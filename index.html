<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guest Markets Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="logo.js"></script>
<style>
:root{
  /* Charte GUEST MARKETS, relevée sur le papier à en-tête :
     bleu du logo #1068B8, rouge « Markets » #EE0000, marine du pied de page #2F5395. */
  --encre:#16202E; --encre-douce:#5A6675; --papier:#F4F6F9; --surface:#FFFFFF;
  --registre:#1068B8; --registre-fonce:#0B4F8F; --registre-clair:#E3EEF9;
  --accent:#EE0000;
  --ambre:#8A5D0F; --ambre-clair:#FBF1DE; --rouge:#A8322D; --rouge-clair:#F8E6E4;
  --vert:#1D6B45; --vert-clair:#E2F2E9;
  --trait:#D8DFE8; --barre:#14264A; --barre-texte:#B4C4DE;
  --rayon:6px;
  font-family:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color:var(--encre); background:var(--papier);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--papier);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--registre);outline-offset:2px}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 .25rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 .75rem;font-weight:600}
p{margin:0 0 .75rem}
.discret{color:var(--encre-douce)}
.petit{font-size:.84rem}
.num{font-variant-numeric:tabular-nums}
td.montant,th.montant{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Écrans d'accès ---------- */
#app{min-height:100%;height:100%}
.acces{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,460px)}
.acces-marque{background:var(--barre);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:space-between;gap:2rem}
.acces-marque blockquote{margin:0;font-size:1.9rem;line-height:1.25;font-weight:600;max-width:22ch}
.acces-marque small{color:var(--barre-texte)}
.acces-sous{margin:.75rem 0 0;color:var(--barre-texte);font-size:1rem}
.acces-form{background:var(--surface);padding:3rem 2.5rem;display:flex;flex-direction:column;justify-content:center}
@media (max-width:760px){.acces{grid-template-columns:1fr}.acces-marque{padding:2rem}.acces-marque blockquote{font-size:1.4rem}}

/* ---------- Formulaires ---------- */
label{display:block;font-weight:500;font-size:.9rem;margin:.9rem 0 .3rem}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:.55rem .7rem;border:1px solid var(--trait);border-radius:var(--rayon);background:#fff}
textarea{min-height:5rem;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--papier);color:var(--encre-douce)}
.case{display:flex;align-items:center;gap:.5rem;margin-top:1rem;font-weight:500}
.case input{width:1.05rem;height:1.05rem;accent-color:var(--registre)}
.aide-champ{font-size:.8rem;color:var(--encre-douce);margin:.25rem 0 0}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--trait);background:#fff;
  padding:.5rem .9rem;border-radius:var(--rayon);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--encre-douce)}
.btn-principal{background:var(--registre);border-color:var(--registre);color:#fff}
.btn-principal:hover{background:var(--registre-fonce);border-color:var(--registre-fonce)}
.btn-danger{color:var(--rouge)}
.btn-lien{border:none;background:none;padding:0;color:var(--registre);cursor:pointer;text-decoration:underline}
.btn[disabled]{opacity:.55;cursor:wait}
.erreur{background:var(--rouge-clair);color:var(--rouge);padding:.6rem .8rem;border-radius:var(--rayon);margin-top:1rem;font-size:.9rem}
.info{background:var(--ambre-clair);color:var(--ambre);padding:.6rem .8rem;border-radius:var(--rayon);margin:1rem 0;font-size:.9rem}

/* ---------- Coque ---------- */
/* La coque tient dans l'écran : seul le contenu défile, le volet reste en place (et défile seul s'il est long). */
.coque{display:grid;grid-template-columns:252px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh}
.coque>.barre,.coque>.principal{min-height:0}
.ic{flex:none;display:block}
.barre{background:var(--barre);color:var(--barre-texte);display:flex;flex-direction:column;overflow:hidden}
.barre-tete{padding:1.1rem 1.1rem .9rem;border-bottom:1px solid rgba(255,255,255,.08)}
.barre-tete .sous-logo{display:block;font-size:.78rem;color:#8EA3C4;margin-top:.55rem;letter-spacing:.02em}
.barre nav{padding:.6rem .6rem 1rem;flex:1;overflow-y:auto}
.barre .groupe{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:1rem .7rem .35rem;color:#7389AD}
.barre a{display:flex;align-items:center;gap:.65rem;padding:.48rem .7rem;border-radius:8px;color:var(--barre-texte);text-decoration:none;font-size:.92rem}
.barre a .ic{opacity:.8}
.barre a:hover{background:rgba(255,255,255,.07);color:#fff}
.barre a[aria-current=page]{background:var(--registre);color:#fff;box-shadow:0 2px 8px rgba(16,104,184,.35)}
.barre a[aria-current=page] .ic{opacity:1}
.barre-pied{display:flex;align-items:center;gap:.65rem;padding:.85rem 1rem;border-top:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.12)}
.avatar{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--registre);color:#fff;font-weight:700;font-size:.85rem;letter-spacing:.03em}
.barre-pied .qui{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.barre-pied .qui b{color:#fff;font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barre-pied .qui span{font-size:.78rem}
.b-deco{flex:none;background:none;border:1px solid rgba(255,255,255,.15);color:var(--barre-texte);border-radius:8px;padding:.35rem;cursor:pointer}
.b-deco:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.principal{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;height:100%}
.barre-haut{display:flex;align-items:center;gap:.9rem;padding:.7rem 2.25rem;background:var(--surface);border-bottom:1px solid var(--trait);min-height:62px}
.b-menu{display:none;background:none;border:1px solid var(--trait);border-radius:8px;padding:.35rem;cursor:pointer}
.ariane{display:flex;align-items:center;gap:.35rem;font-size:.9rem;color:var(--encre-douce);min-width:0;flex:1}
.ariane .ic{opacity:.6}
.ariane b{color:var(--encre);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ariane a{color:inherit;text-decoration:none;white-space:nowrap}
.ariane a:hover{color:var(--registre)}
.recherche{position:relative;width:min(300px,30vw)}
.recherche .loupe{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--encre-douce)}
.recherche input{width:100%;padding:.48rem .7rem .48rem 2.1rem;border:1px solid var(--trait);border-radius:8px;background:var(--papier)}
.recherche input:focus{background:#fff}
.resultats{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;background:#fff;border:1px solid var(--trait);border-radius:8px;box-shadow:0 8px 24px rgba(22,32,46,.12);padding:.3rem;max-height:60vh;overflow:auto}
.resultats button,.menu-nouvelle button{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;background:none;border:none;padding:.5rem .6rem;border-radius:6px;cursor:pointer}
.resultats button:hover,.menu-nouvelle button:hover{background:var(--registre-clair)}
.resultats small{margin-left:auto;color:var(--encre-douce);font-size:.75rem}
.b-cloche{position:relative;background:none;border:1px solid var(--trait);border-radius:8px;padding:.42rem;cursor:pointer;color:var(--encre-douce)}
.b-cloche:hover{color:var(--encre);border-color:var(--encre-douce)}
.b-cloche .badge{position:absolute;top:-6px;right:-7px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.nouvelle{position:relative}
.menu-nouvelle{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:240px;background:#fff;border:1px solid var(--trait);border-radius:8px;box-shadow:0 8px 24px rgba(22,32,46,.12);padding:.3rem}
.contenu{overflow-y:auto;padding:1.75rem 2.25rem 4rem}
.entete-page{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.b-fermer-menu{display:none;float:right;align-items:center;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:var(--rayon);padding:.2rem .55rem;font:inherit;font-size:.85rem;cursor:pointer}
.voile-menu{display:none}
@media (max-width:860px){
  .coque{grid-template-columns:1fr}
  .barre{position:fixed;inset:0 auto 0 0;width:min(290px,82vw);z-index:20;transform:translateX(-100%);transition:transform .2s}
  .barre.ouverte{transform:none}
  .b-fermer-menu{display:inline-flex}
  .voile-menu{display:block;position:fixed;inset:0;z-index:19;background:rgba(22,32,46,.45);cursor:pointer}
  .voile-menu[hidden]{display:none}
  .b-menu{display:block}
  .barre-haut{padding:.6rem 1rem;gap:.6rem}
  .ariane{font-size:.85rem}.ariane .etape{display:none}
  .recherche{display:none}
  .nouvelle .btn span{display:none}.nouvelle .btn{padding:.45rem .55rem}
  .contenu{padding:1.25rem 1rem 3rem}
}
@media (prefers-reduced-motion:reduce){.barre{transition:none}}
.logo-chip{display:block;background:#fff;border-radius:8px;padding:.45rem .6rem;width:max-content}
.logo-chip img{display:block;width:150px;height:auto}
.acces-marque .logo-chip img{width:210px}

/* ---------- Tableaux ---------- */
.panneau{background:var(--surface);border:1px solid var(--trait);border-radius:var(--rayon)}
.outils{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;padding:.9rem 1rem;border-bottom:1px solid var(--trait)}
.outils input,.outils select{width:auto;min-width:10rem}
.outils .pousse{margin-left:auto}
.outils input[type=checkbox]{min-width:0;width:1.05rem}
.defil{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-weight:600;color:var(--encre-douce);font-size:.82rem;padding:.6rem 1rem;border-bottom:1px solid var(--trait);white-space:nowrap}
td{padding:.6rem 1rem;border-bottom:1px solid var(--trait);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFBFC}
td.code{white-space:nowrap;font-variant-numeric:tabular-nums}
.vide{padding:2.5rem 1rem;text-align:center;color:var(--encre-douce)}
.pastille{display:inline-block;padding:.05rem .5rem;border-radius:999px;font-size:.8rem;font-weight:500;background:var(--registre-clair);color:var(--registre-fonce);white-space:nowrap}
.pastille.inactif{background:#ECEEF1;color:var(--encre-douce)}
.pastille.attente{background:var(--ambre-clair);color:var(--ambre)}
.pastille.alerte{background:var(--rouge-clair);color:var(--rouge)}
.pastille.ok{background:var(--vert-clair);color:var(--vert)}
.actions-ligne{display:flex;gap:.4rem;justify-content:flex-end;flex-wrap:wrap}
.pagination{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1rem;border-top:1px solid var(--trait);font-size:.88rem}

/* ---------- Accueil ---------- */
.accueil h1{font-size:1.75rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:1rem;margin-bottom:1.5rem}
.kpi{display:flex;align-items:center;gap:.85rem;background:var(--surface);border:1px solid var(--trait);border-radius:12px;padding:1rem 1.1rem;text-decoration:none;color:inherit;transition:box-shadow .15s,border-color .15s}
.kpi:hover,.rapide:hover{border-color:#B9C6D6;box-shadow:0 4px 14px rgba(22,32,46,.07)}
.kpi-txt{display:flex;flex-direction:column;line-height:1.2}
.kpi-txt b{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi-txt span{font-size:.84rem;color:var(--encre-douce)}
.pastille-ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px}
.pastille-ic.petit{width:34px;height:34px;border-radius:9px}
.pastille-ic.bleu{background:#E3EEF9;color:#1068B8}.pastille-ic.orange{background:#FDEEDC;color:#B5620B}
.pastille-ic.violet{background:#EEE8FB;color:#6741C2}.pastille-ic.vert{background:#E2F2E9;color:#1D6B45}
.pastille-ic.rouge{background:#FBE5E5;color:#C8211E}
.deux-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1.25rem;align-items:start}
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:12px;overflow:hidden}
.carte.pleine{grid-column:1/-1}
.carte-tete{display:flex;align-items:center;gap:.6rem;padding:1rem 1.2rem;border-bottom:1px solid var(--trait)}
.carte-tete h2{margin:0;flex:1}
.total-carte{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.total-carte small{font-size:.75rem;color:var(--encre-douce)}
.total-carte b{font-size:1.05rem;white-space:nowrap}
.badge-compte{display:grid;place-items:center;min-width:26px;height:26px;padding:0 .5rem;border-radius:13px;background:var(--accent);color:#fff;font-size:.8rem;font-weight:700}
.liste-carte{list-style:none;margin:0;padding:.3rem 0}
.liste-carte li{display:flex;align-items:center;gap:.8rem;padding:.65rem 1.2rem;border-bottom:1px solid #EEF1F5}
.liste-carte li:last-child{border-bottom:none}
.liste-carte li > a{display:flex;align-items:center;gap:.8rem;flex:1;color:inherit;text-decoration:none;margin:-.65rem -1.2rem;padding:.65rem 1.2rem}
.liste-carte li > a:hover{background:#FAFBFC}
.liste-carte .lib{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.liste-carte .lib small{color:var(--encre-douce);font-size:.8rem}
.liste-carte.traiter .lib b{font-weight:600}
.liste-carte .btn{padding:.35rem .75rem;font-size:.85rem}
.lien-carte{display:flex;align-items:center;justify-content:center;gap:.35rem;width:100%;padding:.8rem;border-top:1px solid var(--trait);color:var(--registre);font-weight:500;text-decoration:none;font-size:.9rem}
button.lien-carte{text-decoration:none;border-radius:0;border-top:1px solid var(--trait)}
.lien-carte:hover{background:var(--registre-clair)}
.rapides{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.rapide{display:flex;align-items:center;gap:.85rem;background:var(--surface);border:1px solid var(--trait);border-radius:12px;padding:1rem 1.1rem;text-decoration:none;color:inherit}
.rapide > span:nth-child(2){flex:1;display:flex;flex-direction:column;line-height:1.3}
.rapide small{color:var(--encre-douce);font-size:.8rem}
.rapide > .ic{color:var(--encre-douce)}
@media (max-width:980px){.deux-col{grid-template-columns:1fr}}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--trait);border:1px solid var(--trait);border-radius:var(--rayon);overflow:hidden;margin-bottom:1.75rem}
.chiffres a{background:var(--surface);padding:1rem 1.1rem;text-decoration:none;color:inherit}
.chiffres a:hover{background:#FAFBFC}
.chiffres b{display:block;font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.chiffres span{font-size:.88rem;color:var(--encre-douce)}
.points{list-style:none;margin:0;padding:0}
.points li{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;padding:.7rem 1rem;border-bottom:1px solid var(--trait)}
.points li:last-child{border-bottom:none}
.points li p{margin:0}
.titre-section{margin-top:2rem}

/* ---------- Journal ---------- */
.registre td.heure{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--encre-douce);font-size:.85rem}
.op{font-weight:600;font-size:.82rem}
.op-INSERT{color:var(--registre)} .op-UPDATE{color:var(--ambre)} .op-DELETE{color:var(--rouge)}
.detail td{background:#FAFBFC;padding:0}
.diff{display:grid;grid-template-columns:minmax(9rem,max-content) 1fr 1fr;font-size:.86rem}
.diff div{padding:.4rem 1rem;border-top:1px solid var(--trait);word-break:break-word}
.diff .champ{color:var(--encre-douce);font-weight:500}
.diff .avant{color:var(--rouge);text-decoration:line-through;text-decoration-color:rgba(168,50,45,.45)}
.diff .apres{color:var(--registre-fonce)}
.diff .t{font-weight:600;color:var(--encre-douce);font-size:.8rem;border-top:none}

/* ---------- Fenêtre modale & notifications ---------- */
dialog{border:none;border-radius:var(--rayon);padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(20,38,74,.25)}
dialog.large{width:min(880px,96vw)}
/* Aperçu avant impression */
dialog.apercu{width:min(1180px,97vw);height:94vh;max-height:94vh;flex-direction:column;overflow:hidden}
dialog.apercu[open]{display:flex}
.apercu-tete{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;border-bottom:1px solid var(--trait);background:var(--surface)}
.apercu-titre{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.apercu-titre b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
dialog.apercu iframe{flex:1;width:100%;border:0;background:#E9EDF2}
.courrier-edit .saut-page{border-top:2px dashed var(--trait);margin:1.5rem 0;position:relative}
.courrier-edit .saut-page::after{content:"page suivante";position:absolute;top:-.7rem;right:0;background:#fff;padding:0 .4rem;font-size:.75rem;color:var(--encre-douce)}
.liste-choix{max-height:50vh;overflow-y:auto;border:1px solid var(--trait);border-radius:var(--rayon);padding:.2rem .8rem .6rem}
dialog::backdrop{background:rgba(20,38,74,.45)}
.modale-corps{padding:1.5rem 1.5rem .5rem;max-height:70vh;overflow-y:auto}
.modale-pied{display:flex;justify-content:flex-end;gap:.6rem;padding:1rem 1.5rem;border-top:1px solid var(--trait);flex-wrap:wrap}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
@media (max-width:560px){.grille2{grid-template-columns:1fr}}
.carte-form{background:var(--surface);border:1px solid var(--trait);border-radius:var(--rayon);padding:1.25rem 1.5rem 1.5rem;max-width:760px;margin-bottom:1.5rem}
#toast{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--encre);color:#fff;padding:.7rem 1rem;border-radius:var(--rayon);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:50}
#toast.visible{opacity:1;transform:none}
#toast.ko{background:var(--rouge)}

/* ---------- Finances et comptabilité ---------- */
.negatif{color:var(--rouge)}
tr.annulee td{color:var(--encre-douce);text-decoration:line-through;text-decoration-color:rgba(90,102,117,.4)}
tfoot td{font-weight:600;border-top:2px solid var(--trait);background:#FAFBFC}
tr.sous-total td{font-weight:600;background:#FAFBFC}
.courrier-edit{background:#fff;border:1px solid var(--trait);border-radius:var(--rayon);padding:1.5rem 1.75rem;max-height:60vh;overflow:auto;font:13px/1.6 "Public Sans",Arial,sans-serif;color:#16202E}
.courrier-edit:focus{outline:2px solid var(--registre)}
.courrier-edit h1{font-size:1.2rem}
table.etat tr.total-etat td{font-weight:700;background:var(--registre-clair);border-top:2px solid var(--registre)}
table.etat tr.detail-compte td{color:var(--encre-douce);padding-top:.15rem;padding-bottom:.15rem}
.graphe{display:flex;gap:.4rem;align-items:flex-end;height:180px;margin:1rem 0 .5rem;border-bottom:1px solid var(--trait)}
.mois-graphe{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.mois-graphe .barres{flex:1;display:flex;gap:2px;align-items:flex-end;width:100%;justify-content:center}
.baton{display:block;width:40%;min-height:1px;border-radius:2px 2px 0 0}.baton.ca{background:var(--registre)}.baton.benefice{background:var(--vert)}.baton.perte{background:var(--rouge)}
.grille-tdb{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:1rem}@media (max-width:900px){.grille-tdb{grid-template-columns:minmax(0,1fr)}}
.chiffres a span.petit{display:block;margin-top:.15rem}
.grille-mois{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem .8rem}@media (max-width:560px){.grille-mois{grid-template-columns:repeat(3,1fr)}}
.onglets{display:flex;gap:.25rem;flex-wrap:wrap;border-bottom:1px solid var(--trait);padding:0 1rem}
.onglets button{border:none;background:none;padding:.75rem .8rem;cursor:pointer;color:var(--encre-douce);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.onglets button[aria-selected=true]{color:var(--registre-fonce);border-bottom-color:var(--registre)}
.onglets .compte{display:inline-block;min-width:1.4rem;padding:0 .35rem;margin-left:.3rem;border-radius:999px;background:var(--registre-clair);font-size:.78rem}
.fiche{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1.25rem;margin:0 0 1rem}
.fiche dt{color:var(--encre-douce);font-size:.88rem}
.fiche dd{margin:0}
.barre-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0 .5rem;padding-top:1rem;border-top:1px solid var(--trait)}
table.saisie td{padding:.35rem .4rem}
table.saisie input,table.saisie select{padding:.4rem .5rem;min-width:0}
table.pivot th:first-child,table.pivot td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:14rem}
table.pivot td.clic{cursor:pointer}
table.pivot td.clic:hover{background:var(--registre-clair)}
table.pivot td,table.pivot th{padding:.5rem .6rem}
.chiffres b.negatif{color:var(--rouge)}
tr.clic{cursor:pointer} tr.clic:hover td{background:var(--registre-clair)}
/* Parc et tournée (lot 10) : cartes lisibles sur téléphone, gros boutons. */
.cartes-parc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin-top:1rem}
.carte-veh,.carte-tournee{border:1px solid var(--trait);border-radius:var(--rayon);padding:1rem;background:var(--surface);display:flex;flex-direction:column;gap:.5rem}
.carte-veh-tete{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
dl.mini{display:grid;grid-template-columns:auto 1fr;gap:.15rem .75rem;margin:0;font-size:.88rem} dl.mini dt{color:var(--encre-douce)} dl.mini dd{margin:0}
.tournee{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.tournee h2{margin:1rem 0 0}
.carte-tournee ul.articles{margin:.25rem 0;padding-left:1.1rem}
.gros-btn{display:block;width:100%;text-align:center;padding:.9rem 1rem;font-size:1rem;white-space:normal;cursor:pointer}
label.gros-btn.envoi{opacity:.6;pointer-events:none}
.deux-btn{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.ligne-recep{display:grid;grid-template-columns:1fr auto;gap:.4rem .75rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--trait)}
.ligne-recep input[data-motif]{grid-column:1/-1}
input.champ-photo{font-size:.85rem;max-width:100%}
svg.courbe{display:block} svg.courbe polyline{stroke-width:1.6} svg.courbe .pos{stroke:var(--registre)} svg.courbe .neg{stroke:var(--rouge)}
svg.courbe .zero{stroke:var(--encre-douce);stroke-width:.8;stroke-dasharray:2 2}
@media print{
  .barre,.barre-haut,.actions-ligne,#toast,.outils{display:none!important}
  .coque,.principal{display:block;height:auto}.contenu{overflow:visible;padding:0}.panneau,.carte-form{border:none}
}

function messageErreur(err) {
  if (!err) return "";
  const m = err.message || String(err);
  if (err.code === "23505") return "Cette valeur existe déjà (code, référence ou nom en double).";
  // Les règles de la base expliquent elles-mêmes leur refus ; seules les contraintes brutes sont reformulées.
  if (err.code === "23514") return /violates check constraint/i.test(m) ? "Valeur non autorisée ou incohérente (vérifiez les montants et les listes)." : m;
  if (err.code === "23503") return "Cet élément est utilisé ailleurs : désactivez-le plutôt que de le supprimer.";
  if (err.code === "42501" || /row-level security/i.test(m)) return /row-level security|permission denied/i.test(m) ? "Vos droits ne permettent pas cette opération." : m;
  if (/Invalid login credentials/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if (/Failed to fetch/i.test(m)) return "Connexion au serveur impossible. Vérifiez votre accès internet.";
  return m;
}

function messageLien(h) {
  const code = h.get("error_code") || h.get("error");
  if (!code) return "";
  if (/otp_expired|expired/i.test(code)) return "Ce lien a expiré ou a déjà été utilisé. Demandez-en un nouveau ci-dessous.";
  if (/access_denied/i.test(code)) return "Ce lien n'est plus valable. Demandez-en un nouveau ci-dessous.";
  return (h.get("error_description") || "Ce lien n'a pas pu être utilisé.").split("+").join(" ");
}

/* Fin de session. Supabase renouvelle la connexion sans limite : on la borne ici.
   Retour à l'écran de connexion après 30 minutes sans activité (4 heures pour un livreur, sur la route),
   et en tout cas 12 heures après la connexion. L'heure de connexion et de dernière activité est
   gardée dans le navigateur (commune à tous les onglets). */
const SESSION = { cle: "gm-session", inactivite: 30 * 60e3, inactiviteLivreur: 4 * 3600e3, max: 12 * 3600e3 };
const lireSession = () => { try { return JSON.parse(localStorage.getItem(SESSION.cle) || "null"); } catch (e) { return null; } };
const ecrireSession = o => { try { localStorage.setItem(SESSION.cle, JSON.stringify(o)); } catch (e) { /* navigation privée */ } };
const ouvrirSession = () => { const t = Date.now(); ecrireSession({ connexion: t, activite: t }); };
function motifExpiration() {
  const x = lireSession(), t = Date.now();
  if (!x) return "Votre session a expiré : reconnectez-vous.";
  const limite = etat.profil && estLivreurSeul() ? SESSION.inactiviteLivreur : SESSION.inactivite;
  if (t - x.connexion > SESSION.max) return "Votre session a expiré (12 heures après la connexion) : reconnectez-vous.";
  if (t - x.activite > limite) return `Votre session a expiré après ${Math.round(limite / 60e3)} minutes sans activité : reconnectez-vous.`;
  return "";
}
let derniereActivite = 0;
function noterActivite() {
  const t = Date.now(); if (!etat.session || t - derniereActivite < 20000) return;
  if (motifExpiration()) return; // trop tard : la vérification suivante déconnecte
  derniereActivite = t; const x = lireSession(); if (x) ecrireSession({ ...x, activite: t });
}
async function expirerSession(motif) {
  etat.messageConnexion = motif;
  try { localStorage.removeItem(SESSION.cle); } catch (e) { /* */ }
  const d = $("#modale"); if (d && d.open) d.close();
  await sb.auth.signOut();
}
function verifierSession() { if (etat.session) { const m = motifExpiration(); if (m) expirerSession(m); } }
function surveillerSession() {
  ["pointerdown", "keydown", "touchstart", "wheel", "scroll"].forEach(ev => document.addEventListener(ev, noterActivite, { passive: true, capture: true }));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) verifierSession(); });
  window.addEventListener("focus", verifierSession);
  setInterval(verifierSession, 60000);
}

    $$(`[data-act="${prefixe}"]`).forEach(c => { c.disabled = c.value === p; if (c.value === p) c.checked = false; });
    const tous = [p, ...lireActivites(prefixe)];
    const alertes = CUMULS_SENSIBLES.filter(([r]) => r.every(x => tous.includes(x))).map(([r, t]) => `${r.map(x => ROLES[x]).join(" + ")} : ${t}`);
    $(`#${prefixe}-cumul`).innerHTML = alertes.length ? `<div class="info"><b>Contrôle allégé.</b> ${alertes.map(esc).join("<br>")}
      <br>L'application continue d'empêcher une personne de payer un achat qu'elle a saisi ou validé, et de valider sa propre paie dès qu'un second responsable existe.</div>` : "";
  };
  $$(`[data-act="${prefixe}"]`).forEach(c => c.onchange = maj); $(selRole).addEventListener("change", maj); maj();
}
const lireActivites = prefixe => $$(`[data-act="${prefixe}"]:checked`).map(c => c.value);

const navVisible = n => peut(n.roles) && (!n.cond || n.cond());

async function demarrer() {
  if (!window.supabase) {
    $("#app").innerHTML = `<div class="acces"><div class="acces-marque"><blockquote>Connexion impossible</blockquote><small>GUEST MARKETS</small></div>
      <div class="acces-form"><h1>Bibliothèque introuvable</h1>
      <p class="discret">L'application n'a pas pu charger ses composants. Vérifiez votre connexion internet puis rechargez la page.</p></div></div>`;
    return;
  }
  // Le client Supabase efface le fragment d'adresse : on lit le type de lien avant.
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(evenement => {
    if (evenement === "PASSWORD_RECOVERY") etat.doitDefinirMdp = true;
    if (evenement === "SIGNED_OUT") setTimeout(ecranConnexion, 0);
  });
  surveillerSession();
  const { data } = await sb.auth.getSession();
  if (data.session) {
    if (hashInitial.get("access_token")) ouvrirSession();
    const m = motifExpiration();
    if (m) return expirerSession(m);
    await entrer(data.session);
  } else ecranConnexion();
}

async function entrer(session) {
  etat.session = session;
  const { data, error } = await sb.from("profils").select("*").eq("id", session.user.id).maybeSingle();
  etat.profil = data;
  const { data: ent } = await sb.from("parametres_entite").select("*").eq("id", 1).maybeSingle();
  etat.entite = ent || {};
  if (etat.doitDefinirMdp) return ecranDefinirMdp();
  if (error || !data || !data.actif) return ecranEnAttente();
  const demandee = location.hash.replace("#/", "");
  await chargerMonEspace();
  etat.page = NAV.some(n => n.id === demandee && navVisible(n)) ? demandee : seulementSalarie() ? "mon_dossier" : estLivreurSeul() ? "ma_tournee" : "accueil";
  rendreCoque();
}

function ecranConnexion() {
  etat.session = null; etat.profil = null;
  cadreAcces(`<h1>Connexion</h1>
    <form id="f-connexion" novalidate>
      <label for="c-email">E-mail professionnel</label>

    </form>`);
  if (etat.messageConnexion) { $("#c-err").innerHTML = `<div class="info">${esc(etat.messageConnexion)}</div>`; etat.messageConnexion = ""; }
  if (etat.erreurLien) {
    $("#c-err").innerHTML = `<div class="erreur">${esc(etat.erreurLien)}</div>`;
    etat.erreurLien = "";
    history.replaceState(null, "", location.pathname);
  }
  $("#f-connexion").onsubmit = async e => {
    e.preventDefault();
    const btn = e.submitter || $("button[type=submit]", e.target); btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $("#c-email").value.trim(), password: $("#c-mdp").value });
    btn.disabled = false;
    if (error) return ($("#c-err").innerHTML = `<div class="erreur">${esc(messageErreur(error))}</div>`);
    ouvrirSession();
    await entrer(data.session);
  };

    const email = $("#c-email").value.trim();
    if (!email) return ($("#c-err").innerHTML = `<div class="erreur">Saisissez d'abord votre e-mail.</div>`);
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: adresseRetour() });
    $("#c-err").innerHTML = error ? `<div class="erreur">${esc(messageErreur(error))}</div>`
      : `<div class="info">Si ce compte existe, un lien de réinitialisation vient d'être envoyé.</div>`;
  };
}

function ecranDefinirMdp() {
  cadreAcces(`<h1>${etat.premiereConnexion ? "Bienvenue" : "Définir votre mot de passe"}</h1>
    ${etat.premiereConnexion ? `<p>Votre accès à l'application de gestion de ${esc(etat.entite.raison_sociale || "GUEST MARKETS")}
      a été créé pour <b>${esc(etat.session?.user?.email || "")}</b>. Choisissez votre mot de passe.</p>` : ""}
    <p class="discret">Au moins 10 caractères. Vous l'utiliserez pour vos prochaines connexions.</p>
    <form id="f-mdp" novalidate>
      <label for="m1">Nouveau mot de passe</label><input id="m1" type="password" autocomplete="new-password">
      <label for="m2">Confirmation</label><input id="m2" type="password" autocomplete="new-password">
      <div id="m-err"></div>
      <p style="margin-top:1.25rem"><button class="btn btn-principal" type="submit">Enregistrer le mot de passe</button></p>
    </form>`);
  $("#f-mdp").onsubmit = async e => {
    e.preventDefault();
    const err = await changerMdp($("#m1").value, $("#m2").value);
    if (err) return ($("#m-err").innerHTML = `<div class="erreur">${esc(err)}</div>`);
    etat.doitDefinirMdp = false;

async function changerMdp(m1, m2) {
  if (m1.length < 10) return "Le mot de passe doit contenir au moins 10 caractères.";
  if (m1 !== m2) return "Les deux saisies ne correspondent pas.";
  const { error } = await sb.auth.updateUser({ password: m1 });
  return error ? messageErreur(error) : null;
}

  };
  champ.onkeydown = e => { if (e.key === "Enter") { const b = $("[data-res]", res); if (b) b.click(); } };
  aller(etat.page);
  majCloche();
}

/* Pastille de la cloche : le nombre de points à traiter (recalculé à chaque passage par l'accueil). */
async function majCloche(n) {
  if (n === undefined) { try { n = (await aFaireFinances()).length; } catch (e) { return; } }
  const b = $("#badge-cloche"); if (!b) return;
  b.hidden = !n; b.textContent = n > 99 ? "99+" : String(n);
}

async function aller(page, param = {}) {
  etat.page = page;
  etat.param = param;
  history.replaceState(null, "", "#/" + page);
  $$(".barre a").forEach(a => a.dataset.page === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  if ($("#ariane")) {
    const pl = placeDansNav(page);
    $("#ariane").innerHTML = page === "accueil" ? `${ic("accueil", 16)}<b>Accueil</b>`
      : `<a href="#/accueil" data-aller="accueil">${ic("accueil", 16)}</a>${pl.groupe ? `<span class="etape">${ic("chevron", 14)}</span><span class="etape">${esc(pl.groupe)}</span>` : ""}${ic("chevron", 14)}<b>${esc(pl.l)}</b>`;
    $$("[data-aller]", $("#ariane")).forEach(el => el.onclick = e => { e.preventDefault(); aller("accueil"); });
  }
  const c = $("#contenu");
  c.innerHTML = `<p class="discret">Chargement…</p>`;
  try {
    if (ENTITES[page]) await pageEntite(page);
    else if (PAGES_FINANCES[page]) await PAGES_FINANCES[page]();
    else if (page === "utilisateurs") await pageUtilisateurs();
    else if (page === "postes") await pagePostes();
    else if (page === "parametres") await pageParametres();
    else if (page === "journal") await pageJournal();
    else if (page === "profil") pageProfil();
    else await pageAccueil();
  } catch (err) {
    c.innerHTML = `<div class="erreur">${esc(messageErreur(err))}</div>`;
  }
  c.scrollTop = 0;
}

function brancherAller() {
  $$("[data-aller]").forEach(el => el.onclick = e => {
    e.preventDefault(); if ($("#modale").open) $("#modale").close();
    aller(el.dataset.aller, el.dataset.param ? JSON.parse(el.dataset.param) : {});
  });
}

    ["paie", "Paie", "Éléments du mois, bulletins, déclarations", "billet", "vert"],
    ["ventes", "Ventes et factures", "Proformas, factures et encaissements", "facture", "violet"],
    ["stock", "Stock", "Quantités et valeur au coût moyen", "carton", "orange"]]
    .filter(([pg]) => NAV.some(n => n.id === pg && navVisible(n))).slice(0, 4);

    <div class="entete-page"><div><h1>${salut} ${esc(p.prenom || nomComplet(p))}</h1>
      <p class="discret">Voici l'essentiel de votre activité · ${esc(new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }))}</p></div></div>
    <div class="kpis">${cibles.map(([t, l, i, c], k) => `<a class="kpi" href="#/${t}" data-aller="${t}"><span class="pastille-ic ${c}">${ic(i, 20)}</span>
      <span class="kpi-txt"><b>${comptes[k].count ?? "—"}</b><span>${esc(l)}</span></span></a>`).join("")}</div>
    <div class="deux-col">

          <b class="num ${totalTreso < 0 ? "negatif" : ""}">${fcfa(totalTreso)} FCFA</b></span></div>
        <ul class="liste-carte">${soldes.slice(0, 6).map(s => `<li><a href="#/tresorerie" data-aller="tresorerie" data-param='${esc(JSON.stringify({ compte: s.id }))}'>
          <span class="pastille-ic petit ${/caisse/i.test(s.type || "") ? "orange" : /mobile/i.test(s.type || "") ? "violet" : "bleu"}">${ic(iconeCompte(s.type), 16)}</span>

          ${items.length > PLAFOND ? `<button class="lien-carte btn-lien" id="b-tout-traiter">Voir les ${items.length} points ${ic("fleche", 15)}</button>` : ""}`

/* Chaque point n'est montré qu'à ceux qui peuvent le traiter. */
async function pointsACompleter() {
  const pts = [];
  const e = etat.entite || {};
  const { data: cats } = await sb.from("categories_produit").select("id, libelle, manager_id").eq("actif", true);
  const mesCats = (cats || []).filter(c => c.manager_id === etat.profil.id).map(c => c.id);
  if (peut(GESTION)) {
    const { count: nbSites } = await sb.from("sites").select("id", { count: "exact", head: true }).eq("actif", true);
    if (!nbSites) pts.push({ texte: `<b>Aucun bureau ni site déclaré.</b> Électricité, eau, loyer et téléphone devront être rattachés à un site : déclarez chaque local avec son contrat ENEO.`, page: "sites", bouton: "Déclarer" });
    const sansManager = (cats || []).filter(c => !c.manager_id);
    if (sansManager.length) pts.push({ texte: `<b>${sansManager.length} catégorie(s) de produits sans manager</b> : ${esc(sansManager.map(c => c.libelle).join(", "))}. Sans manager désigné, personne ne pourra saisir leurs achats.`, page: "categories_produit", bouton: "Désigner" });
  }
  if (seulementManager() && !mesCats.length) pts.push({ texte: `<b>Aucune catégorie de produits ne vous est encore attribuée.</b> Le DAF doit vous désigner comme manager d'une catégorie pour que vous puissiez en gérer les produits et les achats.` });
  if (peut(ENTITES.produits.ecriture)) {
    let q = sb.from("produits").select("id", { count: "exact", head: true }).eq("actif", true).is("prix_vente", null);
    if (seulementManager()) q = q.in("categorie_id", mesCats.length ? mesCats : ["-"]);
    const { count } = await q;
    if (count) pts.push({ texte: `<b>${count} produit(s) ${seulementManager() ? "de vos catégories " : ""}sans prix de vente.</b> Le classeur n'en portait aucun : chaque vente était saisie à un prix libre, que rien ne permettait de contrôler.`, page: "produits", bouton: "Compléter" });
  }
  if (peut(ENTITES.fournisseurs.ecriture)) {
    const { count } = await sb.from("fournisseurs").select("id", { count: "exact", head: true }).eq("actif", true).is("niu", null);
    if (count) pts.push({ texte: `<b>${count} fournisseur(s) sans NIU.</b> Le NIU est indispensable pour justifier une charge et appliquer les retenues à la source.`, page: "fournisseurs", bouton: "Compléter" });
  }
  if (peut([...GESTION, "rh"]) && !e.numero_cnps) pts.push({ texte: `<b>Numéro d'employeur CNPS non renseigné.</b> Il figurera sur les bulletins de paie et les déclarations.`, page: peut(GESTION) ? "parametres" : null, bouton: "Renseigner" });
  if (peut(GESTION)) {
    const { data: ct } = await sb.from("comptes_tresorerie").select("code, libelle, responsable_id, type, plafond_operation, fonds_alloue").eq("actif", true);
    const sansResp = (ct || []).filter(c => c.type === "Caisse" && !c.responsable_id);
    if (sansResp.length) pts.push({ texte: `<b>${sansResp.length} caisse(s) sans responsable</b> : ${esc(sansResp.map(c => c.libelle).join(", "))}. Une caisse a un seul responsable, qui répond de son solde.`, page: "comptes_tresorerie", bouton: "Désigner" });
    const incoherents = (ct || []).filter(c => c.plafond_operation && c.fonds_alloue && Number(c.plafond_operation) > Number(c.fonds_alloue));
    for (const c of incoherents) pts.push({ texte: `<b>${esc(c.libelle)}</b> : le plafond par sortie (${fcfa(c.plafond_operation)} FCFA) dépasse le fonds alloué (${fcfa(c.fonds_alloue)} FCFA). Repris tel quel du classeur ; le plafond n'a alors aucun effet.`, page: "comptes_tresorerie", bouton: "Corriger" });
  }
  return pts;
}

/* =====================================================================
   Référentiels génériques
   ===================================================================== */
async function chargerListe(cle) {
  const d = LISTES[cle];
  let q = sb.from(d.table || cle).select(d.select).order(d.ordre);
  if (d.filtre) q = d.filtre(q);
  const { data, error } = await q;
  if (error) throw error;
  // Le plan comptable a pour clé le numéro de compte, et non un identifiant.
  if (d.cle) (data || []).forEach(r => { r.id = r[d.cle]; });
  etat.refs[cle] = data || [];
  return etat.refs[cle];
}

const libelleRef = (cle, id, court = false) => {
  const r = (etat.refs[cle] || []).find(x => x.id === id);
  if (!r) return id || "";
  return court && LISTES[cle].court ? LISTES[cle].court(r) : LISTES[cle].lib(r);
};

function valeurAffichee(ch, v) {
  if (ch.t === "bool") {
    if (ch.libVrai !== undefined) return v ? `<span class="pastille">${esc(ch.libVrai)}</span>` : esc(ch.libFaux || "");
    return `<span class="pastille ${v ? "" : "inactif"}">${v ? "Actif" : "Inactif"}</span>`;
  }
  if (ch.t === "ref") return v ? esc(libelleRef(ch.liste_ref, v, true)) : (ch.vide ? `<span class="pastille attente">${esc(ch.vide)}</span>` : "");
  if (ch.t === "montant") return fcfa(v);
  if (ch.t === "date") return esc(dateCourte(v));
  return esc(v);
}

const peutEcrire = e => peut(e.ecriture);
const estMaCategorie = id => ((etat.refs.categories_produit || []).find(c => c.id === id) || {}).manager_id === etat.profil.id;

function prochainCode(prefixe, codes, largeur = 2) {
  const nums = codes.filter(c => c && c.startsWith(prefixe)).map(c => parseInt(c.slice(prefixe.length), 10)).filter(n => !isNaN(n));
  return prefixe + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(largeur, "0");
}

async function pageEntite(cle) {
  const e = ENTITES[cle];
  const listes = new Set([...e.champs.filter(c => c.t === "ref").map(c => c.liste_ref),
    ...(e.filtres || []).filter(f => f.liste).map(f => f.liste)]);
  await Promise.all([...listes].map(chargerListe));
  let requete = sb.from(e.table).select("*");
  for (const o of [].concat(e.ordre)) requete = requete.order(o);
  const { data, error } = await requete;
  if (error) throw error;
  const cols = e.champs.filter(c => c.liste);
  const modif = peutEcrire(e);
  const cleDe = r => String(r[e.cle || "id"]);

  const filtresHtml = (e.filtres || []).map(f => `<select data-filtre="${f.k}" aria-label="${esc(f.l)}"><option value="">${esc(f.l)}</option>
    ${(f.liste ? etat.refs[f.liste].map(r => ({ v: r.id, l: LISTES[f.liste].lib(r) }))
      : f.options.map(o => typeof o === "object" ? o : { v: o, l: o }))
      .map(o => `<option value="${esc(o.v)}">${esc(o.l)}</option>`).join("")}</select>`).join("");

  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>${esc(e.titre)}</h1>
      <p class="discret">${esc(e.aide)}</p></div>
      <div class="actions-ligne">${modif ? `<button class="btn btn-principal" id="b-ajout">Ajouter ${esc(e.singulier)}</button>` : ""}</div></div>
    <div class="panneau">
      <div class="outils"><input type="text" id="filtre" placeholder="Rechercher…" aria-label="Rechercher">${filtresHtml}
        <label class="case" style="margin:0"><input type="checkbox" id="f-inactifs"> Inclure les inactifs</label>
        <span class="discret num" id="nb"></span>
        <button class="btn pousse" id="b-export">Exporter</button></div>
      <div class="defil"><table><thead><tr>${cols.map(c => `<th class="${c.t === "montant" ? "montant" : ""}">${esc(c.l)}</th>`).join("")}${modif ? "<th></th>" : ""}</tr></thead>
      <tbody id="corps"></tbody></table></div></div>`;

  const visibles = () => {
    const q = $("#filtre").value.toLowerCase();
    const inactifs = $("#f-inactifs").checked;
    const filtres = $$("[data-filtre]").map(s => [s.dataset.filtre, s.value]).filter(([, v]) => v);
    return data.filter(r => (inactifs || r.actif !== false)
      && filtres.every(([k, v]) => String(r[k] ?? "") === v)
      && (!q || e.champs.some(c => String(c.t === "ref" ? libelleRef(c.liste_ref, r[c.k]) : r[c.k] ?? "").toLowerCase().includes(q))));
  };
  const dessiner = () => {
    const lignes = visibles();
    $("#nb").textContent = `${lignes.length} élément(s)`;
    $("#corps").innerHTML = lignes.length ? lignes.map(r => `<tr>${cols.map(c =>
        `<td class="${c.t === "montant" ? "montant" : c.k === "code" || c.k === "reference" ? "code" : ""}">${valeurAffichee(c, r[c.k])}</td>`).join("")}
      ${modif ? `<td><div class="actions-ligne">${!e.ligneModifiable || e.ligneModifiable(r)
        ? `<button class="btn" data-edit="${esc(cleDe(r))}">Modifier</button>` : ""}</div></td>` : ""}</tr>`).join("")
      : `<tr><td colspan="${cols.length + 1}" class="vide">Aucun élément ne correspond.</td></tr>`;
    $$("[data-edit]").forEach(b => b.onclick = () => formulaireEntite(cle, data.find(r => cleDe(r) === b.dataset.edit), data));
  };
  $("#filtre").oninput = dessiner;
  $("#f-inactifs").onchange = dessiner;
  $$("[data-filtre]").forEach(s => s.onchange = dessiner);
  if (modif) $("#b-ajout").onclick = () => formulaireEntite(cle, null, data);
  $("#b-export").onclick = () => {
    const champs = e.champs;
    exporterTableau(cle + ".xlsx", champs.map(c => c.l), visibles().map(r => champs.map(c =>
      c.t === "ref" ? libelleRef(c.liste_ref, r[c.k]) : c.t === "bool" ? (r[c.k] ? "Oui" : "Non")
        : c.t === "montant" ? fcfa(r[c.k]) : c.t === "date" ? dateCourte(r[c.k]) : r[c.k] ?? "")), e.titre);
  };
  dessiner();
}

function champFormulaire(ch, v, desactive = false, pref = "ch-") {
  const id = pref + ch.k, dis = desactive ? " disabled" : "", req = ch.req ? " required" : "";
  const lib = `<label for="${id}">${esc(ch.l)}${ch.req ? " *" : ""}</label>`;
  if (ch.t === "bool") return `<label class="case"><input type="checkbox" id="${id}" ${v ? "checked" : ""}${dis}> ${esc(ch.l)}</label>`;
  if (ch.t === "textarea") return lib + `<textarea id="${id}"${dis}>${esc(v)}</textarea>`;
  if (ch.t === "select") return lib + `<select id="${id}"${dis}${req}><option value="">—</option>${ch.options.map(o => {
    const val = typeof o === "object" ? o.v : o, txt = typeof o === "object" ? o.l : o;
    return `<option value="${esc(val)}" ${String(val) === String(v ?? "") ? "selected" : ""}>${esc(txt)}</option>`; }).join("")}</select>`;
  if (ch.t === "ref") return lib + `<select id="${id}"${dis}${req}><option value="">—</option>${(etat.refs[ch.liste_ref] || [])
    .filter(o => !ch.choix || ch.choix(o) || o.id === v).map(o =>
    `<option value="${o.id}" ${o.id === v ? "selected" : ""}>${esc(LISTES[ch.liste_ref].lib(o))}</option>`).join("")}</select>`
    + (ch.indice ? `<p class="aide-champ">${esc(ch.indice)}</p>` : "");
  const type = ch.t === "number" || ch.t === "montant" ? "number" : ch.t === "date" ? "date" : "text";
  const pas = ch.t === "montant" ? ` step="1" min="0"` : ch.t === "number" ? ` step="any"` : "";
  return lib + `<input type="${type}" id="${id}" value="${esc(v)}"${pas}${dis}${req}>`
    + (ch.indice ? `<p class="aide-champ">${esc(ch.indice)}</p>` : "");
}

function lireChamp(ch, pref = "ch-") {
  const el = $("#" + pref + ch.k);
  if (!el) return undefined;
  if (ch.t === "bool") return el.checked;
  const v = el.value.trim();
  if (v === "") return null;
  if (ch.t === "number" || ch.t === "montant") return Number(v);
  return v;
}

function ouvrirModale(titre, corps, { onSave, onDelete, libelleSave = "Enregistrer", large = false } = {}) {
  const d = $("#modale");
  if (d.open) d.close(); // une fiche peut en ouvrir une autre (reclasser, payer…)
  d.classList.toggle("large", large);
  d.innerHTML = `<form method="dialog" id="f-modale" novalidate>
    <div class="modale-corps"><h2>${esc(titre)}</h2>${corps}<div id="mod-err"></div></div>
    <div class="modale-pied">
      ${onDelete ? `<button type="button" class="btn btn-danger" id="mod-suppr" style="margin-right:auto">Supprimer</button>` : ""}
      <button type="button" class="btn" id="mod-annuler">${onSave ? "Annuler" : "Fermer"}</button>
      ${onSave ? `<button type="submit" class="btn btn-principal">${esc(libelleSave)}</button>` : ""}
    </div></form>`;
  $("#mod-annuler").onclick = () => d.close();
  $("#f-modale").onsubmit = async ev => {
    ev.preventDefault();
    if (!onSave) return d.close();
    const btn = ev.submitter; if (btn) btn.disabled = true;
    const err = await onSave();
    if (btn) btn.disabled = false;
    if (err) { $("#mod-err").innerHTML = `<div class="erreur">${esc(err)}</div>`; $("#mod-err").scrollIntoView({ block: "nearest", behavior: "smooth" }); toast(err, true); }
    else d.close();
  };
  if (onDelete) $("#mod-suppr").onclick = async () => {
    if (!confirm("Supprimer définitivement cet élément ? La suppression sera tracée dans le journal.")) return;
    const err = await onDelete();
    if (err) $("#mod-err").innerHTML = `<div class="erreur">${esc(err)}</div>`;
    else d.close();
  };
  d.showModal();
  const premier = $("input:not([type=checkbox]):not([disabled]),select:not([disabled]),textarea", d); if (premier) premier.focus();
}

function formulaireEntite(cle, ligne, toutes, apres) {
  const e = ENTITES[cle];
  const champs = e.champs.filter(c => !c.calcule && (!c.roles || peut(c.roles)));
  const cleTable = e.cle || "id";
  const valeurInitiale = c => {
    if (ligne) return ligne[c.k];
    if (c.auto && e.prefixe) return prochainCode(e.prefixe, (toutes || []).map(r => r.code), e.largeur);
    return c.defaut;
  };
  const corps = `<div class="grille2">${champs.filter(c => c.t !== "textarea" && c.t !== "bool")
      .map(c => `<div>${champFormulaire(c, valeurInitiale(c), !!(ligne && c.fige))}</div>`).join("")}</div>
    ${champs.filter(c => c.t === "textarea" || c.t === "bool").map(c => champFormulaire(c, valeurInitiale(c))).join("")}
    ${cle === "produits" && seulementManager() ? `<p class="discret petit" style="margin-top:1rem">Vous ne pouvez enregistrer que des produits de vos catégories.</p>` : ""}`;
  ouvrirModale(ligne ? `Modifier ${e.singulier}` : `Ajouter ${e.singulier}`, corps, {
    large: champs.length > 8,
    onSave: async () => {
      const donnees = {};
      for (const c of champs) {
        if (ligne && c.fige) continue;
        donnees[c.k] = lireChamp(c);
        if (c.req && (donnees[c.k] === null || donnees[c.k] === "")) return `Le champ « ${c.l} » est obligatoire.`;
        if (c.t === "montant" && donnees[c.k] !== null && donnees[c.k] < 0) return `« ${c.l} » ne peut pas être négatif.`;
      }
      if (cle === "comptes_tresorerie" && ligne && donnees.parent_id === ligne.id) return "Un compte ne peut pas être son propre parent.";
      const req = ligne ? sb.from(e.table).update(donnees).eq(cleTable, ligne[cleTable]).select(cleTable) : sb.from(e.table).insert(donnees);
      const { data: faits, error } = await req;
      if (error) return messageErreur(error);
      // Une modification refusée par les droits ne renvoie pas d'erreur : aucune ligne. On le dit.
      if (ligne && (!faits || !faits.length)) return "Rien n'a été enregistré : vos droits ne permettent pas de modifier cet élément, ou il a été supprimé entre-temps.";
      toast(ligne ? "Modifications enregistrées." : "Élément ajouté.");
      if (apres) apres(); else aller(cle);
    },
    onDelete: ligne && estGestionnaire() ? async () => {
      const { error } = await sb.from(e.table).delete().eq(cleTable, ligne[cleTable]);
      if (error) return messageErreur(error);
      toast("Élément supprimé."); aller(cle);
    } : null
  });
}

async function appelerGestionUtilisateurs(corps) {
  if (!/^https?:$/.test(location.protocol)) {
    throw new Error("Ouvrez l'application depuis son adresse web (http:// ou https://) pour ajouter un utilisateur : le lien d'accès doit pouvoir y revenir.");
  }
  const { data, error } = await sb.functions.invoke("gerer-utilisateur",
    { body: { ...corps, retour: adresseRetour() } });
  if (error) {
    let message = error.message;
    try { const j = await error.context.json(); if (j && j.erreur) message = j.erreur; } catch (e) { /* réponse non lisible */ }
    if (/Failed to send|Failed to fetch|FunctionsFetchError/i.test(message)) message = "Le service d'ajout d'utilisateurs est injoignable. Vérifiez votre connexion internet.";
    throw new Error(message);
  }
  return data || {};
}

function formulaireInvitation() {
  const moiAdmin = peut(["admin"]);
  // Les accès du personnel (rôle salarié) se créent depuis sa fiche, qui les relie au dossier.
  const roles = Object.entries(ROLES).filter(([k]) => (moiAdmin || k !== "admin") && k !== "salarie");
  ouvrirModale("Ajouter un utilisateur", `
    <div class="grille2">
      <div>${champFormulaire({ k: "prenom", l: "Prénom" }, "", false, "u-")}</div>
      <div>${champFormulaire({ k: "nom", l: "Nom", req: true }, "", false, "u-")}</div>
      <div>${champFormulaire({ k: "email", l: "Adresse e-mail", req: true }, "", false, "u-")}</div>
      <div>${champFormulaire({ k: "fonction", l: "Fonction" }, "", false, "u-")}</div>
      <div style="grid-column:1/-1">${champPoste("u-poste", null, true)}</div>
      <div><label for="u-role">Rôle *</label><select id="u-role">
        ${roles.map(([k, v]) => `<option value="${k}"${k === "comptable" ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>
        <p class="aide-champ" id="u-role-aide"></p></div>
    </div>
    ${blocActivites("u-act", "comptable", [], moiAdmin)}
    <fieldset style="border:0;padding:0;margin:1rem 0 0">
      <legend><b>Comment lui transmettre son accès ?</b></legend>
      <label class="case"><input type="radio" name="u-mode" value="lien" checked>
        Me donner un lien à lui envoyer moi-même — WhatsApp, SMS ou e-mail</label>
      <label class="case"><input type="radio" name="u-mode" value="email">
        Lui envoyer l'invitation par e-mail depuis Supabase</label>
      <p class="discret petit" style="margin:.3rem 0 0">Tant qu'un service d'envoi d'e-mails n'est pas configuré,
        la messagerie intégrée n'envoie que deux e-mails par heure : le lien est plus sûr.</p>
    </fieldset>`, {
    large: true, libelleSave: "Créer l'accès",
    onSave: async () => {
      const email = lireChamp({ k: "email" }, "u-");
      const nom = lireChamp({ k: "nom" }, "u-");
      if (!nom || !email) return "Le nom et l'adresse e-mail sont obligatoires.";
      if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) return "Adresse e-mail invalide.";
      const mode = ($("input[name=u-mode]:checked") || {}).value || "lien";
      const prenom = lireChamp({ k: "prenom" }, "u-");
      let r;
      try {
        r = await appelerGestionUtilisateurs({ action: "inviter", mode, email, nom, prenom,
          fonction: lireChamp({ k: "fonction" }, "u-"), role: $("#u-role").value, roles_supplementaires: lireActivites("u-act") });
        if ($("#u-poste").value && r.id) {
          const { error: ep } = await sb.rpc("attribuer_poste", { p_profil: r.id, p_poste: $("#u-poste").value });
          if (ep) r.avertissement = "Accès créé, mais le poste n'a pas pu être attribué : " + messageErreur(ep);
        }
      } catch (err) { return err.message; }
      setTimeout(() => {
        if (r.lien) afficherLienAcces(r.lien, { prenom: prenom || nom, email, nouveau: true });
        else toast(`Invitation envoyée à ${email}.`);
        if (r.avertissement) toast(r.avertissement, true);
        if (!r.lien) aller("utilisateurs");
      }, 0);
    }
  });
  const aide = () => ($("#u-role-aide").textContent = ROLES_DESCRIPTION[$("#u-role").value] || "");
  $("#u-role").onchange = aide; aide();
  brancherActivites("u-act", "#u-role");
  brancherPoste("u-poste", "#u-role", "u-act", aide);
}

/* Poste : un modèle de droits défini par le DAF. Choisi, il fixe le rôle et les activités (qui ne se modifient plus à la main). */
function champPoste(id, valeur, invitation) {
  const postes = (etat.postes || []).filter(p => p.actif || p.id === valeur);
  return `<label for="${id}">Poste</label><select id="${id}"><option value="">Aucun poste : droits choisis à la main</option>
    ${postes.map(p => { const salarie = invitation && p.droits[0] === "salarie";
      return `<option value="${p.id}" ${p.id === valeur ? "selected" : ""} ${salarie ? "disabled" : ""}>${esc(p.libelle)}${salarie ? " — accès à ouvrir depuis sa fiche du personnel" : ""}</option>`; }).join("")}</select>
    <p class="aide-champ" id="${id}-aide"></p>`;
}
function brancherPoste(id, selRole, prefixeAct, aide) {
  const maj = () => {
    const p = (etat.postes || []).find(x => x.id === $("#" + id).value);
    $(selRole).disabled = !!p;
    if (p) { $(selRole).value = p.droits[0]; $(selRole).dispatchEvent(new Event("change")); }
    $$(`[data-act="${prefixeAct}"]`).forEach(c => {
      if (p) { c.checked = p.droits.slice(1).includes(c.value); c.disabled = true; } else c.disabled = c.value === $(selRole).value;
    });
    $("#" + id + "-aide").textContent = p ? `Droits du poste : ${p.droits.map(d => ROLES[d] || d).join(" + ")}. Pour les changer, modifiez le poste (Postes et droits) : tous ses titulaires suivent.` : "";
    if (aide) aide();
  };
  $("#" + id).onchange = maj; maj();
}

function formulairePoste(p) {
  const moiAdmin = peut(["admin"]), droits = p ? p.droits : ["salarie"];
  const choix = Object.entries(ROLES).filter(([k]) => moiAdmin || k !== "admin" || droits.includes("admin"));
  ouvrirModale(p ? "Modifier le poste" : "Nouveau poste", `
    <div class="grille2"><div><label for="po-lib">Intitulé du poste *</label><input type="text" id="po-lib" value="${esc(p ? p.libelle : "")}"></div>
      <div><label for="po-princ">Droit principal *</label><select id="po-princ">${choix.map(([k, v]) => `<option value="${k}" ${k === droits[0] ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>
        <p class="aide-champ" id="po-aide"></p></div></div>
    <label for="po-desc">Description</label><input type="text" id="po-desc" value="${esc(p ? p.description || "" : "")}" placeholder="Ce que fait la personne, en une phrase">
    <fieldset style="border:0;padding:0;margin:1rem 0 0"><legend><b>Droits supplémentaires</b></legend>
      <p class="discret petit" style="margin:.2rem 0 .4rem">Pour un poste qui cumule plusieurs activités (« Espace personnel seulement » ne se cumule pas).</p>
      <div class="grille2">${choix.filter(([k]) => k !== "salarie").map(([k, v]) => `<label class="case" style="margin-top:.35rem"><input type="checkbox" data-po value="${k}" ${droits.slice(1).includes(k) ? "checked" : ""}> ${esc(v)}</label>`).join("")}</div>
      <div id="po-cumul" style="margin-top:.5rem"></div></fieldset>
    ${p ? `<label class="case" style="margin-top:1rem"><input type="checkbox" id="po-actif" ${p.actif ? "checked" : ""}> Poste actif</label>` : ""}`, {
    large: true, libelleSave: p ? "Enregistrer" : "Créer le poste",
    onSave: async () => {
      const lib = $("#po-lib").value.trim(), princ = $("#po-princ").value;
      if (!lib) return "Indiquez l'intitulé du poste.";
      const d = [princ, ...(princ === "salarie" ? [] : $$("[data-po]:checked").map(c => c.value).filter(x => x !== princ))];
      const v = { libelle: lib, description: $("#po-desc").value.trim() || null, droits: d, ...(p ? { actif: $("#po-actif").checked } : {}) };
      const { error } = p ? await sb.from("postes").update(v).eq("id", p.id) : await sb.from("postes").insert(v);
      if (error) return /duplicate|unique/i.test(error.message) ? "Un poste porte déjà cet intitulé." : messageErreur(error);
      toast(p ? "Poste mis à jour : ses titulaires suivent." : "Poste créé."); aller("postes");
    }
  });
  const maj = () => {
    const princ = $("#po-princ").value;
    $("#po-aide").textContent = ROLES_DESCRIPTION[princ] || "";
    $$("[data-po]").forEach(c => { c.disabled = princ === "salarie" || c.value === princ; if (c.disabled) c.checked = false; });
    const tous = [princ, ...$$("[data-po]:checked").map(c => c.value)];
    const al = CUMULS_SENSIBLES.filter(([r]) => r.every(x => tous.includes(x))).map(([r, t]) => `${r.map(x => ROLES[x]).join(" + ")} : ${t}`);
    $("#po-cumul").innerHTML = al.length ? `<div class="info"><b>Contrôle allégé.</b> ${al.map(esc).join("<br>")}</div>` : "";
  };
  $("#po-princ").onchange = maj; $$("[data-po]").forEach(c => c.onchange = maj); maj();
}

/* Le lien d'accès, à copier ou à envoyer. Il ouvre le compte : on le rappelle. */
function afficherLienAcces(lien, { prenom, email, nouveau }) {
  const message = `Bonjour ${prenom || ""}, voici votre accès à l'application de gestion de ` +
    `${etat.entite.raison_sociale || "GUEST MARKETS"}. Ouvrez ce lien pour choisir votre mot de passe ` +
    `(il n'est valable que peu de temps) : ${lien}`;
  ouvrirModale(nouveau ? "Accès créé" : "Nouveau lien d'accès", `
    <p>${nouveau ? `Le compte de <b>${esc(email)}</b> est créé et actif.` : `Nouveau lien pour <b>${esc(email)}</b>.`}
      Transmettez-lui ce lien : il lui permettra de choisir son mot de passe.</p>
    <label for="l-lien">Lien d'accès</label>
    <input type="text" id="l-lien" readonly value="${esc(lien)}" style="font-family:monospace;font-size:.8rem">
    <div class="actions-ligne" style="margin-top:.75rem;justify-content:flex-start">
      <button type="button" class="btn btn-principal" id="l-copier">Copier le lien</button>
      <a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(message)}">Envoyer par WhatsApp</a>
      <a class="btn" href="mailto:${esc(email)}?subject=${encodeURIComponent("Votre accès à l'application GUEST MARKETS")}&body=${encodeURIComponent(message)}">Envoyer par e-mail</a>
    </div>
    <div class="info" style="margin-top:1rem"><b>Ce lien ouvre le compte.</b> Ne le transmettez qu'à la personne
      concernée. Il n'est valable qu'une heure et ne sert qu'une fois ; s'il a expiré, ouvrez la fiche de l'utilisateur
      et demandez un nouveau lien.</div>`, {});
  $("#l-copier").onclick = async () => {
    try { await navigator.clipboard.writeText(lien); toast("Lien copié."); }
    catch (e) { $("#l-lien").select(); document.execCommand("copy"); toast("Lien copié."); }
  };
  $("#modale").addEventListener("close", () => { if (etat.page === "utilisateurs") aller("utilisateurs"); }, { once: true });
}

function formulaireUtilisateur(u) {
  const moiAdmin = peut(["admin"]);
  const soi = u.id === etat.profil.id;
  const rolesPossibles = Object.entries(ROLES).filter(([k]) => moiAdmin || k !== "admin" || u.role === "admin");
  const bloqueRole = !moiAdmin && u.role === "admin";
  const corps = `<p class="discret">${esc(u.email)}</p>
    <div class="grille2">
      <div>${champFormulaire({ k: "prenom", l: "Prénom" }, u.prenom)}</div>
      <div>${champFormulaire({ k: "nom", l: "Nom" }, u.nom)}</div>
      <div>${champFormulaire({ k: "fonction", l: "Fonction" }, u.fonction)}</div>
      <div style="grid-column:1/-1">${champPoste("ch-poste", u.poste_id, false)}</div>
      <div><label for="ch-role">Rôle *</label><select id="ch-role" ${bloqueRole ? "disabled" : ""}>
        ${rolesPossibles.map(([k, v]) => `<option value="${k}" ${k === u.role ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>
        <p class="aide-champ" id="ch-role-aide"></p></div>
    </div>
    ${u.role === "salarie" && !(u.roles_supplementaires || []).length ? `<p class="discret petit">Compte d'un membre du personnel (espace personnel). Ajoutez des activités ci-dessous s'il tient aussi un poste de gestion.</p>` : ""}
    ${blocActivites("ch-act", u.role, u.roles_supplementaires, moiAdmin || (u.roles_supplementaires || []).includes("admin"))}
    ${champFormulaire({ k: "actif", l: "Compte actif", t: "bool" }, u.actif, soi)}
    ${soi ? `<p class="discret" style="margin-top:.5rem">Vous ne pouvez pas désactiver votre propre compte.</p>` : ""}
    ${!soi ? `<p style="margin-top:1rem"><button type="button" class="btn" id="b-lien-u">Produire un nouveau lien d'accès</button></p>
      <p class="discret petit">Pour une personne qui n'a pas encore choisi son mot de passe, ou dont le lien a expiré.
        Une personne qui s'est déjà connectée utilise « Mot de passe oublié ».</p>` : ""}`;
  ouvrirModale("Modifier l'utilisateur", corps, {
    onSave: async () => {
      const donnees = {
        prenom: lireChamp({ k: "prenom" }), nom: lireChamp({ k: "nom" }), fonction: lireChamp({ k: "fonction" }),
        role: $("#ch-role").value, actif: $("#ch-actif").checked, roles_supplementaires: lireActivites("ch-act")
      };
      const poste = $("#ch-poste").value || null;
      if (poste) { delete donnees.role; delete donnees.roles_supplementaires; }
      const { error } = await sb.from("profils").update(donnees).eq("id", u.id);
      if (error) return messageErreur(error);
      if (poste !== (u.poste_id || null)) {
        const { error: ep } = await sb.rpc("attribuer_poste", { p_profil: u.id, p_poste: poste });
        if (ep) return messageErreur(ep);
      }
      toast("Utilisateur mis à jour.");
      if (soi) { const { data } = await sb.from("profils").select("*").eq("id", u.id).single(); etat.profil = data; rendreCoque(); }
      else aller("utilisateurs");
    }
  });
  const aide = () => ($("#ch-role-aide").textContent = ROLES_DESCRIPTION[$("#ch-role").value] || "");
  $("#ch-role").onchange = aide; aide();
  brancherActivites("ch-act", "#ch-role");
  brancherPoste("ch-poste", "#ch-role", "ch-act", aide);
  if ($("#b-lien-u")) $("#b-lien-u").onclick = async () => {
    const b = $("#b-lien-u"); b.disabled = true;
    try {
      const r = await appelerGestionUtilisateurs({ action: "lien", id: u.id });
      $("#modale").close();
      afficherLienAcces(r.lien, { prenom: u.prenom || u.nom, email: u.email, nouveau: false });
    } catch (err) {
      $("#mod-err").innerHTML = `<div class="erreur">${esc(err.message)}</div>`;
      b.disabled = false;
    }
  };
}

const TAILLE_PAGE = 50;
const journalEtat = { offset: 0 };
const IGNORES = ["updated_at", "created_at"];

function tableJournal(lignes, avecEnregistrement = true) {
  if (!lignes.length) return `<div class="vide">Aucune modification enregistrée.</div>`;
  return `<table class="registre"><thead><tr><th>Date et heure</th><th>Utilisateur</th><th>Opération</th><th>Élément</th>${avecEnregistrement ? "<th>Identifiant</th>" : ""}<th></th></tr></thead><tbody>
  ${lignes.map((l, i) => `<tr>
    <td class="heure">${esc(dateHeure(l.horodatage))}</td>
    <td>${esc(l.utilisateur_email || "Système (reprise ou administration)")}</td>
    <td><span class="op op-${l.action}">${LIB_ACTIONS[l.action]}</span></td>
    <td>${esc(NOMS_TABLES[l.table_nom] || l.table_nom)}${resume(l) ? `<div class="discret">${esc(resume(l))}</div>` : ""}</td>
    ${avecEnregistrement ? `<td class="discret num" style="font-size:.8rem">${esc((l.enregistrement_id || "").slice(0, 8))}</td>` : ""}
    <td><button class="btn-lien" data-diff="${i}" aria-expanded="false">Détail</button></td></tr>
    <tr class="detail" hidden data-diff-ligne="${i}"><td colspan="${avecEnregistrement ? 6 : 5}">${diffHtml(l)}</td></tr>`).join("")}
  </tbody></table>`;
}

function resume(l) {
  const d = l.apres || l.avant || {};
  if (d.numero) return `${d.numero} – ${d.libelle || ""}`;
  if (d.reference) return `${d.reference} – ${d.designation || ""}`;
  if (d.code) return `${d.code}${d.libelle ? " – " + d.libelle : d.nom ? " – " + d.nom : ""}`;
  return d.email || d.raison_sociale || d.libelle || "";
}

function formatVal(v) {
  if (v === null || v === undefined || v === "") return "∅";
  if (typeof v === "boolean") return v ? "Oui" : "Non";
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

function diffHtml(l) {
  const a = l.avant || {}, b = l.apres || {};
  let cles = [...new Set([...Object.keys(a), ...Object.keys(b)])].filter(k => !IGNORES.includes(k));
  if (l.action === "UPDATE") cles = cles.filter(k => JSON.stringify(a[k]) !== JSON.stringify(b[k]));
  if (!cles.length) return `<div style="padding:.6rem 1rem" class="discret">Aucun champ métier modifié.</div>`;
  return `<div class="diff"><div class="t">Champ</div><div class="t">Avant</div><div class="t">Après</div>
    ${cles.map(k => `<div class="champ">${esc(k)}</div>
      <div class="${l.action !== "INSERT" ? "avant" : "discret"}">${l.action === "INSERT" ? "" : esc(formatVal(a[k]))}</div>
      <div class="apres">${l.action === "DELETE" ? "" : esc(formatVal(b[k]))}</div>`).join("")}</div>`;
}

function brancherJournal() {
  $$("[data-diff]").forEach(b => b.onclick = () => {
    const ligne = $(`[data-diff-ligne="${b.dataset.diff}"]`, b.closest("table"));
    ligne.hidden = !ligne.hidden;
    b.setAttribute("aria-expanded", String(!ligne.hidden));
    b.textContent = ligne.hidden ? "Détail" : "Masquer";
  });
}

async function pageJournal() {

async function chargerJournal() {
  let q = sb.from("journal_audit").select("*", { count: "exact" }).order("horodatage", { ascending: false })
    .range(journalEtat.offset, journalEtat.offset + TAILLE_PAGE - 1);
  const tbl = $("#j-table").value, act = $("#j-action").value, usr = $("#j-user").value.trim(),
    du = $("#j-du").value, au = $("#j-au").value;
  if (tbl) q = q.eq("table_nom", tbl);
  if (act) q = q.eq("action", act);
  if (usr) q = q.ilike("utilisateur_email", `%${usr}%`);
  if (du) q = q.gte("horodatage", new Date(du + "T00:00:00").toISOString());
  if (au) q = q.lte("horodatage", new Date(au + "T23:59:59.999").toISOString());
  const { data, count, error } = await q;
  if (error) return ($("#j-corps").innerHTML = `<div class="erreur" style="margin:1rem">${esc(messageErreur(error))}</div>`);
  $("#j-corps").innerHTML = tableJournal(data);
  brancherJournal();
  const debut = count ? journalEtat.offset + 1 : 0, fin = Math.min(journalEtat.offset + TAILLE_PAGE, count || 0);
  $("#j-pag").innerHTML = `<span class="discret num">${debut}–${fin} sur ${count || 0}</span>
    <span><button class="btn" id="j-prec" ${journalEtat.offset === 0 ? "disabled" : ""}>Précédent</button>
    <button class="btn" id="j-suiv" ${fin >= (count || 0) ? "disabled" : ""}>Suivant</button></span>`;
  $("#j-prec").onclick = () => { journalEtat.offset = Math.max(0, journalEtat.offset - TAILLE_PAGE); chargerJournal(); };
  $("#j-suiv").onclick = () => { journalEtat.offset += TAILLE_PAGE; chargerJournal(); };
}

/* PostgREST rend 1 000 lignes au plus par appel : on lit par pages. */
async function chargerTout(construire) {
  let lignes = [];
  for (let de = 0; ; de += 1000) {
    const { data, error } = await construire().range(de, de + 999);
    if (error) throw error;
    lignes = lignes.concat(data || []);
    if (!data || data.length < 1000) return lignes;
  }
}

  if (peut(PREPARE_VENTE)) {
    const n = await compter(sb.from("documents_vente").select("id", { count: "exact", head: true }).eq("statut", "Brouillon").in("type", ["Facture", "Avoir"]));
    if (n) pts.push({ texte: `<b>${n} facture(s) ou avoir(s) en brouillon</b> : tant qu'ils ne sont pas validés, ils ne comptent ni en chiffre d'affaires ni en stock.`, page: "ventes", param: { onglet: "brouillons" }, bouton: "Valider" });
  }
  if (peut(FINANCE)) {
    const { data: echues } = await sb.from("v_documents_vente").select("reste").eq("type", "Facture").eq("statut", "Validée").gt("reste", 0).gt("jours_retard", 0);
    if (echues && echues.length) pts.push({ texte: `<b>${echues.length} facture(s) échue(s) impayée(s)</b>, pour ${fcfa(echues.reduce((s, d) => s + Number(d.reste), 0))} FCFA.`, page: "creances", bouton: "Relancer" });
  }
  {
    const { data: st } = await sb.from("v_stock").select("quantite, seuil_alerte").gt("seuil_alerte", 0);
    const n = (st || []).filter(p => Number(p.quantite) <= Number(p.seuil_alerte)).length;
    if (n) pts.push({ texte: `<b>${n} produit(s) sous le seuil d'alerte</b> : à réapprovisionner.`, page: "stock", bouton: "Voir" });
  }
  if (peut(IMMO_SAISIE)) {
    const { data: der } = await sb.from("amortissements").select("annee, mois").eq("anterieur", false).order("annee", { ascending: false }).order("mois", { ascending: false }).limit(1);
    const { count: nImmo } = await sb.from("immobilisations").select("id", { count: "exact", head: true }).eq("statut", "En service");
    const p = new Date(); p.setDate(0);
    const dernier = der && der[0] ? der[0].annee * 12 + der[0].mois : 0;
    if (nImmo && dernier < p.getFullYear() * 12 + p.getMonth() + 1) pts.push({ texte: `<b>Les amortissements de ${MOIS[p.getMonth()].toLowerCase()} ${p.getFullYear()}</b> sont à passer.`, page: "immobilisations", param: { onglet: "dotations" }, bouton: "Doter" });
    const n = await compter(sb.from("v_acquisitions_a_immobiliser").select("ligne_ecriture_id", { count: "exact", head: true }));
    if (n) pts.push({ texte: `<b>${n} acquisition(s) en classe 2</b> ne sont rattachées à aucune fiche d'immobilisation.`, page: "immobilisations", param: { onglet: "a_immobiliser" }, bouton: "Immobiliser" });
  }
  if (peut(CORRECTION)) {
    const { data: et } = await sb.from("v_etalements").select("date_debut, nb_mois, mois_passes").gt("reste", 0);
    const p = new Date(); p.setDate(0);
    const dus = (et || []).filter(e => { const d = new Date(e.date_debut); const n = Math.min(e.nb_mois, (p.getFullYear() - d.getFullYear()) * 12 + p.getMonth() - d.getMonth() + 1); return n > e.mois_passes; }).length;
    if (dus) pts.push({ texte: `<b>${dus} charge(s) étalée(s)</b> ont des quotes-parts à passer jusqu'à ${MOIS[p.getMonth()].toLowerCase()}.`, page: "etalements", bouton: "Passer" });
  }
  if (peut(PAIEMENT)) {
    // Indemnités de stage : le mois écoulé (et le mois en cours à partir du 25), depuis la mise en service d'octobre 2026.
    const d = new Date(), mois = [[d.getFullYear(), d.getMonth()]];
    if (d.getDate() >= 25) mois.push([d.getFullYear(), d.getMonth() + 1]);
    for (let [a, m] of mois) {
      if (m === 0) { a--; m = 12; }
      if (a * 12 + m < 2026 * 12 + 10) continue;
      try {
        const l = (await appeler("etat_stagiaires", { p_annee: a, p_mois: m })).filter(x => Number(x.reste) > 0);
        if (l.length) pts.push({ texte: `<b>${l.length} indemnité(s) de stage de ${MOIS[m - 1].toLowerCase()} ${a}</b> restent à payer (${fcfa(l.reduce((t, x) => t + Number(x.reste), 0))} FCFA).`, page: "paie", param: { onglet: "stagiaires" }, bouton: "Payer" });
      } catch (e) { /* sans accès */ }
    }
  }
  if (peut(["caissier"])) {
    try {
      const ap = await appeler("approvisionnements_attendus");
      if (ap.length) pts.push({ texte: `<b>${ap.length} approvisionnement(s) de votre caisse</b> à confirmer (${fcfa(ap.reduce((t, a) => t + Number(a.montant), 0))} FCFA) : l'argent est parti, son arrivée n'est pas saisie.`, page: "tresorerie", bouton: "Confirmer" });
    } catch (e) { /* */ }
  }
  if (peut(FINANCE)) {
    // Un compte de trésorerie ne peut pas être à découvert ; un transfert doit arriver quelque part.
    try {
      const neg = (await appeler("situation_tresorerie", { p_date: aujourdhui() })).filter(s => Number(s.solde) < 0);
      if (neg.length) pts.push({ texte: `<b>${neg.length} compte(s) de trésorerie en solde négatif</b> (${esc(neg.map(s => s.code).join(", "))}) : une entrée manque ou a été portée sur un autre compte.`, page: "situation_tresorerie", bouton: "Examiner" });
      const tr = (await appeler("transferts_tresorerie")).filter(t => t.statut !== "Arrivé" && ecartJours(t.date_sortie || t.date_entree, aujourdhui()) > 7);
      if (tr.length) pts.push({ texte: `<b>${tr.length} transfert(s) entre comptes</b> sans contrepartie depuis plus de 7 jours : arrivée ou départ à saisir.`, page: "situation_tresorerie", bouton: "Voir" });
    } catch (e) { /* sans accès */ }
  }
  if (peut(CORRECTION)) {
    const n = await compter(sb.from("releves_bancaires").select("id", { count: "exact", head: true }).eq("statut", "En cours"));
    if (n) pts.push({ texte: `<b>${n} rapprochement(s) bancaire(s)</b> en cours, à terminer et valider.`, page: "rapprochements", bouton: "Rapprocher" });
  }
  await aFaireSupply(pts);
  if (peut(CORRECTION)) {
    const n = await compter(sb.from("reprise_lignes").select("id", { count: "exact", head: true }).eq("statut", "Importée, à revoir"));
    if (n) pts.push({ texte: `<b>${n} ligne(s) reprises du classeur</b> sont à revoir : catégories à ventiler, bureaux à indiquer, règlements à affecter.`, page: "reprise", bouton: "Revoir" });
  }
  return pts;
}

/* =====================================================================
   Trésorerie
   ===================================================================== */
const libCompteOp = o => o.payeur === "Compensation fournisseur" ? "Compensation (fournisseur)"
  : o.payeur !== "Trésorerie" ? `Exploitant (${o.payeur})` : o.compte_code || "";
function imputationOp(o) {
  if (o.type === "Règlement fournisseur") return (o.fournisseur ? esc(o.fournisseur) : `<span class="pastille attente">Fournisseur à affecter</span>`)
    + (o.achat_numero ? `<div class="discret petit">${esc(o.achat_numero)}</div>` : "");
  if (o.type === "Encaissement client") return esc(o.client || "") + (o.document_numero ? `<div class="discret petit">${esc(o.document_numero)}</div>` : "");
  if (o.type === "Paiement salaire") return esc(o.salarie || "") + (o.bulletin_numero ? `<div class="discret petit">${esc(o.bulletin_numero)}</div>` : "");
  if (o.type === "Virement") return `→ ${esc(o.destination_code || "")}`;
  return (o.ventilation ? `<span class="pastille">Ventilée</span> ` : "") + esc(o.categorie || "");
}
function pastillesOperation(o) {
  const p = [];
  if (o.annulee) p.push(`<span class="pastille inactif">Annulée</span>`);
  if (o.exercice_anterieur) p.push(`<span class="pastille inactif" title="Charge reportée en 129">Exercice 2025</span>`);
  if (o.reprise_statut === "Importée, à revoir") p.push(`<span class="pastille attente" title="${esc(o.reprise_motif)}">À revoir</span>`);
  else if (o.reprise_statut === "Revue") p.push(`<span class="pastille ok">Revue</span>`);
  return p.join(" ");
}
/* Sens d'une opération vu d'un compte : un virement sort de l'un et entre dans l'autre. */
function sensOperation(o, compte) {
  if (o.type === "Virement") return compte === o.compte_destination_id ? "entree" : compte === o.compte_tresorerie_id ? "sortie" : "interne";
  return ["Recette", "Encaissement client"].includes(o.type) ? "entree" : "sortie";
}

        <select id="f-groupe" aria-label="Groupe de catégories"><option value="">Tous les groupes</option>${GROUPES_CATEGORIE.map(g => `<option>${esc(g)}</option>`).join("")}</select>

  $("#appros").innerHTML = `<div class="panneau" style="margin-bottom:1.25rem"><h2 style="margin-top:0">Approvisionnements à confirmer</h2>

    <div class="defil"><table><thead><tr><th>Parti le</th><th>De</th><th>Pour</th><th>Libellé</th><th class="montant">Montant</th><th>Reçu le</th><th></th></tr></thead><tbody>
    ${ap.map(a => `<tr><td class="code">${esc(dateCourte(a.date_sortie))}</td><td>${esc(a.compte_sortie)}</td><td>${esc(a.compte)}</td><td>${esc(a.libelle)}</td>
