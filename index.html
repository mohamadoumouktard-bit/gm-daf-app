  };
  $("#f-etat").onchange = dessiner; dessiner();
  if ($("#b-doc")) $("#b-doc").onclick = () => formulaireDocumentVehicule({});
}

      <td><span class="pastille ${CLASSE_SAISIE[e.statut]}">${esc(e.statut)}</span><div class="discret petit">${esc(nomPers(e.saisi_par))}</div></td>

function deciderSaisieParc(table, id, decision) {
  if (decision === "Validé") return sb.from(table).update({ statut: "Validé" }).eq("id", id).then(({ error }) => { if (error) toast(messageErreur(error), true); else { toast("Validé."); recharger(); } });
  ouvrirModale("Refuser la saisie", `<label for="rf-motif">Motif *</label><textarea id="rf-motif"></textarea>`, {
    libelleSave: "Refuser",
    onSave: async () => {
      const m = $("#rf-motif").value.trim(); if (!m) return "Indiquez le motif.";
      const { error } = await sb.from(table).update({ statut: "Refusé", motif_refus: m }).eq("id", id);
      if (error) return messageErreur(error);
      toast("Saisie refusée."); recharger();
    }
  });
}

async function ongletReleves() {
  const p = etat.param.periode || etat.periodeReleve || moisPrecedent();
  etat.periodeReleve = p;
  const { data, error } = await sb.from("releves_km").select("*").order("annee").order("mois");
  if (error) throw error;
  const rel = data || [];
  const du = v => rel.find(r => r.vehicule_id === v && r.annee === p.annee && r.mois === p.mois);
  const prec = v => rel.filter(r => r.vehicule_id === v && r.statut !== "Refusé" && r.annee * 12 + r.mois < p.annee * 12 + p.mois).pop();
  const actifs = etat.parc.vehicules.filter(v => v.actif && v.statut !== "Hors service");
  const aValider = actifs.filter(v => (du(v.id) || {}).statut === "Saisi");
  $("#parc-actions").innerHTML = peut(PARC_VALIDE) && aValider.length ? `<button class="btn btn-principal" id="b-val-rel">Valider les ${aValider.length} relevé(s)</button>` : "";
  $("#parc-corps").innerHTML = `<p class="discret">Chaque fin de mois, relevez le compteur de chaque véhicule (photo du compteur conseillée). Le responsable valide ;
      l'onglet Carburant compare alors les kilomètres parcourus au carburant payé par la caisse.</p>
    <div class="outils"><label class="discret" for="rl-mois" style="margin:0">Mois</label><input type="month" id="rl-mois" value="${p.annee}-${String(p.mois).padStart(2, "0")}" style="width:auto"></div>
    <div class="defil"><table><thead><tr><th>Véhicule</th><th class="montant">Relevé précédent</th><th>Compteur au ${String(p.mois).padStart(2, "0")}/${p.annee}</th>
      <th class="montant">Km parcourus</th><th>Photo</th><th>Statut</th><th></th></tr></thead><tbody>${actifs.map(v => { const r = du(v.id), q = prec(v.id);
      const base = q ? Number(q.kilometrage) : v.km_initial != null ? Number(v.km_initial) : null;
      const modifiable = peut(PARC_SAISIE) && (!r || r.statut !== "Validé" || peut(PARC_VALIDE));
      return `<tr><td><b>${esc(v.libelle)}</b><div class="discret petit">${esc(v.immatriculation || "")}</div></td>
        <td class="montant">${base != null ? base.toLocaleString("fr-FR") + " km" : "—"}</td>
        <td>${modifiable ? `<input type="number" min="0" inputmode="numeric" data-km="${v.id}" value="${esc(r ? r.kilometrage : "")}" style="width:9rem">` : r ? Number(r.kilometrage).toLocaleString("fr-FR") + " km" : "—"}</td>
        <td class="montant">${r && base != null ? (Number(r.kilometrage) - base).toLocaleString("fr-FR") : ""}</td>
        <td>${r && r.photo ? `<button class="btn-lien" data-voir="${esc(r.photo)}">Voir</button>` : ""}${modifiable ? `<input type="file" accept="image/*" capture="environment" data-photo="${v.id}" class="champ-photo petit">` : ""}</td>
        <td>${r ? `<span class="pastille ${CLASSE_SAISIE[r.statut]}">${esc(r.statut)}</span>${r.motif_refus ? `<div class="discret petit">${esc(r.motif_refus)}</div>` : ""}` : `<span class="pastille inactif">À relever</span>`}</td>
        <td class="actions-ligne">${modifiable ? `<button class="btn" data-enr="${v.id}">Enregistrer</button>` : ""}
          ${r && r.statut === "Saisi" && peut(PARC_VALIDE) ? `<button class="btn" data-refuser-rel="${r.id}">Refuser</button>` : ""}</td></tr>`; }).join("")}</tbody></table></div>`;
  $("#rl-mois").onchange = () => { const [a, m] = $("#rl-mois").value.split("-").map(Number); if (a && m) { etat.periodeReleve = { annee: a, mois: m }; aller("parc", { onglet: "releves" }); } };
  $$("[data-voir]").forEach(b => b.onclick = () => voirFichierSupply(b.dataset.voir));
  $$("[data-refuser-rel]").forEach(b => b.onclick = () => deciderSaisieParc("releves_km", b.dataset.refuserRel, "Refusé"));
  $$("[data-enr]").forEach(b => b.onclick = async () => {
    const v = b.dataset.enr, km = $(`[data-km="${v}"]`).value, r = du(v);
    if (km === "") return toast("Indiquez le kilométrage au compteur.", true);
    b.disabled = true;
    try {
      const photo = await deposerSupply("releves", ($(`[data-photo="${v}"]`).files || [])[0]);
      const fin = new Date(p.annee, p.mois, 0), d = { kilometrage: Number(km), ...(photo ? { photo } : {}) };
      const { error } = r ? await sb.from("releves_km").update({ ...d, ...(r.statut === "Refusé" ? { statut: "Saisi", motif_refus: null } : {}) }).eq("id", r.id)
        : await sb.from("releves_km").insert({ ...d, vehicule_id: v, annee: p.annee, mois: p.mois, date_releve: new Date(fin - fin.getTimezoneOffset() * 60000).toISOString().slice(0, 10) });
      if (error) throw error;
      toast("Relevé enregistré."); aller("parc", { onglet: "releves" });
    } catch (err) { b.disabled = false; toast(messageErreur(err), true); }
  });
  if ($("#b-val-rel")) $("#b-val-rel").onclick = async () => {
    const ids = aValider.map(v => du(v.id).id);
    const { error } = await sb.from("releves_km").update({ statut: "Validé" }).in("id", ids);
    if (error) return toast(messageErreur(error), true);
    toast("Relevés validés."); aller("parc", { onglet: "releves" });
  };
}

async function ongletCarburant() {
  const annee = etat.filtres.annee;
  const lignes = await appeler("suivi_carburant", { p_annee: annee });
  const vehs = [...new Map(lignes.map(l => [l.vehicule_id, l])).values()];
  const cell = l => !l ? "" : `<div class="${l.anomalie ? "negatif" : ""}" title="${esc(l.anomalie || "")}">${l.km_parcourus != null ? `${Number(l.km_parcourus).toLocaleString("fr-FR")} km` : `<span class="discret">— km</span>`}
    <div class="petit">${Number(l.carburant) ? fcfa(l.carburant) : ""}${l.cout_km != null ? ` · ${fcfa(l.cout_km)}/km` : ""}</div>${l.anomalie ? `<div class="petit">⚠ ${esc(l.anomalie)}</div>` : ""}</div>`;
  const anomalies = lignes.filter(l => l.anomalie);
  const annees = []; for (let a = 2026; a <= Math.max(2026, new Date().getFullYear()) + 1; a++) annees.push(a);
  $("#parc-corps").innerHTML = `<div class="outils"><select id="cb-annee" aria-label="Année">${annees.map(a => `<option ${a === Number(annee) ? "selected" : ""}>${a}</option>`).join("")}</select></div>
    <p class="discret">Kilomètres du mois (relevés validés ou saisis) et carburant payé par la caisse pour chaque véhicule (catégories Carburant…). Une alerte apparaît
      quand du carburant est payé sans relevé ou sans kilomètre, ou quand le coût au kilomètre dépasse de plus de 30 % la moyenne des trois mois précédents.</p>
    ${anomalies.length ? `<div class="info"><b>${anomalies.length} point(s) à vérifier.</b> ${anomalies.slice(0, 6).map(a => `${esc(a.libelle)} (${MOIS[a.mois - 1].toLowerCase()}) : ${esc(a.anomalie)}`).join(" ; ")}${anomalies.length > 6 ? "…" : ""}</div>` : ""}
    <div class="defil"><table class="pivot"><thead><tr><th>Véhicule</th>${MOIS_COURT.map(m => `<th>${m}</th>`).join("")}<th>Année</th></tr></thead><tbody>
    ${vehs.map(v => { const ls = lignes.filter(l => l.vehicule_id === v.vehicule_id), km = ls.reduce((t, l) => t + Number(l.km_parcourus || 0), 0), c = ls.reduce((t, l) => t + Number(l.carburant || 0), 0);
      return `<tr><td><b>${esc(v.libelle)}</b></td>${MOIS.map((_, i) => `<td>${cell(ls.find(l => l.mois === i + 1))}</td>`).join("")}
        <td><b>${km.toLocaleString("fr-FR")} km</b><div class="petit">${fcfa(c)}${km ? ` · ${fcfa(Math.round(c / km))}/km` : ""}</div></td></tr>`; }).join("")}</tbody></table></div>`;
  $("#cb-annee").onchange = () => { etat.filtres.annee = Number($("#cb-annee").value); aller("parc", { onglet: "carburant" }); };
}

  const actives = new Set((livs || []).filter(l => !["Échouée", "Annulée", "Reportée"].includes(l.statut)).map(l => l.document_vente_id));
  const aPlanifier = (ventes || []).filter(v => !["Livrée", "Retournée"].includes(v.livraison) && !actives.has(v.id));
  const nomsClients = Object.fromEntries((ventes || []).map(v => [v.client_id, v.client]));

      <div class="defil"><table><thead><tr><th>Facture</th><th>Date</th><th>Client</th><th class="montant">Montant</th><th></th></tr></thead><tbody>

    <div class="outils"><select id="f-st" aria-label="Statut"><option value="">Tous les statuts</option>${Object.keys(CLASSE_LIVRAISON).map(s => `<option>${s}</option>`).join("")}</select>

  const dessiner = () => {
    const st = $("#f-st").value, d = $("#f-date").value;
    $("#corps-liv").innerHTML = (livs || []).filter(l => (!st || l.statut === st) && (!d || l.date_prevue === d)).map(l => `<tr>
      <td class="code">${esc(dateCourte(l.date_prevue))}</td><td>${esc(nomsClients[l.client_id] || "")}<div class="discret petit">${esc(l.telephone || "")}</div></td>
      <td>${esc(l.adresse || "")}</td><td>${esc([nomPers(l.livreur_id), nomVeh(l.vehicule_id)].filter(Boolean).join(" · "))}</td>
      <td><span class="pastille ${CLASSE_LIVRAISON[l.statut]}">${esc(l.statut)}</span>${l.motif ? `<div class="discret petit">${esc(l.motif)}</div>` : ""}</td>

  $$("[data-planif]").forEach(b => b.onclick = () => formulairePlanifierLivraison(aPlanifier.find(v => v.id === b.dataset.planif)));

/* Réception chez le fournisseur : quantité récupérée par article ; tout écart s'explique. */
function formulaireReception(e, retour) {
  const lignes = e.enlevement_lignes || e.lignes || [];
  ouvrirModale("Réception chez le fournisseur", `<p class="discret petit">Comptez ce qui est chargé. Un écart (manquant, casse) est signalé au manager et au DAF.</p>
    ${lignes.map(l => `<div class="ligne-recep"><div><b>${esc(l.designation)}</b><div class="discret petit">Commandé : ${qte(l.quantite_attendue)}</div></div>
      <input type="number" min="0" inputmode="decimal" data-recue="${l.id}" value="${esc(l.quantite_attendue)}" aria-label="Quantité récupérée" style="width:6rem">
      <input type="text" data-motif="${l.id}" placeholder="Motif de l'écart" aria-label="Motif de l'écart" hidden></div>`).join("")}
    <label for="rc-obs">Observation</label><input type="text" id="rc-obs">`, {
    libelleSave: "Valider la réception",
    onSave: async () => {
      const ls = lignes.map(l => ({ id: l.id, quantite_recue: $(`[data-recue="${l.id}"]`).value === "" ? null : Number($(`[data-recue="${l.id}"]`).value), motif_ecart: $(`[data-motif="${l.id}"]`).value }));
      try { await appeler("enregistrer_enlevement", { p_id: e.id, p_lignes: ls, p_observation: $("#rc-obs").value || null }); } catch (err) { return messageErreur(err); }

/* Points de l'accueil pour la supply chain, le manager et le livreur. */
async function aFaireSupply(pts) {
  const compter = async q => { const { count } = await q; return count || 0; };
  try {
    if (peut(PARC_LECTEURS)) {
      const { data: ech } = await sb.from("v_echeances_parc").select("etat");
      const exp = (ech || []).filter(e => ["Expiré", "Manquant"].includes(e.etat)).length, s7 = (ech || []).filter(e => e.etat === "Sous 7 jours").length,
        s30 = (ech || []).filter(e => e.etat === "Sous 30 jours").length;
      if (exp) pts.push({ texte: `<b>${exp} papier(s) de véhicule expiré(s) ou manquant(s)</b> : assurance, visite technique, vignette, carte grise…`, page: "parc", param: { onglet: "echeances" }, bouton: "Voir" });
      if (s7 + s30) pts.push({ texte: `<b>${s7 + s30} document(s) du parc expirent bientôt</b>${s7 ? ` (dont ${s7} sous 7 jours)` : ""}.`, page: "parc", param: { onglet: "echeances" }, bouton: "Renouveler" });
      const p = moisPrecedent();
      const [{ data: rel }, { data: veh }] = await Promise.all([sb.from("releves_km").select("vehicule_id, statut").eq("annee", p.annee).eq("mois", p.mois),
        sb.from("vehicules").select("id").eq("actif", true).neq("statut", "Hors service")]);
      const manquants = (veh || []).filter(v => !(rel || []).some(r => r.vehicule_id === v.id && r.statut !== "Refusé")).length;
      if (manquants && peut(PARC_SAISIE)) pts.push({ texte: `<b>Relevé kilométrique de ${MOIS[p.mois - 1].toLowerCase()} ${p.annee}</b> : ${manquants} véhicule(s) à relever.`, page: "parc", param: { onglet: "releves", periode: p }, bouton: "Relever" });
      if (peut(PARC_VALIDE)) {
        const nr = (rel || []).filter(r => r.statut === "Saisi").length, ne = await compter(sb.from("entretiens_vehicule").select("id", { count: "exact", head: true }).eq("statut", "Saisi"));
        if (nr) pts.push({ texte: `<b>${nr} relevé(s) kilométrique(s)</b> de l'adjoint attendent votre validation.`, page: "parc", param: { onglet: "releves", periode: p }, bouton: "Valider" });
        if (ne) pts.push({ texte: `<b>${ne} entretien(s) ou réparation(s)</b> attendent votre validation.`, page: "parc", param: { onglet: "entretiens" }, bouton: "Valider" });
      }
      const ni = await compter(sb.from("incidents_vehicule").select("id", { count: "exact", head: true }).eq("statut", "Ouvert"));
      if (ni) pts.push({ texte: `<b>${ni} incident(s) de véhicule</b> signalé(s), sans suite pour l'instant.`, page: "parc", param: { onglet: "incidents" }, bouton: "Traiter" });
    }
    if (peut(PARC_SAISIE)) {
      const a = await appeler("achats_a_enlever");
      if (a.length) pts.push({ texte: `<b>${a.length} achat(s) validé(s)</b> sont à aller chercher chez les fournisseurs.`, page: "logistique", param: { onglet: "enlevements" }, bouton: "Planifier" });
    }
    if (peut([...PARC_LECTEURS, "manager"])) {
      const n = await compter(sb.from("enlevements").select("id", { count: "exact", head: true }).eq("ecart", true).gte("effectue_le", new Date(Date.now() - 30 * 864e5).toISOString()));
      if (n) pts.push({ texte: `<b>${n} enlèvement(s) avec écart</b> ces 30 derniers jours : quantités récupérées inférieures ou supérieures à l'achat.`, page: "logistique", param: { onglet: "enlevements" }, bouton: "Voir" });
    }
    if (peut(["livreur"])) {
      const t = await appeler("ma_tournee", { p_date: aujourdhui() });
      const n = (t.livraisons || []).filter(l => ["À livrer", "En cours"].includes(l.statut)).length + (t.enlevements || []).filter(e => e.statut === "Prévu").length;
      if (n) pts.push({ texte: `<b>${n} course(s) dans votre tournée</b> aujourd'hui.`, page: "ma_tournee", bouton: "Ouvrir" });
    }
  } catch (e) { /* sans accès */ }
}

/* =====================================================================

   Le salarié ne lit aucune table : tout passe par les fonctions mon_espace,
   mes_bulletins, mes_conges… qui ne rendent que ce qui le concerne.

const TYPES_DEMANDE = ["Formation", "Attestation de travail", "Attestation de salaire", "Attestation de stage", "Avance sur salaire", "Mise à jour du dossier", "Autre"];
const CLASSE_DEMANDE = { "Demandée": "attente", "Visée": "attente", "Acceptée": "ok", "Traitée": "ok", "Refusée": "alerte", "Annulée": "inactif" };

const CLASSE_EVAL = { "Ouverte": "attente", "Auto-évaluée": "attente", "Évaluée": "", "Signée": "ok", "Close": "inactif" };
const APPRECIATIONS = ["Insuffisant", "À améliorer", "Satisfaisant", "Très bien", "Excellent"];
const CHAMPS_MAJ_DOSSIER = [["telephone", "Téléphone"], ["email", "E-mail"], ["adresse", "Adresse (quartier)"], ["ville", "Ville"],
  ["personne_a_prevenir", "Personne à prévenir"], ["telephone_urgence", "Téléphone de la personne à prévenir"],
  ["situation_familiale", "Situation familiale"], ["enfants", "Enfants à charge"], ["banque", "Banque"], ["rib", "RIB"], ["numero_mobile_money", "N° Mobile Money"]];
const aEspace = () => !!etat.monEspace;
const estStagiaireEspace = () => !!etat.monEspace && etat.monEspace.salarie.type_contrat === "Stage";
const aUneEquipe = () => !!etat.monEspace && (etat.monEspace.equipe || []).length > 0;
const statutConge = c => c.statut === "Visé" ? "Visé, en attente de la RH" : c.statut === "Demandé" ? "En attente du responsable" : c.statut;
const statutDemande = d => d.statut === "Visée" ? "Visée, en attente de la RH" : d.statut === "Demandée" ? (["Formation", "Avance sur salaire"].includes(d.type) ? "En attente du responsable" : "En attente de la RH") : d.statut;
const compterJoursOuvrables = (a, b) => { if (!a || !b || b < a) return 0; let n = 0;
  for (let d = new Date(a + "T00:00:00"); d <= new Date(b + "T00:00:00"); d.setDate(d.getDate() + 1)) if (d.getDay() !== 0) n++; return n; };

async function chargerMonEspace() {
  try { etat.monEspace = await appeler("mon_espace"); } catch (e) { etat.monEspace = null; }
  return etat.monEspace;
}

/* Rappels de l'espace (cloche et accueil) : ce que la personne doit faire elle-même. */
function rappelsEspace() {
  const m = etat.monEspace; if (!m) return [];
  const r = m.rappels || {}, pts = [];
  if (r.explications) pts.push({ texte: `<b>${r.explications} demande(s) d'explication</b> attendent votre réponse (48 heures).`, page: "mon_dossier", bouton: "Répondre" });
  if (r.evaluations) pts.push({ texte: `<b>Votre évaluation annuelle</b> attend votre auto-évaluation ou votre signature.`, page: "mes_evaluations", bouton: "Ouvrir" });
  if (r.conges_a_viser) pts.push({ texte: `<b>${r.conges_a_viser} demande(s) de congé de votre équipe</b> attendent votre visa.`, page: "mon_equipe", bouton: "Viser" });
  if (r.demandes_a_viser) pts.push({ texte: `<b>${r.demandes_a_viser} demande(s) de votre équipe</b> (formation, avance) attendent votre visa.`, page: "mon_equipe", bouton: "Viser" });
  if (r.evaluations_a_faire) pts.push({ texte: `<b>${r.evaluations_a_faire} évaluation(s) annuelle(s)</b> de votre équipe sont à conduire.`, page: "mon_equipe", bouton: "Évaluer" });
  if (r.reponses) pts.push({ texte: `<b>${r.reponses} réponse(s)</b> à vos demandes ces 7 derniers jours.`, page: "mes_demandes", bouton: "Voir" });
  return pts;
}

function formulaireDemande(typeInitial, apres) {
  const stage = estStagiaireEspace();
  const types = TYPES_DEMANDE.filter(t => stage ? !["Attestation de salaire", "Avance sur salaire", "Attestation de travail"].includes(t) : t !== "Attestation de stage");
  ouvrirModale("Nouvelle demande", `<label for="dm-type">Type de demande</label><select id="dm-type">${types.map(t => `<option ${t === typeInitial ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
    <div id="dm-champs"></div>`, {
    libelleSave: "Envoyer la demande", large: true,
    onSave: async () => {
      const type = $("#dm-type").value, v = id => ($("#dm-" + id) || {}).value || "";
      const p = { type, objet: v("objet").trim(), details: v("details").trim(), donnees: {} };
      if (type === "Formation") Object.assign(p.donnees, { organisme: v("organisme"), date_debut: v("debut"), date_fin: v("fin"), cout: Number(v("cout") || 0) || null });
      if (type === "Avance sur salaire") { p.donnees.montant = Number(v("montant") || 0); p.objet = p.objet || `Avance de ${fcfa(p.donnees.montant)} FCFA`; }
      if (type.startsWith("Attestation")) p.objet = p.objet || type;
      if (type === "Mise à jour du dossier") {
        CHAMPS_MAJ_DOSSIER.forEach(([k]) => { const x = v("maj-" + k).trim(); if (x) p.donnees[k] = x; });
        if (!Object.keys(p.donnees).length) return "Indiquez au moins une information à mettre à jour.";
        p.objet = p.objet || "Mise à jour : " + CHAMPS_MAJ_DOSSIER.filter(([k]) => p.donnees[k]).map(([, l]) => l.toLowerCase()).join(", ");
      }
      try { await appeler("creer_demande", { p }); } catch (err) { return messageErreur(err); }
      toast("Demande envoyée."); if (apres) apres();
    }
  });
  const champs = () => {
    const t = $("#dm-type").value;
    $("#dm-champs").innerHTML = t === "Formation" ? `<label for="dm-objet">Intitulé de la formation *</label><input type="text" id="dm-objet">
        <div class="grille2"><div><label for="dm-organisme">Organisme</label><input type="text" id="dm-organisme"></div>
        <div><label for="dm-cout">Coût estimé (FCFA)</label><input type="number" id="dm-cout" min="0" step="1000"></div>
        <div><label for="dm-debut">Du</label><input type="date" id="dm-debut"></div><div><label for="dm-fin">Au</label><input type="date" id="dm-fin"></div></div>
        <label for="dm-details">En quoi elle vous aidera dans votre poste</label><textarea id="dm-details" rows="3"></textarea>`
      : t === "Avance sur salaire" ? `<div class="grille2"><div><label for="dm-montant">Montant (FCFA) *</label><input type="number" id="dm-montant" min="1000" step="1000"></div></div>
        <label for="dm-details">Motif</label><textarea id="dm-details" rows="3"></textarea>
        <p class="discret petit">Accordée, l'avance est retenue sur votre salaire (élément « Remboursement d'avance »).</p>`
      : t.startsWith("Attestation") ? `<label for="dm-details">Pour quel usage ? (banque, ambassade, logement…)</label><input type="text" id="dm-details">`
      : t === "Mise à jour du dossier" ? `<p class="discret petit">Ne remplissez que ce qui change. La RH vérifie puis met votre dossier à jour.</p>
        <div class="grille2">${CHAMPS_MAJ_DOSSIER.map(([k, l]) => `<div><label for="dm-maj-${k}">${esc(l)}</label><input type="text" id="dm-maj-${k}"></div>`).join("")}</div>
        <label for="dm-details">Précision</label><input type="text" id="dm-details">`
      : `<label for="dm-objet">Objet *</label><input type="text" id="dm-objet"><label for="dm-details">Détails</label><textarea id="dm-details" rows="4"></textarea>`;
  };
  $("#dm-type").onchange = champs; champs();
}

/* Formulaire d'évaluation commun : salarié (colonne « auto »), responsable ou RH (colonne « resp »). */
function formulaireEvaluation(item, apres) {
  const e = item.evaluation, place = item.place, nom = item.nom;
  const ecritSal = place === "salarie" && e.statut === "Ouverte";
  const ecritResp = ["evaluateur", "rh"].includes(place) && ["Ouverte", "Auto-évaluée"].includes(e.statut);
  const voitResp = place !== "salarie" || ["Évaluée", "Signée", "Close"].includes(e.statut);
  const note = (k, v, actif, id) => actif ? `<select data-note="${k}" data-id="${esc(id)}" aria-label="Note"><option value="">—</option>${[1, 2, 3, 4, 5].map(n => `<option ${Number(v) === n ? "selected" : ""}>${n}</option>`).join("")}</select>`
    : (v != null && v !== "" ? `<b>${esc(v)}</b>` : `<span class="discret">—</span>`);
  const objectifs = e.objectifs || [];
  const corps = `<p class="discret">${esc(nom)} · année ${e.annee} · <span class="pastille ${CLASSE_EVAL[e.statut] || ""}">${esc(e.statut)}</span>
      · notes de 1 (insuffisant) à 5 (excellent)</p>
    <h3>Compétences</h3><table><thead><tr><th>Critère</th><th style="text-align:center">Auto-évaluation</th>${voitResp ? `<th style="text-align:center">Responsable</th>` : ""}</tr></thead><tbody>
      ${(e.competences || []).map((c, i) => `<tr><td>${esc(c.critere)}</td><td style="text-align:center">${note("auto", c.auto, ecritSal, "c" + i)}</td>
        ${voitResp ? `<td style="text-align:center">${note("resp", c.resp, ecritResp, "c" + i)}</td>` : ""}</tr>`).join("")}</tbody></table>
    ${objectifs.length || ecritResp ? `<h3>Objectifs de l'année</h3>${objectifs.length ? `<table><thead><tr><th>Objectif</th><th>Résultat obtenu</th><th style="text-align:center">Auto</th>${voitResp ? `<th style="text-align:center">Resp.</th>` : ""}</tr></thead><tbody>
      ${objectifs.map((o, i) => `<tr><td>${esc(o.objectif)}</td><td>${ecritSal ? `<input type="text" data-resultat="o${i}" value="${esc(o.resultat || "")}">` : esc(o.resultat || "")}</td>
        <td style="text-align:center">${note("auto", o.auto, ecritSal, "o" + i)}</td>${voitResp ? `<td style="text-align:center">${note("resp", o.resp, ecritResp, "o" + i)}</td>` : ""}</tr>`).join("")}</tbody></table>`
      : `<p class="discret petit">Pas d'objectifs fixés l'an dernier.</p>`}` : ""}
    <h3>Le salarié</h3>${ecritSal ? `<label for="ev-cauto">Bilan de votre année (réussites, difficultés)</label><textarea id="ev-cauto" rows="3">${esc(e.commentaire_auto || "")}</textarea>
      <label for="ev-souhait">Formations souhaitées, projets</label><input type="text" id="ev-souhait" value="${esc(e.souhaits_formation || "")}">`
      : `<p>${esc(e.commentaire_auto || "—")}</p>${e.souhaits_formation ? `<p class="petit"><b>Souhaits :</b> ${esc(e.souhaits_formation)}</p>` : ""}`}
    ${voitResp ? `<h3>Le responsable</h3>${ecritResp ? `<label for="ev-cresp">Appréciation détaillée</label><textarea id="ev-cresp" rows="3">${esc(e.commentaire_resp || "")}</textarea>
      <div class="grille2"><div><label for="ev-appr">Appréciation générale *</label><select id="ev-appr"><option value="">—</option>${APPRECIATIONS.map(a => `<option ${a === e.appreciation ? "selected" : ""}>${a}</option>`).join("")}</select></div></div>
      <label for="ev-obj">Objectifs pour l'an prochain (un par ligne)</label><textarea id="ev-obj" rows="3">${esc((e.objectifs_suivants || []).map(o => o.objectif).join("\n"))}</textarea>`
      : `<p>${esc(e.commentaire_resp || "—")}</p><p><b>Appréciation :</b> ${esc(e.appreciation || "—")}${e.note_globale != null ? ` · note ${qte(e.note_globale)} / 5` : ""}</p>
        ${(e.objectifs_suivants || []).length ? `<p class="petit"><b>Objectifs pour l'an prochain :</b></p><ul>${e.objectifs_suivants.map(o => `<li>${esc(o.objectif)}</li>`).join("")}</ul>` : ""}`}` : ""}
    ${place === "salarie" && e.statut === "Évaluée" ? `<h3>Votre signature</h3><label for="ev-csal">Vos remarques sur l'évaluation (facultatif)</label><textarea id="ev-csal" rows="2"></textarea>`
      : e.commentaire_salarie ? `<p class="petit"><b>Remarques du salarié :</b> ${esc(e.commentaire_salarie)}</p>` : ""}
    ${e.signe_salarie_le ? `<p class="discret petit">Signée par le salarié le ${esc(dateHeure(e.signe_salarie_le))}.</p>` : ""}
    <div class="barre-actions"><button type="button" class="btn" id="ev-imp">Imprimer</button>
      ${ecritSal || ecritResp ? `<button type="button" class="btn" id="ev-brouillon">Enregistrer sans transmettre</button>` : ""}</div>`;
  const lire = () => {
    const comp = (e.competences || []).map((c, i) => ({ critere: c.critere, auto: valeur("auto", "c" + i, c.auto), resp: valeur("resp", "c" + i, c.resp) }));
    const obj = objectifs.map((o, i) => ({ objectif: o.objectif, resultat: ($(`[data-resultat="o${i}"]`) || {}).value ?? o.resultat, auto: valeur("auto", "o" + i, o.auto), resp: valeur("resp", "o" + i, o.resp) }));
    return { competences: comp, objectifs: obj, commentaire_auto: ($("#ev-cauto") || {}).value, souhaits_formation: ($("#ev-souhait") || {}).value,
      commentaire_resp: ($("#ev-cresp") || {}).value, appreciation: ($("#ev-appr") || {}).value,
      objectifs_suivants: $("#ev-obj") ? $("#ev-obj").value.split("\n").map(x => x.trim()).filter(Boolean).map(objectif => ({ objectif })) : undefined };
  };
  const valeur = (k, id, defaut) => { const s = $(`[data-note="${k}"][data-id="${id}"]`); return s ? (s.value === "" ? null : Number(s.value)) : defaut; };
  const enregistrer = async soumettre => { await appeler("enregistrer_evaluation", { p_id: e.id, p: lire(), p_soumettre: soumettre }); };
  ouvrirModale(`Évaluation annuelle ${e.annee} — ${nom}`, corps, {
    large: true,
    libelleSave: ecritSal ? "Transmettre à mon responsable" : ecritResp ? "Transmettre au salarié" : place === "salarie" && e.statut === "Évaluée" ? "Signer" : undefined,
    onSave: ecritSal || ecritResp || (place === "salarie" && e.statut === "Évaluée") ? async () => {
      try {
        if (place === "salarie" && e.statut === "Évaluée") await appeler("signer_evaluation", { p_id: e.id, p_commentaire: $("#ev-csal").value });
        else {
          if (ecritSal && !confirm("Transmettre votre auto-évaluation ? Vous ne pourrez plus la modifier.")) return "Non transmise.";
          await enregistrer(true);
        }
      } catch (err) { return messageErreur(err); }
      toast(place === "salarie" && e.statut === "Évaluée" ? "Évaluation signée." : "Évaluation transmise."); if (apres) apres();
    } : undefined
  });
  if ($("#ev-brouillon")) $("#ev-brouillon").onclick = async () => { try { await enregistrer(false); toast("Enregistré."); } catch (err) { toast(messageErreur(err), true); } };
  $("#ev-imp").onclick = () => imprimerHtml(`Évaluation ${e.annee} — ${nom}`, `<h1 style="text-align:center">ENTRETIEN ANNUEL D'ÉVALUATION ${e.annee}</h1>
    <p><b>Salarié :</b> ${esc(nom)}${item.emploi ? " — " + esc(item.emploi) : ""}</p>
    <table><thead><tr><th>Compétence</th><th style="text-align:center">Auto-évaluation</th><th style="text-align:center">Responsable</th></tr></thead><tbody>

        <td>${c.statut === "Demandé" ? `<div class="actions-ligne"><button class="btn btn-principal" data-vc="${c.id}" data-f="1">Favorable</button><button class="btn" data-vc="${c.id}" data-f="">Défavorable</button></div>` : ""}</td></tr>`; }).join("")
        || `<tr><td colspan="8" class="vide">Aucune demande de congé.</td></tr>`}</tbody></table></div>
    <h2 class="titre-section">Formations et avances</h2><div class="panneau defil"><table><thead><tr><th>Salarié</th><th>Demande</th><th>Statut</th><th></th></tr></thead><tbody>

      ${aConduire.map(x => `<tr><td>${x.evaluation.annee}</td><td>${esc(x.nom)}</td><td><span class="pastille ${CLASSE_EVAL[x.evaluation.statut] || ""}">${esc(x.evaluation.statut)}</span></td>

/* ---------- RH : demandes du personnel ---------- */
async function pageDemandesPersonnel() {

    sb.from("demandes_rh").select("*").order("created_at", { ascending: false }),
    sb.from("v_personnel").select("*"),
    sb.from("evenements_rh").select("id, salarie_id, objet, date_effet, date_fin, date_evenement, donnees").eq("type", "Formation").order("date_evenement", { ascending: false })]);
  if (error) throw error;
  await chargerListe("profils_noms");
  const qui = id => (sal || []).find(s => s.id === id) || {};
  const ecrire = peut(PAIE_PREPARE);
  let onglet = etat.param.onglet || etat.ongletDemandes || "a_traiter";
  const ouvertes = (dem || []).filter(d => ["Demandée", "Visée", "Acceptée"].includes(d.statut));

      <p class="discret">Formations et avances arrivent visées par le responsable ; attestations et mises à jour du dossier arrivent directement.

    <div class="panneau"><div class="onglets" role="tablist">${[["a_traiter", `À traiter (${ouvertes.length})`], ["toutes", "Toutes"], ["formations", "Plan de formation"]].map(([k, l]) =>
      `<button role="tab" data-onglet="${k}" aria-selected="${k === onglet}">${esc(l)}</button>`).join("")}</div><div id="zone"></div></div>`;
  const zone = $("#zone");
  const tableau = liste => `<div class="defil"><table><thead><tr><th>Date</th><th>Salarié</th><th>Demande</th><th>Avis du responsable</th><th>Statut</th><th></th></tr></thead><tbody>
    ${liste.map(d => { const s = qui(d.salarie_id); return `<tr><td class="code">${esc(dateCourte(d.created_at.slice(0, 10)))}</td><td>${esc(nomPersonne(s))}<div class="discret petit">${esc(s.emploi || "")}</div></td>
      <td><b>${esc(d.type)}</b><div class="petit">${esc(d.objet)}</div>${d.details ? `<div class="discret petit">${esc(d.details)}</div>` : ""}${detailsDemande(d)}</td>
      <td class="petit">${d.avis_responsable ? `${esc(d.avis_responsable)}${d.avis_commentaire ? " — " + esc(d.avis_commentaire) : ""}<div class="discret">${esc(nomProfil(d.avis_par))}</div>` : ["Formation", "Avance sur salaire"].includes(d.type) && d.statut === "Demandée" ? `<span class="discret">en attente</span>` : ""}</td>
      <td><span class="pastille ${CLASSE_DEMANDE[d.statut] || ""}">${esc(d.statut)}</span>${d.reponse ? `<div class="petit">${esc(d.reponse)}</div>` : ""}</td>
      <td>${ecrire && ["Demandée", "Visée", "Acceptée"].includes(d.statut) ? `<button class="btn btn-principal" data-traiter="${d.id}">Traiter</button>` : ""}</td></tr>`; }).join("")
      || `<tr><td colspan="6" class="vide">Aucune demande.</td></tr>`}</tbody></table></div>`;
  const vues = {
    a_traiter: () => { zone.innerHTML = tableau(ouvertes); brancher(); },
    toutes: () => { zone.innerHTML = tableau(dem || []); brancher(); },
    formations: () => {
      const annees = [...new Set((forms || []).map(f => (f.date_effet || f.date_evenement).slice(0, 4)))].sort().reverse();
      zone.innerHTML = annees.map(a => `<h2 style="padding:1rem 1rem 0">${a}</h2><div class="defil"><table><thead><tr><th>Salarié</th><th>Formation</th><th>Organisme</th><th>Dates</th><th class="montant">Coût</th></tr></thead><tbody>
        ${(forms || []).filter(f => (f.date_effet || f.date_evenement).startsWith(a)).map(f => `<tr><td>${esc(nomPersonne(qui(f.salarie_id)))}</td><td>${esc(f.objet || "")}</td>
          <td>${esc((f.donnees || {}).organisme || "")}</td><td class="code">${esc(dateCourte(f.date_effet || f.date_evenement))}${f.date_fin ? " → " + esc(dateCourte(f.date_fin)) : ""}</td>
          <td class="montant">${(f.donnees || {}).cout ? fcfa(f.donnees.cout) : ""}</td></tr>`).join("")}</tbody></table></div>`).join("")
        || `<div class="vide">Aucune formation enregistrée. Une formation acceptée ou saisie comme événement « Formation » apparaît ici.</div>`;
    }
  };
  const brancher = () => $$("[data-traiter]").forEach(b => b.onclick = () => traiterDemande((dem || []).find(d => d.id === b.dataset.traiter), qui));
  $$("[data-onglet]").forEach(b => b.onclick = () => { onglet = etat.ongletDemandes = b.dataset.onglet; $$("[data-onglet]").forEach(x => x.setAttribute("aria-selected", String(x === b))); vues[onglet](); });
  vues[onglet]();
}

function detailsDemande(d) {
  const x = d.donnees || {};
  if (d.type === "Avance sur salaire") return `<div class="petit"><b>${fcfa(x.montant)} FCFA</b></div>`;
  if (d.type === "Formation") return `<div class="discret petit">${esc([x.organisme, x.date_debut ? "du " + dateCourte(x.date_debut) : "", x.date_fin ? "au " + dateCourte(x.date_fin) : "", x.cout ? fcfa(x.cout) + " FCFA" : ""].filter(Boolean).join(" · "))}</div>`;
  if (d.type === "Mise à jour du dossier") return `<div class="petit">${CHAMPS_MAJ_DOSSIER.filter(([k]) => x[k]).map(([k, l]) => `${esc(l)} : <b>${esc(x[k])}</b>`).join("<br>")}</div>`;
  return "";
}

function traiterDemande(d, qui) {
  const s = qui(d.salarie_id);
  const attestation = { "Attestation de travail": "attestation", "Attestation de stage": "fin_stage" }[d.type];
  ouvrirModale(`${d.type} — ${nomPersonne(s)}`, `<p><b>${esc(d.objet)}</b></p>${d.details ? `<p>${esc(d.details)}</p>` : ""}${detailsDemande(d)}
    ${d.avis_responsable ? `<div class="info">Avis du responsable : <b>${esc(d.avis_responsable)}</b>${d.avis_commentaire ? " — " + esc(d.avis_commentaire) : ""}</div>` : ""}
    ${attestation ? `<p><button type="button" class="btn" id="td-attest">Rédiger l'attestation</button> <span class="discret petit">puis marquez la demande « Traitée ».</span></p>` : ""}
    ${d.type === "Avance sur salaire" ? `<p class="discret petit">Acceptée, l'avance se paie en Trésorerie (catégorie « Avance sur salaire », 421) et se retient en paie (élément « Remboursement d'avance »).</p>` : ""}
    ${d.type === "Mise à jour du dossier" ? `<p class="discret petit">« Accepter » reporte ces informations sur la fiche du salarié.</p>` : ""}
    <label for="td-dec">Décision *</label><select id="td-dec">${(d.statut === "Acceptée" ? ["Traitée"] : ["Acceptée", "Traitée", "Refusée"]).map(x => `<option>${x}</option>`).join("")}</select>
    <label for="td-rep">Réponse au salarié${" (obligatoire en cas de refus)"}</label><textarea id="td-rep" rows="3">${esc(d.reponse || "")}</textarea>`, {
    libelleSave: "Enregistrer la décision",
    onSave: async () => {
      try { await appeler("traiter_demande", { p_id: d.id, p_decision: $("#td-dec").value, p_reponse: $("#td-rep").value }); }
      catch (err) { return messageErreur(err); }
      toast("Décision enregistrée : le salarié la voit dans son espace."); recharger();
    }
  });
  if ($("#td-attest")) $("#td-attest").onclick = () => { $("#modale").close(); editeurCourrier(s, { modele: attestation }, recharger); };
}

        <td><span class="pastille ${CLASSE_EVAL[e.statut] || ""}">${esc(e.statut)}</span></td><td class="montant">${e.note_globale != null ? qte(e.note_globale) : ""}</td>

        || `<tr><td colspan="6" class="vide">Campagne ${annee} non ouverte.</td></tr>`}</tbody></table></div>`;

  if ($("#b-campagne")) $("#b-campagne").onclick = async () => {

/* ---------- Fiche du salarié (RH) : son accès à l'application ---------- */
async function blocAccesSalarie(s, conteneur, recharge) {
  const ecrire = peut(PERSO_ECRITURE);
  const { data: lien } = await sb.from("salaries").select("profil_id").eq("id", s.id).maybeSingle();
  const profilId = lien && lien.profil_id;
  const { data: pr } = profilId ? await sb.from("profils").select("id, email, role, actif, acces_jusqu_au").eq("id", profilId).maybeSingle() : { data: null };
  const finStage = s.type_contrat === "Stage" ? (s.date_sortie || s.date_fin_contrat || "") : "";
  conteneur.innerHTML = `<h2>Accès à l'application</h2>${pr ? `<p>${esc(pr.email)} · ${esc(ROLES[pr.role] || pr.role)}
      <span class="pastille ${pr.actif && (!pr.acces_jusqu_au || pr.acces_jusqu_au >= aujourdhui()) ? "ok" : "inactif"}">${pr.actif ? (pr.acces_jusqu_au && pr.acces_jusqu_au < aujourdhui() ? "expiré" : "actif") : "désactivé"}</span>
      ${pr.acces_jusqu_au ? `<span class="discret petit"> · jusqu'au ${esc(dateCourte(pr.acces_jusqu_au))}</span>` : ""}</p>
      ${ecrire ? `<div class="actions-ligne" style="justify-content:flex-start">${pr.role === "salarie" ? `<button class="btn" id="ac-lien">Nouveau lien d'accès</button>
        <button class="btn" id="ac-fin">Durée d'accès</button>` : ""}<button class="btn-lien" id="ac-retirer">Retirer l'accès</button></div>` : ""}`
    : `<p class="discret petit">Pas encore d'accès. Avec son accès, ${esc(s.prenom || s.nom)} consulte son dossier, ses bulletins et ses congés, et fait ses demandes en ligne${s.type_contrat === "Stage" ? " (accès limité à la durée du stage)" : ""}.</p>
      ${ecrire ? `<div class="actions-ligne" style="justify-content:flex-start"><button class="btn btn-principal" id="ac-creer">Créer son accès</button>
        ${peut(GESTION) ? `<button class="btn" id="ac-relier">Relier un compte existant</button>` : ""}</div>` : ""}`}`;
  const clic = (id, f) => { if ($("#" + id)) $("#" + id).onclick = f; };
  clic("ac-creer", () => ouvrirModale(`Créer l'accès de ${nomPersonne(s)}`, `<div class="grille2">
      <div><label for="ac-email">E-mail professionnel *</label><input type="email" id="ac-email" value="${esc(s.email || "")}"></div>
      <div><label for="ac-jusqu">Accès jusqu'au${s.type_contrat === "Stage" ? " *" : ""}</label><input type="date" id="ac-jusqu" value="${esc(finStage)}">
        <p class="aide-champ">${s.type_contrat === "Stage" ? "Fin du stage : l'accès se ferme seul ce jour-là." : "Vide : sans limite (il se ferme à la sortie du salarié)."}</p></div></div>
    <p class="discret petit">Un lien d'accès est produit : envoyez-le par WhatsApp ou par e-mail. Il permet de choisir son mot de passe et n'est valable qu'une heure.</p>`, {
    libelleSave: "Créer l'accès",
    onSave: async () => {
      const email = $("#ac-email").value.trim(), jusqu = $("#ac-jusqu").value || null;
      if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) return "Adresse e-mail invalide.";
      if (s.type_contrat === "Stage" && !jusqu) return "Indiquez la fin du stage.";
      let r;
      try { r = await appelerGestionUtilisateurs({ action: "inviter", mode: "lien", email, role: "salarie", salarie_id: s.id, acces_jusqu_au: jusqu, nom: s.nom, prenom: s.prenom }); }
      catch (err) { return err.message; }
      setTimeout(() => { if (r.avertissement) toast(r.avertissement, true); if (r.lien) afficherLienAcces(r.lien, { prenom: s.prenom || s.nom, email, nouveau: true }); recharge(); }, 0);
    }
  }));
  clic("ac-relier", async () => {
    const { data: comptes } = await sb.from("profils").select("id, email, nom, prenom, role").eq("actif", true).neq("role", "salarie").order("nom");
    ouvrirModale(`Relier un compte à ${nomPersonne(s)}`, `<p class="discret petit">Pour un membre du personnel qui a déjà un compte de gestion (DAF, RH, comptable…) : il retrouve son espace personnel en plus de ses fonctions.</p>
      <label for="ac-compte">Compte *</label><select id="ac-compte"><option value="">—</option>${(comptes || []).map(c => `<option value="${c.id}">${esc(nomComplet(c))} — ${esc(c.email)} (${esc(ROLES[c.role])})</option>`).join("")}</select>`, {
      libelleSave: "Relier",
      onSave: async () => {
        if (!$("#ac-compte").value) return "Choisissez le compte.";
        try { await appeler("lier_acces_salarie", { p_profil: $("#ac-compte").value, p_salarie: s.id, p_jusqu_au: null, p_nouveau: false }); } catch (err) { return messageErreur(err); }
        toast("Compte relié."); if ($("#ac-compte").value === etat.profil.id) await chargerMonEspace(); recharge();
      }
    });
  });
  clic("ac-lien", async () => {
    try { const r = await appelerGestionUtilisateurs({ action: "lien", id: pr.id }); afficherLienAcces(r.lien, { prenom: s.prenom || s.nom, email: pr.email, nouveau: false }); }
    catch (err) { toast(err.message, true); }
  });
  clic("ac-fin", () => ouvrirModale("Durée d'accès", `<label for="ac-d">Accès jusqu'au (vide : sans limite)</label><input type="date" id="ac-d" value="${esc(pr.acces_jusqu_au || "")}">`, {
    onSave: async () => {
      try { await appeler("fixer_fin_acces", { p_salarie: s.id, p_jusqu_au: $("#ac-d").value || null }); } catch (err) { return messageErreur(err); }
      toast("Durée d'accès enregistrée."); recharge();
    }
  }));
  clic("ac-retirer", async () => {
    if (!confirm(pr.role === "salarie" ? `Retirer l'accès de ${nomPersonne(s)} ? Son compte est désactivé.` : `Délier ce compte de la fiche ? Le compte de gestion reste actif.`)) return;
    try { await appeler("retirer_acces_salarie", { p_salarie: s.id }); toast("Accès retiré."); recharge(); } catch (err) { toast(messageErreur(err), true); }
  });
}

/* =====================================================================
   Papier à en-tête
   Relevé sur le modèle Word de la société : logo à gauche, pied légal en
   marine. Les mentions viennent des paramètres de l'entité.
   ===================================================================== */
const STYLE_PAPIER = `.pap-entete{width:100%;border:none;margin:0 0 1.4rem;border-bottom:2px solid #1068B8}
  .pap-entete td{border:none;padding:0 0 .6rem;vertical-align:bottom;color:#16202E}
  .pap-pied{margin-top:2.5rem;padding-top:.6rem;border-top:2px solid #EE0000;
    font-size:.72rem;color:#2F5395;text-align:center;line-height:1.55}`;

function enteteSocieteHtml() {
  const e = etat.entite || {};
  return `<table class="pap-entete"><tr>
    <td><img src="${LOGO}" alt="GUEST MARKETS" style="width:170px"></td>
    <td style="text-align:right;font-size:.8rem;line-height:1.45">
      <b>${esc(e.raison_sociale || "GUEST MARKETS")}</b><br>
      ${esc(e.siege || "")}<br>${esc(e.telephone || "")}${e.email ? " · " + esc(e.email) : ""}</td></tr></table>`;
}

function piedSocieteHtml() {
  const e = etat.entite || {};
  return `<div class="pap-pied"><b>${esc(e.raison_sociale || "GUEST MARKETS")}</b> · ${esc(e.siege || "")}
    · Tél. ${esc(e.telephone || "")} · ${esc(e.email || "")} · ${esc(e.site_web || "")}<br>
    RCCM ${esc(e.rccm || "")} · NIU ${esc(e.niu || "")}${e.numero_cnps ? " · CNPS " + esc(e.numero_cnps) : ""}</div>`;
}

function documentImprimable(titre, corpsHtml, opts = {}) {
  // À l'écran (aperçu), le document se présente comme une feuille A4 (ou A4 paysage) sur fond gris.
  const paysage = /landscape/.test(corpsHtml);
  const feuille = `@media screen{html{background:#E9EDF2}body{background:#fff;width:${paysage ? "297mm" : "210mm"};max-width:calc(100% - 24px);min-height:${paysage ? "210mm" : "297mm"};
      margin:16px auto!important;padding:${paysage ? "8mm" : "10mm 14mm"}!important;box-shadow:0 2px 14px rgba(22,32,46,.18);box-sizing:border-box}}`;
  if (opts.brut) return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(titre)}</title>
    <style>*{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}body{margin:0;color:#16202E;font-family:"Public Sans",Arial,sans-serif}
      ${feuille}@media screen{.page-bp+.page-bp{margin-top:14mm;padding-top:10mm;border-top:2px dashed #C3CCD8}}</style></head><body>${corpsHtml}</body></html>`;
  // En-tête et pied fixés en haut et en bas de CHAQUE page, quelle que soit la longueur
  // du texte : les deux blocs sont en position fixe (répétés par le navigateur à chaque
  // page) et le contenu est tenu entre deux réserves de même hauteur (thead/tfoot d'un
  // tableau d'enveloppe, eux aussi répétés à chaque page).
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(titre)}</title>
    <style>@page{size:A4 portrait;margin:10mm 14mm}
      html,body{margin:0;padding:0}
      body{font:13px/1.6 "Public Sans",Arial,sans-serif;color:#16202E}
      h1{font-size:1.35rem;margin:0 0 .3rem}h2{font-size:.95rem;text-transform:uppercase;letter-spacing:.04em;margin:1.5rem 0 .4rem}
      table{border-collapse:collapse;width:100%;margin:.6rem 0}td,th{border:1px solid #bbb;padding:.3rem .5rem;vertical-align:top;font-size:.85rem}
      th{background:#E3EEF9;text-align:left}.discret{color:#5A6675}
      h2{page-break-after:avoid}tr{page-break-inside:avoid}
      ${STYLE_PAPIER}
      .pap-haut{position:fixed;top:0;left:0;right:0;height:30mm;overflow:hidden;background:#fff}
      .pap-haut .pap-entete{margin:0}
      .pap-bas{position:fixed;bottom:0;left:0;right:0;height:15mm;overflow:hidden;background:#fff}
      .pap-bas .pap-pied{margin:0}
      table.pap-page{margin:0;width:100%}
      table.pap-page>thead>tr>td,table.pap-page>tbody>tr>td,table.pap-page>tfoot>tr>td{border:none;padding:0;font-size:inherit}
      table.pap-page>tbody>tr{page-break-inside:auto}
      .pap-reserve-haut{height:34mm}.pap-reserve-bas{height:19mm}
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      ${feuille}
      @media screen{body{display:flex;flex-direction:column}.pap-haut,.pap-bas{position:static;height:auto}.pap-haut{order:0;margin-bottom:1rem}
        table.pap-page{order:1}.pap-bas{order:2;margin-top:auto;padding-top:1.5rem}.pap-reserve-haut,.pap-reserve-bas{display:none}
        .saut-page{border-top:2px dashed #C3CCD8;margin:12mm -14mm 10mm}}</style></head><body>
    <div class="pap-haut">${enteteSocieteHtml()}</div><div class="pap-bas">${piedSocieteHtml()}</div>
    <table class="pap-page"><thead><tr><td><div class="pap-reserve-haut"></div></td></tr></thead>
      <tfoot><tr><td><div class="pap-reserve-bas"></div></td></tr></tfoot>
      <tbody><tr><td>${corpsHtml}</td></tr></tbody></table></body></html>`;
}

/* Tout document passe d'abord par un aperçu (pour ne pas gâcher de papier) ;
   « Imprimer » lance ensuite l'impression du cadre. Une fenêtre à part (et non
   la modale) : on peut prévisualiser depuis un formulaire ouvert sans le perdre. */
function imprimerHtml(titre, corpsHtml, opts = {}) {
  let d = $("#apercu");
  if (!d) { d = document.createElement("dialog"); d.id = "apercu"; d.className = "apercu"; document.body.appendChild(d); }
  d.innerHTML = `<div class="apercu-tete"><div class="apercu-titre"><b>${esc(titre)}</b><span class="discret petit">Aperçu avant impression — vérifiez avant d'imprimer</span></div>
      <button type="button" class="btn btn-principal" id="ap-imprimer">Imprimer</button><button type="button" class="btn" id="ap-fermer">Fermer</button></div>
    <iframe id="ap-cadre" title="Aperçu : ${esc(titre)}"></iframe>`;
  const cadre = $("#ap-cadre", d);
  cadre.srcdoc = documentImprimable(titre, corpsHtml, opts);
  $("#ap-fermer", d).onclick = () => d.close();
  $("#ap-imprimer", d).onclick = () => {
    try { cadre.contentWindow.focus(); cadre.contentWindow.print(); }
    catch (err) { toast("Impression impossible dans ce navigateur.", true); }
  };
  d.showModal();
  $("#ap-imprimer", d).focus();
}

/* Choix des personnes qui figurent dans un état (paie payée par un tiers…).
   Rend la liste des identifiants cochés, ou null si l'on annule. */
function choisirPersonnes(titre, items, { note = "", libelle = "Continuer" } = {}) {
  return new Promise(resolve => {
    let fini = false;
    ouvrirModale(titre, `${note ? `<p class="discret petit">${note}</p>` : ""}
      <div class="outils" style="padding:.4rem 0"><button type="button" class="btn-lien" id="cp-tous">Tout cocher</button>
        <button type="button" class="btn-lien" id="cp-aucun">Tout décocher</button><span class="discret petit pousse" id="cp-nb"></span></div>
      <div class="liste-choix">${items.map(x => `<label class="case" style="margin-top:.3rem"><input type="checkbox" data-cp="${esc(x.id)}" ${x.coche ? "checked" : ""}>
        <span>${esc(x.libelle)}${x.sous ? ` <span class="discret petit">— ${esc(x.sous)}</span>` : ""}</span></label>`).join("")}</div>`, {
      libelleSave: libelle,
      onSave: async () => {
        const ids = $$("[data-cp]:checked").map(c => c.dataset.cp);
        if (!ids.length) return "Cochez au moins une personne.";
        fini = true; setTimeout(() => resolve(ids), 0);
      }
    });
    const compte = () => { $("#cp-nb").textContent = `${$$("[data-cp]:checked").length} / ${items.length} retenue(s)`; };
    $$("[data-cp]").forEach(c => c.onchange = compte); compte();
    $("#cp-tous").onclick = () => { $$("[data-cp]").forEach(c => { c.checked = true; }); compte(); };
    $("#cp-aucun").onclick = () => { $$("[data-cp]").forEach(c => { c.checked = false; }); compte(); };
    $("#modale").addEventListener("close", () => { if (!fini) resolve(null); }, { once: true });
  });
}
const libellePayeur = p => p === "Guest Cameroun" ? "payé par Guest Cameroun" : p === "CEO" ? "payé par le CEO" : "";

/* =====================================================================
   Exports Excel, PDF et CSV
   Les bibliothèques sont chargées au premier export seulement.
   ===================================================================== */
const CDN_EXPORT = {
  xlsx: "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
  jspdf: "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js",
  autotable: "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"
};
const scriptsCharges = {};

function chargerScript(url) {
  if (scriptsCharges[url]) return scriptsCharges[url];
  scriptsCharges[url] = new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = url;
    s.onload = () => ok();
    s.onerror = () => { delete scriptsCharges[url]; ko(new Error("Outil d'export inaccessible.")); };
    document.head.appendChild(s);
  });
  return scriptsCharges[url];
}

/* Reconnaît les nombres écrits à la française pour qu'Excel les additionne. */
function versNombre(v) {
  if (typeof v === "number") return isFinite(v) ? v : null;
  if (typeof v !== "string") return null;
  const s = v.trim();
  if (s === "" || !/^-?\d[\d\s ]*(,\d+)?$/.test(s)) return null;
  const n = Number(s.replace(/[\s ]/g, "").replace(",", "."));
  return isNaN(n) ? null : n;
}

const nomFeuille = t => String(t || "Export").replace(/[\[\]:*?\/\\]/g, " ").trim().slice(0, 31) || "Export";
const sansExtension = f => String(f).replace(/\.[^.]+$/, "");
const COULEUR_ENTETE = [16, 104, 184];
const COULEUR_ALTERNEE = [241, 246, 252];

function exporterCsv(nom, entetes, lignes) {
  const cell = v => { const s = String(v ?? ""); return /[;"\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = "﻿" + [entetes, ...lignes].map(l => l.map(cell).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = sansExtension(nom) + ".csv"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function telechargerExcel(nomFichier, titre, entetes, lignes) {
  if (!window.XLSX) await chargerScript(CDN_EXPORT.xlsx);
  const corps = lignes.map(l => l.map(v => { const n = versNombre(v); return n === null ? (v == null ? "" : String(v)) : n; }));
  const aoa = [entetes, ...corps];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = entetes.map((e, i) => ({ wch: Math.min(55, Math.max(10, ...aoa.map(l => String(l[i] ?? "").length + 2))) }));
  ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 1, c: Math.max(0, entetes.length - 1) } }) };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, nomFeuille(titre));
  XLSX.writeFile(wb, sansExtension(nomFichier) + ".xlsx");
}

function entetePdf(doc, titre) {
  const l = doc.internal.pageSize.getWidth();
  try { doc.addImage(LOGO, "PNG", 14, 6, 34, 12.8); } catch (e) {}
  doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(22, 32, 46);
  doc.text(titre, 52, 12);
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(90, 102, 117);
  doc.text("Administration et finances", 52, 17.5);
  doc.text(new Date().toLocaleDateString("fr-FR"), l - 14, 17.5, { align: "right" });
  doc.setDrawColor(...COULEUR_ENTETE); doc.setLineWidth(0.6); doc.line(14, 21, l - 14, 21);
  doc.setLineWidth(0.2);
}

function piedPdf(doc) {
  const n = doc.internal.getNumberOfPages();
  const l = doc.internal.pageSize.getWidth(), h = doc.internal.pageSize.getHeight();
  const e = etat.entite || {};
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    doc.setDrawColor(238, 0, 0); doc.line(14, h - 14, l - 14, h - 14);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(47, 83, 149);
    doc.text(`${e.raison_sociale || "GUEST MARKETS"} · RCCM ${e.rccm || ""} · NIU ${e.niu || ""}`, 14, h - 9);
    doc.text(`Page ${i} sur ${n}`, l - 14, h - 9, { align: "right" });
  }
}

async function telechargerPdfTableau(nomFichier, titre, entetes, lignes) {
  if (!window.jspdf) await chargerScript(CDN_EXPORT.jspdf);
  await chargerScript(CDN_EXPORT.autotable);
  const doc = new window.jspdf.jsPDF({ orientation: entetes.length > 6 ? "landscape" : "portrait", unit: "mm", format: "a4" });
  doc.autoTable({
    head: [entetes],
    body: lignes.map(l => l.map(v => v == null ? "" : String(v))),
    startY: 26, margin: { top: 26, left: 14, right: 14, bottom: 16 },
    styles: { font: "helvetica", fontSize: 7.5, cellPadding: 1.6, overflow: "linebreak", textColor: [22, 32, 46] },
    headStyles: { fillColor: COULEUR_ENTETE, textColor: 255, fontStyle: "bold", fontSize: 7.5 },
    alternateRowStyles: { fillColor: COULEUR_ALTERNEE },
    didDrawPage: () => entetePdf(doc, titre)
  });
  piedPdf(doc);
  doc.save(sansExtension(nomFichier) + ".pdf");
}

/* Menu d'export commun à tous les tableaux de l'application. */
function exporterTableau(nomFichier, entetes, lignes, titre) {
  const nom = titre || sansExtension(nomFichier).replace(/_/g, " ");
  ouvrirModale("Exporter", `
    <p>${lignes.length} ligne(s) et ${entetes.length} colonne(s) à exporter.</p>
    <div class="actions-ligne" style="margin-top:1.25rem;justify-content:flex-start">
      <button type="button" class="btn btn-principal" id="ex-xlsx">Excel</button>
      <button type="button" class="btn btn-principal" id="ex-pdf">PDF</button>
      <button type="button" class="btn" id="ex-csv">CSV</button>
    </div>
    <p class="discret petit" style="margin-top:1.25rem">Le fichier est préparé dans votre navigateur.
      Au premier export, comptez quelques secondes le temps de charger l'outil.</p>
    <div id="ex-err"></div>`, {});
  const lancer = async (fn, bouton) => {
    const b = $(bouton); if (b) b.disabled = true;
    try { await fn(); $("#modale").close(); toast("Export terminé."); }
    catch (err) { $("#ex-err").innerHTML = `<div class="erreur">${esc(err.message)} Vérifiez votre connexion internet, ou utilisez l'export CSV.</div>`; }
    if (b) b.disabled = false;
  };
  $("#ex-xlsx").onclick = () => lancer(() => telechargerExcel(nomFichier, nom, entetes, lignes), "#ex-xlsx");
  $("#ex-pdf").onclick = () => lancer(() => telechargerPdfTableau(nomFichier, nom, entetes, lignes), "#ex-pdf");
  $("#ex-csv").onclick = () => { exporterCsv(nomFichier, entetes, lignes); $("#modale").close(); };
}

demarrer();
