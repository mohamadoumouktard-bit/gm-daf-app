  const cat = (etat.refs.categories_op || []).find(c => c.code === "IND-STAGE");
  if (!cat) return toast("Catégorie « Indemnités de stage » introuvable en Trésorerie.", true);
  const total = liste.reduce((t, x) => t + Number(x.reste), 0);
  const periode = `${annee}-${String(mois).padStart(2, "0")}-01`;
  ouvrirModale(liste.length > 1 ? `Payer ${liste.length} indemnités de stage` : `Indemnité de stage — ${nomSalarie(liste[0])}`, `
    <p>${liste.length > 1 ? `${liste.length} indemnités de ${esc(MOIS[mois - 1].toLowerCase())} ${annee}, pour <b>${fcfa(total)} FCFA</b>.`
      : `Reste dû pour ${esc(MOIS[mois - 1].toLowerCase())} ${annee} : <b>${fcfa(total)} FCFA</b> — ${esc([liste[0].mode_paiement, liste[0].banque].filter(Boolean).join(" · "))}${liste[0].rib ? " · RIB " + esc(liste[0].rib) : ""}`}</p>
    <div class="grille2"><div><label for="pst-compte">Compte qui paie *</label><select id="pst-compte"><option value="">—</option>${comptes.map(c =>
        `<option value="${c.id}" ${c.id === compteDefaut ? "selected" : ""}>${esc(c.code)} – ${esc(c.libelle)}</option>`).join("")}</select></div>
      <div><label for="pst-date">Date *</label><input type="date" id="pst-date" value="${aujourdhui()}"></div>
      ${liste.length === 1 ? `<div><label for="pst-montant">Montant (FCFA) *</label><input type="number" id="pst-montant" min="1" step="1" value="${Number(liste[0].reste)}"></div>` : ""}
      <div><label for="pst-piece">Référence (ordre de virement…)</label><input type="text" id="pst-piece"></div></div>`, {
    libelleSave: "Enregistrer le paiement",
    onSave: async () => {
      const compte = $("#pst-compte").value, date = $("#pst-date").value;
      if (!compte || !date) return "Choisissez le compte et la date.";
      let n = 0;
      for (const x of liste) {
        const montant = liste.length === 1 ? Number($("#pst-montant").value || 0) : Number(x.reste);
        if (!(montant > 0)) return "Montant invalide.";
        const { error } = await sb.from("operations_tresorerie").insert({ type: "Dépense", payeur: "Trésorerie", compte_tresorerie_id: compte, categorie_id: cat.id,
          salarie_id: x.salarie_id, periode_indemnite: periode, montant, beneficiaire: nomSalarie(x), date_operation: date,
          libelle: `Indemnité de stage ${MOIS[mois - 1].toLowerCase()} ${annee} — ${nomSalarie(x)}`, piece_justificative: $("#pst-piece").value.trim() || null });
        if (error) { if (n && apres) apres(); return `${nomSalarie(x)} : ${messageErreur(error)}${n ? ` (${n} paiement(s) déjà enregistré(s))` : ""}`; }
        n++;
      }
      toast(`${n} indemnité(s) payée(s).`); if (apres) apres();
    }

}

/* État des virements du mois : nets des salariés et indemnités des stagiaires, par banque. */
async function etatVirements(bulletins, annee, mois, format) {
  let stagiaires = [];
  try { stagiaires = await appeler("etat_stagiaires", { p_annee: annee, p_mois: mois }); } catch (e) { /* rôle sans accès : salariés seuls */ }
  const tous = [...bulletins.map(b => ({ id: "b" + b.id, m: b.matricule, nom: nomSalarie(b), qualite: "Salarié", mode: b.mode_paiement, banque: b.banque, compte: b.rib || b.numero_mobile_money,
      montant: Number(b.net_a_payer), payeur: (etat.payeurs || {})[b.salarie_id] || "Entreprise" })),
    ...stagiaires.filter(x => Number(x.du) > 0).map(x => ({ id: "s" + x.salarie_id, m: x.matricule, nom: nomSalarie(x), qualite: "Stagiaire", mode: x.mode_paiement, banque: x.banque,
      compte: x.rib || x.numero_mobile_money, montant: Number(x.du), payeur: (etat.payeurs || {})[x.salarie_id] || "Entreprise" }))];
  // On choisit qui figure dans l'état (présélection : ceux que l'entreprise paie).
  const ids = await choisirPersonnes("Qui figure dans l'état des virements ?", tous.map(x => ({ id: x.id, libelle: `${x.m} — ${x.nom}`,
    sous: [x.qualite, fcfa(x.montant) + " FCFA", x.banque || x.mode, libellePayeur(x.payeur)].filter(Boolean).join(" · "), coche: x.payeur === "Entreprise" })),
    { note: "Sont décochés d'office les salaires payés par Guest Cameroun ou le CEO (fiche du salarié, « Salaire payé par »).", libelle: format === "excel" ? "Exporter" : "Aperçu" });
  if (!ids) return;
  const lignes = tous.filter(x => ids.includes(x.id));
  const groupe = l => l.payeur !== "Entreprise" ? `Payés par ${l.payeur === "CEO" ? "le CEO" : "Guest Cameroun"}` : l.mode === "Virement" ? (l.banque || "Virement — banque à préciser") : (l.mode || "Espèces");
  const groupes = [...new Set(lignes.map(groupe))].sort().map(g => ({ g, l: lignes.filter(x => groupe(x) === g).sort((a, b) => a.m.localeCompare(b.m)) }));
  const somme = l => l.reduce((t, x) => t + x.montant, 0);
  const titre = `État des virements — ${MOIS[mois - 1]} ${annee}`;
  if (format === "excel") {
    return exporterTableau(`etat_virements_${annee}_${String(mois).padStart(2, "0")}.xlsx`, ["Banque / mode", "Matricule", "Nom et prénoms", "Qualité", "RIB / n°", "Montant"],
      groupes.flatMap(({ g, l }) => [...l.map(x => [g, x.m, x.nom, x.qualite, x.compte || "", x.montant]), [g, "", `Sous-total ${g}`, "", "", somme(l)]])
        .concat([["", "", "TOTAL GÉNÉRAL", "", "", somme(lignes)]]), titre);
  }
  imprimerHtml(titre, `<h1>${esc(titre)}</h1><p class="discret">Nets à payer des salariés (paie ${esc(((bulletins[0] || {}).statut_paie || "").toLowerCase())})
      et indemnités de stage dues · montants en FCFA</p>
    ${groupes.map(({ g, l }) => `<h2 style="margin:1rem 0 .3rem">${esc(g)}</h2><table><thead><tr><th>Matr.</th><th>Nom et prénoms</th><th>Qualité</th><th>RIB / n°</th>
      <th style="text-align:right">Montant</th></tr></thead><tbody>${l.map(x => `<tr><td>${esc(x.m)}</td><td>${esc(x.nom)}</td><td>${esc(x.qualite)}</td><td>${esc(x.compte || "")}</td>
      <td style="text-align:right">${fcfa(x.montant)}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="4"><b>Sous-total ${esc(g)}</b></td><td style="text-align:right"><b>${fcfa(somme(l))}</b></td></tr></tfoot></table>`).join("")}
    <p style="margin-top:1rem">Total général : <b>${fcfa(somme(lignes))} FCFA</b> — ${esc(enLettres(somme(lignes)))} francs CFA
      (salariés ${fcfa(somme(lignes.filter(x => x.qualite === "Salarié")))} ; stagiaires ${fcfa(somme(lignes.filter(x => x.qualite === "Stagiaire")))}).</p>
    <table style="margin-top:1.5rem;border:none;width:60%"><tr><td style="border:none">Établi par</td><td style="border:none">Visa du DAF</td></tr></table>`);
}

  const etatLib = avecStage ? `État des salaires et indemnités de ${moisTxt}` : `État des salaires de ${moisTxt}`;
  return `<p style="text-align:right">Douala, le ${esc(dateLongue(date))}</p>
    <p style="text-align:right;margin:1.2rem 0 .2rem">À</p>
    <p style="text-align:right">${esc(m.destinataire)}</p>
    <p style="margin-top:2rem"><b>Objet : Salaires du mois de ${esc(moisTxt)}</b></p>
    <p style="margin-top:1.2rem">${esc(m.appel)},</p>
    <p>Par le débit de ${esc(m.libelle_compte)} N° ${esc(m.compte_debite)} ouvert dans vos livres, nous vous saurions gré de bien vouloir virer la somme de
      <b>${montantOV(total)}</b>.</p>
    <ul style="list-style:none;padding-left:1.5rem;margin:1.2rem 0">
      <li style="margin:.5rem 0">➢&nbsp; MONTANT (en chiffres) : ${montantOV(total)}</li>
      <li style="margin:.5rem 0">➢&nbsp; MONTANT (en lettres) : ${esc(enLettres(total).toUpperCase())} FCFA</li>
      <li style="margin:.5rem 0">➢&nbsp; BÉNÉFICIAIRE : Employés ${esc((etat.entite || {}).raison_sociale || "GUEST MARKETS")}</li>
      <li style="margin:.5rem 0">➢&nbsp; MOTIF : RÈGLEMENT DES SALAIRES${avecStage ? " ET INDEMNITÉS" : ""} DE ${esc(moisTxt.toUpperCase())}</li></ul>
    <p>Nous restons disponibles pour tout complément d'information.</p>
    <p>Recevez, ${esc(m.appel)}, l'expression de notre profond respect.</p>
    <p style="margin-top:1.2rem">PJ : ${esc(etatLib)}</p>
    <p style="text-align:right;margin-top:2.5rem"><b>${esc(m.signataire)}</b></p>
    <div class="saut-page" style="break-before:page;page-break-before:always"></div>
    <p style="text-align:center;font-weight:700;text-transform:uppercase;margin:0 0 .6rem">${esc(etatLib)}</p>
    <table style="width:90%;margin:0 auto"><thead><tr><th style="text-align:center">NOMS ET PRÉNOMS</th><th style="text-align:center">NUMÉRO DE COMPTE</th>
      <th style="text-align:center">MONTANT</th></tr></thead><tbody>
      ${lignes.map(x => `<tr><td style="text-align:center">${esc(x.nom)}</td><td style="text-align:center">${esc(x.compte || "//")}</td>
        <td style="text-align:right;white-space:nowrap">${montantOV(x.montant)}</td></tr>`).join("")}
      <tr><td style="text-align:center"><b>TOTAL</b></td><td></td><td style="text-align:right;white-space:nowrap"><b>${montantOV(total)}</b></td></tr></tbody></table>
    <p style="text-align:right;margin-top:2.5rem"><b>${esc(m.signataire)}</b></p>`;
}

async function formulaireOV(bulletins, annee, mois, apres) {
  const { data: modeles, error } = await sb.from("modeles_ov").select("*").eq("actif", true).order("banque");
  if (error) return toast(messageErreur(error), true);
  if (!(modeles || []).length) return toast("Aucun modèle d'ordre de virement : créez-en un dans Paramètres et barèmes.", true);
  ouvrirModale(`Ordre de virement — ${MOIS[mois - 1]} ${annee}`, `<div class="grille2">
      <div><label for="ov-banque">Banque *</label><select id="ov-banque">${modeles.map(m => `<option value="${m.id}">${esc(m.banque)}</option>`).join("")}</select>
        <p class="aide-champ" id="ov-aide"></p></div>
      <div><label for="ov-date">Date de l'ordre *</label><input type="date" id="ov-date" value="${aujourdhui()}"></div></div>
    <p class="discret petit">Vous choisirez ensuite les bénéficiaires ; la lettre et l'état se modifient avant impression.</p>`, {
    libelleSave: "Choisir les bénéficiaires",
    onSave: async () => {
      const m = modeles.find(x => x.id === $("#ov-banque").value), date = $("#ov-date").value;
      if (!m || !date) return "Choisissez la banque et la date.";
      setTimeout(() => preparerOV(m, date, bulletins, annee, mois, apres), 0);
    }
  });
  const aide = () => { const m = modeles.find(x => x.id === $("#ov-banque").value);
    $("#ov-aide").textContent = `Débit du compte N° ${m.compte_debite}${m.payeur && m.payeur !== "Entreprise" ? ` (compte de ${m.payeur === "CEO" ? "du CEO" : "Guest Cameroun"})` : ""} · ${m.destinataire}${m.inclure_stagiaires ? " · avec les indemnités des stagiaires" : ""}`; };
  $("#ov-banque").onchange = aide; aide();
}

async function preparerOV(m, date, bulletins, annee, mois, apres) {
  let stagiaires = [];
  if (m.inclure_stagiaires) { try { stagiaires = await appeler("etat_stagiaires", { p_annee: annee, p_mois: mois }); } catch (e) { /* sans accès */ } }
  const memeBanque = b => (b || "").trim().toUpperCase() === m.banque.trim().toUpperCase();
  const tous = [...bulletins.filter(b => Number(b.net_a_payer) > 0).map(b => ({ id: "b" + b.id, bulletin: b, m: b.matricule, nom: nomSalarie(b).toUpperCase(),
      compte: b.mode_paiement === "Virement" && memeBanque(b.banque) ? (b.rib || "") : "", montant: Number(b.net_a_payer), qualite: "Salarié",
      banque: b.banque, mode: b.mode_paiement, payeur: (etat.payeurs || {})[b.salarie_id] || "Entreprise" })),
    ...stagiaires.filter(x => Number(x.du) > 0).map(x => ({ id: "s" + x.salarie_id, stagiaire: x, m: x.matricule, nom: nomSalarie(x).toUpperCase(),
      compte: memeBanque(x.banque) ? (x.rib || "") : "", montant: Number(x.du), qualite: "Stagiaire", banque: x.banque, mode: x.mode_paiement,
      payeur: (etat.payeurs || {})[x.salarie_id] || "Entreprise" }))];
  const ids = await choisirPersonnes(`Bénéficiaires de l'OV ${m.banque}`, tous.map(x => ({ id: x.id, libelle: `${x.m} — ${x.nom}`,
    sous: [x.qualite, montantOV(x.montant), x.banque || x.mode, libellePayeur(x.payeur)].filter(Boolean).join(" · "),
    coche: memeBanque(x.banque) && x.payeur === "Entreprise" })),
    { note: `Sont cochés d'office les bénéficiaires dont le compte est à ${esc(m.banque)} et dont le salaire est payé par l'entreprise. Cochez aussi ceux qui retirent leur salaire à l'agence sans compte : leur numéro apparaîtra « // ».`, libelle: "Préparer l'OV" });
  if (!ids) return;
  const lignes = tous.filter(x => ids.includes(x.id));
  editeurOV(m, lignes, annee, mois, date, apres);
}

function editeurOV(m, lignes, annee, mois, date, apres) {
  const total = lignes.reduce((t, x) => t + x.montant, 0);
  const titre = `OV ${m.banque} — salaires ${MOIS[mois - 1].toLowerCase()} ${annee}`;
  ouvrirModale(titre, `<div class="info">${lignes.length} bénéficiaire(s) · <b>${montantOV(total)}</b>. Le texte se corrige directement ci-dessous
      (noms tels qu'enregistrés à la banque, montants) avant l'aperçu.</div>
    <div id="ov-texte" class="courrier-edit" contenteditable="true" spellcheck="true">${corpsOV(m, lignes, annee, mois, date)}</div>
    <div class="barre-actions" style="flex-wrap:wrap">
      <button type="button" class="btn btn-principal" id="ov-apercu">Aperçu avant impression</button>
      ${peut(["rh", "daf", "admin", "tresorier"]) ? `<button type="button" class="btn" id="ov-ranger">Ranger au registre des OV</button>` : ""}
      ${peut(PAIEMENT) ? `<button type="button" class="btn" id="ov-payer">Enregistrer les paiements</button>` : ""}</div>`, { large: true });
  $("#ov-apercu").onclick = () => imprimerHtml(titre, $("#ov-texte").innerHTML);
  if ($("#ov-ranger")) $("#ov-ranger").onclick = async () => {
    const b = $("#ov-ranger"); b.disabled = true;
    const { data, error } = await sb.from("ordres_virement").insert({ banque: m.banque, annee, mois, date_ordre: date, montant: total, nb_beneficiaires: lignes.length,
      lignes: lignes.map(x => ({ matricule: x.m, nom: x.nom, compte: x.compte || null, montant: x.montant, qualite: x.qualite })), document_html: $("#ov-texte").innerHTML }).select().single();
    if (error) { b.disabled = false; return toast(messageErreur(error), true); }
    toast(`OV rangé au registre : ${data.numero}.`); b.textContent = `Rangé (${data.numero})`;
  };
  if ($("#ov-payer")) $("#ov-payer").onclick = () => {
    const sal = lignes.filter(x => x.bulletin && Number(x.bulletin.reste_a_payer) > 0).map(x => x.bulletin);
    const stg = lignes.filter(x => x.stagiaire && Number(x.stagiaire.reste) > 0).map(x => x.stagiaire);
    if (!sal.length && !stg.length) return toast("Rien à payer : ces salaires et indemnités sont déjà réglés (ou la paie n'est pas validée).", true);
    if (sal.length && sal[0].statut_paie !== "Validée") return toast("La paie du mois doit être validée avant d'enregistrer les paiements des salaires.", true);
    // Compte de Guest Cameroun ou du CEO : les salaires sont payés par l'exploitant (422 / 1041).
    const qui = m.payeur && m.payeur !== "Entreprise" ? m.payeur : m.compte_tresorerie_id;
    if (sal.length) formulairePaiementSalaires(sal, qui, stg.length ? () => formulairePaiementStage(stg, annee, mois, apres, m.compte_tresorerie_id) : apres);
    else formulairePaiementStage(stg, annee, mois, apres, m.compte_tresorerie_id);
  };
}

/* Registre des OV du mois (Paie → Bulletins). */
async function registreOV(conteneur, annee, mois) {
  const { data, error } = await sb.from("ordres_virement").select("*").eq("annee", annee).eq("mois", mois).order("created_at");
  if (error || !(data || []).length) { conteneur.innerHTML = ""; return; }
  conteneur.innerHTML = `<h2 style="padding:1rem 1rem 0">Ordres de virement émis</h2><div class="defil"><table><thead><tr><th>Numéro</th><th>Banque</th><th>Date</th>
    <th class="montant">Bénéficiaires</th><th class="montant">Montant</th><th></th></tr></thead><tbody>
    ${data.map(o => `<tr${o.annule ? ' class="discret"' : ""}><td class="code">${esc(o.numero)}${o.annule ? ` <span class="pastille inactif">annulé</span>` : ""}</td><td>${esc(o.banque)}</td>
      <td class="code">${esc(dateCourte(o.date_ordre))}</td><td class="montant">${o.nb_beneficiaires}</td><td class="montant">${fcfa(o.montant)}</td>
      <td><div class="actions-ligne"><button class="btn" data-ov-voir="${o.id}">Aperçu</button>
        ${!o.annule && peut(GESTION) ? `<button class="btn-lien" data-ov-annuler="${o.id}">Annuler</button>` : ""}</div></td></tr>`).join("")}</tbody></table></div>`;
  $$("[data-ov-voir]", conteneur).forEach(b => b.onclick = () => { const o = data.find(x => x.id === b.dataset.ovVoir); imprimerHtml(o.numero, o.document_html); });
  $$("[data-ov-annuler]", conteneur).forEach(b => b.onclick = async () => {
    const motif = prompt("Motif de l'annulation de cet OV :"); if (!motif) return;
    const { error: e } = await sb.from("ordres_virement").update({ annule: true, motif_annulation: motif }).eq("id", b.dataset.ovAnnuler);
    if (e) return toast(messageErreur(e), true); toast("OV annulé."); registreOV(conteneur, annee, mois);
  });
}

/* Modèles d'OV (Paie → Paramètres et barèmes), modifiables par le DAF. */
function formulaireModeleOV(m, apres) {
  const nouveau = !m; m = m || { libelle_compte: "notre compte d'attente", signataire: "LE CEO", actif: true };

/* Rubriques de paie : création et réglage du régime (imposable, cotisable, fixe). */
function formulaireRubrique(r, apres) {
  const nouveau = !r;
  r = r || { type: "Gain", mode: "Montant", imposable: true, cotisable: true, fixe: true, actif: true, compte: "6638" };
  const coche = (id, l, v, aide) => `<label class="case"><input type="checkbox" id="${id}" ${v ? "checked" : ""}> ${l}</label>${aide ? `<p class="aide-champ">${aide}</p>` : ""}`;
  ouvrirModale(nouveau ? "Nouvelle rubrique de paie" : `Rubrique ${r.code}`, `<div class="grille2">
      <div><label for="rb-code">Code *</label><input type="text" id="rb-code" value="${esc(r.code || "")}" ${nouveau ? 'placeholder="ex. IND-NOUR"' : "readonly"}></div>
      <div><label for="rb-lib">Libellé *</label><input type="text" id="rb-lib" value="${esc(r.libelle || "")}" placeholder="ex. Indemnité de nourriture"></div>
      <div><label for="rb-type">Nature *</label><select id="rb-type" ${nouveau ? "" : "disabled"}><option value="Gain" ${r.type === "Gain" ? "selected" : ""}>Gain (élément du salaire)</option>
        <option value="Retenue" ${r.type === "Retenue" ? "selected" : ""}>Retenue sur le net</option></select></div>
      <div><label for="rb-compte">Compte *</label><input type="text" id="rb-compte" value="${esc((r.type === "Retenue" ? r.compte_tiers : r.compte) || "")}">
        <p class="aide-champ">Gain : compte de charge (6611 salaire, 6612 primes, 6631 logement, 6634 transport, 6638 autres). Retenue : 421.</p></div></div>
    <div id="rb-gain">${coche("rb-fixe", "Élément mensuel fixe", r.fixe, "Coché : montant fixé par salarié dans Rémunérations, repris chaque mois. Décoché : saisi au mois dans Éléments du mois.")}
      ${coche("rb-imp", "Imposable (entre dans le salaire taxable : IRPP, CAC, crédit foncier, RAV)", r.imposable)}
      ${coche("rb-cot", "Cotisable (entre dans l'assiette CNPS)", r.cotisable)}</div>
    ${coche("rb-actif", "Active", r.actif !== false)}
    <label for="rb-aide">Aide (facultatif)</label><input type="text" id="rb-aide" value="${esc(r.aide || "")}">
    <p class="discret petit">Le changement vaut pour les paies calculées ensuite. Les salariés dont le net est convenu gardent leur net : leur base se réajuste.</p>`, {
    libelleSave: "Enregistrer",
    onSave: async () => {
      const type = $("#rb-type").value, code = $("#rb-code").value.trim().toUpperCase(), compte = $("#rb-compte").value.trim();
      if (!/^[A-Z0-9-]{2,20}$/.test(code)) return "Code : 2 à 20 caractères (lettres, chiffres, tiret).";
      if (!$("#rb-lib").value.trim() || !compte) return "Libellé et compte sont obligatoires.";
      const gain = type === "Gain";
      const d = { libelle: $("#rb-lib").value.trim(), compte: gain ? compte : null, compte_tiers: gain ? null : compte, actif: $("#rb-actif").checked,
        aide: $("#rb-aide").value.trim() || null, fixe: gain && $("#rb-fixe").checked, imposable: gain && $("#rb-imp").checked, cotisable: gain && $("#rb-cot").checked };
      const { error } = nouveau
        ? await sb.from("rubriques_paie").insert({ ...d, code, type, mode: "Montant", ordre: gain ? (d.fixe ? 35 : 43) : 93 })
        : await sb.from("rubriques_paie").update(d).eq("code", r.code);
      if (error) return messageErreur(error);
      toast(nouveau ? `Rubrique ${code} créée.` : "Rubrique enregistrée."); if (apres) apres();
    }
  });
  const maj = () => { $("#rb-gain").hidden = $("#rb-type").value !== "Gain"; };
  $("#rb-type").onchange = maj; maj();
}

      || `<tr><td colspan="8" class="vide">Aucune demande.</td></tr>`}</tbody></table></div>`;
  $$("[data-dec]").forEach(b => b.onclick = async () => {

    catch (err) { toast(messageErreur(err), true); }

    ouvrirModale("Demande de congé", `<div class="grille2">
      <div><label for="cg-sal">Salarié *</label><select id="cg-sal"><option value="">—</option>${(soldes || []).map(s => `<option value="${s.salarie_id}">${esc(s.matricule)} – ${esc(nomSalarie(s))} (reste ${qte(s.reste)} j)</option>`).join("")}</select></div>
      <div><label for="cg-type">Type</label><select id="cg-type">${["Congé annuel", "Maladie", "Maternité", "Paternité", "Événement familial", "Sans solde"].map(t => `<option>${t}</option>`).join("")}</select></div>

      <div><label for="cg-motif">Motif</label><input type="text" id="cg-motif"></div></div>`, {

        const d = { salarie_id: $("#cg-sal").value || null, type: $("#cg-type").value, date_debut: $("#cg-du").value || null, date_fin: $("#cg-au").value || null,
          jours: Number($("#cg-jours").value || 0), motif: $("#cg-motif").value.trim() || null };
        if (!d.salarie_id || !d.date_debut || !d.date_fin) return "Salarié et dates sont obligatoires.";
        if (d.date_fin < d.date_debut) return "La date de fin précède la date de début.";
        if (!(d.jours > 0)) return "Indiquez le nombre de jours.";
        const s = sal(d.salarie_id);
        if (d.type === "Congé annuel" && d.jours > Number(s.reste) && !confirm(`${nomSalarie(s)} n'a que ${qte(s.reste)} jour(s) de solde. Enregistrer quand même ?`)) return "Demande non enregistrée.";
        const { error } = await sb.from("conges").insert(d);
        if (error) return messageErreur(error);
        toast("Demande enregistrée."); recharger();
      }
    });
    const compter = () => {
      const a = $("#cg-du").value, b = $("#cg-au").value;
      if (!a || !b || b < a) return;
      let n = 0; for (let d = new Date(a + "T00:00:00"); d <= new Date(b + "T00:00:00"); d.setDate(d.getDate() + 1)) if (d.getDay() !== 0) n++;
      $("#cg-jours").value = n;
    };
    $("#cg-du").onchange = compter; $("#cg-au").onchange = compter;
  };
}

/* =====================================================================

   Le registre part des écritures de classe 2 : chaque acquisition passée en
   achat, en dépense ou reprise du classeur se rattache à une fiche. Les
   amortissements sont linéaires, au mois ; le comptable les passe chaque mois
   (une écriture par mois, journal AMO). Seul le DAF sort un bien de l'actif.
   ===================================================================== */
const IMMO_SAISIE = ["admin", "daf", "comptable"];
const CLASSE_IMMO = { "En service": "ok", "Cédée": "inactif", "Mise au rebut": "inactif" };
const COMPTES_IMMO = [["213", "Logiciels et sites internet"], ["231", "Bâtiments"], ["234", "Aménagements, agencements, installations"],
  ["241", "Matériel et outillage"], ["244", "Matériel et mobilier de bureau"], ["245", "Matériel de transport"], ["27", "Dépôts et cautionnements (non amortis)"]];
const DUREE_CONSEILLEE = { "213": 3, "231": 20, "234": 3, "241": 5, "244": 5, "245": 4 };

async function pageImmobilisations() {
  await chargerRefsFinance();
  let onglet = etat.param.onglet || etat.ongletImmo || "registre";
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Immobilisations</h1>
      <p class="discret">Registre des biens durables, plan d'amortissement de chacun et dotations mensuelles. Une acquisition enregistrée en classe 2
      (achat, dépense ou reprise du classeur) apparaît dans « À immobiliser » jusqu'à ce qu'elle soit rattachée à une fiche.</p></div>
      <div class="actions-ligne"><button class="btn" id="b-export">Exporter</button></div></div>
    <div class="panneau"><div class="onglets" role="tablist">
      <button role="tab" data-onglet="registre" aria-selected="${onglet === "registre"}">Registre</button>
      <button role="tab" data-onglet="a_immobiliser" aria-selected="${onglet === "a_immobiliser"}">À immobiliser</button>
      <button role="tab" data-onglet="dotations" aria-selected="${onglet === "dotations"}">Dotations</button></div>
      <div id="zone"></div></div>`;
  const zone = $("#zone");
  let exporter = () => {};

  const registre = async () => {
    const immos = await chargerTout(() => sb.from("v_immobilisations").select("*").order("code"));
    zone.innerHTML = `<div class="outils"><select id="i-statut" aria-label="Statut"><option value="En service">En service</option><option value="sorties">Sorties de l'actif</option><option value="">Toutes</option></select>
      <span class="discret num pousse" id="nb"></span></div>
      <div class="defil"><table><thead><tr><th>Code</th><th>Désignation</th><th>Compte</th><th>Mise en service</th><th class="montant">Valeur d'origine</th>
        <th class="montant">Durée</th><th class="montant">Dotation mensuelle</th><th class="montant">Amortissements</th><th class="montant">Valeur nette</th><th>Statut</th><th></th></tr></thead>
      <tbody id="corps"></tbody><tfoot id="pied"></tfoot></table></div>`;
    const visibles = () => { const s = $("#i-statut").value; return immos.filter(i => !s || (s === "sorties" ? i.statut !== "En service" : i.statut === s)); };
    const dessiner = () => {
      const l = visibles();
      $("#nb").textContent = `${l.length} immobilisation(s)`;
      $("#corps").innerHTML = l.map(i => `<tr><td class="code">${esc(i.code)}</td><td>${esc(i.libelle)}${i.vehicule ? `<div class="discret petit">${esc(i.vehicule)}</div>` : ""}</td>
        <td class="code">${esc(i.compte)}</td><td class="code">${esc(dateCourte(i.date_mise_en_service))}</td><td class="montant">${fcfa(i.valeur_origine)}</td>
        <td class="montant">${i.duree_annees ? qte(i.duree_annees) + " an(s)" : `<span class="discret">non amorti</span>`}</td>
        <td class="montant">${fcfa(i.dotation_mensuelle)}</td><td class="montant">${fcfa(i.amortissements_cumules)}</td><td class="montant"><b>${fcfa(i.valeur_nette)}</b></td>
        <td><span class="pastille ${CLASSE_IMMO[i.statut]}">${esc(i.statut)}</span></td><td><button class="btn" data-immo="${i.id}">Fiche</button></td></tr>`).join("")
        || `<tr><td colspan="11" class="vide">Aucune immobilisation.</td></tr>`;
      const t = k => l.reduce((s, i) => s + Number(i[k] || 0), 0);
      $("#pied").innerHTML = `<tr><td colspan="4">Total</td><td class="montant">${fcfa(t("valeur_origine"))}</td><td></td><td class="montant">${fcfa(t("dotation_mensuelle"))}</td>
        <td class="montant">${fcfa(t("amortissements_cumules"))}</td><td class="montant">${fcfa(t("valeur_nette"))}</td><td colspan="2"></td></tr>`;
      $$("[data-immo]").forEach(b => b.onclick = () => ouvrirImmobilisation(immos.find(i => i.id === b.dataset.immo)));
    };
    $("#i-statut").onchange = dessiner;
    exporter = () => exporterTableau("registre_immobilisations.xlsx", ["Code", "Désignation", "Compte", "Acquisition", "Mise en service", "Valeur d'origine", "Durée (ans)",
      "Dotation mensuelle", "Amortissements cumulés", "Valeur nette", "Statut", "Date de sortie"],
      visibles().map(i => [i.code, i.libelle, i.compte, dateCourte(i.date_acquisition), dateCourte(i.date_mise_en_service), Number(i.valeur_origine), i.duree_annees,
        Number(i.dotation_mensuelle || 0), Number(i.amortissements_cumules), Number(i.valeur_nette), i.statut, dateCourte(i.date_sortie)]), "Registre des immobilisations");
    dessiner();
  };

  const aImmobiliser = async () => {
    const acq = await chargerTout(() => sb.from("v_acquisitions_a_immobiliser").select("*").order("date_ecriture").order("ligne_ecriture_id"));
    zone.innerHTML = `<p class="discret petit">Cochez les écritures qui forment un même bien (par exemple toutes les factures d'un aménagement), puis créez sa fiche.
      Une dépense inscrite ici à tort (frais de déplacement…) se corrige par un reclassement de l'opération.</p>
      <div class="outils"><span class="discret num" id="nb"></span>
        ${peut(IMMO_SAISIE) ? `<button class="btn btn-principal pousse" id="b-fiche" disabled>Créer la fiche</button>` : ""}</div>
      <div class="defil"><table><thead><tr><th></th><th>Date</th><th>Écriture</th><th>Compte</th><th>Libellé</th><th>Fournisseur</th><th class="montant">Montant</th></tr></thead>
      <tbody>${acq.map(a => `<tr><td>${peut(IMMO_SAISIE) ? `<input type="checkbox" data-acq="${a.ligne_ecriture_id}" aria-label="Choisir">` : ""}</td>
        <td class="code">${esc(dateCourte(a.date_ecriture))}</td><td class="code">${esc(a.numero)}</td><td class="code" title="${esc(a.compte_libelle)}">${esc(a.compte)}</td>
        <td>${esc(a.libelle)}</td><td>${esc(a.fournisseur || "")}</td><td class="montant">${fcfa(a.montant)}</td></tr>`).join("")
        || `<tr><td colspan="7" class="vide">Toutes les acquisitions sont inscrites au registre.</td></tr>`}</tbody></table></div>`;
    const choix = () => $$("[data-acq]:checked").map(c => acq.find(a => String(a.ligne_ecriture_id) === c.dataset.acq));
    const maj = () => {
      const c = choix();
      $("#nb").textContent = c.length ? `${c.length} écriture(s) cochée(s) : ${fcfa(c.reduce((s, a) => s + Number(a.montant), 0))} FCFA` : `${acq.length} écriture(s) à immobiliser`;
      if ($("#b-fiche")) $("#b-fiche").disabled = !c.length;
    };
    $$("[data-acq]").forEach(c => c.onchange = maj);
    if ($("#b-fiche")) $("#b-fiche").onclick = () => formulaireImmobilisation(choix());
    exporter = () => exporterTableau("acquisitions_a_immobiliser.xlsx", ["Date", "Écriture", "Compte", "Libellé", "Fournisseur", "Montant"],
      acq.map(a => [dateCourte(a.date_ecriture), a.numero, a.compte, a.libelle, a.fournisseur, Number(a.montant)]), "Acquisitions à immobiliser");
    maj();
  };

  const dotations = async () => {
    const [immos, amos] = await Promise.all([
      chargerTout(() => sb.from("immobilisations").select("id, code, libelle")),
      chargerTout(() => sb.from("amortissements").select("*").order("annee").order("mois"))]);
    const nom = id => { const i = immos.find(x => x.id === id); return i ? `${i.code} ${i.libelle}` : ""; };
    const mois = new Map();
    for (const a of amos) {
      const k = a.anterieur ? "Antérieur" : `${a.annee}-${String(a.mois).padStart(2, "0")}`;
      if (!mois.has(k)) mois.set(k, { k, lib: a.anterieur ? "Avant l'ouverture (à-nouveaux)" : `${MOIS[a.mois - 1]} ${a.annee}`, total: 0, lignes: [] });
      const m = mois.get(k); m.total += Number(a.montant); m.lignes.push(a);
    }
    const derniers = [...mois.values()].filter(m => m.k !== "Antérieur");
    const dernier = derniers.length ? derniers[derniers.length - 1].lib : "aucun";
    const d = new Date(); d.setDate(0); // fin du mois précédent
    zone.innerHTML = `<div class="outils"><span class="discret">Dernier mois doté : <b>${esc(dernier)}</b></span>
      ${peut(IMMO_SAISIE) ? `<span class="pousse"></span><label class="discret" style="margin:0" for="d-annee">Doter jusqu'à</label>
        <select id="d-mois" aria-label="Mois">${MOIS.map((m, i) => `<option value="${i + 1}" ${i === d.getMonth() ? "selected" : ""}>${m}</option>`).join("")}</select>
        <input type="number" id="d-annee" value="${d.getFullYear()}" min="2026" style="width:6rem" aria-label="Année">
        <button class="btn btn-principal" id="b-doter">Passer les dotations</button>` : ""}</div>
      <div class="defil"><table><thead><tr><th>Mois</th><th>Immobilisation</th><th class="montant">Dotation</th></tr></thead><tbody>
      ${[...mois.values()].reverse().map(m => `<tr class="sous-total"><td colspan="2">${esc(m.lib)}</td><td class="montant">${fcfa(m.total)}</td></tr>`
        + m.lignes.map(a => `<tr><td></td><td>${esc(nom(a.immobilisation_id))}${a.anterieur ? ` <span class="discret petit">${MOIS[a.mois - 1].toLowerCase()} ${a.annee}</span>` : ""}</td>
          <td class="montant">${fcfa(a.montant)}</td></tr>`).join("")).join("") || `<tr><td colspan="3" class="vide">Aucune dotation passée.</td></tr>`}</tbody></table></div>`;
    if ($("#b-doter")) $("#b-doter").onclick = async () => {
      const b = $("#b-doter"); b.disabled = true;
      try { toast(await appeler("doter_amortissements", { p_annee: Number($("#d-annee").value), p_mois: Number($("#d-mois").value) })); await basculer("dotations"); }
      catch (err) { toast(messageErreur(err), true); b.disabled = false; }
    };
    exporter = () => exporterTableau("dotations_amortissements.xlsx", ["Mois", "Immobilisation", "Dotation"],
      amos.map(a => [a.anterieur ? `${MOIS[a.mois - 1]} ${a.annee} (antérieur)` : `${MOIS[a.mois - 1]} ${a.annee}`, nom(a.immobilisation_id), Number(a.montant)]), "Dotations aux amortissements");
  };

  const basculer = async k => {
    onglet = etat.ongletImmo = k;
    $$("[data-onglet]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.onglet === k)));
    await (k === "a_immobiliser" ? aImmobiliser() : k === "dotations" ? dotations() : registre());
  };
  $$("[data-onglet]").forEach(b => b.onclick = () => basculer(b.dataset.onglet));
  $("#b-export").onclick = () => exporter();
  await basculer(onglet);
}

function formulaireImmobilisation(lignes) {
  const total = lignes.reduce((s, a) => s + Number(a.montant), 0);
  const date = lignes.map(a => a.date_ecriture).sort()[0];
  const compte = lignes[0].compte;
  const prefixe = (COMPTES_IMMO.find(([c]) => compte.startsWith(c)) || [compte])[0];
  const veh = lignes.find(a => a.vehicule_id), act = lignes.find(a => a.activite_id), site = lignes.find(a => a.site_id);
  ouvrirModale("Nouvelle immobilisation", `<p class="discret petit">${lignes.length} écriture(s) : <b>${fcfa(total)} FCFA</b> au compte ${esc(compte)}.
      Si le bien a été acquis avant le 01/01/2026, les amortissements antérieurs sont passés en à-nouveaux (129 / 28x).</p>
    <label for="im-lib">Désignation *</label><input type="text" id="im-lib" value="${esc(lignes.length === 1 ? lignes[0].libelle : "")}">
    <div class="grille2"><div><label for="im-acq">Date d'acquisition *</label><input type="date" id="im-acq" value="${esc(date)}"></div>
      <div><label for="im-mes">Mise en service *</label><input type="date" id="im-mes" value="${esc(date)}"></div></div>
    <div class="grille2"><div><label for="im-duree">Durée d'amortissement (années) *</label><input type="number" id="im-duree" min="0.5" step="0.5" value="${DUREE_CONSEILLEE[prefixe] || ""}"></div>
      <div><label for="im-val">Valeur d'origine</label><input type="text" id="im-val" value="${fcfa(total)}" disabled></div></div>
    <div class="grille2"><div><label for="im-act">Activité</label><select id="im-act">${optionsRef("activites", act && act.activite_id, undefined, "Structure (toutes)")}</select></div>
      <div><label for="im-site">Bureau ou site</label><select id="im-site">${optionsRef("sites", site && site.site_id)}</select></div></div>
    <label for="im-veh">Véhicule</label><select id="im-veh">${optionsRef("vehicules", veh && veh.vehicule_id)}</select>
    <label for="im-obs">Observation</label><textarea id="im-obs"></textarea>`, {
    libelleSave: "Inscrire au registre",
    onSave: async () => {
      const fiche = { libelle: $("#im-lib").value.trim(), date_acquisition: $("#im-acq").value, date_mise_en_service: $("#im-mes").value,
        duree_annees: $("#im-duree").value, activite_id: $("#im-act").value, site_id: $("#im-site").value, vehicule_id: $("#im-veh").value, observation: $("#im-obs").value.trim() };
      if (!fiche.libelle || !fiche.date_acquisition) return "Indiquez la désignation et la date d'acquisition.";
      if (!prefixe.startsWith("27") && !Number(fiche.duree_annees)) return "Indiquez la durée d'amortissement.";
      try { await appeler("creer_immobilisation", { p_fiche: fiche, p_lignes: lignes.map(a => a.ligne_ecriture_id) }); }
      catch (err) { return messageErreur(err); }
      toast("Immobilisation inscrite au registre."); etat.param = { onglet: "registre" }; recharger();
    }
  });
}

async function ouvrirImmobilisation(i) {
  if (!i) return;
  let plan, lignes;
  try {
    [plan, lignes] = await Promise.all([appeler("plan_amortissement", { p_id: i.id }),
      chargerTout(() => sb.from("immobilisations_lignes").select("ligne_ecriture_id").eq("immobilisation_id", i.id))]);
  } catch (err) { return toast(messageErreur(err), true); }
  const passes = new Set();
  const { data: amos } = await sb.from("amortissements").select("annee, mois").eq("immobilisation_id", i.id);
  (amos || []).forEach(a => passes.add(`${a.annee}-${a.mois}`));
  // Le plan par exercice : plus lisible que 36 ou 48 lignes mensuelles.
  const annees = new Map();
  for (const p of plan || []) {
    if (!annees.has(p.annee)) annees.set(p.annee, { annee: p.annee, mois: 0, dotation: 0, passe: 0, cumul: 0, vnc: 0 });
    const a = annees.get(p.annee); a.mois++; a.dotation += Number(p.dotation); a.cumul = Number(p.cumul); a.vnc = Number(p.vnc);
    if (passes.has(`${p.annee}-${p.mois}`)) a.passe += Number(p.dotation);
  }
  const tableau = `<table><thead><tr><th>Exercice</th><th class="montant">Mois</th><th class="montant">Dotation</th><th class="montant">dont passée</th>
      <th class="montant">Cumul fin d'exercice</th><th class="montant">Valeur nette</th></tr></thead>
    <tbody>${[...annees.values()].map(a => `<tr><td>${a.annee}</td><td class="montant">${a.mois}</td><td class="montant">${fcfa(a.dotation)}</td>
      <td class="montant">${a.passe ? fcfa(a.passe) : ""}</td><td class="montant">${fcfa(a.cumul)}</td><td class="montant">${fcfa(a.vnc)}</td></tr>`).join("")
      || `<tr><td colspan="6" class="vide">Bien non amortissable.</td></tr>`}</tbody></table>`;
  const actions = [`<button type="button" class="btn" id="im-imprimer">Imprimer la fiche</button>`];
  if (i.statut === "En service" && peut(VALIDATION)) actions.push(`<button type="button" class="btn btn-danger" id="im-sortir">Sortir de l'actif</button>`);
  ouvrirModale(`${i.code} — ${i.libelle}`, `
    ${i.statut !== "En service" ? `<div class="erreur">${esc(i.statut)} le ${esc(dateCourte(i.date_sortie))} : ${esc(i.motif_sortie || "")}</div>` : ""}
    <dl class="fiche">
      <dt>Compte</dt><dd>${esc(i.compte)} · amortissements ${esc(i.compte_amortissement || "—")} · dotation ${esc(i.compte_dotation || "—")}</dd>
      <dt>Acquisition</dt><dd>${esc(dateCourte(i.date_acquisition))} · mise en service ${esc(dateCourte(i.date_mise_en_service))}</dd>
      <dt>Valeur d'origine</dt><dd><b>${fcfa(i.valeur_origine)} FCFA</b> (${(lignes || []).length} écriture(s))</dd>
      <dt>Amortissement</dt><dd>${i.duree_annees ? `linéaire sur ${qte(i.duree_annees)} an(s), ${fcfa(i.dotation_mensuelle)} FCFA par mois` : "non amorti"}</dd>
      <dt>Amortissements passés</dt><dd>${fcfa(i.amortissements_cumules)} FCFA · valeur nette <b>${fcfa(i.valeur_nette)} FCFA</b></dd>
      ${i.activite ? `<dt>Activité</dt><dd>${esc(i.activite)}</dd>` : ""}${i.site ? `<dt>Site</dt><dd>${esc(i.site)}</dd>` : ""}
      ${i.vehicule ? `<dt>Véhicule</dt><dd>${esc(i.vehicule)}</dd>` : ""}${i.observation ? `<dt>Observation</dt><dd>${esc(i.observation)}</dd>` : ""}
    </dl><h2>Plan d'amortissement</h2><div class="defil">${tableau}</div>
    <div class="barre-actions">${actions.join("")}</div>`, { large: true });
  $("#im-imprimer").onclick = () => imprimerHtml(`Fiche ${i.code}`, `<h1>Fiche d'immobilisation ${esc(i.code)}</h1>
    <p><b>${esc(i.libelle)}</b><br>Compte ${esc(i.compte)} · acquis le ${esc(dateCourte(i.date_acquisition))} · mis en service le ${esc(dateCourte(i.date_mise_en_service))}<br>
    Valeur d'origine : ${fcfa(i.valeur_origine)} FCFA · ${i.duree_annees ? `amortissement linéaire sur ${qte(i.duree_annees)} an(s)` : "non amorti"}</p>
    <h2>Plan d'amortissement</h2>${tableau}`);
  if ($("#im-sortir")) $("#im-sortir").onclick = () => ouvrirModale(`Sortir ${i.code} de l'actif`, `<p>Les amortissements sont d'abord passés jusqu'au mois de sortie.
      L'écriture solde le bien : amortissements cumulés au débit du ${esc(i.compte_amortissement || "")}, valeur nette au débit du 812, valeur d'origine au crédit du ${esc(i.compte)}.
      En cas de cession, le prix encaissé se saisit en Trésorerie (recette « Produits de cession d'immobilisations », compte 822).</p>
    <div class="grille2"><div><label for="so-date">Date de sortie *</label><input type="date" id="so-date" value="${aujourdhui()}"></div>
      <div><label for="so-statut">Nature *</label><select id="so-statut"><option>Cédée</option><option>Mise au rebut</option></select></div></div>
    <label for="so-motif">Motif *</label><textarea id="so-motif"></textarea>`, {
    libelleSave: "Sortir de l'actif",
    onSave: async () => {
      const m = $("#so-motif").value.trim();
      if (!m) return "Indiquez le motif.";
      try { await appeler("sortir_immobilisation", { p_id: i.id, p_date: $("#so-date").value, p_statut: $("#so-statut").value, p_motif: m }); }
      catch (err) { return messageErreur(err); }
      toast("Immobilisation sortie de l'actif."); recharger();
    }
  });
}

/* =====================================================================
   COMPTE DE L'EXPLOITANT (lot 5)
   GUEST MARKETS est une entreprise individuelle : ce que le CEO ou Guest
   Cameroun paie pour elle, ou lui apporte, va au 1041 ; ce qu'elle leur
   rembourse en sort. L'écran dit, à tout moment, combien elle leur doit.
   ===================================================================== */
async function pageExploitant() {
  const mv = await chargerTout(() => sb.from("v_compte_exploitant").select("*").order("date_ecriture").order("id"));
  const f = etat.exploitant = etat.exploitant || { financeur: "" };
  const solde = l => l.reduce((s, x) => s + Number(x.credit) - Number(x.debit), 0);
  const financeurs = [...new Set(mv.map(m => m.financeur))].sort();
  const parFin = financeurs.map(n => ({ n, s: solde(mv.filter(m => m.financeur === n)) }));
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Compte de l'exploitant</h1>
      <p class="discret">Ce que GUEST MARKETS doit à son exploitant (compte 1041). Le CEO et Guest Cameroun forment un seul financeur ; l'écran les distingue
      seulement pour savoir qui a payé quoi. Un solde créditeur est une dette de l'entreprise envers eux.</p></div>
      <div class="actions-ligne"><button class="btn" id="b-imprimer">Imprimer le relevé</button><button class="btn" id="b-export">Exporter</button></div></div>
    <div class="chiffres"><a><b>${fcfa(solde(mv))}</b><span>Dû à l'exploitant</span></a>
      ${parFin.map(x => `<a><b>${fcfa(x.s)}</b><span>dont ${esc(x.n)}</span></a>`).join("")}</div>
    <h2>Mois par mois</h2><div class="panneau defil" id="mensuel"></div>
    <h2 class="titre-section">Mouvements</h2>
    <div class="panneau"><div class="outils">
      <select id="x-fin" aria-label="Financeur"><option value="">Tous</option>${financeurs.map(n => `<option ${n === f.financeur ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
      <input type="text" id="filtre" placeholder="Rechercher…" aria-label="Rechercher"><span class="discret num pousse" id="nb"></span></div>
      <div class="defil"><table><thead><tr><th>Date</th><th>Écriture</th><th>Libellé</th><th>Financeur</th><th>Nature</th>
        <th class="montant">Remboursé (débit)</th><th class="montant">Apporté (crédit)</th><th class="montant">Solde</th></tr></thead>
      <tbody id="corps"></tbody></table></div></div>`;
  const visibles = () => { const q = $("#filtre").value.toLowerCase();
    return mv.filter(m => (!f.financeur || m.financeur === f.financeur) && (!q || [m.libelle, m.numero, m.nature].join(" ").toLowerCase().includes(q))); };
  const dessiner = () => {
    const l = visibles(); let s = 0;
    $("#nb").textContent = `${l.length} mouvement(s)`;
    $("#corps").innerHTML = l.map(m => { s += Number(m.credit) - Number(m.debit);
      return `<tr><td class="code">${esc(dateCourte(m.date_ecriture))}</td><td class="code">${m.operation_id ? `<button class="btn-lien" data-op="${m.operation_id}">${esc(m.numero)}</button>` : esc(m.numero)}</td>
        <td>${esc(m.libelle)}</td><td>${esc(m.financeur)}</td><td class="petit">${esc(m.nature)}</td>
        <td class="montant">${Number(m.debit) ? fcfa(m.debit) : ""}</td><td class="montant">${Number(m.credit) ? fcfa(m.credit) : ""}</td><td class="montant">${fcfa(s)}</td></tr>`; }).join("")
      || `<tr><td colspan="8" class="vide">Aucun mouvement.</td></tr>`;
    $$("[data-op]").forEach(b => b.onclick = async () => {
      await chargerRefsFinance();
      const { data, error } = await sb.from("v_operations").select("*").eq("id", b.dataset.op).maybeSingle();
      if (error || !data) return toast(messageErreur(error) || "Opération introuvable.", true);
      ouvrirOperation(data, recharger);
    });
    // Tableau mensuel du financeur choisi.
    const mois = new Map(); let cumul = 0;
    for (const m of mv.filter(m => !f.financeur || m.financeur === f.financeur)) {
      const k = `${m.annee}-${String(m.mois).padStart(2, "0")}`;
      if (!mois.has(k)) mois.set(k, { lib: `${MOIS[m.mois - 1]} ${m.annee}`, d: 0, c: 0 });
      const x = mois.get(k); x.d += Number(m.debit); x.c += Number(m.credit);
    }
    $("#mensuel").innerHTML = `<table><thead><tr><th>Mois</th><th class="montant">Apports et dépenses payées pour l'entreprise</th><th class="montant">Remboursements</th>
      <th class="montant">Variation</th><th class="montant">Solde dû</th></tr></thead><tbody>${[...mois.values()].map(x => { cumul += x.c - x.d;
      return `<tr><td>${esc(x.lib)}</td><td class="montant">${fcfa(x.c)}</td><td class="montant">${x.d ? fcfa(x.d) : ""}</td><td class="montant">${fcfa(x.c - x.d)}</td>
        <td class="montant"><b>${fcfa(cumul)}</b></td></tr>`; }).join("") || `<tr><td colspan="5" class="vide">Aucun mouvement.</td></tr>`}</tbody></table>`;
  };
  $("#x-fin").onchange = () => { f.financeur = $("#x-fin").value; dessiner(); };
  $("#filtre").oninput = dessiner;
  $("#b-export").onclick = () => { let s = 0; exporterTableau("compte_exploitant.xlsx", ["Date", "Écriture", "Libellé", "Financeur", "Nature", "Débit", "Crédit", "Solde"],
    visibles().map(m => { s += Number(m.credit) - Number(m.debit); return [dateCourte(m.date_ecriture), m.numero, m.libelle, m.financeur, m.nature, Number(m.debit), Number(m.credit), s]; }),
    `Compte de l'exploitant${f.financeur ? " — " + f.financeur : ""}`); };
  $("#b-imprimer").onclick = () => { const l = visibles(); let s = 0;
    imprimerHtml("Relevé du compte de l'exploitant", `<h1>Relevé du compte de l'exploitant${f.financeur ? " — " + esc(f.financeur) : ""}</h1>
      <p class="discret">Compte 1041 · arrêté au ${esc(dateCourte(aujourdhui()))}</p>
      <table><thead><tr><th>Date</th><th>Pièce</th><th>Libellé</th><th>Débit</th><th>Crédit</th><th>Solde</th></tr></thead><tbody>${l.map(m => { s += Number(m.credit) - Number(m.debit);
        return `<tr><td>${esc(dateCourte(m.date_ecriture))}</td><td>${esc(m.numero)}</td><td>${esc(m.libelle)}</td><td style="text-align:right">${Number(m.debit) ? fcfa(m.debit) : ""}</td>
          <td style="text-align:right">${Number(m.credit) ? fcfa(m.credit) : ""}</td><td style="text-align:right">${fcfa(s)}</td></tr>`; }).join("")}</tbody></table>
      <p>Solde dû à l'exploitant : <b>${fcfa(s)} FCFA</b> (${esc(enLettres(s))} francs CFA).</p>`); };
  dessiner();
}

const RAPPROCHEMENT = ["admin", "daf", "comptable", "tresorier"];
const COMPTES_BANQUE = t => /^(52|55)/.test(t.compte || "");

async function pageRapprochements() {

      <div class="actions-ligne">${peut(RAPPROCHEMENT) ? `<button class="btn btn-principal" id="b-nouveau">Nouveau relevé</button>` : ""}</div></div>

        <td class="montant">${fcfa(r.solde_final)}</td><td class="montant">${fcfa(r.solde_comptable)}</td><td class="montant ${ecart ? "negatif" : ""}">${ecart ? fcfa(ecart) : "0"}</td>
        <td class="montant">${r.nb_lignes - r.nb_non_pointees} / ${r.nb_lignes}</td>
        <td><span class="pastille ${r.statut === "Validé" ? "ok" : "attente"}">${esc(r.statut)}</span></td><td><button class="btn" data-rel="${r.id}">Ouvrir</button></td></tr>`; }).join("")

function formulaireReleve(comptes) {
  ouvrirModale("Nouveau relevé", `<label for="rl-compte">Compte *</label><select id="rl-compte"><option value="">—</option>${comptes.map(c =>
      `<option value="${c.id}">${esc(c.code)} — ${esc(c.libelle)}</option>`).join("")}</select>
    <div class="grille2"><div><label for="rl-debut">Du *</label><input type="date" id="rl-debut"></div><div><label for="rl-fin">Au *</label><input type="date" id="rl-fin"></div></div>
    <div class="grille2"><div><label for="rl-si">Solde initial du relevé *</label><input type="number" id="rl-si" step="1"></div>

/* Lecture d'un relevé Excel ou CSV : repère les colonnes par leur titre. */
async function lireReleve(fichier) {
  await chargerScript(CDN_EXPORT.xlsx);
  const wb = XLSX.read(await fichier.arrayBuffer(), { type: "array", cellDates: true, raw: false, dateNF: "yyyy-mm-dd" });
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" });
  const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
  const iTitre = aoa.findIndex(r => r.some(c => /date/.test(norm(c))) && r.some(c => /montant|debit|credit/.test(norm(c))));
  if (iTitre < 0) throw new Error("Colonnes introuvables : il faut au moins une colonne « Date » et une colonne « Montant » (ou « Débit » et « Crédit »).");
  const t = aoa[iTitre].map(norm), col = re => t.findIndex(c => re.test(c));
  const cDate = col(/date/), cLib = col(/libelle|designation|description|operation|motif/), cRef = col(/ref/),
    cMont = col(/montant/), cDeb = col(/debit|sortie|retrait/), cCre = col(/credit|entree|versement/);
  const nombre = v => typeof v === "number" ? v : Number(String(v).replace(/\s| /g, "").replace(",", ".")) || 0;
  const date = v => {
    if (v instanceof Date) return new Date(v - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    if (typeof v === "number") return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
    const m = String(v).trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
    if (m) return `${m[3].length === 2 ? "20" + m[3] : m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    return /^\d{4}-\d{2}-\d{2}/.test(String(v)) ? String(v).slice(0, 10) : null;
  };
  const lignes = [];
  for (const r of aoa.slice(iTitre + 1)) {
    const d = date(r[cDate]);
    if (!d) continue;
    const montant = Math.round(cMont >= 0 ? nombre(r[cMont]) : nombre(r[cCre]) - nombre(r[cDeb]));
    if (!montant) continue;
    lignes.push({ date_operation: d, libelle: String(cLib >= 0 ? r[cLib] : "").trim() || "Ligne du relevé", reference: cRef >= 0 ? String(r[cRef]).trim() || null : null, montant });
  }
  if (!lignes.length) throw new Error("Aucune ligne datée avec un montant n'a été trouvée dans le fichier.");
  return lignes;
}

async function ouvrirReleve(id) {

    chargerTout(() => sb.from("lignes_releve").select("*").eq("releve_id", id).order("date_operation").order("id"))]);
  if (error) return toast(messageErreur(error), true);
  const d0 = new Date(r.date_debut); d0.setDate(d0.getDate() - 10);
  const d1 = new Date(r.date_fin); d1.setDate(d1.getDate() + 10);
  const ecritures = await chargerTout(() => sb.from("v_ecritures_banque").select("*").eq("compte", r.compte)

  const suspens = libre.filter(e => e.date_ecriture >= r.date_debut && e.date_ecriture <= r.date_fin);

      <a><b>${lignes.length - nonPointees.length} / ${lignes.length}</b><span>lignes pointées</span></a></div>

    <tbody>${lignes.map(l => { const e = pointee(l.ligne_ecriture_id); return `<tr><td>${agir && !l.ligne_ecriture_id ? `<input type="radio" name="rl-l" value="${l.id}" aria-label="Choisir">` : ""}</td>

/* =====================================================================
   PILOTAGE (lot 6) : états financiers SYSCOHADA, résultat analytique,
   budget, tableau de bord. La base calcule les montants par poste (règles
   comptes → postes dans regles_postes) ; l'écran fait les totaux selon
   les formules de postes_etats, affiche, imprime et exporte.
   ===================================================================== */
const ISO = d => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const finDeMois = (a, m) => ISO(new Date(a, m, 0));
const montantSigne = v => `<span class="${Number(v) < 0 ? "negatif" : ""}">${Number(v) ? fcfa(v) : "–"}</span>`;

async function chargerPostes(etatCode) {
  etat.refs.postes = etat.refs.postes || {};
  if (!etat.refs.postes[etatCode]) {
    const { data, error } = await sb.from("postes_etats").select("*").eq("etat", etatCode).order("ordre");
    if (error) throw error;
    etat.refs.postes[etatCode] = data || [];
  }
  return etat.refs.postes[etatCode];
}

/* Totaux d'un état : chaque total additionne les codes de sa formule (calcul récursif). */
function totaliserEtat(postes, valeurs) {
  const v = new Map(valeurs), parCode = new Map(postes.map(p => [p.code, p]));
  const calc = code => {
    if (v.has(code)) return v.get(code);
    const p = parCode.get(code);
    const x = p && p.type === "total" ? (p.formule || []).reduce((s, c) => s + calc(c), 0) : 0;
    v.set(code, x); return x;
  };
  postes.forEach(p => calc(p.code));
  return v;
}
const sommeParCode = (lignes, cle = "montant", filtre = () => true) => {
  const m = new Map();
  lignes.filter(filtre).forEach(l => m.set(l.code, (m.get(l.code) || 0) + Number(l[cle] || 0)));
  return m;
};

/* Période des états : exercice et mois d'arrêté (fin de mois). */
function periodeEtats() {
  const f = etat.filtres, annee = Number(f.annee), mois = Number(f.mois) || 12;
  return { annee, mois, debut: `${annee}-01-01`, fin: finDeMois(annee, mois), debutN1: `${annee - 1}-01-01`, finN1: finDeMois(annee - 1, mois),
    lib: `au ${dateCourte(finDeMois(annee, mois))}`, libN1: `au ${dateCourte(finDeMois(annee - 1, mois))}` };
}
