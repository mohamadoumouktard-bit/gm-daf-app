    $("#corps").innerHTML = (m ? `<tr class="sous-total"><td colspan="7">Report au 1er ${esc(MOIS[m - 1].toLowerCase())}</td><td class="montant">${soldeDC(report)}</td></tr>` : "")
      + (rangs.map(l => `<tr><td class="code">${esc(dateCourte(l.date_ecriture))}</td><td class="code">${esc(l.numero)}</td><td>${esc(l.journal_code)}</td>
        <td>${esc(l.libelle)}</td><td class="petit">${esc([l.categorie, l.site, l.vehicule, l.fournisseur].filter(Boolean).join(" · "))}</td>
        <td class="montant">${l.debit ? fcfa(l.debit) : ""}</td><td class="montant">${l.credit ? fcfa(l.credit) : ""}</td><td class="montant">${soldeDC(l.solde)}</td></tr>`).join("")
      || `<tr><td colspan="8" class="vide">Aucun mouvement sur la période.</td></tr>`);
    const d = rangs.reduce((s, l) => s + Number(l.debit), 0), c = rangs.reduce((s, l) => s + Number(l.credit), 0);
    $("#pied").innerHTML = `<tr><td colspan="5">Totaux de la période · solde final</td><td class="montant">${fcfa(d)}</td><td class="montant">${fcfa(c)}</td><td class="montant">${soldeDC(solde)}</td></tr>`;
  };
  brancherPeriode(charger);
  $("#g-compte").onchange = charger; $("#g-four").onchange = charger;
  $("#b-export").onclick = () => exporterTableau(`grand_livre_${$("#g-compte").value}.xlsx`, ["Date", "N°", "Journal", "Libellé", "Catégorie", "Fournisseur", "Débit", "Crédit", "Solde"],
    rangs.map(l => [dateCourte(l.date_ecriture), l.numero, l.journal_code, l.libelle, l.categorie, l.fournisseur, l.debit, l.credit, Math.round(l.solde)]),
    `Grand livre ${$("#g-compte").value} — ${libPeriode()}`);
  await charger();
}

/* Balance à six colonnes (SYSCOHADA) : soldes à l'ouverture, mouvements de la
   période, soldes à la clôture. L'ouverture reprend les à-nouveaux (journal AN)
   et tout ce qui précède le premier mois choisi ; la clôture = ouverture + mouvements. */
async function pageBalance() {
  const b = etat.balance = etat.balance || { de: 1, a: Number(etat.filtres.mois) || new Date().getMonth() + 1 };
  const annees = []; for (let x = 2026; x <= Math.max(2026, new Date().getFullYear()) + 1; x++) annees.push(x);
  const optMois = v => MOIS.map((m, i) => `<option value="${i + 1}" ${i + 1 === v ? "selected" : ""}>${m}</option>`).join("");
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Balance</h1>
      <p class="discret">Balance à six colonnes : pour chaque compte, le solde à l'ouverture de la période, les mouvements de la période et le solde à la clôture.
      Chaque paire de colonnes est équilibrée.</p></div>
      <div class="actions-ligne"><button class="btn" id="b-export">Exporter</button></div></div>
    <div class="panneau"><div class="outils">
      <select id="b-annee" aria-label="Exercice">${annees.map(x => `<option ${x === Number(etat.filtres.annee) ? "selected" : ""}>${x}</option>`).join("")}</select>
      <label class="discret" style="margin:0" for="b-de">du mois</label><select id="b-de">${optMois(b.de)}</select>
      <label class="discret" style="margin:0" for="b-a">au mois</label><select id="b-a">${optMois(b.a)}</select>
      <select id="b-classe" aria-label="Classe"><option value="">Toutes les classes</option>${CLASSES.map(c => `<option value="${c.v}">${esc(c.l)}</option>`).join("")}</select>
      <label class="case" style="margin:0"><input type="checkbox" id="b-soldes"> Masquer les comptes soldés</label>
      <span class="discret pousse" id="b-titre"></span></div>
    <div class="defil"><table><thead>
      <tr><th rowspan="2">Compte</th><th rowspan="2">Intitulé</th><th colspan="2" class="montant" style="text-align:center">Soldes à l'ouverture</th>
        <th colspan="2" class="montant" style="text-align:center">Mouvements de la période</th><th colspan="2" class="montant" style="text-align:center">Soldes à la clôture</th></tr>
      <tr><th class="montant">Débit</th><th class="montant">Crédit</th><th class="montant">Débit</th><th class="montant">Crédit</th><th class="montant">Débit</th><th class="montant">Crédit</th></tr>
    </thead><tbody id="corps"></tbody><tfoot id="pied"></tfoot></table></div></div>`;
  let comptes = [];
  const sens = s => [s > 0 ? s : 0, s < 0 ? -s : 0];
  const colonnes = c => { const [od, oc] = sens(c.o), [fd, fc] = sens(c.o + c.d - c.c); return [od, oc, c.d, c.c, fd, fc]; };
  const cellules = v => v.map(x => `<td class="montant">${x ? fcfa(x) : ""}</td>`).join("");
  const visibles = () => comptes.filter(c => (!$("#b-classe").value || String(c.classe) === $("#b-classe").value)
    && (c.o !== 0 || c.d !== 0 || c.c !== 0) && (!$("#b-soldes").checked || c.o + c.d - c.c !== 0));
  const dessiner = () => {
    const tot = Array(6).fill(0);
    let html = "", classe = null, st = null;
    const fermer = () => { if (st) html += `<tr class="sous-total"><td colspan="2">Total classe ${classe}</td>${cellules(st)}</tr>`; };
    for (const c of visibles()) {
      if (c.classe !== classe) { fermer(); classe = c.classe; st = Array(6).fill(0); }
      const v = colonnes(c);
      v.forEach((x, i) => { st[i] += x; tot[i] += x; });
      html += `<tr><td class="code"><button class="btn-lien" data-aller="grand_livre" data-param='${esc(JSON.stringify({ compte: c.compte }))}'>${esc(c.compte)}</button></td>
        <td>${esc(c.libelle)}</td>${cellules(v)}</tr>`;
    }
    fermer();
    $("#corps").innerHTML = html || `<tr><td colspan="8" class="vide">Aucune écriture.</td></tr>`;
    const equilibre = tot[0] === tot[1] && tot[2] === tot[3] && tot[4] === tot[5];
    $("#pied").innerHTML = `<tr><td colspan="2">Total général${equilibre || $("#b-classe").value ? "" : " — DÉSÉQUILIBRE"}</td>${cellules(tot).replace(/<td class="montant"><\/td>/g, `<td class="montant">0</td>`)}</tr>`;
    brancherAller();
  };
  const charger = async () => {
    const annee = Number($("#b-annee").value);
    let de = Number($("#b-de").value), a = Number($("#b-a").value);
    if (a < de) { a = de; $("#b-a").value = a; }
    Object.assign(b, { de, a }); etat.filtres.annee = annee;
    const fin = new Date(annee, a, 0).toLocaleDateString("fr-FR");
    $("#b-titre").textContent = `du 01/${String(de).padStart(2, "0")}/${annee} au ${fin}`;
    $("#corps").innerHTML = `<tr><td colspan="8" class="vide">Chargement…</td></tr>`;
    const lignes = await chargerTout(() => sb.from("v_lignes_ecriture").select("id, compte, compte_libelle, classe, debit, credit, mois, journal_code")
      .eq("annee", annee).lte("mois", a).order("id"));
    const parCompte = new Map();
    for (const l of lignes) {
      if (!parCompte.has(l.compte)) parCompte.set(l.compte, { compte: l.compte, libelle: l.compte_libelle, classe: Number(l.classe), o: 0, d: 0, c: 0 });
      const c = parCompte.get(l.compte), dc = Number(l.debit) - Number(l.credit);
      if (l.journal_code === "AN" || l.mois < de) c.o += dc;
      else { c.d += Number(l.debit); c.c += Number(l.credit); }
    }
    comptes = [...parCompte.values()].sort((x, y) => x.compte < y.compte ? -1 : 1);
    dessiner();
  };
  ["b-annee", "b-de", "b-a"].forEach(id => $("#" + id).onchange = charger);
  ["b-classe", "b-soldes"].forEach(id => $("#" + id).onchange = dessiner);
  $("#b-export").onclick = () => exporterTableau(`balance_${$("#b-annee").value}.xlsx`,
    ["Compte", "Intitulé", "Ouverture débit", "Ouverture crédit", "Mouvements débit", "Mouvements crédit", "Clôture débit", "Clôture crédit"],
    visibles().map(c => [c.compte, c.libelle, ...colonnes(c).map(x => x || "")]), `Balance — ${$("#b-titre").textContent}`);
  await charger();
}

/* =====================================================================
   Reprise du classeur : ce qui a été importé, écarté, et ce qui reste à revoir.
   ===================================================================== */
const STATUTS_REPRISE = ["Importée, à revoir", "Revue", "Importée", "Ignorée", "Rejetée"];
const CLASSE_REPRISE = { "Importée, à revoir": "attente", Revue: "ok", "Importée": "", "Ignorée": "inactif", "Rejetée": "alerte" };
const raisonReprise = m => String(m || "").split(/ : |\. /)[0].replace(/^« |»$/g, "").trim();

async function pageReprise() {
  await chargerRefsFinance();
  const lignes = await chargerTout(() => sb.from("reprise_lignes").select("*").order("source").order("ligne"));
  const sources = [...new Set(lignes.map(l => l.source))];
  const r = etat.reprise = etat.reprise || { statut: "Importée, à revoir", source: "", raison: "" };
  const aRevoir = lignes.filter(l => l.statut === "Importée, à revoir");
  const raisons = [...aRevoir.reduce((m, l) => m.set(raisonReprise(l.motif), (m.get(raisonReprise(l.motif)) || 0) + 1), new Map())].sort((a, b) => b[1] - a[1]);
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Reprise du classeur</h1>
      <p class="discret">Les ${lignes.length} lignes de « Rapport Guest Markets.xlsx » et ce qu'elles sont devenues. Aucune n'a été effacée : chaque ligne écartée dit pourquoi,

/* Montant en toutes lettres, pour les factures (« Arrêtée la présente facture à la somme de… »). */
function enLettres(n) {
  n = Math.round(Math.abs(Number(n) || 0));
  if (n === 0) return "zéro";
  const u = ["", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize"];
  const d = ["", "dix", "vingt", "trente", "quarante", "cinquante", "soixante"];
  const dizaines = x => {
    if (x <= 16) return u[x];
    if (x < 20) return "dix-" + u[x - 10];
    const t = Math.floor(x / 10), r = x % 10;
    if (t === 7) return "soixante" + (x === 71 ? " et onze" : "-" + dizaines(x - 60));
    if (t === 8) return "quatre-vingt" + (r ? "-" + u[r] : "s");
    if (t === 9) return "quatre-vingt-" + dizaines(x - 80);
    return d[t] + (r === 1 ? " et un" : r ? "-" + u[r] : "");
  };
  const centaines = (x, invariable) => {
    const c = Math.floor(x / 100), r = x % 100;
    let s = c ? (c > 1 ? u[c] + " cent" + (r === 0 && !invariable ? "s" : "") : "cent") : "";
    if (r) s += (s ? " " : "") + (invariable && r === 80 ? "quatre-vingt" : dizaines(r));
    return s;
  };
  const parts = []; let reste = n;
  for (const [v, nom] of [[1e9, "milliard"], [1e6, "million"], [1e3, "mille"]]) {
    const q = Math.floor(reste / v); reste %= v;
    if (!q) continue;
    parts.push(nom === "mille" ? (q === 1 ? "mille" : centaines(q, true) + " mille") : centaines(q) + " " + nom + (q > 1 ? "s" : ""));
  }
  if (reste) parts.push(centaines(reste));
  return parts.join(" ");
}

    sb.from("v_operations").select("id, numero, date_operation, montant, compte_code, payeur, fournisseur, annulee").eq("document_vente_id", d.id).order("date_operation"),
    sb.from("v_documents_vente").select("id, numero, type, date_document, montant, statut").eq("facture_id", d.id).order("date_document"),
    sb.from("v_documents_vente").select("id, numero, type, date_document, montant, statut").eq("proforma_id", d.id),
    sb.from("relances").select("*").eq("document_id", d.id).order("date_relance", { ascending: false })]);

    if (d.type === "Proforma" && ["Envoyée"].includes(d.statut)) a.push(`<button type="button" class="btn" data-statut="Acceptée">Acceptée par le client</button>`,

      ${d.livraison ? `<dt>Livraison</dt><dd>${esc(d.livraison)}${d.date_livraison ? " le " + esc(dateCourte(d.date_livraison)) : ""}${d.adresse_livraison ? " · " + esc(d.adresse_livraison) : ""}</dd>` : ""}
      ${d.type === "Avoir" ? `<dt>Marchandise</dt><dd>${d.retour_stock ? "retournée en stock" : "non retournée (rabais)"}</dd>` : ""}
      ${d.reprise ? "" : `<dt>Saisi par</dt><dd>${esc(nomProfil(d.saisi_par))}${d.valide_par ? " · validé par " + esc(nomProfil(d.valide_par)) + " le " + esc(dateHeure(d.valide_le)) : ""}</dd>`}
    </dl>
    <div class="defil"><table><thead><tr><th>Désignation</th><th class="montant">Qté</th><th class="montant">Prix unitaire</th><th class="montant">Remise</th><th class="montant">Montant</th></tr></thead>
    <tbody>${lignes.map(l => { const p = produit(l.produit_id); return `<tr><td>${esc(l.designation)}${p ? `<div class="discret petit">${esc(p.reference)}${brouillon && d.type === "Facture" ? ` · en stock : ${qte(p.quantite)}${Number(l.quantite) > Math.max(0, Number(p.quantite)) ? ` · <b>à commander : ${qte(Number(l.quantite) - Math.max(0, Number(p.quantite)))}</b>` : ""}` : ""}</div>` : ""}</td>
      <td class="montant">${qte(l.quantite)}</td><td class="montant">${fcfa(l.prix_unitaire)}</td><td class="montant">${Number(l.remise) ? fcfa(l.remise) : ""}</td><td class="montant">${fcfa(l.montant)}</td></tr>`; }).join("")
      || `<tr><td colspan="5" class="vide">Aucune ligne.</td></tr>`}</tbody></table></div>
    ${encs.length ? `<h2 style="margin-top:1.25rem">Encaissements</h2><div class="defil"><table><tbody>${encs.map(o => `<tr class="${o.annulee ? "annulee" : ""}">
      <td class="code">${esc(o.numero)}</td><td>${esc(dateCourte(o.date_operation))}</td><td>${esc(libCompteOp(o))}${o.fournisseur ? " · " + esc(o.fournisseur) : ""}</td>
      <td class="montant">${fcfa(o.montant)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    ${lies.length ? `<h2 style="margin-top:1.25rem">Documents liés</h2><div class="defil"><table><tbody>${lies.map(x => `<tr><td>${esc(x.type)}</td>
      <td class="code">${esc(x.numero || "(brouillon)")}</td><td>${esc(dateCourte(x.date_document))}</td><td class="montant">${fcfa(x.montant)}</td>
      <td><span class="pastille ${CLASSE_DOC[x.statut]}">${esc(x.statut)}</span></td></tr>`).join("")}</tbody></table></div>` : ""}
    ${relances.length ? `<h2 style="margin-top:1.25rem">Relances</h2><div class="defil"><table><tbody>${relances.map(x => `<tr><td>${esc(dateCourte(x.date_relance))}</td>
      <td>${esc(x.moyen)}</td><td>${esc(x.commentaire || "")}${x.promesse_date ? `<div class="discret petit">Promesse : ${fcfa(x.promesse_montant)} le ${esc(dateCourte(x.promesse_date))}</div>` : ""}</td></tr>`).join("")}</tbody></table></div>` : ""}
    <div class="barre-actions">${a.join("")}</div>`, { large: true });
  const clic = (id, fn) => { if ($("#" + id)) $("#" + id).onclick = fn; };
  const fermerEt = (message) => { $("#modale").close(); toast(message); retour(); };
  clic("a-valider", async () => {
    try { const num = await appeler("valider_vente", { p_id: d.id }); fermerEt(`${d.type} ${num} ${d.type === "Avoir" ? "validé" : "validée"}.`); }
    catch (err) { toast(messageErreur(err), true); }
  });
  clic("a-facturer", async () => {
    try { const id = await appeler("facturer_proforma", { p_id: d.id }); $("#modale").close(); toast("Facture créée en brouillon : vérifiez-la puis validez-la.");
      const { data } = await sb.from("v_documents_vente").select("*").eq("id", id).maybeSingle(); retour(); if (data) setTimeout(() => ouvrirDocument(data, retour), 300); }
    catch (err) { toast(messageErreur(err), true); }
  });
  $$("[data-statut]").forEach(b => b.onclick = async () => {
    try { await appeler("changer_statut_proforma", { p_id: d.id, p_statut: b.dataset.statut }); fermerEt(`Proforma ${b.dataset.statut.toLowerCase()}.`); }
    catch (err) { toast(messageErreur(err), true); }
  });
  clic("a-modifier", () => formulaireDocument({ type: d.type, canal: d.canal, doc: d, lignes }, retour));
  clic("a-supprimer", async () => {
    if (!confirm("Supprimer ce brouillon ? La suppression sera tracée dans le journal.")) return;
    const { error } = await sb.from("documents_vente").delete().eq("id", d.id);
    if (error) return toast(messageErreur(error), true);
    fermerEt("Brouillon supprimé.");
  });
  clic("a-annuler", () => formulaireMotif(`Annuler ${d.numero}`, "La proforma reste visible, annulée.", "annuler_vente", { p_id: d.id }, "Annuler la proforma", "Proforma annulée.", retour));
  clic("a-encaisser", () => formulaireEncaissement(d, retour));
  clic("a-avoir", async () => {
    try {
      const id = await appeler("creer_avoir", { p_facture: d.id });
      const [{ data: av }, { data: ls }] = await Promise.all([sb.from("v_documents_vente").select("*").eq("id", id).maybeSingle(),
        sb.from("lignes_vente").select("*").eq("document_id", id).order("created_at")]);
      toast("Avoir créé en brouillon, avec les lignes de la facture : gardez seulement ce qui est retourné ou remisé.");
      formulaireDocument({ type: "Avoir", canal: d.canal, doc: av, lignes: ls || [] }, retour);
    } catch (err) { toast(messageErreur(err), true); }
  });
  clic("a-relancer", () => formulaireRelance(d, retour));
  clic("a-livraison", () => formulaireLivraison(d, retour));
  clic("a-imprimer", () => imprimerDocument(d, lignes, encs));
  clic("a-lettre", () => imprimerRelance(d));
}

/* Proforma, facture (E-Commerce ou B2B) ou avoir. Le client se tape : s'il n'existe pas, il est créé. */
function formulaireDocument({ type, canal, doc = null, lignes = [], comptant = false }, retour) {
  const x = doc || {};
  const stock = (etat.refs.stock || []).filter(p => p.actif !== false || lignes.some(l => l.produit_id === p.produit_id));
  const clients = (etat.refs.clients || []).filter(c => c.actif !== false);
  const clientActuel = (etat.refs.clients || []).find(c => c.id === x.client_id);
  const avoir = type === "Avoir";
  const optProduits = v => `<option value="">— Ligne libre (sans stock) —</option>` + stock.map(p =>
    `<option value="${p.produit_id}" ${p.produit_id === v ? "selected" : ""}>${esc(p.reference)} – ${esc(p.designation)} · stock ${qte(p.quantite)}</option>`).join("");
  const ligneHtml = l => `<tr>
    <td><select class="l-prod" aria-label="Produit" ${avoir ? "disabled" : ""}>${optProduits(l.produit_id)}</select></td>
    <td><input type="text" class="l-des" value="${esc(l.designation || "")}" aria-label="Désignation"></td>
    <td><input type="number" class="l-qte" min="0" step="any" value="${esc(l.quantite ?? 1)}" aria-label="Quantité" style="width:5rem"></td>
    <td><input type="number" class="l-pu" min="0" step="1" value="${esc(l.prix_unitaire ?? "")}" aria-label="Prix unitaire" style="width:7.5rem" ${avoir ? "" : ""}></td>
    <td><input type="number" class="l-rem" min="0" step="1" value="${esc(l.remise ?? 0)}" aria-label="Remise" style="width:6.5rem"></td>
    <td class="montant l-mont"></td><td><button type="button" class="btn-lien l-suppr">Retirer</button></td></tr>`;
  const comptes = (etat.refs.comptes_tresorerie || []).filter(c => c.actif !== false);
  const titre = avoir ? `Avoir sur ${x.facture_numero || ""}` : doc ? `Modifier ${type.toLowerCase()} ${x.numero || "(brouillon)"}`
    : type === "Proforma" ? "Nouvelle proforma B2B" : canal === "E-Commerce" ? "Nouvelle vente E-Commerce" : "Nouvelle facture B2B";
  ouvrirModale(titre, `
    <datalist id="dl-clients">${clients.filter(c => c.canal === canal || avoir).map(c => `<option value="${esc(c.nom)}">`).join("")}</datalist>
    <div class="grille2">
      <div><label for="dv-client">Client *</label><input type="text" id="dv-client" list="dl-clients" autocomplete="off" value="${esc(clientActuel ? clientActuel.nom : "")}" ${avoir ? "disabled" : ""}>
        <p class="aide-champ" id="dv-client-aide">${avoir ? "" : "Tapez le nom : un client inconnu sera créé."}</p></div>
      <div id="dv-tel-bloc" hidden><label for="dv-tel">Téléphone du nouveau client</label><input type="text" id="dv-tel"></div>
      <div><label for="dv-date">Date *</label><input type="date" id="dv-date" value="${esc(x.date_document || aujourdhui())}"></div>
      <div><label for="dv-ref">${canal === "E-Commerce" ? "N° de commande du site" : "Bon de commande du client"}</label><input type="text" id="dv-ref" value="${esc(x.reference_commande || "")}"></div>
      <div><label for="dv-objet">Objet</label><input type="text" id="dv-objet" value="${esc(x.objet || "")}"></div>
      ${type === "Proforma" ? `<div><label for="dv-validite">Valable jusqu'au</label><input type="date" id="dv-validite" value="${esc(x.date_validite || "")}"></div>` : ""}
      ${type === "Facture" && canal === "B2B" ? `<div><label for="dv-echeance">Échéance</label><input type="date" id="dv-echeance" value="${esc(x.date_echeance || "")}">
        <p class="aide-champ">Vide : date + délai de paiement du client.</p></div>` : ""}
      ${canal === "E-Commerce" && type === "Facture" ? `<div><label for="dv-adresse">Adresse de livraison</label><input type="text" id="dv-adresse" value="${esc(x.adresse_livraison || "")}"></div>` : ""}
      ${canal === "B2B" && !avoir ? `<div><label for="dv-conditions">Conditions (paiement, livraison, garantie)</label><input type="text" id="dv-conditions" value="${esc(x.conditions || "")}"></div>` : ""}
    </div>
    ${avoir ? `<label class="case"><input type="checkbox" id="dv-retour" ${x.retour_stock !== false ? "checked" : ""}> La marchandise est retournée et remise en stock (sinon : simple rabais)</label>` : ""}
    <h2 style="margin-top:1.25rem">Lignes</h2>
    <div class="defil"><table class="saisie"><thead><tr><th>Produit</th><th>Désignation</th><th>Qté</th><th>Prix unitaire</th><th>Remise</th><th class="montant">Montant</th><th></th></tr></thead>
    <tbody id="dv-lignes">${(lignes.length ? lignes : [{}]).map(ligneHtml).join("")}</tbody>
    <tfoot><tr><td colspan="5">${avoir ? "" : `<button type="button" class="btn" id="dv-ajout">Ajouter une ligne</button>`}</td><td class="montant" id="dv-total"></td><td></td></tr></tfoot></table></div>
    ${comptant ? `<fieldset style="border:1px solid var(--trait);border-radius:var(--rayon);padding:.5rem 1rem 1rem;margin-top:1rem">
      <legend><b>Encaissement</b></legend>
      <label class="case"><input type="checkbox" id="dv-comptant" checked> Valider la facture et enregistrer l'encaissement maintenant</label>
      <div class="grille2"><div><label for="dv-compte">Encaissé sur</label><select id="dv-compte"><option value="">—</option>${comptes.map(c =>
        `<option value="${c.id}" ${c.code === "OM" ? "selected" : ""}>${esc(c.code)} – ${esc(c.libelle)}</option>`).join("")}</select></div>
      <div><label for="dv-piece">Référence du paiement</label><input type="text" id="dv-piece" placeholder="N° de transaction…"></div></div></fieldset>` : ""}
    <label for="dv-obs">Observation</label><textarea id="dv-obs">${esc(x.observation || "")}</textarea>`, {
    large: true, libelleSave: comptant ? "Enregistrer" : "Enregistrer le brouillon",
    onSave: async () => {
      let clientId = x.client_id;
      if (!avoir) {
        const nom = $("#dv-client").value.trim();
        if (!nom) return "Indiquez le client.";
        const trouve = (etat.refs.clients || []).find(c => c.nom.toUpperCase() === nom.toUpperCase() || `${c.nom} (${c.code})`.toUpperCase() === nom.toUpperCase());
        if (trouve) clientId = trouve.id;
        else {
          const { data, error } = await sb.from("clients").insert({ nom, type: canal === "B2B" ? "Entreprise" : "Particulier", canal,
            telephone: $("#dv-tel").value.trim() || null }).select("id").single();
          if (error) return messageErreur(error);
          clientId = data.id; await chargerListe("clients");
        }
      }
      const v = id => { const el = $("#" + id); return el && el.value.trim() !== "" ? el.value.trim() : null; };
      const entete = { client_id: clientId, date_document: v("dv-date"), reference_commande: v("dv-ref"), objet: v("dv-objet"),
        observation: v("dv-obs") };
      if (!entete.date_document) return "Indiquez la date.";
      if ($("#dv-validite")) entete.date_validite = v("dv-validite");
      if ($("#dv-echeance")) entete.date_echeance = v("dv-echeance");
      if ($("#dv-adresse")) entete.adresse_livraison = v("dv-adresse");
      if ($("#dv-conditions")) entete.conditions = v("dv-conditions");
      if ($("#dv-retour")) entete.retour_stock = $("#dv-retour").checked;
      const ls = $$("#dv-lignes tr").map(tr => ({ produit_id: $(".l-prod", tr).value || null, designation: $(".l-des", tr).value.trim(),
        quantite: Number($(".l-qte", tr).value || 0), prix_unitaire: Number($(".l-pu", tr).value || 0), remise: Number($(".l-rem", tr).value || 0) }))
        .filter(l => l.produit_id || l.designation || l.prix_unitaire);
      if (!ls.length) return "Ajoutez au moins une ligne.";
      for (const [i, l] of ls.entries()) {
        if (!l.designation) l.designation = (stock.find(p => p.produit_id === l.produit_id) || {}).designation || "";
        if (!l.designation) return `Ligne ${i + 1} : indiquez la désignation.`;
        if (!(l.quantite > 0)) return `Ligne ${i + 1} : la quantité doit être positive.`;
        if (!(l.prix_unitaire >= 0) || !(l.remise >= 0)) return `Ligne ${i + 1} : prix ou remise invalide.`;
        if (l.remise > Math.round(l.quantite * l.prix_unitaire)) return `Ligne ${i + 1} : la remise dépasse le montant de la ligne.`;
      }
      if (comptant && $("#dv-comptant").checked && !$("#dv-compte").value) return "Choisissez le compte sur lequel la vente est encaissée.";
      let id = doc && doc.id;
      if (doc) {
        const { error } = await sb.from("documents_vente").update(entete).eq("id", doc.id);
        if (error) return messageErreur(error);
        const { error: e2 } = await sb.from("lignes_vente").delete().eq("document_id", doc.id);
        if (e2) return messageErreur(e2);
      } else {
        const { data, error } = await sb.from("documents_vente").insert({ ...entete, type, canal }).select("id").single();
        if (error) return messageErreur(error);
        id = data.id;
      }
      const { error: e3 } = await sb.from("lignes_vente").insert(ls.map(l => ({ ...l, document_id: id })));
      if (e3) return messageErreur(e3) + " L'en-tête est enregistré en brouillon : corrigez les lignes.";
      if (comptant && $("#dv-comptant").checked) {
        let num;
        try { num = await appeler("valider_vente", { p_id: id }); }
        catch (err) { setTimeout(() => toast("Facture enregistrée en brouillon, mais non validée : " + messageErreur(err), true), 0); retour(); return; }
        const total = ls.reduce((s, l) => s + Math.round(l.quantite * l.prix_unitaire) - l.remise, 0);
        const { error: e4 } = await sb.from("operations_tresorerie").insert({ type: "Encaissement client", compte_tresorerie_id: $("#dv-compte").value,
          document_vente_id: id, montant: total, libelle: `Encaissement ${num} — ${$("#dv-client").value.trim()}`, date_operation: entete.date_document,
          piece_justificative: v("dv-piece") });
        setTimeout(() => e4 ? toast(`Facture ${num} validée, mais l'encaissement a échoué : ${messageErreur(e4)}`, true) : toast(`Facture ${num} validée et encaissée.`), 0);
      } else toast(doc ? "Modifications enregistrées." : `${type} enregistrée en brouillon.`);
      retour();
    }
  });
  const calculer = () => {
    let total = 0;
    $$("#dv-lignes tr").forEach(tr => {
      const m = Math.round(Number($(".l-qte", tr).value || 0) * Number($(".l-pu", tr).value || 0)) - Number($(".l-rem", tr).value || 0);
      total += m; $(".l-mont", tr).textContent = fcfa(m);
    });
    $("#dv-total").textContent = fcfa(total);
  };
  const brancher = () => {
    $$("#dv-lignes tr").forEach(tr => {
      [".l-qte", ".l-pu", ".l-rem"].forEach(s => $(s, tr).oninput = calculer);
      $(".l-prod", tr).onchange = () => {
        const p = stock.find(p => p.produit_id === $(".l-prod", tr).value);
        if (p) { $(".l-des", tr).value = p.designation; if (!$(".l-pu", tr).value && p.prix_vente) $(".l-pu", tr).value = p.prix_vente; }
        calculer();
      };
      $(".l-suppr", tr).onclick = () => { if ($$("#dv-lignes tr").length > 1) { tr.remove(); calculer(); } };
    });
    calculer();
  };
  if ($("#dv-ajout")) $("#dv-ajout").onclick = () => { $("#dv-lignes").insertAdjacentHTML("beforeend", ligneHtml({})); brancher(); };
  if (!avoir) $("#dv-client").oninput = () => {
    const nom = $("#dv-client").value.trim().toUpperCase();
    const connu = !nom || (etat.refs.clients || []).some(c => c.nom.toUpperCase() === nom);
    $("#dv-tel-bloc").hidden = connu;
    $("#dv-client-aide").textContent = connu ? "Tapez le nom : un client inconnu sera créé." : "Nouveau client : il sera créé à l'enregistrement.";
  };
  brancher();
}

function formulaireEncaissement(d, retour) {
  const comptes = (etat.refs.comptes_tresorerie || []).filter(c => c.actif !== false);
  const special = peut(EXPLOITANT);
  ouvrirModale(`Encaisser ${d.numero}`, `<p>${esc(d.client)} — reste dû <b>${fcfa(d.reste)} FCFA</b></p>
    <div class="grille2">
      <div><label for="en-date">Date *</label><input type="date" id="en-date" value="${aujourdhui()}"></div>
      <div><label for="en-mode">Mode</label><select id="en-mode"><option value="Trésorerie">Encaissement sur un compte</option>
        ${special ? `<option value="Guest Cameroun">Imputé sur le compte de l'exploitant (Guest Cameroun)</option>
        <option value="CEO">Imputé sur le compte de l'exploitant (CEO)</option>
        <option value="Compensation fournisseur">Compensé avec une dette fournisseur</option>` : ""}</select></div>
      <div id="en-compte-bloc"><label for="en-compte">Compte *</label><select id="en-compte"><option value="">—</option>${comptes.map(c =>
        `<option value="${c.id}">${esc(c.code)} – ${esc(c.libelle)}</option>`).join("")}</select></div>
      <div id="en-four-bloc" hidden><label for="en-four">Fournisseur *</label><select id="en-four">${optionsRef("fournisseurs", null)}</select></div>
      <div><label for="en-montant">Montant (FCFA) *</label><input type="number" id="en-montant" min="1" step="1" value="${Number(d.reste)}"></div>
      <div><label for="en-piece">Référence du paiement</label><input type="text" id="en-piece" placeholder="N° de transaction, de chèque…"></div>
    </div>
    <p class="discret petit" id="en-aide"></p>`, {
    libelleSave: "Enregistrer l'encaissement",
    onSave: async () => {
      const mode = $("#en-mode").value;
      const o = { type: "Encaissement client", payeur: mode, document_vente_id: d.id, date_operation: $("#en-date").value || null,
        compte_tresorerie_id: mode === "Trésorerie" ? $("#en-compte").value || null : null,
        fournisseur_id: mode === "Compensation fournisseur" ? $("#en-four").value || null : null,
        montant: Number($("#en-montant").value || 0), libelle: `Encaissement ${d.numero} — ${d.client}`, piece_justificative: $("#en-piece").value.trim() || null };
      if (!o.date_operation) return "Indiquez la date.";
      if (mode === "Trésorerie" && !o.compte_tresorerie_id) return "Choisissez le compte.";
      if (mode === "Compensation fournisseur" && !o.fournisseur_id) return "Choisissez le fournisseur dont la dette est compensée.";
      if (!(o.montant > 0) || !Number.isInteger(o.montant)) return "Le montant doit être un nombre entier positif.";
      if (o.montant > Number(d.reste)) return `L'encaissement dépasse le reste dû (${fcfa(d.reste)} FCFA).`;
      const { data, error } = await sb.from("operations_tresorerie").insert(o).select("numero").single();
      if (error) return messageErreur(error);
      toast(`Encaissement ${data && data.numero ? data.numero + " " : ""}enregistré.`); retour();
    }
  });
  const maj = () => {
    const m = $("#en-mode").value;
    $("#en-compte-bloc").hidden = m !== "Trésorerie"; $("#en-four-bloc").hidden = m !== "Compensation fournisseur";
    $("#en-aide").textContent = m === "Compensation fournisseur" ? "La créance du client s'éteint contre ce que l'entreprise doit au fournisseur (écriture 401 / 411)."
      : ["CEO", "Guest Cameroun"].includes(m) ? "La créance s'impute sur ce que l'entreprise doit à l'exploitant (écriture 1041 / 411), comme la cession à Guest Cameroun." : "";
  };
  $("#en-mode").onchange = maj; maj();
}

function formulaireRelance(d, retour) {
  ouvrirModale(`Relance — ${d.numero}`, `<p>${esc(d.client)} — reste dû <b>${fcfa(d.reste)} FCFA</b>${Number(d.jours_retard) > 0 ? `, ${d.jours_retard} jour(s) de retard` : ""}</p>
    <div class="grille2">
      <div><label for="rl-date">Date *</label><input type="date" id="rl-date" value="${aujourdhui()}"></div>
      <div><label for="rl-moyen">Moyen *</label><select id="rl-moyen">${["Appel", "SMS / WhatsApp", "E-mail", "Courrier", "Visite"].map(m => `<option>${m}</option>`).join("")}</select></div>
      <div><label for="rl-pdate">Promesse de paiement le</label><input type="date" id="rl-pdate"></div>
      <div><label for="rl-pmont">Montant promis (FCFA)</label><input type="number" id="rl-pmont" min="0" step="1"></div>
      <div><label for="rl-proch">Prochaine relance</label><input type="date" id="rl-proch"></div>
    </div>
    <label for="rl-com">Compte rendu</label><textarea id="rl-com"></textarea>`, {
    libelleSave: "Enregistrer la relance",
    onSave: async () => {
      const v = id => $("#" + id).value.trim() || null;
      const r = { document_id: d.id, client_id: d.client_id, date_relance: v("rl-date"), moyen: v("rl-moyen"), commentaire: v("rl-com"),

/* =====================================================================
   Créances clients : balance âgée, factures ouvertes, relances.
   ===================================================================== */
const TRANCHES = [{ l: "Non échu", f: j => j <= 0 }, { l: "1 à 30 j", f: j => j >= 1 && j <= 30 }, { l: "31 à 60 j", f: j => j > 30 && j <= 60 },
  { l: "61 à 90 j", f: j => j > 60 && j <= 90 }, { l: "Plus de 90 j", f: j => j > 90 }];

async function pageCreances() {
  await chargerRefsVentes();
  const [docs, { data: relances }] = await Promise.all([
    chargerTout(() => sb.from("v_documents_vente").select("*").eq("type", "Facture").eq("statut", "Validée").gt("reste", 0).order("date_echeance")),
    sb.from("relances").select("*").order("date_relance", { ascending: false })]);
  const derniere = id => (relances || []).find(r => r.document_id === id);
  const parClient = new Map();
  for (const d of docs) {
    if (!parClient.has(d.client_id)) parClient.set(d.client_id, { client: d.client, code: d.client_code, tel: d.client_telephone, t: TRANCHES.map(() => 0), total: 0 });
    const c = parClient.get(d.client_id), i = TRANCHES.findIndex(t => t.f(Number(d.jours_retard)));
    c.t[i] += Number(d.reste); c.total += Number(d.reste);
  }
  const clients = [...parClient.values()].sort((a, b) => b.total - a.total);
  const tot = TRANCHES.map((_, i) => clients.reduce((s, c) => s + c.t[i], 0)), total = tot.reduce((s, v) => s + v, 0);
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Créances clients</h1>
      <p class="discret">Ce que les clients doivent encore, par ancienneté du retard. Chaque relance est notée sur la facture ; la lettre de relance s'imprime sur le papier à en-tête.</p></div>
      <div class="actions-ligne"><button class="btn" id="b-export">Exporter</button></div></div>
    <div class="chiffres"><a><b>${fcfa(total)}</b><span>Total à encaisser</span></a>
      <a><b class="${total - tot[0] > 0 ? "negatif" : ""}">${fcfa(total - tot[0])}</b><span>dont échu</span></a>
      <a><b>${docs.length}</b><span>facture(s) ouverte(s)</span></a><a><b>${clients.length}</b><span>client(s)</span></a></div>
    <h2>Balance âgée</h2>
    <div class="panneau defil"><table><thead><tr><th>Client</th>${TRANCHES.map(t => `<th class="montant">${t.l}</th>`).join("")}<th class="montant">Total</th></tr></thead>
    <tbody>${clients.map(c => `<tr><td>${esc(c.client)} <span class="discret petit">${esc(c.code)}${c.tel ? " · " + esc(c.tel) : ""}</span></td>
      ${c.t.map((v, i) => `<td class="montant ${i > 0 && v ? "negatif" : ""}">${v ? fcfa(v) : ""}</td>`).join("")}<td class="montant"><b>${fcfa(c.total)}</b></td></tr>`).join("")
      || `<tr><td colspan="${TRANCHES.length + 2}" class="vide">Aucune créance : toutes les factures sont réglées.</td></tr>`}</tbody>
    <tfoot><tr><td>Total</td>${tot.map(v => `<td class="montant">${fcfa(v)}</td>`).join("")}<td class="montant">${fcfa(total)}</td></tr></tfoot></table></div>
    <h2 class="titre-section">Factures ouvertes</h2>
    <div class="panneau defil"><table><thead><tr><th>N°</th><th>Date</th><th>Client</th><th>Échéance</th><th class="montant">Retard</th><th class="montant">Montant</th>
      <th class="montant">Reste</th><th>Dernière relance</th><th></th></tr></thead>
    <tbody>${docs.map(d => { const r = derniere(d.id); return `<tr><td class="code">${esc(d.numero)}</td><td class="code">${esc(dateCourte(d.date_document))}</td>
      <td>${esc(d.client)}</td><td class="code">${esc(dateCourte(d.date_echeance))}</td>
      <td class="montant ${Number(d.jours_retard) > 0 ? "negatif" : ""}">${Number(d.jours_retard) > 0 ? d.jours_retard + " j" : ""}</td>
      <td class="montant">${fcfa(d.montant)}</td><td class="montant"><b>${fcfa(d.reste)}</b></td>
      <td class="petit">${r ? `${esc(dateCourte(r.date_relance))} · ${esc(r.moyen)}${r.prochaine_relance ? `<div class="discret">prochaine : ${esc(dateCourte(r.prochaine_relance))}</div>` : ""}` : `<span class="discret">aucune</span>`}</td>
      <td><button class="btn" data-doc="${d.id}">Ouvrir</button></td></tr>`; }).join("") || `<tr><td colspan="9" class="vide">Aucune facture ouverte.</td></tr>`}</tbody></table></div>`;
  $$("[data-doc]").forEach(b => b.onclick = () => ouvrirDocument(docs.find(d => d.id === b.dataset.doc), recharger));
  $("#b-export").onclick = () => exporterTableau("creances_clients.xlsx", ["Client", "Code", ...TRANCHES.map(t => t.l), "Total"],
    clients.map(c => [c.client, c.code, ...c.t, c.total]), "Balance âgée des créances clients");
}

/* =====================================================================
   Stock : état au CMP, fiche par produit, marges.

async function pageStock() {
  const { data: stock, error } = await sb.from("v_stock").select("*").order("designation");
  if (error) throw error;
  await chargerListe("categories_produit");
  const voitMarges = peut(FINANCE);
  let onglet = etat.param.onglet || etat.ongletStock || "etat";
  const produit0 = etat.param.produit || etat.produitStock || "";
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Stock</h1>
      <p class="discret">Quantités et valeur au coût moyen pondéré : chaque achat validé entre en stock et recalcule le coût moyen ; chaque facture validée
      sort la marchandise à ce coût ; un avoir avec retour la remet en stock.</p></div>
      <div class="actions-ligne">${peut(CORRECTION) ? `<button class="btn" id="b-ajuster">Ajustement d'inventaire</button>` : ""}<button class="btn" id="b-export">Exporter</button></div></div>
    <div class="panneau">
      <div class="onglets" role="tablist">
        <button role="tab" data-onglet="etat" aria-selected="${onglet === "etat"}">État du stock</button>
        <button role="tab" data-onglet="fiche" aria-selected="${onglet === "fiche"}">Fiche de stock</button>
        ${voitMarges ? `<button role="tab" data-onglet="marges" aria-selected="${onglet === "marges"}">Marges</button>` : ""}</div>
      <div id="zone"></div></div>`;
  const zone = $("#zone");
  let exporter = () => {};

  const etatStock = () => {
    zone.innerHTML = `<div class="outils"><select id="s-cat" aria-label="Catégorie"><option value="">Toutes les catégories</option>${(etat.refs.categories_produit || []).map(c =>
      `<option value="${c.id}">${esc(c.libelle)}</option>`).join("")}</select>
      <select id="s-filtre" aria-label="Filtre"><option value="stock">En stock</option><option value="alerte">Sous le seuil d'alerte</option><option value="rupture">En rupture</option><option value="acheter">Vendu, à acheter</option><option value="">Tous les produits</option></select>
      <input type="text" id="filtre" placeholder="Référence, désignation…" aria-label="Rechercher"><span class="discret num" id="nb"></span></div>
      <div class="defil"><table><thead><tr><th>Référence</th><th>Désignation</th><th>Catégorie</th><th class="montant">Quantité</th><th class="montant">CMP</th>
        <th class="montant">Valeur</th><th class="montant">Prix de vente</th><th class="montant">Marge</th><th>Dernier mouvement</th><th></th></tr></thead>
      <tbody id="corps"></tbody><tfoot id="pied"></tfoot></table></div>`;
    const visibles = () => {
      const c = $("#s-cat").value, f = $("#s-filtre").value, q = $("#filtre").value.toLowerCase();
      return stock.filter(p => (!c || p.categorie_id === c) && (!q || [p.reference, p.designation].join(" ").toLowerCase().includes(q))
        && (f === "stock" ? Number(p.quantite) > 0 : f === "alerte" ? Number(p.seuil_alerte) > 0 && Number(p.quantite) <= Number(p.seuil_alerte)
          : f === "rupture" ? Number(p.quantite) <= 0 && Number(p.nb_mouvements) > 0 : f === "acheter" ? Number(p.quantite) < 0 : true));
    };
    const dessiner = () => {
      const l = visibles();
      $("#nb").textContent = `${l.length} produit(s)`;
      $("#corps").innerHTML = l.map(p => {
        const marge = Number(p.prix_vente) && Number(p.cmp) ? (Number(p.prix_vente) - Number(p.cmp)) / Number(p.prix_vente) * 100 : null;
        const alerte = Number(p.quantite) < 0 ? `<span class="pastille attente" title="Vendu sans stock : à acheter auprès du fournisseur">À acheter</span>` : Number(p.quantite) <= 0 ? `<span class="pastille alerte">Rupture</span>` : Number(p.seuil_alerte) > 0 && Number(p.quantite) <= Number(p.seuil_alerte) ? `<span class="pastille attente">Seuil</span>` : "";
        return `<tr><td class="code">${esc(p.reference)}</td><td>${esc(p.designation)} ${alerte}</td><td>${esc(p.categorie || "")}</td>
          <td class="montant ${Number(p.quantite) < 0 ? "negatif" : ""}">${qte(p.quantite)}</td><td class="montant">${fcfa(p.cmp)}</td><td class="montant">${fcfa(p.valeur)}</td>
          <td class="montant">${p.prix_vente ? fcfa(p.prix_vente) : `<span class="discret">—</span>`}</td>
          <td class="montant ${marge !== null && marge < 0 ? "negatif" : ""}">${marge === null ? "" : marge.toFixed(1) + " %"}</td>
          <td class="code">${esc(dateCourte(p.dernier_mouvement))}</td><td><button class="btn-lien" data-fiche="${p.produit_id}">Fiche</button></td></tr>`;
      }).join("") || `<tr><td colspan="10" class="vide">Aucun produit.</td></tr>`;
      $("#pied").innerHTML = `<tr><td colspan="3">Total</td><td class="montant">${qte(l.reduce((s, p) => s + Number(p.quantite), 0))}</td><td></td>
        <td class="montant">${fcfa(l.reduce((s, p) => s + Number(p.valeur), 0))}</td><td colspan="4"></td></tr>`;
      $$("[data-fiche]").forEach(b => b.onclick = () => { etat.produitStock = b.dataset.fiche; basculer("fiche"); });
    };
    ["s-cat", "s-filtre"].forEach(id => $("#" + id).onchange = dessiner); $("#filtre").oninput = dessiner;
    exporter = () => exporterTableau("etat_du_stock.xlsx", ["Référence", "Désignation", "Catégorie", "Quantité", "CMP", "Valeur", "Prix de vente", "Seuil d'alerte"],
      visibles().map(p => [p.reference, p.designation, p.categorie, p.quantite, p.cmp, p.valeur, p.prix_vente || "", p.seuil_alerte || ""]), "État du stock au CMP");
    dessiner();
  };

  const fiche = async () => {
    const pid = etat.produitStock || produit0 || "";
    zone.innerHTML = `<div class="outils"><select id="s-prod" aria-label="Produit" style="min-width:20rem"><option value="">Choisir un produit…</option>${stock.map(p =>
      `<option value="${p.produit_id}" ${p.produit_id === pid ? "selected" : ""}>${esc(p.reference)} – ${esc(p.designation)}</option>`).join("")}</select>
      <span class="discret num pousse" id="nb"></span></div>
      <div class="defil"><table><thead><tr><th>Date</th><th>Mouvement</th><th>Pièce</th><th>Tiers</th><th class="montant">Entrée</th><th class="montant">Sortie</th>
        <th class="montant">Coût unitaire</th><th class="montant">Stock</th><th class="montant">CMP</th><th class="montant">Valeur</th></tr></thead><tbody id="corps"></tbody></table></div>`;
    let mvts = [];
    const charger = async () => {
      const id = $("#s-prod").value; etat.produitStock = id;
      if (!id) { $("#corps").innerHTML = `<tr><td colspan="10" class="vide">Choisissez un produit.</td></tr>`; return; }
      mvts = await chargerTout(() => sb.from("v_mouvements_stock").select("*").eq("produit_id", id).order("date_mouvement").order("id"));
      $("#nb").textContent = `${mvts.length} mouvement(s)`;
      $("#corps").innerHTML = mvts.map(m => `<tr><td class="code">${esc(dateCourte(m.date_mouvement))}</td><td>${esc(m.type)}${m.motif ? `<div class="discret petit">${esc(m.motif)}</div>` : ""}</td>
        <td class="code">${esc(m.piece || "")}</td><td>${esc(m.tiers || "")}</td>
        <td class="montant">${Number(m.quantite) > 0 ? qte(m.quantite) : ""}</td><td class="montant">${Number(m.quantite) < 0 ? qte(-m.quantite) : ""}</td>
        <td class="montant">${fcfa(m.cout_unitaire)}</td><td class="montant ${Number(m.qte_apres) < 0 ? "negatif" : ""}">${qte(m.qte_apres)}</td>
        <td class="montant">${fcfa(m.cmp_apres)}</td><td class="montant">${fcfa(m.valeur_apres)}</td></tr>`).join("")
        || `<tr><td colspan="10" class="vide">Aucun mouvement pour ce produit.</td></tr>`;
    };
    $("#s-prod").onchange = charger;
    exporter = () => exporterTableau("fiche_de_stock.xlsx", ["Date", "Mouvement", "Pièce", "Tiers", "Quantité", "Coût unitaire", "Stock après", "CMP après", "Valeur après"],
      mvts.map(m => [dateCourte(m.date_mouvement), m.type, m.piece, m.tiers, m.quantite, m.cout_unitaire, m.qte_apres, m.cmp_apres, m.valeur_apres]),
      `Fiche de stock — ${$("#s-prod").selectedOptions[0] ? $("#s-prod").selectedOptions[0].text : ""}`);
    await charger();
  };

  const marges = async () => {
    const m = etat.marges = etat.marges || { axe: "produit" };
    zone.innerHTML = `<div class="outils">${champsPeriode()}<label class="discret" style="margin:0" for="m-axe">par</label>
      <select id="m-axe">${[["produit", "Produit"], ["categorie", "Catégorie"], ["mois", "Mois"], ["client", "Client"], ["canal", "Canal"]].map(([k, l]) =>
        `<option value="${k}" ${k === m.axe ? "selected" : ""}>${l}</option>`).join("")}</select>
      <label class="case" style="margin:0"><input type="checkbox" id="m-perte"> Ventes à perte seulement</label><span class="discret num pousse" id="nb"></span></div>
      <div class="defil"><table><thead><tr><th id="m-titre">Produit</th><th class="montant">Quantité</th><th class="montant">Chiffre d'affaires</th><th class="montant">Coût d'achat</th>
        <th class="montant">Marge</th><th class="montant">Taux</th></tr></thead><tbody id="corps"></tbody><tfoot id="pied"></tfoot></table></div>`;
    let lignes = [], rangs = [];
    const cle = { produit: r => r.produit || r.reference || "Ligne libre", categorie: r => r.categorie || "Sans catégorie", mois: r => MOIS[r.mois - 1],
      client: r => r.client, canal: r => r.canal };
    const dessiner = () => {
      const perte = $("#m-perte").checked, g = new Map();
      for (const r of lignes.filter(r => !perte || Number(r.marge) < 0)) {
        const k = perte ? `${r.numero} — ${r.produit || r.reference || ""}` : cle[m.axe](r);
        if (!g.has(k)) g.set(k, { k, q: 0, ca: 0, cout: 0, marge: 0, mois: r.mois });
        const x = g.get(k); x.q += Number(r.quantite); x.ca += Number(r.chiffre_affaires); x.cout += Number(r.cout); x.marge += Number(r.marge);
      }
      rangs = [...g.values()].sort((a, b) => m.axe === "mois" && !perte ? a.mois - b.mois : b.ca - a.ca);
      $("#m-titre").textContent = perte ? "Vente" : { produit: "Produit", categorie: "Catégorie", mois: "Mois", client: "Client", canal: "Canal" }[m.axe];
      $("#nb").textContent = `${rangs.length} ligne(s)`;
      const taux = x => x.ca ? (x.marge / x.ca * 100).toFixed(1) + " %" : "";
      $("#corps").innerHTML = rangs.map(x => `<tr><td>${esc(x.k)}</td><td class="montant">${qte(x.q)}</td><td class="montant">${fcfa(x.ca)}</td>
        <td class="montant">${fcfa(x.cout)}</td><td class="montant ${x.marge < 0 ? "negatif" : ""}">${fcfa(x.marge)}</td><td class="montant">${taux(x)}</td></tr>`).join("")
        || `<tr><td colspan="6" class="vide">Aucune vente sur la période.</td></tr>`;
      const t = rangs.reduce((s, x) => ({ q: s.q + x.q, ca: s.ca + x.ca, cout: s.cout + x.cout, marge: s.marge + x.marge }), { q: 0, ca: 0, cout: 0, marge: 0 });
      $("#pied").innerHTML = `<tr><td>Total</td><td class="montant">${qte(t.q)}</td><td class="montant">${fcfa(t.ca)}</td><td class="montant">${fcfa(t.cout)}</td>
        <td class="montant">${fcfa(t.marge)}</td><td class="montant">${taux(t)}</td></tr>`;
    };
    const charger = async () => {
      const { annee, mois } = etat.filtres;
      lignes = await chargerTout(() => { let q = sb.from("v_marges").select("*").eq("annee", annee); if (mois) q = q.eq("mois", mois); return q.order("date_document"); });
      dessiner();
    };
    brancherPeriode(charger);
    $("#m-axe").onchange = () => { m.axe = $("#m-axe").value; dessiner(); };
    $("#m-perte").onchange = dessiner;
    exporter = () => exporterTableau("marges.xlsx", [$("#m-titre").textContent, "Quantité", "Chiffre d'affaires", "Coût d'achat", "Marge"],
      rangs.map(x => [x.k, x.q, Math.round(x.ca), Math.round(x.cout), Math.round(x.marge)]), `Marges — ${libPeriode()}`);
    await charger();
  };

  const basculer = async k => {
    onglet = etat.ongletStock = k;
    $$("[data-onglet]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.onglet === k)));
    await (k === "fiche" ? fiche() : k === "marges" && voitMarges ? marges() : etatStock());
  };
  $$("[data-onglet]").forEach(b => b.onclick = () => basculer(b.dataset.onglet));
  $("#b-export").onclick = () => exporter();
  if ($("#b-ajuster")) $("#b-ajuster").onclick = () => formulaireAjustement(stock, etat.produitStock);
  await basculer(onglet);
}

function formulaireAjustement(stock, produitId) {
  ouvrirModale("Ajustement d'inventaire", `<p class="discret petit">Indiquez la quantité réellement comptée. L'écart avec le stock théorique est passé
    au coût moyen du moment et reste tracé dans la fiche du produit.</p>
    <label for="aj-prod">Produit *</label><select id="aj-prod"><option value="">—</option>${stock.map(p =>
      `<option value="${p.produit_id}" ${p.produit_id === produitId ? "selected" : ""}>${esc(p.reference)} – ${esc(p.designation)} (théorique : ${qte(p.quantite)})</option>`).join("")}</select>
    <div class="grille2"><div><label for="aj-date">Date de l'inventaire *</label><input type="date" id="aj-date" value="${aujourdhui()}"></div>
      <div><label for="aj-qte">Quantité comptée *</label><input type="number" id="aj-qte" min="0" step="any"></div></div>
    <label for="aj-motif">Motif *</label><input type="text" id="aj-motif" placeholder="Inventaire du…, casse, vol…">`, {
    libelleSave: "Enregistrer l'ajustement",
    onSave: async () => {
      const p = $("#aj-prod").value, q = $("#aj-qte").value;
      if (!p || q === "") return "Choisissez le produit et indiquez la quantité comptée.";
      try { await appeler("ajuster_stock", { p_produit: p, p_quantite_comptee: Number(q), p_date: $("#aj-date").value, p_motif: $("#aj-motif").value.trim() }); }
      catch (err) { return messageErreur(err); }
      toast("Ajustement enregistré."); etat.produitStock = p; etat.param = { onglet: "fiche", produit: p }; recharger();
    }
  });
}

/* =====================================================================
   PAIE (lot 4)
   La RH saisit les éléments du mois et calcule ; le DAF valide (jamais la
   paie qu'il a calculée lui-même) — l'écriture de paie est alors passée ;
   le trésorier paie les nets. Le calcul est dans la base : l'écran ne fait
   qu'afficher, saisir et appeler.
   ===================================================================== */
const PAIE_PREPARE = ["rh", "daf", "admin"];
const PAIE_LECTURE = ["rh", "daf", "admin", "auditeur", "dg"];
const CLASSE_PAIE = { Ouverte: "inactif", "Calculée": "attente", "Validée": "ok" };
const nomSalarie = s => [s.nom, s.prenom].filter(Boolean).join(" ");

async function pagePaie() {
  const f = etat.filtres;
  if (!f.moisPaie) f.moisPaie = new Date().getMonth() + 1;
  let onglet = etat.param.onglet || etat.ongletPaie || "bulletins";
  const annee = Number(f.annee), mois = Number(f.moisPaie);
  const [{ data: periode }, { data: salaries, error }, { data: rubriques }] = await Promise.all([
    sb.from("periodes_paie").select("*").eq("annee", annee).eq("mois", mois).maybeSingle(),
    sb.from("salaries").select("id, matricule, nom, prenom, salaire_base, net_cible, type_contrat, emploi, actif, date_embauche, date_sortie, mode_paiement, numero_mobile_money, rib, banque, paye_par").order("matricule"),
    sb.from("rubriques_paie").select("*").order("ordre")]);
  if (error) throw error;
  await Promise.all(["profils_noms", "comptes_tresorerie"].map(chargerListe));
  etat.payeurs = Object.fromEntries((salaries || []).map(s => [s.id, s.paye_par || "Entreprise"]));
  const payeur = b => (etat.payeurs || {})[b.salarie_id] || "Entreprise";
  const statut = periode ? periode.statut : "Ouverte";
  const actions = [
    peut(PAIE_PREPARE) && statut !== "Validée" ? `<button class="btn btn-principal" id="b-calculer">${statut === "Calculée" ? "Recalculer" : "Calculer la paie"}</button>` : "",
    peut(VALIDATION) && statut === "Calculée" ? `<button class="btn btn-principal" id="b-valider">Valider la paie</button>` : "",
    peut(VALIDATION) && statut === "Validée" ? `<button class="btn" id="b-rouvrir">Rouvrir</button>` : "",
    statut !== "Ouverte" ? `<button class="btn" id="b-tous">Imprimer les bulletins</button>` : ""].join("");
  const annees = []; for (let a = 2026; a <= Math.max(2026, new Date().getFullYear()) + 1; a++) annees.push(a);
  const onglets = [["bulletins", "Bulletins"], ["variables", "Éléments du mois", PAIE_PREPARE.concat("auditeur", "dg")], ["remunerations", "Rémunérations", PAIE_LECTURE],
    ["stagiaires", "Stagiaires", PAIE_LECTURE.concat("comptable", "tresorier")], ["declarations", "Déclarations", PAIE_LECTURE], ["parametres", "Paramètres et barèmes", PAIE_LECTURE]].filter(o => !o[2] || peut(o[2]));
  if (!onglets.some(o => o[0] === onglet)) onglet = "bulletins";
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Paie</h1>
      <p class="discret">La RH saisit les éléments du mois et calcule ; le DAF valide — jamais la paie qu'il a calculée lui-même — et l'écriture de paie est passée ;
      le trésorier paie les nets. IRPP, CNPS, crédit foncier, redevance audiovisuelle et taxe communale sont calculés au barème, jamais saisis.</p></div>
      <div class="actions-ligne">${actions}</div></div>
    <div class="outils" style="padding:0 0 1rem">
      <select id="pa-annee" aria-label="Année">${annees.map(a => `<option ${a === annee ? "selected" : ""}>${a}</option>`).join("")}</select>
      <select id="pa-mois" aria-label="Mois">${MOIS.map((m, i) => `<option value="${i + 1}" ${i + 1 === mois ? "selected" : ""}>${m}</option>`).join("")}</select>
      <span class="pastille ${CLASSE_PAIE[statut]}">${esc(statut === "Ouverte" ? "Non calculée" : statut)}</span>
      ${periode && periode.calcule_le ? `<span class="discret petit">calculée le ${esc(dateHeure(periode.calcule_le))} par ${esc(nomProfil(periode.calcule_par))}</span>` : ""}
      ${periode && periode.valide_le ? `<span class="discret petit">· validée le ${esc(dateHeure(periode.valide_le))} par ${esc(nomProfil(periode.valide_par))}</span>` : ""}</div>
    ${periode && periode.observation ? `<div class="info" style="white-space:pre-line">${esc(periode.observation)}</div>` : ""}
    <div class="panneau"><div class="onglets" role="tablist">${onglets.map(([k, l]) => `<button role="tab" data-onglet="${k}" aria-selected="${k === onglet}">${esc(l)}</button>`).join("")}</div>
      <div id="zone"></div></div>`;
  $("#pa-annee").onchange = () => { f.annee = Number($("#pa-annee").value); recharger(); };
  $("#pa-mois").onchange = () => { f.moisPaie = Number($("#pa-mois").value); recharger(); };
  const clic = (id, fn) => { if ($("#" + id)) $("#" + id).onclick = fn; };
  clic("b-calculer", async () => {
    const b = $("#b-calculer"); b.disabled = true;
    try { const r = await appeler("calculer_paie", { p_annee: annee, p_mois: mois }); toast(`Paie calculée : ${r}.`); recharger(); }
    catch (err) { toast(messageErreur(err), true); b.disabled = false; }
  });
  clic("b-valider", async () => {
    if (!confirm(`Valider la paie de ${MOIS[mois - 1].toLowerCase()} ${annee} ? L'écriture de paie sera passée et les bulletins ne se modifieront plus.`)) return;
    try { await appeler("valider_paie", { p_annee: annee, p_mois: mois }); toast("Paie validée : l'écriture est passée, les nets peuvent être payés."); recharger(); }
    catch (err) { toast(messageErreur(err), true); }
  });
  clic("b-rouvrir", () => formulaireMotif(`Rouvrir la paie de ${MOIS[mois - 1].toLowerCase()} ${annee}`,
    "L'écriture de paie est extournée ; la paie redevient modifiable. Impossible si des salaires ont déjà été payés.",
    "rouvrir_paie", { p_annee: annee, p_mois: mois }, "Rouvrir", "Paie rouverte.", recharger));
  const zone = $("#zone");
  let bulletins = [];
  const chargerBulletins = async () => {
    if (!periode) return [];
    bulletins = await chargerTout(() => sb.from("v_bulletins").select("*").eq("periode_id", periode.id).order("matricule"));
    return bulletins;
  };
  clic("b-tous", async () => { await chargerBulletins(); imprimerBulletins(bulletins); });

  const ongletBulletins = async () => {
    await chargerBulletins();
    const payer = peut(PAIEMENT) && statut === "Validée";
    zone.innerHTML = !periode || statut === "Ouverte" ? `<div class="vide">La paie de ${esc(MOIS[mois - 1].toLowerCase())} ${annee} n'est pas encore calculée.
        ${peut(PAIE_PREPARE) ? "Saisissez les éléments du mois (heures supplémentaires, primes, absences, avances), puis calculez." : ""}</div>`
      : `<div class="outils"><span class="discret num" id="nb">${bulletins.length} bulletin(s)</span>
          ${payer && bulletins.some(b => Number(b.reste_a_payer) > 0) ? `<button class="btn btn-principal" id="b-payer-tout">Payer tous les nets restants</button>` : ""}
          <button class="btn pousse" id="b-livre">Livre de paie</button><button class="btn" id="b-livre-xls">Livre de paie (Excel)</button>
          <button class="btn" id="b-vir">État des virements</button><button class="btn" id="b-vir-xls">Virements (Excel)</button>
          ${peut(["rh", "daf", "admin", "tresorier"]) ? `<button class="btn btn-principal" id="b-ov">Ordres de virement</button>` : ""}</div>
        <div class="defil"><table><thead><tr><th>Matricule</th><th>Salarié</th><th class="montant">Jours</th><th class="montant">Brut</th><th class="montant">Retenues</th>
          <th class="montant">Net à payer</th><th class="montant">Charges patronales</th><th class="montant">Payé</th><th class="montant">Reste</th><th></th></tr></thead>
        <tbody>${bulletins.map(b => `<tr><td class="code">${esc(b.matricule)}</td><td>${esc(nomSalarie(b))}<div class="discret petit">${esc(b.emploi || "")}</div></td>
          <td class="montant">${qte(b.jours_payes)}</td><td class="montant">${fcfa(b.brut)}</td><td class="montant">${fcfa(b.total_retenues)}</td>
          <td class="montant"><b>${fcfa(b.net_a_payer)}</b></td><td class="montant">${fcfa(b.total_patronal)}</td>
          <td class="montant">${Number(b.paye) ? fcfa(b.paye) : ""}</td><td class="montant">${statut === "Validée" && Number(b.reste_a_payer) ? fcfa(b.reste_a_payer) : ""}</td>
          <td><div class="actions-ligne"><button class="btn" data-bul="${b.id}">Bulletin</button>
            ${payer && Number(b.reste_a_payer) > 0 ? `<button class="btn" data-payer="${b.id}">Payer</button>` : ""}</div></td></tr>`).join("")}</tbody>
        <tfoot><tr><td colspan="3">Total</td>${["brut", "total_retenues", "net_a_payer", "total_patronal", "paye", "reste_a_payer"].map(k =>
          `<td class="montant">${fcfa(bulletins.reduce((s, b) => s + Number(b[k] || 0), 0))}</td>`).join("")}<td></td></tr></tfoot></table></div>
        <p class="discret petit" style="padding:0 1rem">Coût total employeur : <b>${fcfa(bulletins.reduce((s, b) => s + Number(b.brut) + Number(b.total_patronal), 0))} FCFA</b>
          (brut + charges patronales).</p>
        <div id="registre-ov"></div>`;
    if ($("#registre-ov")) registreOV($("#registre-ov"), annee, mois);
    if ($("#b-ov")) $("#b-ov").onclick = () => formulaireOV(bulletins, annee, mois, recharger);
    $$("[data-bul]").forEach(x => x.onclick = () => ouvrirBulletin(bulletins.find(b => b.id === x.dataset.bul)));
    $$("[data-payer]").forEach(x => x.onclick = () => formulairePaiementSalaires([bulletins.find(b => b.id === x.dataset.payer)]));
    // « Payer tous » : les salaires versés par l'entreprise ; ceux payés par Guest Cameroun ou le CEO se règlent un par un.
    if ($("#b-payer-tout")) $("#b-payer-tout").onclick = () => {
      const aPayer = bulletins.filter(b => Number(b.reste_a_payer) > 0 && payeur(b) === "Entreprise");
      if (!aPayer.length) return toast("Aucun net restant dû par l'entreprise : les autres se paient un par un (« Payer »).", true);
      formulairePaiementSalaires(aPayer);
    };
    // Livre de paie : on choisit qui y figure (présélection : salaires payés par l'entreprise).
    const choisirLivre = async format => {
      const ids = await choisirPersonnes("Qui figure dans le livre de paie ?", bulletins.map(b => ({ id: b.id, libelle: `${b.matricule} — ${nomSalarie(b)}`,
        sous: [fcfa(b.net_a_payer) + " FCFA net", libellePayeur(payeur(b))].filter(Boolean).join(" · "), coche: payeur(b) === "Entreprise" })),
        { note: "Sont décochés d'office les salaires payés par Guest Cameroun ou le CEO (fiche du salarié, « Salaire payé par »). Le livre de paie légal comprend en principe tout le personnel : décochez pour un état interne.", libelle: format === "excel" ? "Exporter" : "Aperçu" });
      if (ids) livreDePaie(bulletins.filter(b => ids.includes(b.id)), annee, mois, format);
    };
    if ($("#b-livre")) $("#b-livre").onclick = () => choisirLivre("imprimer");
    if ($("#b-livre-xls")) $("#b-livre-xls").onclick = () => choisirLivre("excel");
    if ($("#b-vir")) $("#b-vir").onclick = () => etatVirements(bulletins, annee, mois, "imprimer");
    if ($("#b-vir-xls")) $("#b-vir-xls").onclick = () => etatVirements(bulletins, annee, mois, "excel");
  };

  const ongletVariables = async () => {
    const vars = periode ? (await sb.from("variables_paie").select("*").eq("periode_id", periode.id).order("created_at")).data || [] : [];
    const saisissables = (rubriques || []).filter(r => r.actif && r.type !== "Cotisation" && r.code !== "BASE");
    const modif = peut(PAIE_PREPARE) && statut !== "Validée";
    zone.innerHTML = `<div class="outils"><span class="discret">Heures supplémentaires, absences non payées, primes, allocation de congé, avances et acomptes à retenir.
        Recalculez la paie après chaque changement.</span>${modif ? `<button class="btn btn-principal pousse" id="b-var">Ajouter un élément</button>` : ""}</div>
      <div class="defil"><table><thead><tr><th>Salarié</th><th>Rubrique</th><th class="montant">Nombre</th><th class="montant">Montant</th><th>Commentaire</th><th></th></tr></thead>
      <tbody>${vars.map(v => { const s = (salaries || []).find(x => x.id === v.salarie_id) || {}, r = (rubriques || []).find(x => x.code === v.rubrique_code) || {};
        return `<tr><td>${esc(s.matricule || "")} ${esc(nomSalarie(s))}</td><td>${esc(r.libelle || v.rubrique_code)}</td>
        <td class="montant">${v.nombre != null ? qte(v.nombre) + (r.mode === "Heures" ? " h" : r.mode === "Jours" ? " j" : "") : ""}</td>
        <td class="montant">${v.montant != null ? fcfa(v.montant) : ""}</td><td>${esc(v.commentaire || "")}</td>
        <td>${modif ? `<button class="btn-lien" data-suppr="${v.id}">Retirer</button>` : ""}</td></tr>`; }).join("")
        || `<tr><td colspan="6" class="vide">Aucun élément variable ce mois-ci.</td></tr>`}</tbody></table></div>`;
    $$("[data-suppr]").forEach(b => b.onclick = async () => {
      const { error } = await sb.from("variables_paie").delete().eq("id", b.dataset.suppr);
      if (error) return toast(messageErreur(error), true);
      toast("Élément retiré. Recalculez la paie."); ongletVariables();
    });
    if ($("#b-var")) $("#b-var").onclick = () => {
      ouvrirModale("Élément du mois", `<div class="grille2">
        <div><label for="va-sal">Salarié *</label><select id="va-sal"><option value="">—</option>${(salaries || []).filter(s => s.actif).map(s =>
          `<option value="${s.id}">${esc(s.matricule)} – ${esc(nomSalarie(s))}</option>`).join("")}</select></div>
        <div><label for="va-rub">Rubrique *</label><select id="va-rub"><option value="">—</option>${saisissables.map(r =>
          `<option value="${r.code}">${esc(r.libelle)}</option>`).join("")}</select><p class="aide-champ" id="va-aide"></p></div>
        <div id="va-nb-bloc" hidden><label for="va-nb" id="va-nb-lib">Nombre</label><input type="number" id="va-nb" min="0" step="any"></div>
        <div id="va-mt-bloc"><label for="va-mt">Montant (FCFA)</label><input type="number" id="va-mt" min="0" step="1"></div>
        <div><label for="va-com">Commentaire</label><input type="text" id="va-com"></div></div>`, {
        libelleSave: "Ajouter",
        onSave: async () => {
          const r = saisissables.find(x => x.code === $("#va-rub").value);
          if (!$("#va-sal").value || !r) return "Choisissez le salarié et la rubrique.";
          let p = periode;
          if (!p) {
            const { data, error } = await sb.from("periodes_paie").select("*").eq("annee", annee).eq("mois", mois).maybeSingle();
            if (error) return messageErreur(error);
            p = data;
            if (!p) return "Calculez d'abord la paie du mois une première fois : la période sera ouverte.";
          }
          const d = { periode_id: p.id, salarie_id: $("#va-sal").value, rubrique_code: r.code, commentaire: $("#va-com").value.trim() || null,
            nombre: ["Heures", "Jours"].includes(r.mode) ? Number($("#va-nb").value || 0) : null,
            montant: r.mode === "Montant" ? Number($("#va-mt").value || 0) : null };
          const { error } = await sb.from("variables_paie").insert(d);
          if (error) return messageErreur(error);
          toast("Élément ajouté. Recalculez la paie pour l'intégrer."); ongletVariables();
        }
      });
      $("#va-rub").onchange = () => {
        const r = saisissables.find(x => x.code === $("#va-rub").value) || {};
        const nb = ["Heures", "Jours"].includes(r.mode);
        $("#va-nb-bloc").hidden = !nb; $("#va-mt-bloc").hidden = nb;
        $("#va-nb-lib").textContent = r.mode === "Heures" ? "Nombre d'heures *" : "Nombre de jours *";
        $("#va-aide").textContent = r.aide || "";
      };
    };
  };

  const ongletRemunerations = async () => {
    const { data: fixes } = await sb.from("elements_fixes").select("*");
    const rubFixes = (rubriques || []).filter(r => r.type === "Gain" && r.fixe && r.actif);
    const modif = peut(PAIE_PREPARE);
    const montant = (s, code) => Number(((fixes || []).find(e => e.salarie_id === s.id && e.rubrique_code === code) || {}).montant || 0);
    const actifs = (salaries || []).filter(s => s.actif && s.type_contrat !== "Stage");
    const nature = r => `${r.imposable ? "imposable" : "non imposable"} · ${r.cotisable ? "cotisable" : "non cotisable"}`;
    zone.innerHTML = `<div class="outils"><span class="discret">On part du <b>net à payer convenu</b> pour un mois complet : à chaque calcul de paie, le salaire de base
        est recalculé à rebours (CNPS, IRPP et taxes au barème) pour que le net tombe au franc près. Les indemnités se fixent ici ; leur régime
        (imposable, cotisable) se règle dans Paramètres et barèmes → Rubriques.</span></div>
      <div class="defil"><table><thead><tr><th>Salarié</th><th class="montant">Net convenu</th><th class="montant">Salaire de base</th>${rubFixes.map(r =>
        `<th class="montant">${esc(r.libelle)}<div class="discret petit" style="font-weight:400">${esc(nature(r))}</div></th>`).join("")}

          catch (err) { return messageErreur(err); }
          toast(`Rémunération enregistrée${parNet ? ` : ${fcfa(net)} FCFA net` : ""}. Recalculez la paie du mois si elle est déjà calculée.`); recharger();

      let minuterie = null, jeton = 0;
      const ligne = (l, v, signe = "", fort = false) => `<tr${fort ? ' class="total"' : ""}><td>${fort ? `<b>${l}</b>` : l}</td><td class="montant">${fort ? "<b>" : ""}${signe}${fcfa(v)}${fort ? "</b>" : ""}</td></tr>`;

        const parNet = $("#rm-mode").value === "net", t = ++jeton, zs = $("#rm-sim");
        $("#rm-net-bloc").hidden = !parNet; $("#rm-base").readOnly = parNet;
        $("#rm-base-aide").textContent = parNet ? "Calculée à partir du net voulu : elle sera réajustée à chaque calcul de paie." : "Le net dépendra de cette base.";
        try {
          const fx = lireFixes();
          let base = Number($("#rm-base").value || 0);
          if (parNet) {
            const net = Number($("#rm-net").value || 0);
            if (!(net > 0)) { zs.innerHTML = ""; return; }
            base = Number(await appeler("base_pour_net", { p_salarie: s.id, p_net: net, p_fixes: fx }));
            if (t !== jeton) return;
            $("#rm-base").value = base;
          }
          if (!(base > 0)) { zs.innerHTML = ""; return; }
          const r = await appeler("simuler_net", { p_salarie: s.id, p_base: base, p_fixes: fx });
          if (t !== jeton) return;
          zs.innerHTML = `<div class="panneau" style="padding:.6rem 1rem"><h3 style="margin:0 0 .4rem">Simulation d'un mois complet</h3><table><tbody>
            ${ligne("Salaire de base", r.base)}${ligne("Indemnités", Number(r.brut) - Number(r.base), "+ ")}${ligne("Salaire brut", r.brut, "", true)}

            ${ligne("Pension vieillesse CNPS", r.cnps, "− ")}${ligne("IRPP", r.irpp, "− ")}${ligne("Centimes additionnels communaux", r.cac, "− ")}
            ${ligne("Crédit foncier", r.cfc, "− ")}${ligne("Redevance audiovisuelle", r.rav, "− ")}${ligne("Taxe de développement local", r.tdl, "− ")}
            ${ligne("Net à payer", r.net, "", true)}</tbody></table></div>`;
        } catch (err) { if (t === jeton) zs.innerHTML = `<p class="erreur">${esc(messageErreur(err))}</p>`; }
      };
      const planifier = () => { clearTimeout(minuterie); minuterie = setTimeout(simuler, 300); };
      $("#rm-mode").onchange = simuler;
      [$("#rm-net"), $("#rm-base"), ...$$("[data-rmfixe]")].forEach(i => { i.oninput = planifier; });

          if ($("#pp-val").value === "" || !$("#pp-date").value) return "Indiquez la valeur et la date d'effet.";
          const { error } = await sb.from("parametres_paie").insert({ code: p.code, libelle: p.libelle, unite: p.unite, valeur: Number($("#pp-val").value),
            date_effet: $("#pp-date").value, observation: $("#pp-obs").value.trim() || null });
          if (error) return messageErreur(error);
          toast("Paramètre enregistré."); ongletParametres();
        }
      });
    };
  };

  const basculer = k => {
    onglet = etat.ongletPaie = k;
    $$("[data-onglet]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.onglet === k)));
    return ({ bulletins: ongletBulletins, variables: ongletVariables, remunerations: ongletRemunerations, stagiaires: ongletStagiaires, declarations: ongletDeclarations, parametres: ongletParametres }[k])();
  };
  $$("[data-onglet]").forEach(b => b.onclick = () => basculer(b.dataset.onglet));
  await basculer(onglet);
}

async function ouvrirBulletin(b) {
  if (!b) return;
  const { data: lignes } = await sb.from("lignes_bulletin").select("*").eq("bulletin_id", b.id).order("ordre").order("id");
  ouvrirModale(`Bulletin ${b.numero} — ${nomSalarie(b)}`, `<style>${STYLE_BULLETIN}</style>
    ${b.statut_paie === "Validée" ? `<p class="discret petit">Payé ${fcfa(b.paye)} FCFA · reste ${fcfa(b.reste_a_payer)} FCFA.</p>` : `<p class="discret petit">Paie ${esc((b.statut_paie || "").toLowerCase())} : le bulletin peut encore changer.</p>`}

    <div class="barre-actions"><button type="button" class="btn" id="bu-imprimer">Imprimer le bulletin</button></div>`, { large: true });

}

/* Bulletins imprimés sur le papier à en-tête, un par page. */
// lignesFournies : pour l'espace salarié, qui lit ses lignes par mes_lignes_bulletin.
async function imprimerBulletins(bulletins, lignesFournies) {
  if (!bulletins.length) return toast("Aucun bulletin à imprimer.", true);
  const ids = bulletins.map(b => b.id);
  const lignes = lignesFournies || await chargerTout(() => sb.from("lignes_bulletin").select("*").in("bulletin_id", ids).order("ordre").order("id"));
  const pages = bulletins.map((b, i) => `<div class="page-bp" style="${i ? "page-break-before:always;" : ""}">${bulletinHtml(b, lignes.filter(l => l.bulletin_id === b.id), true)}</div>`);
  imprimerHtml(`Bulletins ${MOIS[bulletins[0].mois - 1]} ${bulletins[0].annee}`, `<style>${STYLE_BULLETIN}${STYLE_BULLETIN_IMPRESSION}</style>${pages.join("")}`, { brut: true });
}

/* Livre de paie : une ligne par salarié, colonnes regroupées (rémunération, retenues, net,
   charges patronales), totaux ; imprimable en paysage et exportable en Excel lisible. */
const COLONNES_LIVRE = [
  { g: "Rémunération", l: "Salaire de base", f: (L) => L.filter(l => ["BASE", "ABS"].includes(l.rubrique_code)).reduce((s, l) => s + Number(l.gain), 0) },
  { g: "Rémunération", l: "Heures sup.", f: (L) => L.filter(l => /^HS/.test(l.rubrique_code)).reduce((s, l) => s + Number(l.gain), 0) },
  { g: "Rémunération", l: "Primes et indemnités", f: (L) => L.filter(l => Number(l.gain) && !["BASE", "ABS"].includes(l.rubrique_code) && !/^HS/.test(l.rubrique_code)).reduce((s, l) => s + Number(l.gain), 0) },
  { g: "Rémunération", l: "Salaire brut", f: (L, b) => Number(b.brut), fort: true },
  { g: "Assiettes", l: "Taxable", f: (L, b) => Number(b.taxable) },
  { g: "Assiettes", l: "Cotisable", f: (L, b) => Number(b.cotisable) },
  { g: "Retenues salariales", l: "CNPS", f: (L) => L.filter(l => l.rubrique_code === "PVID").reduce((s, l) => s + Number(l.retenue), 0) },
  { g: "Retenues salariales", l: "IRPP + CAC", f: (L) => L.filter(l => ["IRPP", "CAC"].includes(l.rubrique_code)).reduce((s, l) => s + Number(l.retenue), 0) },
  { g: "Retenues salariales", l: "Crédit foncier", f: (L) => L.filter(l => l.rubrique_code === "CFC").reduce((s, l) => s + Number(l.retenue), 0) },
  { g: "Retenues salariales", l: "RAV + TDL", f: (L) => L.filter(l => ["RAV", "TDL"].includes(l.rubrique_code)).reduce((s, l) => s + Number(l.retenue), 0) },
  { g: "Retenues salariales", l: "Avances et autres", f: (L) => L.filter(l => Number(l.retenue) && !["PVID", "IRPP", "CAC", "CFC", "RAV", "TDL"].includes(l.rubrique_code)).reduce((s, l) => s + Number(l.retenue), 0) },
  { g: "Retenues salariales", l: "Total retenues", f: (L, b) => Number(b.total_retenues), fort: true },
  { g: "Net", l: "NET À PAYER", f: (L, b) => Number(b.net_a_payer), fort: true },
  { g: "Charges patronales", l: "CNPS (PV, AF, AT)", f: (L) => L.filter(l => ["PVID", "AF", "AT"].includes(l.rubrique_code)).reduce((s, l) => s + Number(l.patronal), 0) },
  { g: "Charges patronales", l: "CFC + FNE", f: (L) => L.filter(l => ["CFC-PAT", "FNE"].includes(l.rubrique_code)).reduce((s, l) => s + Number(l.patronal), 0) },
  { g: "Charges patronales", l: "Total patronal", f: (L, b) => Number(b.total_patronal), fort: true },
  { g: "Coût", l: "Coût employeur", f: (L, b) => Number(b.brut) + Number(b.total_patronal), fort: true }];

async function livreDePaie(bulletins, annee, mois, format) {
  if (!bulletins.length) return toast("Aucun bulletin.", true);
  const lignes = await chargerTout(() => sb.from("lignes_bulletin").select("bulletin_id, rubrique_code, gain, retenue, patronal").in("bulletin_id", bulletins.map(b => b.id)).order("id"));
  const rangs = bulletins.map(b => { const L = lignes.filter(l => l.bulletin_id === b.id); return { b, v: COLONNES_LIVRE.map(c => Math.round(c.f(L, b))) }; });
  const tot = COLONNES_LIVRE.map((c, i) => rangs.reduce((s, r) => s + r.v[i], 0));
  const titre = `Livre de paie — ${MOIS[mois - 1]} ${annee}`;
  if (format === "excel") {
    if (!window.XLSX) await chargerScript(CDN_EXPORT.xlsx);
    const groupes = ["", "", "", "", ...COLONNES_LIVRE.map((c, i) => i && COLONNES_LIVRE[i - 1].g === c.g ? "" : c.g)];
    const entetes = ["Matricule", "Nom et prénom", "Emploi", "Jours", ...COLONNES_LIVRE.map(c => c.l)];
    const aoa = [[`${(etat.entite || {}).raison_sociale || "GUEST MARKETS"} — ${titre}`], [], groupes, entetes,
      ...rangs.map(r => [r.b.matricule, nomSalarie(r.b), r.b.emploi || "", Number(r.b.jours_payes), ...r.v]), ["", `TOTAL (${rangs.length} salariés)`, "", "", ...tot]];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const fmt = "#,##0";
    for (let r = 4; r < aoa.length; r++) for (let c = 4; c < entetes.length; c++) { const ref = XLSX.utils.encode_cell({ r, c }); if (ws[ref]) ws[ref].z = fmt; }
    ws["!cols"] = [{ wch: 10 }, { wch: 30 }, { wch: 26 }, { wch: 6 }, ...COLONNES_LIVRE.map(c => ({ wch: Math.max(12, c.l.length + 2) }))];
    const merges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 8 } }];
    let i0 = 0;
    for (let i = 1; i <= COLONNES_LIVRE.length; i++) if (i === COLONNES_LIVRE.length || COLONNES_LIVRE[i].g !== COLONNES_LIVRE[i0].g) {
      if (i - 1 > i0) merges.push({ s: { r: 2, c: i0 + 4 }, e: { r: 2, c: i + 3 } }); i0 = i; }
    ws["!merges"] = merges;
    ws["!freeze"] = { xSplit: 2, ySplit: 4 };
    ws["!views"] = [{ state: "frozen", xSplit: 2, ySplit: 4 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, nomFeuille(`Paie ${String(mois).padStart(2, "0")}-${annee}`));
    XLSX.writeFile(wb, `livre_de_paie_${annee}_${String(mois).padStart(2, "0")}.xlsx`);
    return;
  }
  const grp = []; COLONNES_LIVRE.forEach(c => { const d = grp[grp.length - 1]; if (d && d.g === c.g) d.n++; else grp.push({ g: c.g, n: 1 }); });
  const cel = (v, fort) => `<td style="text-align:right;white-space:nowrap${fort ? ";font-weight:700" : ""}">${v ? fcfa(v) : "–"}</td>`;
  imprimerHtml(titre, `<style>@page{size:A4 landscape;margin:.8cm}body{max-width:none!important;margin:0!important;padding:0!important}
      .livre td,.livre th{font-size:9.5px;padding:.2rem .3rem}.livre th{text-align:center}.livre tr:nth-child(even) td{background:#F4F6F9}
      .livre tfoot td{background:#E3EEF9!important;font-weight:700;border-top:2px solid #2F5395}</style>
    <h1>${esc(titre)}</h1><p class="discret">${rangs.length} salarié(s) · montants en FCFA · paie ${esc((bulletins[0].statut_paie || "").toLowerCase())}</p>
    <table class="livre"><thead><tr><th colspan="3"></th>${grp.map(g => `<th colspan="${g.n}">${esc(g.g)}</th>`).join("")}</tr>
      <tr><th>Matr.</th><th>Nom et prénom</th><th>Jours</th>${COLONNES_LIVRE.map(c => `<th>${esc(c.l)}</th>`).join("")}</tr></thead>
    <tbody>${rangs.map(r => `<tr><td>${esc(r.b.matricule)}</td><td>${esc(nomSalarie(r.b))}<br><span class="discret">${esc(r.b.emploi || "")}</span></td>
      <td style="text-align:right">${qte(r.b.jours_payes)}</td>${r.v.map((v, i) => cel(v, COLONNES_LIVRE[i].fort)).join("")}</tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="3">TOTAL</td>${tot.map((v, i) => cel(v, true)).join("")}</tr></tfoot></table>
    <table style="margin-top:1.5rem;border:none;width:60%"><tr><td style="border:none">Établi par</td><td style="border:none">Visa du DAF</td></tr></table>`);
}

        <option value="CEO" ${compteDefaut === "CEO" || !compteDefaut && liste.length === 1 && (etat.payeurs || {})[liste[0].salarie_id] === "CEO" ? "selected" : ""}>Le CEO (compte de l'exploitant)</option></select>

      }
      toast(`${n} paiement(s) enregistré(s).`); if (apres) setTimeout(apres, 0); else recharger();

}

/* Paiement des indemnités de stage : une dépense par stagiaire, rattachée au mois réglé. */
