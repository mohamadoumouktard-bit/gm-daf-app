/* Saisie d'une dépense, d'une recette, d'un virement ou d'une dépense payée par l'exploitant. */
function formulaireOperation(genre, retour) {
  const exploitant = genre === "Exploitant";
  const type = exploitant ? "Dépense" : genre;
  const nat = type === "Recette" ? NAT_RECETTE : NAT_DEPENSE;
  const filtreCat = c => nat.includes(c.nature) && !(exploitant && c.nature === "Compte de l'exploitant");
  const comptes = (etat.refs.comptes_tresorerie || []).filter(c => c.actif !== false);
  const optComptes = `<option value="">—</option>` + comptes.map(c => `<option value="${c.id}">${esc(c.code)} – ${esc(c.libelle)}</option>`).join("");
  const titre = { Dépense: "Nouvelle dépense", Recette: "Nouvelle recette", Virement: "Virement entre deux comptes",
    Exploitant: "Dépense payée par l'exploitant" }[genre];
  const corps = `${exploitant ? `<p class="discret petit">Payée directement par le CEO ou par Guest Cameroun pour GUEST MARKETS : elle ne sort d'aucune caisse,
      et sa contrepartie est le compte de l'exploitant (1041).</p>` : ""}
    ${type === "Virement" ? `<p class="discret petit">Approvisionnement d'une caisse, dépôt en banque, retrait : l'argent change de compte sans entrer ni sortir de l'entreprise.</p>` : ""}
    <div class="grille2">
      <div><label for="op-date">Date *</label><input type="date" id="op-date" value="${aujourdhui()}"></div>
      ${exploitant ? `<div><label for="op-payeur">Payée par *</label><select id="op-payeur"><option>CEO</option><option>Guest Cameroun</option></select></div>`
        : `<div><label for="op-compte">${type === "Virement" ? "Compte débité" : type === "Recette" ? "Compte qui encaisse" : "Compte qui paie"} *</label>
          <select id="op-compte">${optComptes}</select><p class="aide-champ" id="op-solde"></p></div>`}
      ${type === "Virement" ? `<div><label for="op-dest">Compte crédité *</label><select id="op-dest">${optComptes}</select><p class="aide-champ" id="op-solde-dest"></p></div>`
        : `<div><label for="op-cat">Catégorie *</label><select id="op-cat">${optionsCategories(filtreCat)}</select></div>`}
      <div><label for="op-montant">Montant (FCFA) *</label><input type="number" id="op-montant" min="1" step="1"></div>
      <div><label for="op-libelle">Libellé *</label><input type="text" id="op-libelle"></div>
      ${type === "Dépense" ? `<div><label for="op-benef">Bénéficiaire</label><input type="text" id="op-benef"></div>` : ""}
      <div><label for="op-piece">Pièce justificative</label><input type="text" id="op-piece" placeholder="N° de facture, de reçu…"></div>
      ${type !== "Virement" ? `<div><label for="op-act">Activité</label><select id="op-act">${optionsRef("activites", null, undefined, "Structure (aucune activité)")}</select></div>
        <div><label for="op-site" id="op-site-lib">Bureau ou site</label><select id="op-site">${optionsRef("sites", null, undefined, "Aucun")}</select></div>
        <div><label for="op-veh" id="op-veh-lib">Véhicule</label><select id="op-veh">${optionsRef("vehicules", null, undefined, "Aucun")}</select></div>
        <div id="op-sal-bloc" hidden><label for="op-sal">Salarié *</label><select id="op-sal">${optionsRef("salaries_liste", null)}</select></div>` : ""}
    </div>
    <p class="info" id="op-aide" hidden></p>`;
  ouvrirModale(titre, corps, {
    large: true,
    onSave: async () => {

      if (!d.date_operation) return "Indiquez la date.";

      if (type === "Virement" && (!d.compte_destination_id || d.compte_destination_id === d.compte_tresorerie_id))
        return "Choisissez un compte crédité différent du compte débité.";
      if (type !== "Virement" && !d.categorie_id) return "Choisissez la catégorie.";
      if (!(d.montant > 0) || !Number.isInteger(d.montant)) return "Le montant doit être un nombre entier de francs, positif.";
      if (!d.libelle) return "Indiquez le libellé.";
      const c = categorie(d.categorie_id);
      if (c.exige_site && !d.site_id) return `Indiquez le bureau ou le site concerné par « ${c.libelle} ».`;
      if (c.exige_vehicule && !d.vehicule_id) return `Indiquez le véhicule concerné par « ${c.libelle} ».`;
      if (String(c.compte || "").startsWith("42") && !d.salarie_id) return `Indiquez le salarié concerné par « ${c.libelle} ».`;
      const { data, error } = await sb.from("operations_tresorerie").insert(d).select("numero").single();
      if (error) return messageErreur(error);
      toast(`Opération ${data && data.numero ? data.numero + " " : ""}enregistrée.`);
      retour();

  });
  const majCat = () => {
    const c = categorie(($("#op-cat") || {}).value);
    if ($("#op-site-lib")) $("#op-site-lib").textContent = "Bureau ou site" + (c.exige_site ? " *" : "");
    if ($("#op-veh-lib")) $("#op-veh-lib").textContent = "Véhicule" + (c.exige_vehicule ? " *" : "");
    if ($("#op-sal-bloc")) $("#op-sal-bloc").hidden = !String(c.compte || "").startsWith("42");
    const aide = [c.aide, c.compte ? `Compte ${c.compte}.` : ""].filter(Boolean).join(" ");
    $("#op-aide").hidden = !aide; $("#op-aide").textContent = aide;
  };
  // Solde du compte, et solde après l'opération : un compte de trésorerie ne doit pas passer à découvert.
  const majSolde = () => {
    const m = Number(($("#op-montant") || {}).value || 0), sortie = type !== "Recette";
    const s = (etat.soldes || []).find(x => x.id === ($("#op-compte") || {}).value);

      const apres = s ? Number(s.solde) + (sortie ? -m : m) : 0;
      $("#op-solde").innerHTML = s ? `Solde : ${fcfa(s.solde)} FCFA${m ? ` · après : <b class="${apres < 0 ? "negatif" : ""}">${fcfa(apres)} FCFA</b>` : ""}`
        + `${s.plafond_operation ? ` · plafond par sortie : ${fcfa(s.plafond_operation)} FCFA` : ""}${m && apres < 0 ? "<br>Le compte passerait à découvert : vérifiez le compte choisi." : ""}` : "";
    }
    const dd = (etat.soldes || []).find(x => x.id === ($("#op-dest") || {}).value);
    if ($("#op-solde-dest")) $("#op-solde-dest").textContent = dd ? `Solde : ${fcfa(dd.solde)} FCFA${m ? ` · après : ${fcfa(Number(dd.solde) + m)} FCFA` : ""}` : "";
  };
  if ($("#op-cat")) $("#op-cat").onchange = majCat;
  ["op-compte", "op-dest"].forEach(id => { if ($("#" + id)) $("#" + id).onchange = majSolde; });
  if ($("#op-montant")) $("#op-montant").oninput = majSolde;
}

/* =====================================================================
   Situation de trésorerie (lot 9) : un tableau par compte, à une date,
   avec les fonds en transit entre deux comptes.
   ===================================================================== */
const plusJoursIso = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const ecartJours = (a, b) => Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000);

/* Petite courbe du solde : la ligne pointillée est le zéro, rouge si le compte finit à découvert. */
function courbeSolde(points) {
  if (!points.length) return "";
  const v = points.map(p => Number(p.solde)), min = Math.min(0, ...v), max = Math.max(0, ...v), L = 120, H = 30;
  const x = i => (i * L / Math.max(1, v.length - 1)).toFixed(1), y = s => (H - 2 - (s - min) * (H - 4) / (max - min || 1)).toFixed(1);
  return `<svg class="courbe" width="${L}" height="${H}" viewBox="0 0 ${L} ${H}" role="img" aria-label="Évolution du solde sur ${v.length} jours">
    ${min < 0 ? `<line x1="0" x2="${L}" y1="${y(0)}" y2="${y(0)}" class="zero"/>` : ""}
    <polyline fill="none" class="${v[v.length - 1] < 0 ? "neg" : "pos"}" points="${v.map((s, i) => `${x(i)},${y(s)}`).join(" ")}"/></svg>`;
}

/* La moitié manquante d'un transfert : l'arrivée d'une sortie, ou le départ d'une arrivée. */
function formulaireCompleterTransfert(t, sit, retour) {
  if (!t) return;
  const sortie = t.statut === "En transit", code = sortie ? t.compte_sortie : t.compte_entree, d = sortie ? t.date_sortie : t.date_entree;
  ouvrirModale(sortie ? "Saisir l'arrivée du transfert" : "Saisir le départ du transfert", `
    <p>${esc(sortie ? t.numero_sortie : t.numero_entree)} — ${esc(t.libelle)} : <b>${fcfa(t.montant)} FCFA</b> ${sortie ? "sortis de" : "arrivés sur"} <b>${esc(code)}</b>
      le ${esc(dateCourte(d))}.</p>
    <p class="discret petit">${sortie ? "L'argent est bien arrivé quelque part, mais l'arrivée n'a pas été saisie (la caisse secondaire s'arrêtait plus tôt dans le classeur, par exemple)."
      : "L'argent est arrivé, mais sa sortie de l'autre compte n'a pas été saisie."} L'opération créée solde le compte d'attente 585.</p>
    <div class="grille2"><div><label for="ct-compte">${sortie ? "Arrivé sur" : "Parti de"} *</label><select id="ct-compte"><option value="">—</option>
      ${sit.filter(s => s.code !== code).map(s => `<option value="${s.id}">${esc(s.code)} – ${esc(s.libelle)}</option>`).join("")}</select></div>
      <div><label for="ct-date">${sortie ? "Date d'arrivée" : "Date de départ"} *</label><input type="date" id="ct-date" value="${esc(d)}"></div></div>`, {
    libelleSave: "Enregistrer",
    onSave: async () => {
      if (!$("#ct-compte").value) return "Choisissez le compte.";
      try { await appeler("completer_transfert", { p_op: sortie ? t.sortie_id : t.entree_id, p_compte: $("#ct-compte").value, p_date: $("#ct-date").value || null }); }
      catch (err) { return messageErreur(err); }
      toast("Transfert complété."); retour();
    }
  });
}

/* Deux moitiés de même montant trop éloignées en date pour le rapprochement automatique (chèque crédité un mois plus tard…). */
function formulaireApparier(t, attente, retour) {
  if (!t) return;
  const cands = attente.filter(a => a.statut === "Arrivée sans départ" && Number(a.montant) === Number(t.montant) && a.compte_entree !== t.compte_sortie && a.date_entree >= t.date_sortie);
  ouvrirModale("Apparier un transfert", `<p>${esc(t.numero_sortie)} — ${esc(t.libelle)} : <b>${fcfa(t.montant)} FCFA</b> sortis de <b>${esc(t.compte_sortie)}</b> le ${esc(dateCourte(t.date_sortie))}.</p>
    <label for="ap-entree">Arrivée correspondante *</label><select id="ap-entree">${cands.map(a => `<option value="${a.entree_id}">${esc(dateCourte(a.date_entree))} · ${esc(a.compte_entree)} · ${esc(a.numero_entree)} — ${esc(a.libelle)}</option>`).join("")}</select>
    <label for="ap-motif">Motif *</label><textarea id="ap-motif" placeholder="Ex. : chèque déposé le 01/08, crédité le 31/08"></textarea>`, {
    libelleSave: "Apparier",
    onSave: async () => {
      const m = $("#ap-motif").value.trim();
      if (!m) return "Indiquez le motif.";
      try { await appeler("apparier_transferts", { p_sortie: t.sortie_id, p_entree: $("#ap-entree").value, p_motif: m }); } catch (err) { return messageErreur(err); }
      toast("Transfert rapproché."); retour();
    }
  });
}

/* Fiche d'une opération : son écriture, son historique de corrections, et ce qu'on peut en faire. */
async function ouvrirOperation(o, retour) {
  if (!o) return;
  let lignes;
  try { lignes = await chargerTout(() => sb.from("v_lignes_ecriture").select("*").eq("origine_id", o.id).order("numero").order("ordre")); }
  catch (err) { return toast(messageErreur(err), true); }
  const ecritures = [...new Set(lignes.map(l => l.numero))];
  const actions = [];
  if (!o.annulee && peut(CORRECTION) && ["Dépense", "Recette"].includes(o.type)) actions.push(`<button type="button" class="btn" id="a-reclasser">Reclasser ou ventiler</button>`);
  if (!o.annulee && peut(CORRECTION) && o.type === "Règlement fournisseur" && !o.achat_id)
    actions.push(`<button type="button" class="btn" id="a-affecter">${o.fournisseur_id ? "Rattacher à un achat" : "Affecter au fournisseur"}</button>`);
  if (!o.annulee && peut(CORRECTION) && o.payeur === "Trésorerie" && o.compte_tresorerie_id)
    actions.push(`<button type="button" class="btn" id="a-compte">Changer de compte</button>`);
  if (peut(CORRECTION) && o.reprise_statut === "Importée, à revoir") actions.push(`<button type="button" class="btn" id="a-revu">Marquer comme revue</button>`);
  actions.push(`<button type="button" class="btn" id="a-imprimer">Imprimer la pièce</button>`);
  if (!o.annulee && !o.exercice_anterieur && peut(VALIDATION) && o.reprise && o.type === "Dépense" && o.date_operation <= ((etat.entite || {}).debut_exercice || "2026-01-01"))
    actions.push(`<button type="button" class="btn" id="a-2025">Rattacher à l'exercice 2025</button>`);
  if (!o.annulee && peut(VALIDATION)) actions.push(`<button type="button" class="btn btn-danger" id="a-annuler">Annuler l'opération</button>`);
  const ventilation = o.ventilation ? `<dt>Ventilation</dt><dd>${o.ventilation.map(v => `${esc(categorie(v.categorie_id).libelle || "")} : ${fcfa(v.montant)}`).join("<br>")}</dd>` : "";
  ouvrirModale(`${o.type} ${o.numero}`, `
    ${o.exercice_anterieur ? `<div class="info">Dépense de l'exercice 2025 : sa charge a été reportée en 129 (à-nouveaux du 01/01/2026).</div>` : ""}
    ${o.annulee ? `<div class="erreur">Opération annulée : ${esc(o.motif_annulation || "")}</div>` : ""}
    ${o.reprise_motif ? `<div class="info"><b>${esc(o.reprise_statut)}</b> — ${esc(o.reprise_motif)}<br><span class="petit">${esc(o.source_reprise || "")}</span></div>` : ""}
    <dl class="fiche">
      <dt>Date</dt><dd>${esc(dateCourte(o.date_operation))}</dd>
      <dt>Montant</dt><dd><b>${fcfa(o.montant)} FCFA</b></dd>
      <dt>Compte</dt><dd>${esc(libCompteOp(o))}${o.destination_code ? " → " + esc(o.destination_code) : ""}</dd>
      <dt>Libellé</dt><dd>${esc(o.libelle)}</dd>
      ${o.beneficiaire ? `<dt>Bénéficiaire</dt><dd>${esc(o.beneficiaire)}</dd>` : ""}
      ${o.categorie ? `<dt>Catégorie</dt><dd>${esc(o.categorie)}</dd>` : ""}${ventilation}
      ${o.type === "Règlement fournisseur" ? `<dt>Fournisseur</dt><dd>${esc(o.fournisseur || "À affecter")}${o.achat_numero ? " · " + esc(o.achat_numero) : ""}</dd>` : ""}
      ${o.type === "Encaissement client" ? `<dt>Client</dt><dd>${esc(o.client || "")}${o.document_numero ? " · facture " + esc(o.document_numero) : ""}</dd>` : ""}
      ${o.payeur === "Compensation fournisseur" ? `<dt>Compensé avec</dt><dd>la dette envers ${esc(o.fournisseur || "")}</dd>` : ""}
      ${o.activite ? `<dt>Activité</dt><dd>${esc(o.activite)}</dd>` : ""}
      ${o.site ? `<dt>Site</dt><dd>${esc(o.site)}</dd>` : ""}${o.vehicule ? `<dt>Véhicule</dt><dd>${esc(o.vehicule)}</dd>` : ""}
      ${o.piece_justificative ? `<dt>Pièce</dt><dd>${esc(o.piece_justificative)}</dd>` : ""}
      <dt>Saisie</dt><dd>${o.reprise ? "Reprise du classeur" : esc(o.saisi_par_nom || "")} · ${esc(dateHeure(o.created_at))}</dd>
    </dl>
    <h2>Écritures</h2>
    <div class="defil"><table><thead><tr><th>Compte</th><th>Libellé</th><th>Imputation</th><th class="montant">Débit</th><th class="montant">Crédit</th></tr></thead><tbody>
    ${ecritures.map(n => { const ls = lignes.filter(l => l.numero === n); return `<tr class="sous-total"><td colspan="5">${esc(n)} · ${esc(ls[0].journal_code)} · ${esc(dateCourte(ls[0].date_ecriture))} — ${esc(ls[0].libelle_ecriture)}</td></tr>`
      + ls.map(l => `<tr><td class="code">${esc(l.compte)}</td><td>${esc(l.libelle)}</td><td class="petit">${esc([l.categorie, l.site, l.vehicule, l.fournisseur].filter(Boolean).join(" · "))}</td>
        <td class="montant">${l.debit ? fcfa(l.debit) : ""}</td><td class="montant">${l.credit ? fcfa(l.credit) : ""}</td></tr>`).join(""); }).join("")}
    </tbody></table></div>
    <div class="barre-actions">${actions.join("")}</div>`, { large: true });
  const clic = (id, fn) => { if ($("#" + id)) $("#" + id).onclick = fn; };
  clic("a-reclasser", () => formulaireReclassement(o, retour));
  clic("a-affecter", () => formulaireAffectation(o, retour));
  clic("a-compte", () => formulaireChangementCompte(o, retour));
  clic("a-revu", () => formulaireRevue(o.reprise_ligne_id, retour));
  clic("a-imprimer", () => imprimerPieceOperation(o, lignes));
  clic("a-2025", () => formulaireMotif(`Rattacher ${o.numero} à l'exercice 2025`,
    "Une écriture d'à-nouveaux au 01/01/2026 débite le 129 (report à nouveau) et crédite la charge : le résultat 2026 n'en porte plus le poids. La trésorerie et le dû à l'exploitant ne changent pas.",
    "porter_exercice_anterieur", { p_id: o.id }, "Rattacher à 2025", "Dépense rattachée à l'exercice 2025.", retour));
  clic("a-annuler", () => formulaireMotif(`Annuler ${o.numero}`,
    "L'opération reste visible, barrée ; son écriture est extournée par une écriture inverse datée d'aujourd'hui. Pour corriger, saisissez-la ensuite de nouveau.",
    "annuler_operation", { p_id: o.id }, "Confirmer l'annulation", "Opération annulée.", retour));
}

/* Motif obligatoire : annulation, renvoi. */
function formulaireMotif(titre, texte, fonction, params, libelle, message, retour) {
  ouvrirModale(titre, `<p>${esc(texte)}</p><label for="mo-motif">Motif *</label><textarea id="mo-motif"></textarea>`, {
    libelleSave: libelle,
    onSave: async () => {
      const m = $("#mo-motif").value.trim();
      if (!m) return "Indiquez le motif.";
      try { await appeler(fonction, { ...params, p_motif: m }); } catch (err) { return messageErreur(err); }
      toast(message); retour();
    }
  });
}

function formulaireRevue(ligneId, retour) {
  ouvrirModale("Marquer comme revue", `<p>L'imputation reprise du classeur est juste : la ligne quitte la liste « à revoir ». Le commentaire est conservé avec elle.</p>
    <label for="rv-com">Commentaire</label><textarea id="rv-com"></textarea>`, {
    libelleSave: "Marquer revue",
    onSave: async () => {
      try { await appeler("marquer_revue", { p_ligne: ligneId, p_commentaire: $("#rv-com").value.trim() || null }); }
      catch (err) { return messageErreur(err); }
      toast("Ligne revue."); retour();
    }
  });
}

/* Reclasser ou ventiler : l'ancienne imputation est extournée, la nouvelle passée, dans le mois de l'opération. */
function formulaireReclassement(o, retour) {
  const nat = o.type === "Dépense" ? NAT_DEPENSE : NAT_RECETTE;
  const initiales = o.ventilation || [{ categorie_id: o.categorie_id, montant: o.montant, site_id: o.site_id, vehicule_id: o.vehicule_id, activite_id: o.activite_id }];
  const ligneHtml = v => `<tr>
    <td><select class="v-cat" aria-label="Catégorie">${optionsCategories(c => nat.includes(c.nature), v.categorie_id)}</select></td>
    <td><input type="number" class="v-mont" min="1" step="1" value="${esc(v.montant ?? "")}" aria-label="Montant" style="width:8rem"></td>
    <td><select class="v-site" aria-label="Site">${optionsRef("sites", v.site_id, undefined, "Aucun")}</select></td>
    <td><select class="v-veh" aria-label="Véhicule">${optionsRef("vehicules", v.vehicule_id, undefined, "Aucun")}</select></td>
    <td><select class="v-act" aria-label="Activité">${optionsRef("activites", v.activite_id, undefined, "Structure")}</select></td>
    <td><button type="button" class="btn-lien v-suppr">Retirer</button></td></tr>`;
  ouvrirModale(`Reclasser ${o.numero}`, `<p>${esc(o.libelle)} — <b>${fcfa(o.montant)} FCFA</b> du ${esc(dateCourte(o.date_operation))}</p>
    ${o.reprise_motif ? `<div class="info">${esc(o.reprise_motif)}</div>` : ""}
    <p class="discret petit">L'imputation actuelle est extournée et la nouvelle passée par une écriture d'opérations diverses datée du jour de l'opération :
      le mois concerné est corrigé et la trace demeure. Pour ventiler (salaire net, retenues, charges patronales…), ajoutez des lignes dont le total égale le montant.</p>
    <div class="defil"><table class="saisie"><thead><tr><th>Catégorie</th><th>Montant</th><th>Site</th><th>Véhicule</th><th>Activité</th><th></th></tr></thead>
    <tbody id="v-corps">${initiales.map(ligneHtml).join("")}</tbody></table></div>
    <p><button type="button" class="btn" id="v-ajout">Ajouter une ligne</button> <span id="v-total" class="num"></span></p>
    <label for="v-motif">Motif *</label><textarea id="v-motif"></textarea>`, {
    large: true, libelleSave: "Reclasser",
    onSave: async () => {
      const vent = $$("#v-corps tr").map(tr => ({ categorie_id: $(".v-cat", tr).value || null, montant: Number($(".v-mont", tr).value || 0),
        site_id: $(".v-site", tr).value || null, vehicule_id: $(".v-veh", tr).value || null, activite_id: $(".v-act", tr).value || null }));
      if (vent.some(v => !v.categorie_id || !(v.montant > 0))) return "Chaque ligne a une catégorie et un montant positif.";
      const total = vent.reduce((s, v) => s + v.montant, 0);
      if (total !== Number(o.montant)) return `Le total (${fcfa(total)}) doit égaler le montant de l'opération (${fcfa(o.montant)} FCFA).`;
      for (const v of vent) {
        const c = categorie(v.categorie_id);
        if (c.exige_site && !v.site_id) return `Indiquez le bureau ou le site pour « ${c.libelle} ».`;
        if (c.exige_vehicule && !v.vehicule_id) return `Indiquez le véhicule pour « ${c.libelle} ».`;
      }
      const motif = $("#v-motif").value.trim();
      if (!motif) return "Indiquez le motif du reclassement.";
      try { await appeler("reclasser_operation", { p_id: o.id, p_ventilation: vent, p_motif: motif }); } catch (err) { return messageErreur(err); }
      toast("Opération reclassée."); retour();
    }
  });
  const total = () => {
    const t = $$(".v-mont").reduce((s, i) => s + Number(i.value || 0), 0);
    $("#v-total").textContent = `Total ${fcfa(t)} sur ${fcfa(o.montant)} FCFA`;
    $("#v-total").className = "num " + (t === Number(o.montant) ? "discret" : "negatif");
  };
  const brancher = () => {
    $$(".v-mont").forEach(i => i.oninput = total);
    $$(".v-suppr").forEach(b => b.onclick = () => { if ($$("#v-corps tr").length > 1) { b.closest("tr").remove(); total(); } });
    total();
  };
  $("#v-ajout").onclick = () => { $("#v-corps").insertAdjacentHTML("beforeend", ligneHtml({})); brancher(); };
  brancher();
}

/* L'argent est passé par un autre compte que celui saisi (encaissement arrivé sur le sous-compte…) :
   une écriture d'OD datée du jour de l'opération le déplace, l'opération garde sa trace. */
function formulaireChangementCompte(o, retour) {
  const entree = ["Recette", "Encaissement client"].includes(o.type);
  const comptes = (etat.refs.comptes_tresorerie || []).filter(c => c.actif !== false && c.id !== o.compte_tresorerie_id
    && !(o.type === "Virement" && c.id === o.compte_destination_id));
  ouvrirModale(`Changer le compte de ${o.numero}`, `<p>${esc(o.libelle)} — <b>${fcfa(o.montant)} FCFA</b> du ${esc(dateCourte(o.date_operation))},
      ${entree ? "encaissé sur" : "payé par"} <b>${esc(o.compte_code || "")}</b>.</p>
    <p class="discret petit">À utiliser quand le relevé montre que l'argent est ${entree ? "arrivé" : "sorti"} sur un autre compte.
      Une écriture d'opérations diverses, datée du ${esc(dateCourte(o.date_operation))}, ${entree ? "retire le montant de l'ancien compte et l'ajoute au nouveau"
      : "rend le montant à l'ancien compte et le retire du nouveau"} : les deux soldes sont corrigés à la bonne date, et la trace reste.</p>
    <label for="cc-compte">${entree ? "Compte qui a réellement encaissé" : "Compte qui a réellement payé"} *</label>
    <select id="cc-compte"><option value="">—</option>${comptes.map(c => `<option value="${c.id}">${esc(c.code)} – ${esc(c.libelle)}</option>`).join("")}</select>
    <label for="cc-motif">Motif *</label><textarea id="cc-motif" placeholder="Ex. : crédité sur le sous-compte selon le relevé BGFI d'octobre"></textarea>`, {
    libelleSave: "Changer de compte",
    onSave: async () => {
      const c = $("#cc-compte").value, m = $("#cc-motif").value.trim();
      if (!c) return "Choisissez le compte.";
      if (!m) return "Indiquez le motif.";
      try { await appeler("changer_compte_operation", { p_id: o.id, p_compte: c, p_motif: m }); } catch (err) { return messageErreur(err); }
      toast("Compte changé : les deux soldes sont corrigés."); retour();
    }
  });
}

function formulaireAffectation(o, retour) {
  ouvrirModale(`Affecter ${o.numero}`, `<p>${esc(o.libelle)} — <b>${fcfa(o.montant)} FCFA</b> du ${esc(dateCourte(o.date_operation))}</p>
    <p class="discret petit">Le classeur ne disait pas quel fournisseur ce règlement payait. L'affectation renseigne le fournisseur sur l'écriture
      sans en changer les montants : la dette de ce fournisseur diminue d'autant.</p>
    <label for="af-four">Fournisseur *</label><select id="af-four" ${o.fournisseur_id ? "disabled" : ""}>${optionsRef("fournisseurs", o.fournisseur_id)}</select>
    <label for="af-achat">Achat réglé</label><select id="af-achat"><option value="">Aucun achat précis</option></select>
    <p class="aide-champ">Facultatif. Seuls les achats validés de ce fournisseur dont le reste dû couvre le règlement sont proposés.</p>`, {
    libelleSave: "Affecter",
    onSave: async () => {
      const f = $("#af-four").value;
      if (!f) return "Choisissez le fournisseur.";
      try { await appeler("affecter_reglement", { p_id: o.id, p_fournisseur: f, p_achat: $("#af-achat").value || null }); }
      catch (err) { return messageErreur(err); }
      toast("Règlement affecté."); retour();
    }
  });
  const achats = async () => {
    const f = $("#af-four").value;
    $("#af-achat").innerHTML = `<option value="">Aucun achat précis</option>`;
    if (!f) return;
    const { data } = await sb.from("v_achats").select("id, numero, date_achat, montant, reste").eq("fournisseur_id", f)
      .eq("statut", "Validé").gte("reste", o.montant).order("date_achat");
    $("#af-achat").innerHTML += (data || []).map(a => `<option value="${a.id}">${esc(a.numero)} du ${esc(dateCourte(a.date_achat))} — reste ${fcfa(a.reste)}</option>`).join("");
  };
  $("#af-four").onchange = achats;
  achats();
}

      ${o.beneficiaire ? `<tr><th>Bénéficiaire</th><td>${esc(o.beneficiaire)}</td></tr>` : ""}

      ${o.site || o.vehicule ? `<tr><th>Site · véhicule</th><td>${esc([o.site, o.vehicule].filter(Boolean).join(" · "))}</td></tr>` : ""}

    </tbody></table>

    <tbody><tr><td style="height:5rem">${esc(o.reprise ? "Reprise du classeur" : o.saisi_par_nom || "")}</td><td></td><td>${esc(o.beneficiaire || "")}</td></tr></tbody></table>`);

/* =====================================================================
   Achats : le manager (ou le comptable) saisit, le DAF valide, le trésorier paie.
   ===================================================================== */
const ONGLETS_ACHATS = [
  { k: "soumis", l: "À valider", f: a => a.statut === "Soumis" },
  { k: "brouillons", l: "Brouillons", f: a => a.statut === "Brouillon" },
  { k: "a_payer", l: "À payer", f: a => a.statut === "Validé" && !a.reprise && Number(a.reste) > 0 },
  { k: "valides", l: "Validés", f: a => a.statut === "Validé", periode: true },
  { k: "tous", l: "Tous", f: () => true, periode: true }];
const CLASSE_STATUT = { Brouillon: "inactif", Soumis: "attente", "Validé": "ok", "Annulé": "alerte" };

async function pageAchats() {
  await chargerRefsFinance(["produits_achat", "categories_produit"]);
  const defaut = peut(VALIDATION) ? "soumis" : peut(["tresorier"]) ? "a_payer" : peut(SAISIE_ACHAT) ? "brouillons" : "tous";
  let onglet = etat.param.onglet || etat.ongletAchats || defaut;
  const achats = await chargerTout(() => sb.from("v_achats").select("*").order("date_achat", { ascending: false }).order("numero", { ascending: false }));
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Achats</h1>
      <p class="discret">Le manager saisit les achats de ses catégories et les soumet ; le DAF les valide — jamais ceux qu'il a saisis lui-même ;
      le trésorier les paie. Personne ne paie un achat qu'il a saisi ou validé.${seulementManager() ? " Vous ne voyez que vos propres achats." : ""}</p></div>
      <div class="actions-ligne">${peut(SAISIE_ACHAT) ? `<button class="btn btn-principal" id="b-achat">Nouvel achat</button>` : ""}</div></div>
    <div class="panneau">
      <div class="onglets" role="tablist">${ONGLETS_ACHATS.map(o => `<button role="tab" data-onglet="${o.k}" aria-selected="${o.k === onglet}">${esc(o.l)}
        <span class="compte">${achats.filter(o.f).length}</span></button>`).join("")}</div>
      <div class="outils"><span id="zone-periode">${champsPeriode()}</span>
        <select id="f-four" aria-label="Fournisseur">${optionsRef("fournisseurs", null, undefined, "Tous les fournisseurs")}</select>
        <input type="text" id="filtre" placeholder="Rechercher…" aria-label="Rechercher">
        <span class="discret num" id="nb"></span><button class="btn pousse" id="b-export">Exporter</button></div>
      <div class="defil"><table><thead><tr><th>N°</th><th>Date</th><th>Fournisseur</th><th>Objet</th><th class="montant">Montant</th>
        <th class="montant">Réglé</th><th class="montant">Reste dû</th><th>Statut</th><th>Saisi par</th><th></th></tr></thead>
      <tbody id="corps"></tbody><tfoot id="pied"></tfoot></table></div></div>`;
  const ong = () => ONGLETS_ACHATS.find(o => o.k === onglet) || ONGLETS_ACHATS[4];
  const visibles = () => {
    const [du, au] = [`${etat.filtres.annee}-${String(etat.filtres.mois || 1).padStart(2, "0")}-01`,
      etat.filtres.mois ? `${etat.filtres.annee}-${String(etat.filtres.mois).padStart(2, "0")}-31` : `${etat.filtres.annee}-12-31`];
    const f = $("#f-four").value, q = $("#filtre").value.toLowerCase();
    return achats.filter(a => ong().f(a) && (!ong().periode || (a.date_achat >= du && a.date_achat <= au))
      && (!f || a.fournisseur_id === f) && (!q || [a.numero, a.objet, a.fournisseur, a.facture_fournisseur].join(" ").toLowerCase().includes(q)));
  };
  const resteAffiche = a => a.statut !== "Validé" ? "" : a.reprise && !Number(a.regle) ? `<span class="discret" title="Achat repris : ses règlements du classeur sont à affecter">non lettré</span>` : fcfa(a.reste);
  const dessiner = () => {
    const lignes = visibles();
    $("#zone-periode").hidden = !ong().periode;
    $("#nb").textContent = `${lignes.length} achat(s)`;
    $("#corps").innerHTML = lignes.length ? lignes.map(a => `<tr class="${a.statut === "Annulé" ? "annulee" : ""}">
      <td class="code">${esc(a.numero)}</td><td class="code">${esc(dateCourte(a.date_achat))}</td><td>${esc(a.fournisseur)}</td>
      <td>${esc(a.objet)}${a.reprise ? ` <span class="pastille inactif">Reprise</span>` : ""}</td>
      <td class="montant">${fcfa(a.montant)}</td><td class="montant">${Number(a.regle) ? fcfa(a.regle) : ""}</td><td class="montant">${resteAffiche(a)}</td>
      <td><span class="pastille ${CLASSE_STATUT[a.statut]}">${esc(a.statut)}</span></td><td>${esc(a.reprise ? "Reprise" : nomProfil(a.saisi_par))}</td>
      <td><button class="btn" data-achat="${a.id}">Ouvrir</button></td></tr>`).join("")
      : `<tr><td colspan="10" class="vide">Aucun achat dans cet onglet.</td></tr>`;
    const tot = lignes.filter(a => a.statut !== "Annulé").reduce((s, a) => s + Number(a.montant), 0);
    $("#pied").innerHTML = lignes.length ? `<tr><td colspan="4">Total (hors annulés)</td><td class="montant">${fcfa(tot)}</td><td colspan="5"></td></tr>` : "";
    $$("[data-achat]").forEach(b => b.onclick = () => ouvrirAchat(achats.find(a => a.id === b.dataset.achat), recharger));
  };
  $$("[data-onglet]").forEach(b => b.onclick = () => {
    onglet = etat.ongletAchats = b.dataset.onglet;
    $$("[data-onglet]").forEach(x => x.setAttribute("aria-selected", String(x === b)));
    dessiner();
  });
  brancherPeriode(dessiner);
  $("#f-four").onchange = dessiner; $("#filtre").oninput = dessiner;
  if ($("#b-achat")) $("#b-achat").onclick = () => formulaireAchat(null, [], recharger);
  $("#b-export").onclick = () => exporterTableau("achats.xlsx", ["N°", "Date", "Fournisseur", "Facture", "Objet", "Montant", "Réglé", "Reste dû", "Statut", "Saisi par", "Reprise"],
    visibles().map(a => [a.numero, dateCourte(a.date_achat), a.fournisseur, a.facture_fournisseur, a.objet, a.montant, a.regle, a.reste, a.statut,
      a.reprise ? "" : nomProfil(a.saisi_par), a.reprise ? a.source_reprise : ""]), `Achats — ${ong().l}`);
  dessiner();
}

async function ouvrirAchat(a, retour) {
  if (!a) return;
  const [rl, rr] = await Promise.all([
    sb.from("lignes_achat").select("*").eq("achat_id", a.id).order("created_at"),
    peut(FINANCE) ? sb.from("v_operations").select("id, numero, date_operation, montant, compte_code, payeur, annulee").eq("achat_id", a.id).order("date_operation")
      : Promise.resolve({ data: [] })]);
  if (rl.error) return toast(messageErreur(rl.error), true);
  const lignes = rl.data || [], regs = rr.data || [];
  const moi = etat.profil.id, auteur = a.saisi_par === moi;
  const actions = [];
  if (a.statut === "Brouillon" && auteur) actions.push(`<button type="button" class="btn btn-principal" id="a-soumettre">Soumettre au DAF</button>`,
    `<button type="button" class="btn" id="a-modifier">Modifier</button>`, `<button type="button" class="btn btn-danger" id="a-supprimer">Supprimer le brouillon</button>`);
  if (a.statut === "Soumis" && peut(VALIDATION) && !auteur) actions.push(`<button type="button" class="btn btn-principal" id="a-valider">Valider</button>`,
    `<button type="button" class="btn" id="a-renvoyer">Renvoyer pour correction</button>`);
  const payable = a.statut === "Validé" && Number(a.reste) > 0 && peut(PAIEMENT) && ![a.saisi_par, a.valide_par].includes(moi);
  if (payable) actions.push(`<button type="button" class="btn btn-principal" id="a-payer">Payer</button>`);
  actions.push(`<button type="button" class="btn" id="a-imprimer">Imprimer</button>`);
  if ((["Brouillon", "Soumis"].includes(a.statut) && (auteur || peut(VALIDATION)) && a.statut !== "Brouillon") || (a.statut === "Validé" && peut(VALIDATION)))
    actions.push(`<button type="button" class="btn btn-danger" id="a-annuler">Annuler l'achat</button>`);
  const note = a.statut === "Soumis" && peut(VALIDATION) && auteur ? `<div class="info">Vous avez saisi cet achat : un autre membre de la direction doit le valider.</div>`
    : a.statut === "Validé" && Number(a.reste) > 0 && peut(PAIEMENT) && !payable ? `<div class="info">Vous avez saisi ou validé cet achat : un autre que vous doit le payer.</div>` : "";
  ouvrirModale(`Achat ${a.numero}`, `${note}
    <dl class="fiche">
      <dt>Statut</dt><dd><span class="pastille ${CLASSE_STATUT[a.statut]}">${esc(a.statut)}</span>${a.reprise ? ` · repris du classeur (${esc(a.source_reprise || "")})` : ""}</dd>
      <dt>Fournisseur</dt><dd>${esc(a.fournisseur)}</dd><dt>Objet</dt><dd>${esc(a.objet)}</dd>
      <dt>Date</dt><dd>${esc(dateCourte(a.date_achat))}${a.facture_fournisseur ? ` · facture ${esc(a.facture_fournisseur)}${a.date_facture ? " du " + esc(dateCourte(a.date_facture)) : ""}` : ""}</dd>
      <dt>Montant</dt><dd><b>${fcfa(a.montant)} FCFA</b>${a.statut === "Validé" ? ` · réglé ${fcfa(a.regle)} · reste ${fcfa(a.reste)}` : ""}</dd>
      ${a.reprise ? "" : `<dt>Saisi par</dt><dd>${esc(nomProfil(a.saisi_par))}${a.soumis_le ? " · soumis le " + esc(dateHeure(a.soumis_le)) : ""}</dd>`}
      ${a.valide_par ? `<dt>Validé par</dt><dd>${esc(nomProfil(a.valide_par))} · ${esc(dateHeure(a.valide_le))}</dd>` : ""}
      ${a.observation ? `<dt>Observations</dt><dd style="white-space:pre-line">${esc(a.observation)}</dd>` : ""}
    </dl>
    <div class="defil"><table><thead><tr><th>Catégorie</th><th>Désignation</th><th class="montant">Qté</th><th class="montant">Prix unitaire</th><th class="montant">Montant</th></tr></thead>
    <tbody>${lignes.map(l => `<tr><td>${esc(categorie(l.categorie_id).libelle || "")}</td><td>${esc(l.designation)}</td>
      <td class="montant">${esc(Number(l.quantite).toLocaleString("fr-FR"))}</td><td class="montant">${fcfa(l.prix_unitaire)}</td><td class="montant">${fcfa(l.montant)}</td></tr>`).join("")
      || `<tr><td colspan="5" class="vide">Aucune ligne.</td></tr>`}</tbody></table></div>
    ${regs.length ? `<h2 style="margin-top:1.25rem">Règlements</h2><div class="defil"><table><tbody>${regs.map(r => `<tr class="${r.annulee ? "annulee" : ""}">
      <td class="code">${esc(r.numero)}</td><td>${esc(dateCourte(r.date_operation))}</td><td>${esc(r.payeur === "Trésorerie" ? r.compte_code : r.payeur)}</td>
      <td class="montant">${fcfa(r.montant)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    <div class="barre-actions">${actions.join("")}</div>`, { large: true });
  const clic = (id, fn) => { if ($("#" + id)) $("#" + id).onclick = fn; };
  const circuit = async (fonction, message) => {
    try { await appeler(fonction, { p_id: a.id }); } catch (err) { return toast(messageErreur(err), true); }
    $("#modale").close(); toast(message); retour();
  };
  clic("a-soumettre", () => circuit("soumettre_achat", "Achat soumis au DAF."));
  clic("a-valider", () => circuit("valider_achat", "Achat validé : il est comptabilisé et peut être payé."));
  clic("a-modifier", () => formulaireAchat(a, lignes, retour));
  clic("a-supprimer", async () => {
    if (!confirm("Supprimer ce brouillon ? La suppression sera tracée dans le journal.")) return;
    const { error } = await sb.from("achats").delete().eq("id", a.id);
    if (error) return toast(messageErreur(error), true);
    $("#modale").close(); toast("Brouillon supprimé."); retour();
  });
  clic("a-renvoyer", () => formulaireMotif(`Renvoyer ${a.numero}`, "L'achat revient en brouillon chez son auteur, avec votre motif.",
    "renvoyer_achat", { p_id: a.id }, "Renvoyer", "Achat renvoyé à son auteur.", retour));
  clic("a-annuler", () => formulaireMotif(`Annuler ${a.numero}`, a.statut === "Validé"
    ? "L'écriture de l'achat est extournée. Un achat déjà réglé ne s'annule qu'après l'annulation de ses règlements." : "L'achat est abandonné ; il reste visible, annulé.",
    "annuler_achat", { p_id: a.id }, "Confirmer l'annulation", "Achat annulé.", retour));
  clic("a-payer", () => formulaireReglement(a, retour));
  clic("a-imprimer", () => imprimerAchat(a, lignes, regs));
}

function formulaireAchat(a, lignesExistantes, retour) {
  const manager = seulementManager();
  const mesCats = (etat.refs.categories_produit || []).filter(c => c.manager_id === etat.profil.id).map(c => c.id);
  const filtreCat = c => ["Charge", "Immobilisation"].includes(c.nature) && (!manager || c.groupe === "Achats de marchandises");
  const produits = (etat.refs.produits_achat || []).filter(p => p.actif !== false && (!manager || mesCats.includes(p.categorie_id)));
  const achm = (etat.refs.categories_op || []).find(c => c.code === "ACHM");
  const optProduits = v => `<option value="">—</option>` + produits.map(p => `<option value="${p.id}" ${p.id === v ? "selected" : ""}>${esc(p.reference)} – ${esc(p.designation)}</option>`).join("");
  const ligneHtml = l => `<tr>
    <td><select class="l-cat" aria-label="Catégorie">${optionsCategories(filtreCat, l.categorie_id || (achm ? achm.id : null))}</select></td>
    <td><select class="l-prod" aria-label="Produit">${optProduits(l.produit_id)}</select></td>
    <td><input type="text" class="l-des" value="${esc(l.designation || "")}" aria-label="Désignation"></td>
    <td><input type="number" class="l-qte" min="0" step="any" value="${esc(l.quantite ?? 1)}" aria-label="Quantité" style="width:5rem"></td>
    <td><input type="number" class="l-pu" min="0" step="1" value="${esc(l.prix_unitaire ?? "")}" aria-label="Prix unitaire" style="width:7.5rem"></td>
    <td class="montant l-mont"></td><td><button type="button" class="btn-lien l-suppr">Retirer</button></td></tr>`;
  const x = a || {};
  ouvrirModale(a ? `Modifier ${a.numero}` : "Nouvel achat", `
    <div class="grille2">
      <div><label for="ac-four">Fournisseur *</label><select id="ac-four">${optionsRef("fournisseurs", x.fournisseur_id)}</select></div>
      <div><label for="ac-objet">Objet *</label><input type="text" id="ac-objet" value="${esc(x.objet || "")}"></div>
      <div><label for="ac-date">Date de l'achat *</label><input type="date" id="ac-date" value="${esc(x.date_achat || aujourdhui())}"></div>
      <div><label for="ac-fact">N° de facture du fournisseur</label><input type="text" id="ac-fact" value="${esc(x.facture_fournisseur || "")}"></div>
      <div><label for="ac-dfact">Date de la facture</label><input type="date" id="ac-dfact" value="${esc(x.date_facture || "")}"></div>
      <div><label for="ac-act">Activité</label><select id="ac-act">${optionsRef("activites", x.activite_id, undefined, "Structure (aucune activité)")}</select></div>
      <div><label for="ac-site">Bureau ou site</label><select id="ac-site">${optionsRef("sites", x.site_id, undefined, "Aucun")}</select></div>
    </div>
    <h2 style="margin-top:1.25rem">Lignes</h2>
    <div class="defil"><table class="saisie"><thead><tr><th>Catégorie</th><th>Produit</th><th>Désignation</th><th>Qté</th><th>Prix unitaire</th><th class="montant">Montant</th><th></th></tr></thead>
    <tbody id="ac-lignes">${(lignesExistantes.length ? lignesExistantes : [{}]).map(ligneHtml).join("")}</tbody>
    <tfoot><tr><td colspan="5"><button type="button" class="btn" id="ac-ajout">Ajouter une ligne</button></td><td class="montant" id="ac-total"></td><td></td></tr></tfoot></table></div>
    <label for="ac-obs">Observation</label><textarea id="ac-obs">${esc(x.observation || "")}</textarea>
    <p class="discret petit">L'achat est enregistré en brouillon. Ouvrez-le ensuite pour le soumettre au DAF.
      ${manager ? "Vous n'achetez que les produits de vos catégories." : ""}</p>`, {
    large: true, libelleSave: "Enregistrer le brouillon",
    onSave: async () => {
      const entete = { fournisseur_id: $("#ac-four").value || null, objet: $("#ac-objet").value.trim(), date_achat: $("#ac-date").value || null,
        facture_fournisseur: $("#ac-fact").value.trim() || null, date_facture: $("#ac-dfact").value || null,
        activite_id: $("#ac-act").value || null, site_id: $("#ac-site").value || null, observation: $("#ac-obs").value.trim() || null };
      if (!entete.fournisseur_id || !entete.objet || !entete.date_achat) return "Le fournisseur, l'objet et la date sont obligatoires.";
      const ls = $$("#ac-lignes tr").map(tr => ({ categorie_id: $(".l-cat", tr).value || null, produit_id: $(".l-prod", tr).value || null,
        designation: $(".l-des", tr).value.trim(), quantite: Number($(".l-qte", tr).value || 0), prix_unitaire: Number($(".l-pu", tr).value || 0) }))
        .filter(l => l.produit_id || l.designation || l.prix_unitaire);
      if (!ls.length) return "Ajoutez au moins une ligne.";
      for (const [i, l] of ls.entries()) {
        const c = categorie(l.categorie_id);
        if (!l.categorie_id) return `Ligne ${i + 1} : choisissez la catégorie.`;
        if (estMarchandise(c) && !l.produit_id) return `Ligne ${i + 1} : un achat de marchandises désigne le produit acheté.`;
        if (!estMarchandise(c)) l.produit_id = null;
        if (!l.designation) l.designation = ((produits.find(p => p.id === l.produit_id)) || {}).designation || "";
        if (!l.designation) return `Ligne ${i + 1} : indiquez la désignation.`;
        if (!(l.quantite > 0)) return `Ligne ${i + 1} : la quantité doit être positive.`;
        if (!(l.prix_unitaire >= 0)) return `Ligne ${i + 1} : prix unitaire invalide.`;
      }
      let id = a && a.id;
      if (a) {
        const { error } = await sb.from("achats").update(entete).eq("id", a.id);
        if (error) return messageErreur(error);
        const { error: e2 } = await sb.from("lignes_achat").delete().eq("achat_id", a.id);
        if (e2) return messageErreur(e2);
      } else {
        const { data, error } = await sb.from("achats").insert(entete).select("id").single();
        if (error) return messageErreur(error);
        id = data.id;
      }
      const { error: e3 } = await sb.from("lignes_achat").insert(ls.map(l => ({ ...l, achat_id: id })));
      if (e3) return messageErreur(e3) + " L'en-tête est enregistré en brouillon : corrigez les lignes.";
      toast("Achat enregistré en brouillon."); retour();
    }
  });
  const calculer = () => {
    let total = 0;
    $$("#ac-lignes tr").forEach(tr => {
      const m = Math.round(Number($(".l-qte", tr).value || 0) * Number($(".l-pu", tr).value || 0));
      total += m; $(".l-mont", tr).textContent = fcfa(m);
      const marchandise = estMarchandise(categorie($(".l-cat", tr).value));
      $(".l-prod", tr).disabled = !marchandise;
    });
    $("#ac-total").textContent = fcfa(total);
  };
  const brancher = () => {
    $$("#ac-lignes tr").forEach(tr => {
      [".l-qte", ".l-pu"].forEach(s => $(s, tr).oninput = calculer);
      $(".l-cat", tr).onchange = calculer;
      $(".l-prod", tr).onchange = () => { const p = produits.find(p => p.id === $(".l-prod", tr).value); if (p && !$(".l-des", tr).value) $(".l-des", tr).value = p.designation; };
      $(".l-suppr", tr).onclick = () => { if ($$("#ac-lignes tr").length > 1) { tr.remove(); calculer(); } };
    });
    calculer();
  };
  $("#ac-ajout").onclick = () => { $("#ac-lignes").insertAdjacentHTML("beforeend", ligneHtml({})); brancher(); };
  brancher();
}

function formulaireReglement(a, retour) {
  const comptes = (etat.refs.comptes_tresorerie || []).filter(c => c.actif !== false);
  ouvrirModale(`Payer ${a.numero}`, `<p>${esc(a.fournisseur)} — ${esc(a.objet)}<br>Reste dû : <b>${fcfa(a.reste)} FCFA</b></p>
    ${a.reprise ? `<div class="info">Achat repris du classeur : vérifiez qu'il n'a pas déjà été payé. Les règlements de marchandises du classeur
      ne disaient pas quel fournisseur ils payaient ; ils figurent en Trésorerie, « à affecter ».</div>` : ""}
    <div class="grille2">
      <div><label for="rg-date">Date *</label><input type="date" id="rg-date" value="${aujourdhui()}"></div>
      ${peut(EXPLOITANT) ? `<div><label for="rg-payeur">Payé par</label><select id="rg-payeur"><option>Trésorerie</option><option>CEO</option><option>Guest Cameroun</option></select></div>` : ""}
      <div><label for="rg-compte">Compte qui paie *</label><select id="rg-compte"><option value="">—</option>${comptes.map(c =>
        `<option value="${c.id}">${esc(c.code)} – ${esc(c.libelle)}</option>`).join("")}</select></div>
      <div><label for="rg-montant">Montant (FCFA) *</label><input type="number" id="rg-montant" min="1" step="1" value="${Number(a.reste)}"></div>
      <div><label for="rg-piece">Pièce justificative</label><input type="text" id="rg-piece" placeholder="N° de chèque, de reçu…"></div>
    </div>`, {
    libelleSave: "Enregistrer le règlement",
    onSave: async () => {
      const payeur = $("#rg-payeur") ? $("#rg-payeur").value : "Trésorerie";
      const d = { type: "Règlement fournisseur", achat_id: a.id, payeur, date_operation: $("#rg-date").value || null,
        compte_tresorerie_id: payeur === "Trésorerie" ? $("#rg-compte").value || null : null, montant: Number($("#rg-montant").value || 0),
        libelle: `Règlement ${a.numero} — ${a.fournisseur}`, piece_justificative: $("#rg-piece").value.trim() || null };
      if (!d.date_operation) return "Indiquez la date.";
      if (payeur === "Trésorerie" && !d.compte_tresorerie_id) return "Choisissez le compte qui paie.";
      if (!(d.montant > 0) || !Number.isInteger(d.montant)) return "Le montant doit être un nombre entier positif.";
      if (d.montant > Number(a.reste)) return `Le règlement dépasse le reste dû (${fcfa(a.reste)} FCFA).`;
      const { data, error } = await sb.from("operations_tresorerie").insert(d).select("numero").single();
      if (error) return messageErreur(error);
      toast(`Règlement ${data && data.numero ? data.numero + " " : ""}enregistré.`); retour();
    }
  });
  if ($("#rg-payeur")) $("#rg-payeur").onchange = () => { $("#rg-compte").disabled = $("#rg-payeur").value !== "Trésorerie"; };
}

function imprimerAchat(a, lignes, regs) {
  imprimerHtml(`Achat ${a.numero}`, `<h1>Bon d'achat n° ${esc(a.numero)}</h1>
    <p class="discret">Du ${esc(dateCourte(a.date_achat))} · statut : ${esc(a.statut)}</p>
    <table><tbody><tr><th style="width:30%">Fournisseur</th><td>${esc(a.fournisseur)} (${esc(a.fournisseur_code || "")})</td></tr>
      <tr><th>Objet</th><td>${esc(a.objet)}</td></tr>
      ${a.facture_fournisseur ? `<tr><th>Facture du fournisseur</th><td>${esc(a.facture_fournisseur)}${a.date_facture ? " du " + esc(dateCourte(a.date_facture)) : ""}</td></tr>` : ""}</tbody></table>
    <table><thead><tr><th>Désignation</th><th style="text-align:right">Qté</th><th style="text-align:right">Prix unitaire</th><th style="text-align:right">Montant</th></tr></thead><tbody>
    ${lignes.map(l => `<tr><td>${esc(l.designation)}</td><td style="text-align:right">${esc(Number(l.quantite).toLocaleString("fr-FR"))}</td>
      <td style="text-align:right">${fcfa(l.prix_unitaire)}</td><td style="text-align:right">${fcfa(l.montant)}</td></tr>`).join("")}
    <tr><th colspan="3">Total (FCFA)</th><th style="text-align:right">${fcfa(a.montant)}</th></tr></tbody></table>
    ${regs.length ? `<h2>Règlements</h2><table><tbody>${regs.filter(r => !r.annulee).map(r => `<tr><td>${esc(r.numero)}</td><td>${esc(dateCourte(r.date_operation))}</td>
      <td style="text-align:right">${fcfa(r.montant)}</td></tr>`).join("")}</tbody></table>` : ""}
    <table style="margin-top:2.5rem"><thead><tr><th>Saisi par</th><th>Validé par le DAF</th><th>Payé par</th></tr></thead>
    <tbody><tr><td style="height:5rem">${esc(a.reprise ? "Reprise du classeur" : nomProfil(a.saisi_par))}</td><td>${esc(nomProfil(a.valide_par))}</td><td></td></tr></tbody></table>`);
}

async function pageDettes() {
  await chargerRefsFinance();
  const [{ data: soldes, error }, aPayer] = await Promise.all([
    sb.from("v_soldes_fournisseurs").select("*").order("solde", { ascending: false }),
    chargerTout(() => sb.from("v_achats").select("*").eq("statut", "Validé").gt("reste", 0).order("date_achat"))]);
  if (error) throw error;
  const lignes = (soldes || []).filter(s => Number(s.solde) !== 0);
  const aAffecter = lignes.find(s => !s.fournisseur_id);
  const dettes = lignes.filter(s => s.fournisseur_id);
  const total = dettes.reduce((t, s) => t + Number(s.solde), 0);
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Dettes fournisseurs</h1>
      <p class="discret">Ce que l'entreprise doit à chaque fournisseur, d'après le compte 401 : factures validées moins règlements.</p></div>
      <div class="actions-ligne"><button class="btn" id="b-export">Exporter</button></div></div>
    ${aAffecter ? `<div class="info"><b>${fcfa(Math.abs(aAffecter.solde))} FCFA de règlements de marchandises</b> repris du classeur ne disent pas quel fournisseur ils ont payé.
      Tant qu'ils ne sont pas affectés, les dettes ci-dessous sont surestimées d'autant.${peut(CORRECTION) ? " Affectez-les ci-dessous : une suggestion est proposée pour la plupart." : ""}</div>
      ${peut(CORRECTION) ? `<div id="bloc-affectation"><p class="vide">Recherche des achats correspondants…</p></div>` : ""}` : ""}
    <div class="panneau defil"><table><thead><tr><th>Code</th><th>Fournisseur</th><th class="montant">Facturé</th><th class="montant">Réglé</th><th class="montant">Solde dû</th><th></th></tr></thead>
    <tbody>${dettes.map(s => `<tr><td class="code">${esc(s.code)}</td><td>${esc(s.fournisseur)}</td><td class="montant">${fcfa(s.facture)}</td>
      <td class="montant">${fcfa(s.regle)}</td><td class="montant ${Number(s.solde) < 0 ? "negatif" : ""}">${fcfa(s.solde)}</td>
      <td><button class="btn-lien" data-aller="grand_livre" data-param='${esc(JSON.stringify({ compte: "401", fournisseur: s.fournisseur_id }))}'>Détail</button></td></tr>`).join("")
      || `<tr><td colspan="6" class="vide">Aucune dette fournisseur.</td></tr>`}</tbody>
    <tfoot><tr><td colspan="4">Total dû aux fournisseurs</td><td class="montant">${fcfa(total)}</td><td></td></tr></tfoot></table></div>
    <h2 class="titre-section">Achats validés restant à payer</h2>
    <div class="panneau defil"><table><thead><tr><th>N°</th><th>Date</th><th>Fournisseur</th><th>Objet</th><th class="montant">Montant</th><th class="montant">Reste dû</th><th></th></tr></thead>
    <tbody>${aPayer.map(a => `<tr><td class="code">${esc(a.numero)}</td><td class="code">${esc(dateCourte(a.date_achat))}</td><td>${esc(a.fournisseur)}</td>
      <td>${esc(a.objet)}${a.reprise ? ` <span class="pastille inactif" title="Ses règlements du classeur peuvent être parmi les règlements à affecter">Reprise</span>` : ""}</td>
      <td class="montant">${fcfa(a.montant)}</td><td class="montant">${fcfa(a.reste)}</td><td><button class="btn" data-achat="${a.id}">Ouvrir</button></td></tr>`).join("")
      || `<tr><td colspan="7" class="vide">Aucun achat à payer.</td></tr>`}</tbody></table></div>`;
  brancherAller();
  $$("[data-achat]").forEach(b => b.onclick = () => ouvrirAchat(aPayer.find(a => a.id === b.dataset.achat), recharger));

  $("#b-export").onclick = () => exporterTableau("dettes_fournisseurs.xlsx", ["Code", "Fournisseur", "Facturé", "Réglé", "Solde dû"],
    lignes.map(s => [s.code || "", s.fournisseur, s.facture, s.regle, s.solde]), "Dettes fournisseurs");
}

/* Paiements sans fournisseur : suggestion (achat du même montant, achats du jour, nom dans le libellé),
   acceptée d'un clic, choisie à la main, ou répartie entre plusieurs fournisseurs. Rien n'est affecté sans le DAF. */
async function blocAffectation() {
  const [ops, sug] = await Promise.all([
    chargerTout(() => sb.from("v_operations").select("*").eq("type", "Règlement fournisseur").is("fournisseur_id", null).eq("annulee", false).order("date_operation")),
    appeler("suggestions_affectation")]);
  const liste = ops.filter(o => !o.ventilation);
  const sugg = Object.fromEntries((sug || []).map(x => [x.operation_id, x]));
  $("#bloc-affectation").innerHTML = `<h2 class="titre-section">Paiements à affecter (${liste.length})</h2>
    <div class="panneau"><div class="outils"><select id="af-filtre" aria-label="Filtre"><option value="">Tous</option><option value="oui">Avec une suggestion</option><option value="non">Sans suggestion</option></select>
      <span class="discret petit">« Accepter » renseigne le fournisseur (et l'achat) sur le paiement : aucun montant ne change, la dette du fournisseur diminue d'autant.</span></div>
    <div class="defil"><table><thead><tr><th>Date</th><th>Payé par</th><th>Libellé</th><th class="montant">Montant</th><th>Suggestion</th><th></th></tr></thead><tbody id="af-corps"></tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="montant" id="af-total"></td><td colspan="2"></td></tr></tfoot></table></div></div>`;
  const dessiner = () => {
    const f = $("#af-filtre").value;
    const vis = liste.filter(o => { const x = sugg[o.id] || {}; const a = !!(x.fournisseur_id || x.parts); return !f || (f === "oui") === a; });
    $("#af-total").textContent = fcfa(vis.reduce((t, o) => t + Number(o.montant), 0));
    $("#af-corps").innerHTML = vis.map(o => { const x = sugg[o.id] || {};
      const prop = x.fournisseur_id ? `<b>${esc(x.fournisseur)}</b>${x.achat_numero ? ` · ${esc(x.achat_numero)} du ${esc(dateCourte(x.date_achat))}` : x.date_achat ? ` · achats du ${esc(dateCourte(x.date_achat))}` : ""}<div class="discret petit">${esc(x.regle)}</div>`
        : x.parts ? `${x.parts.map(p => `${esc(p.fournisseur)} ${fcfa(p.montant)}`).join(" + ")}<div class="discret petit">${esc(x.regle)} (${esc(dateCourte(x.date_achat))})</div>` : `<span class="discret">—</span>`;
      return `<tr><td class="code">${esc(dateCourte(o.date_operation))}</td><td>${esc(libCompteOp(o))}<div class="discret petit">${esc(o.numero)}</div></td>
        <td>${esc(o.libelle)}</td><td class="montant">${fcfa(o.montant)}</td><td>${prop}</td>
        <td class="actions-ligne">${x.fournisseur_id || x.parts ? `<button class="btn btn-principal" data-accepter="${o.id}">Accepter</button>` : ""}
          <button class="btn" data-choisir="${o.id}">Choisir…</button><button class="btn" data-repartir="${o.id}">Répartir…</button></td></tr>`; }).join("")
      || `<tr><td colspan="6" class="vide">Aucun paiement à affecter.</td></tr>`;
    const op = id => liste.find(o => o.id === id);
    $$("[data-accepter]").forEach(b => b.onclick = async () => {
      const x = sugg[b.dataset.accepter]; b.disabled = true;
      try {
        if (x.parts) await appeler("repartir_reglement", { p_id: x.operation_id, p_parts: x.parts.map(p => ({ fournisseur_id: p.fournisseur_id, montant: p.montant })), p_motif: "Suggestion acceptée" });
        else await appeler("affecter_reglement", { p_id: x.operation_id, p_fournisseur: x.fournisseur_id, p_achat: x.achat_id || null });
      } catch (err) { b.disabled = false; return toast(messageErreur(err), true); }
      toast("Paiement affecté."); recharger();
    });
    $$("[data-choisir]").forEach(b => b.onclick = () => formulaireAffectation(op(b.dataset.choisir), recharger));
    $$("[data-repartir]").forEach(b => b.onclick = () => formulaireRepartition(op(b.dataset.repartir), (sugg[b.dataset.repartir] || {}).parts, recharger));
  };
  $("#af-filtre").onchange = dessiner; dessiner();
}

function formulaireRepartition(o, parts, retour) {
  const ligne = p => `<tr><td><select class="rp-four" aria-label="Fournisseur">${optionsRef("fournisseurs", p.fournisseur_id || null)}</select></td>
    <td><input type="number" class="rp-mt" min="1" step="1" value="${esc(p.montant ?? "")}" aria-label="Montant" style="width:9rem"></td>
    <td><button type="button" class="btn-lien rp-suppr">Retirer</button></td></tr>`;
  const init = parts && parts.length ? parts : [{}, {}];
  ouvrirModale(`Répartir ${o.numero}`, `<p>${esc(o.libelle)} — <b>${fcfa(o.montant)} FCFA</b> du ${esc(dateCourte(o.date_operation))}</p>
    <p class="discret petit">Pour un paiement qui a réglé plusieurs fournisseurs. Une écriture d'opérations diverses, datée du jour du paiement, porte chaque part sur son fournisseur.</p>
    <div class="defil"><table class="saisie"><thead><tr><th>Fournisseur</th><th>Montant</th><th></th></tr></thead><tbody id="rp-corps">${init.map(ligne).join("")}</tbody></table></div>
    <p><button type="button" class="btn" id="rp-ajout">Ajouter un fournisseur</button> <span id="rp-total" class="num"></span></p>
    <label for="rp-motif">Observation</label><input type="text" id="rp-motif">`, {
    large: true, libelleSave: "Répartir",
    onSave: async () => {
      const p = $$("#rp-corps tr").map(tr => ({ fournisseur_id: $(".rp-four", tr).value || null, montant: Number($(".rp-mt", tr).value || 0) }));
      if (p.length < 2) return "Indiquez au moins deux fournisseurs (sinon, utilisez « Choisir… »).";
      if (p.some(x => !x.fournisseur_id || !(x.montant > 0))) return "Chaque ligne a un fournisseur et un montant positif.";
      const t = p.reduce((s, x) => s + x.montant, 0);
      if (t !== Number(o.montant)) return `Le total (${fcfa(t)}) doit égaler le paiement (${fcfa(o.montant)} FCFA).`;
      try { await appeler("repartir_reglement", { p_id: o.id, p_parts: p, p_motif: $("#rp-motif").value || null }); } catch (err) { return messageErreur(err); }
      toast("Paiement réparti."); retour();
    }
  });
  const total = () => { const t = $$(".rp-mt").reduce((s, i) => s + Number(i.value || 0), 0);
    $("#rp-total").textContent = `Total ${fcfa(t)} sur ${fcfa(o.montant)} FCFA`; $("#rp-total").className = "num " + (t === Number(o.montant) ? "discret" : "negatif"); };
  const brancher = () => { $$(".rp-mt").forEach(i => i.oninput = total); $$(".rp-suppr").forEach(b => b.onclick = () => { b.closest("tr").remove(); total(); }); total(); };
  $("#rp-ajout").onclick = () => { $("#rp-corps").insertAdjacentHTML("beforeend", ligne({})); brancher(); };
  brancher();
}

/* =====================================================================
   Consultation par période : mois en colonnes, catégorie (ou site,
   activité, véhicule…) en lignes ; chaque case s'ouvre sur ses écritures.
   ===================================================================== */
const AXES = {
  categorie: { l: "Catégorie", cle: "categorie_id", lib: r => r.categorie || "Sans catégorie" },
  groupe: { l: "Groupe de catégories", cle: "groupe", lib: r => r.groupe || "Sans groupe" },
  compte: { l: "Compte", cle: "compte", lib: r => `${r.compte} – ${r.compte_libelle}` },
  site: { l: "Bureau ou site", cle: "site_id", lib: r => r.site || "Sans site" },
  activite: { l: "Activité", cle: "activite_id", lib: r => r.activite || "Structure (sans activité)" },
  vehicule: { l: "Véhicule", cle: "vehicule_id", lib: r => r.vehicule || "Sans véhicule" },
  fournisseur: { l: "Fournisseur", cle: "fournisseur_id", lib: r => r.fournisseur || "Sans fournisseur" },
  client: { l: "Client", cle: "client_id", lib: r => r.client || "Sans client" }
};
const PERIMETRES = {
  charges: { l: "Charges", classes: [6], signe: r => r.debit - r.credit },
  produits: { l: "Produits", classes: [7], signe: r => r.credit - r.debit },
  resultat: { l: "Résultat (produits − charges)", classes: [6, 7], signe: r => r.credit - r.debit },
  immobilisations: { l: "Immobilisations", classes: [2], signe: r => r.debit - r.credit },
  exploitant: { l: "Compte de l'exploitant", classes: [1], filtre: r => String(r.compte).startsWith("104"), signe: r => r.credit - r.debit }
};

async function pageConsultation() {
  await chargerRefsFinance();
  const c = etat.consult = etat.consult || { axe: "categorie", perimetre: "charges", activite: "" };
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Consultation par période</h1>
      <p class="discret">Les montants de l'année, mois par mois, d'après les écritures : ce qui a été dépensé ou gagné, par catégorie, par bureau, par activité ou par véhicule.
      Cliquez sur un montant pour voir les opérations qui le composent.</p></div>
      <div class="actions-ligne"><button class="btn" id="b-export">Exporter</button></div></div>
    <div class="panneau"><div class="outils">
      <select id="p-annee-seule" aria-label="Année">${[2026, 2027].map(a => `<option ${a === Number(etat.filtres.annee) ? "selected" : ""}>${a}</option>`).join("")}</select>
      <select id="c-perimetre" aria-label="Périmètre">${Object.entries(PERIMETRES).map(([k, p]) => `<option value="${k}" ${k === c.perimetre ? "selected" : ""}>${esc(p.l)}</option>`).join("")}</select>
      <label class="discret" style="margin:0" for="c-axe">par</label>
      <select id="c-axe">${Object.entries(AXES).map(([k, a]) => `<option value="${k}" ${k === c.axe ? "selected" : ""}>${esc(a.l)}</option>`).join("")}</select>
      <select id="c-activite" aria-label="Activité"><option value="">Toutes les activités</option><option value="STRUCT" ${c.activite === "STRUCT" ? "selected" : ""}>Structure (sans activité)</option>
        ${(etat.refs.activites || []).map(a => `<option value="${a.id}" ${a.id === c.activite ? "selected" : ""}>${esc(libActivite(a))}</option>`).join("")}</select>
      <span class="discret num pousse" id="nb"></span></div>
    <div class="defil" id="pivot"><div class="vide">Chargement…</div></div></div>`;
  let lignes = [], tableau = null;
  const charger = async () => {
    $("#pivot").innerHTML = `<div class="vide">Chargement…</div>`;
    const p = PERIMETRES[c.perimetre];
    lignes = (await chargerTout(() => sb.from("v_lignes_ecriture").select("id, compte, compte_libelle, classe, debit, credit, mois, date_ecriture, numero, journal_code, libelle, categorie_id, categorie, groupe, site_id, site, activite_id, activite, vehicule_id, vehicule, fournisseur_id, fournisseur, client_id, client, origine, origine_id")
      .eq("annee", etat.filtres.annee).in("classe", p.classes).order("id"))).filter(r => !p.filtre || p.filtre(r));
    dessiner();
  };
  const dessiner = () => {
    const p = PERIMETRES[c.perimetre], axe = AXES[c.axe];
    const retenues = lignes.filter(r => !c.activite || (c.activite === "STRUCT" ? !r.activite_id : r.activite_id === c.activite));
    const groupes = new Map();
    for (const r of retenues) {
      const k = r[axe.cle] ?? "∅";
      if (!groupes.has(k)) groupes.set(k, { lib: axe.lib(r), mois: Array(12).fill(0), total: 0 });
      const g = groupes.get(k), v = p.signe({ debit: Number(r.debit), credit: Number(r.credit) });
      g.mois[r.mois - 1] += v; g.total += v;
    }
    const rangs = [...groupes.entries()].filter(([, g]) => g.mois.some(v => v !== 0)).sort((a, b) => Math.abs(b[1].total) - Math.abs(a[1].total));
    const totaux = Array(12).fill(0).map((_, m) => rangs.reduce((s, [, g]) => s + g.mois[m], 0));
    const general = totaux.reduce((s, v) => s + v, 0);
    tableau = { rangs, totaux, general };
    $("#nb").textContent = `${retenues.length} ligne(s) d'écriture`;
    const cel = (v, k, m) => `<td class="montant clic ${v < 0 ? "negatif" : ""}" data-k="${esc(k)}" data-m="${m}">${v ? fcfa(v) : ""}</td>`;
    $("#pivot").innerHTML = rangs.length ? `<table class="pivot"><thead><tr><th>${esc(axe.l)}</th>${MOIS_COURT.map(m => `<th class="montant">${m}</th>`).join("")}<th class="montant">Total</th></tr></thead>
      <tbody>${rangs.map(([k, g]) => `<tr><td>${esc(g.lib)}</td>${g.mois.map((v, m) => cel(v, k, m + 1)).join("")}${cel(g.total, k, "")}</tr>`).join("")}</tbody>
      <tfoot><tr><td>${c.perimetre === "resultat" ? "Résultat" : "Total"}</td>${totaux.map((v, m) => cel(v, "*", m + 1)).join("")}${cel(general, "*", "")}</tr></tfoot></table>`
      : `<div class="vide">Aucun montant pour ces critères en ${esc(etat.filtres.annee)}.</div>`;
    $$("#pivot td.clic").forEach(td => td.onclick = () => {
      const k = td.dataset.k, m = td.dataset.m ? Number(td.dataset.m) : null;
      const detail = retenues.filter(r => (k === "*" || String(r[axe.cle] ?? "∅") === k) && (!m || r.mois === m));
      if (!detail.length) return;
      const titre = `${k === "*" ? p.l : groupes.get(rangs.find(([x]) => String(x) === k)[0]).lib} — ${m ? MOIS[m - 1] + " " : ""}${etat.filtres.annee}`;
      detailLignes(titre, detail, p.signe);
    });
  };
  $("#p-annee-seule").onchange = () => { etat.filtres.annee = Number($("#p-annee-seule").value); charger(); };
  $("#c-perimetre").onchange = () => { c.perimetre = $("#c-perimetre").value; charger(); };
  $("#c-axe").onchange = () => { c.axe = $("#c-axe").value; dessiner(); };
  $("#c-activite").onchange = () => { c.activite = $("#c-activite").value; dessiner(); };
  $("#b-export").onclick = () => {
    if (!tableau) return;
    exporterTableau(`consultation_${etat.filtres.annee}.xlsx`, [AXES[c.axe].l, ...MOIS, "Total"],
      [...tableau.rangs.map(([, g]) => [g.lib, ...g.mois.map(v => Math.round(v)), Math.round(g.total)]),
        [c.perimetre === "resultat" ? "Résultat" : "Total", ...tableau.totaux.map(v => Math.round(v)), Math.round(tableau.general)]],
      `${PERIMETRES[c.perimetre].l} par ${AXES[c.axe].l.toLowerCase()} — ${etat.filtres.annee}`);
  };
  await charger();
}

function detailLignes(titre, lignes, signe) {
  const tri = lignes.slice().sort((a, b) => a.date_ecriture < b.date_ecriture ? -1 : a.date_ecriture > b.date_ecriture ? 1 : 0);
  const total = tri.reduce((s, r) => s + signe({ debit: Number(r.debit), credit: Number(r.credit) }), 0);
  ouvrirModale(titre, `<div class="defil"><table><thead><tr><th>Date</th><th>N°</th><th>Libellé</th><th>Compte</th><th>Imputation</th><th class="montant">Montant</th></tr></thead>
    <tbody>${tri.map(r => { const v = signe({ debit: Number(r.debit), credit: Number(r.credit) }); return `<tr><td class="code">${esc(dateCourte(r.date_ecriture))}</td>
      <td class="code">${esc(r.numero)}</td><td>${esc(r.libelle)}</td><td class="code">${esc(r.compte)}</td>
      <td class="petit">${esc([r.categorie, r.site, r.vehicule, r.fournisseur].filter(Boolean).join(" · "))}</td>
      <td class="montant ${v < 0 ? "negatif" : ""}">${fcfa(v)}</td></tr>`; }).join("")}</tbody>
    <tfoot><tr><td colspan="5">Total</td><td class="montant">${fcfa(total)}</td></tr></tfoot></table></div>
    <p class="discret petit" style="margin-top:.75rem">Un montant négatif est une extourne : annulation ou reclassement.</p>
    <p><button type="button" class="btn" id="d-export">Exporter ces lignes</button></p>`, { large: true });
  $("#d-export").onclick = () => exporterTableau("detail.xlsx", ["Date", "N°", "Journal", "Libellé", "Compte", "Catégorie", "Site", "Véhicule", "Fournisseur", "Montant"],
    tri.map(r => [dateCourte(r.date_ecriture), r.numero, r.journal_code, r.libelle, r.compte, r.categorie, r.site, r.vehicule, r.fournisseur,
      signe({ debit: Number(r.debit), credit: Number(r.credit) })]), titre);
}

/* =====================================================================
   Comptabilité : journaux, grand livre, balance, périodes
   ===================================================================== */
async function pageJournaux() {
  const { data: journaux, error } = await sb.from("journaux").select("code, libelle").order("code");
  if (error) throw error;
  const j0 = etat.param.journal || "";
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Journaux</h1>
      <p class="discret">Toutes les écritures, dans l'ordre. Elles sont produites par les opérations ; une écriture ne se modifie pas, elle s'extourne.</p></div>
      <div class="actions-ligne">${peut(CORRECTION) ? `<button class="btn" id="b-od">Écriture manuelle</button>` : ""}</div></div>
    <div class="panneau"><div class="outils">${champsPeriode()}
      <select id="f-journal" aria-label="Journal"><option value="">Tous les journaux</option>${(journaux || []).map(j =>
        `<option value="${esc(j.code)}" ${j.code === j0 ? "selected" : ""}>${esc(j.code)} – ${esc(j.libelle)}</option>`).join("")}</select>
      <input type="text" id="filtre" placeholder="N°, libellé, pièce, compte…" aria-label="Rechercher">
      <span class="discret num" id="nb"></span><button class="btn pousse" id="b-export">Exporter</button></div>
    <div class="defil"><table class="registre"><thead><tr><th>N°</th><th>Date</th><th>Journal</th><th>Libellé</th><th>Pièce</th><th>Origine</th><th class="montant">Montant</th><th></th></tr></thead>
    <tbody id="corps"></tbody><tfoot id="pied"></tfoot></table></div></div>`;
  let lignes = [];
  const ecritures = () => {
    const q = $("#filtre").value.toLowerCase(), parId = new Map();
    for (const l of lignes) { if (!parId.has(l.ecriture_id)) parId.set(l.ecriture_id, []); parId.get(l.ecriture_id).push(l); }
    return [...parId.values()].filter(ls => !q || ls.some(l => [l.numero, l.libelle_ecriture, l.libelle, l.piece, l.compte].join(" ").toLowerCase().includes(q)));
  };
  const dessiner = () => {
    const ecr = ecritures().slice(0, 1500);
    $("#nb").textContent = `${ecritures().length} écriture(s)`;

      <td class="montant">${fcfa(ls.reduce((s, l) => s + Number(l.debit), 0))}</td><td><button class="btn-lien" data-diff="${i}" aria-expanded="false">Détail</button></td></tr>

        <td>${esc(l.libelle)}</td><td class="petit">${esc([l.categorie, l.site, l.vehicule, l.fournisseur].filter(Boolean).join(" · "))}</td>
        <td class="montant">${l.debit ? fcfa(l.debit) : ""}</td><td class="montant">${l.credit ? fcfa(l.credit) : ""}</td></tr>`).join("")}</tbody></table></td></tr>`; }).join("")
      : `<tr><td colspan="8" class="vide">Aucune écriture sur la période.</td></tr>`;
    brancherJournal();
  };
  const charger = async () => {
    $("#corps").innerHTML = `<tr><td colspan="8" class="vide">Chargement…</td></tr>`;

      if (j) q = q.eq("journal_code", j);
      return q.order("date_ecriture", { ascending: false }).order("numero", { ascending: false }).order("ordre");
    });
    const tot = lignes.reduce((s, l) => s + Number(l.debit), 0), totc = lignes.reduce((s, l) => s + Number(l.credit), 0);
    $("#pied").innerHTML = `<tr><td colspan="6">Total des débits${tot === totc ? " (égal au total des crédits)" : ` — crédits : ${fcfa(totc)}`}</td><td class="montant">${fcfa(tot)}</td><td></td></tr>`;
    dessiner();
  };
  brancherPeriode(charger);
  $("#f-journal").onchange = charger; $("#filtre").oninput = dessiner;
  if ($("#b-od")) $("#b-od").onclick = () => formulaireEcriture(recharger);
  $("#b-export").onclick = () => exporterTableau(`journaux_${etat.filtres.annee}.xlsx`, ["N°", "Date", "Journal", "Compte", "Intitulé", "Libellé", "Débit", "Crédit", "Catégorie", "Site", "Activité", "Véhicule", "Fournisseur", "Pièce"],
    ecritures().flat().map(l => [l.numero, dateCourte(l.date_ecriture), l.journal_code, l.compte, l.compte_libelle, l.libelle, l.debit, l.credit, l.categorie, l.site, l.activite, l.vehicule, l.fournisseur, l.piece]),
    `Journaux — ${libPeriode()}`);
  await charger();
}

async function formulaireEcriture(retour) {
  await chargerListe("comptes");
  const comptes = etat.refs.comptes.filter(c => c.actif !== false);
  const optComptes = `<option value="">—</option>` + comptes.map(c => `<option value="${esc(c.numero)}">${esc(c.numero)} – ${esc(c.libelle)}</option>`).join("");
  const ligneHtml = () => `<tr><td><select class="e-cpt" aria-label="Compte">${optComptes}</select></td>
    <td><input type="text" class="e-lib" aria-label="Libellé de la ligne"></td>
    <td><input type="number" class="e-deb" min="0" step="1" aria-label="Débit" style="width:8rem"></td>
    <td><input type="number" class="e-cre" min="0" step="1" aria-label="Crédit" style="width:8rem"></td>
    <td><button type="button" class="btn-lien e-suppr">Retirer</button></td></tr>`;
  ouvrirModale("Écriture manuelle (opérations diverses)", `
    <div class="info">Pour une entrée ou une sortie d'argent, passez par la Trésorerie : une écriture manuelle ne crée pas d'opération ni de pièce de caisse.
      Elle sert aux régularisations : dotations, charges à payer, reclassements de comptes.</div>
    <div class="grille2"><div><label for="e-date">Date *</label><input type="date" id="e-date" value="${aujourdhui()}"></div>
      <div><label for="e-piece">Pièce</label><input type="text" id="e-piece"></div></div>
    <label for="e-libelle">Libellé *</label><input type="text" id="e-libelle">
    <div class="defil" style="margin-top:1rem"><table class="saisie"><thead><tr><th>Compte</th><th>Libellé</th><th>Débit</th><th>Crédit</th><th></th></tr></thead>
    <tbody id="e-corps">${ligneHtml()}${ligneHtml()}</tbody></table></div>
    <p><button type="button" class="btn" id="e-ajout">Ajouter une ligne</button> <span id="e-total" class="num"></span></p>`, {
    large: true, libelleSave: "Passer l'écriture",
    onSave: async () => {
      const libelle = $("#e-libelle").value.trim(), date = $("#e-date").value;
      if (!date || !libelle) return "La date et le libellé sont obligatoires.";
      const ls = $$("#e-corps tr").map(tr => ({ compte: $(".e-cpt", tr).value, libelle: $(".e-lib", tr).value.trim() || null,
        debit: Number($(".e-deb", tr).value || 0), credit: Number($(".e-cre", tr).value || 0) })).filter(l => l.compte || l.debit || l.credit);
      if (ls.length < 2) return "Une écriture compte au moins deux lignes.";
      if (ls.some(l => !l.compte)) return "Chaque ligne a un compte.";
      if (ls.some(l => (l.debit > 0) === (l.credit > 0) || l.debit < 0 || l.credit < 0)) return "Chaque ligne porte soit un débit, soit un crédit.";
      const d = ls.reduce((s, l) => s + l.debit, 0), c = ls.reduce((s, l) => s + l.credit, 0);
      if (d !== c) return `L'écriture n'est pas équilibrée : débit ${fcfa(d)}, crédit ${fcfa(c)}.`;
      try { await appeler("saisir_ecriture", { p_date: date, p_libelle: libelle, p_piece: $("#e-piece").value.trim() || null, p_lignes: ls }); }
      catch (err) { return messageErreur(err); }
      toast("Écriture passée."); retour();
    }
  });
  const total = () => {
    const d = $$(".e-deb").reduce((s, i) => s + Number(i.value || 0), 0), c = $$(".e-cre").reduce((s, i) => s + Number(i.value || 0), 0);
    $("#e-total").textContent = `Débit ${fcfa(d)} · Crédit ${fcfa(c)}${d !== c ? ` · écart ${fcfa(Math.abs(d - c))}` : ""}`;
    $("#e-total").className = "num " + (d === c ? "discret" : "negatif");
  };
  const brancher = () => {
    $$(".e-deb,.e-cre").forEach(i => i.oninput = total);
    $$(".e-suppr").forEach(b => b.onclick = () => { if ($$("#e-corps tr").length > 2) { b.closest("tr").remove(); total(); } });
    total();
  };
  $("#e-ajout").onclick = () => { $("#e-corps").insertAdjacentHTML("beforeend", ligneHtml()); brancher(); };
  brancher();
}

      return q.order("date_ecriture").order("numero").order("ordre");
    });

    const avant = m ? lignes.filter(l => l.mois < m) : [];
    if (m) lignes = lignes.filter(l => l.mois === m);
    let solde = avant.reduce((s, l) => s + Number(l.debit) - Number(l.credit), 0);
