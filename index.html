/* ---------------------------------------------------------------------
   Résultat analytique : le compte de résultat ventilé par activité,
   par bureau ou site, par véhicule ou par mois.
   --------------------------------------------------------------------- */
const AXES_ANALYTIQUES = { activite: { l: "Activité", ref: "activites", vide: "Structure (non affecté)" }, site: { l: "Bureau ou site", ref: "sites", vide: "Non affecté" },
  vehicule: { l: "Véhicule", ref: "vehicules", vide: "Non affecté" }, mois: { l: "Mois", vide: "" } };
const CODES_ANALYTIQUES = ["TA", "RA", "RB", "XA", "TB", "TC", "TD", "TH", "RE", "RG", "RH", "RI", "RJ", "XC", "RK", "XD", "RL", "XE", "RM", "XF", "TN", "RO", "XH", "XI"];

async function pageAnalytique() {
  await Promise.all(["activites", "sites", "vehicules"].map(chargerListe));
  const a = etat.analytique = etat.analytique || { axe: "activite" };
  const f = etat.filtres, annee = Number(f.annee), debut = f.mois ? `${annee}-${String(f.mois).padStart(2, "0")}-01` : `${annee}-01-01`,
    fin = f.mois ? finDeMois(annee, Number(f.mois)) : `${annee}-12-31`;
  const [postes, lignes] = await Promise.all([chargerPostes("CR"), appeler("resultat_par_axe", { p_debut: debut, p_fin: fin, p_axe: a.axe })]);
  const ax = AXES_ANALYTIQUES[a.axe];
  const cles = a.axe === "mois" ? [...new Set(lignes.map(l => l.axe))].sort((x, y) => x - y)
    : [...(etat.refs[ax.ref] || []).filter(r => lignes.some(l => l.axe === r.id)).map(r => r.id), ...(lignes.some(l => !l.axe) ? [null] : [])];
  const libCle = k => a.axe === "mois" ? MOIS[Number(k) - 1] : k === null ? ax.vide : (etat.refs[ax.ref].find(r => r.id === k) || {}).libelle || k;
  const vals = cles.map(k => totaliserEtat(postes, sommeParCode(lignes, "montant", l => (l.axe ?? null) === k)));
  const tot = totaliserEtat(postes, sommeParCode(lignes));
  const codes = CODES_ANALYTIQUES.filter(c => postes.find(p => p.code === c) && (postes.find(p => p.code === c).type === "total" || tot.get(c)));
  const lib = c => postes.find(p => p.code === c).libelle;
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Résultat analytique</h1>
      <p class="discret">Le compte de résultat ventilé selon l'imputation des écritures. Ce qui n'est rattaché à rien (loyer du siège, honoraires…) reste en
      « ${esc(AXES_ANALYTIQUES.activite.vide)} » : ce sont les frais communs que les activités doivent couvrir.
      La marge commerciale par activité dépend de l'imputation des achats et de la variation de stock (non ventilée) : pour la marge réelle par canal,
      voyez Stock → Marges, calculée au coût des marchandises vendues.</p></div>
      <div class="actions-ligne"><button class="btn" id="b-export">Exporter</button></div></div>
    <div class="panneau"><div class="outils">${champsPeriode()}<label class="discret" style="margin:0" for="an-axe">par</label>
      <select id="an-axe">${Object.entries(AXES_ANALYTIQUES).map(([k, x]) => `<option value="${k}" ${k === a.axe ? "selected" : ""}>${esc(x.l)}</option>`).join("")}</select></div>
    <div class="defil"><table class="etat"><thead><tr><th>Réf.</th><th>Libellé</th>${cles.map(k => `<th class="montant">${esc(libCle(k))}</th>`).join("")}<th class="montant">Total</th></tr></thead>
    <tbody>${codes.map(c => { const p = postes.find(x => x.code === c), cls = p.type === "total" ? (c === "XI" ? "total-etat" : "sous-total") : "";
      return `<tr class="${cls}"><td class="code">${esc(c)}</td><td>${esc(lib(c))}</td>${vals.map(v => `<td class="montant">${montantSigne(v.get(c) || 0)}</td>`).join("")}
        <td class="montant"><b>${montantSigne(tot.get(c) || 0)}</b></td></tr>`; }).join("")}
      ${a.axe !== "mois" && tot.get("TA") ? `<tr><td></td><td class="discret">Taux de marge commerciale</td>${vals.map(v => `<td class="montant discret">${v.get("TA") ? (v.get("XA") / v.get("TA") * 100).toFixed(1) + " %" : ""}</td>`).join("")}
        <td class="montant discret">${(tot.get("XA") / tot.get("TA") * 100).toFixed(1)} %</td></tr>` : ""}</tbody></table></div></div>`;
  brancherPeriode(recharger);
  $("#an-axe").onchange = () => { a.axe = $("#an-axe").value; recharger(); };
  $("#b-export").onclick = () => exporterTableau(`resultat_par_${a.axe}.xlsx`, ["Réf.", "Libellé", ...cles.map(libCle), "Total"],
    codes.map(c => [c, lib(c), ...vals.map(v => v.get(c) || 0), tot.get(c) || 0]), `Résultat par ${ax.l.toLowerCase()} — ${libPeriode()}`);
}

/* ---------------------------------------------------------------------
   Budget : par compte (ou racine de compte), mois par mois, éventuellement
   par activité ; comparé au réalisé. Le DAF le saisit, tous les lecteurs
   des finances le consultent.
   --------------------------------------------------------------------- */
const BUDGET = ["admin", "daf"];
async function pageBudget() {
  await Promise.all(["activites", "comptes"].map(chargerListe));
  const annee = Number(etat.filtres.annee);
  const [{ data: budgets, error }, realise] = await Promise.all([sb.from("budgets").select("*").eq("annee", annee), appeler("realise_mensuel", { p_annee: annee })]);
  if (error) throw error;
  const lignesB = new Map();
  for (const b of budgets || []) {
    const k = `${b.compte}|${b.activite_id || ""}`;
    if (!lignesB.has(k)) lignesB.set(k, { compte: b.compte, activite_id: b.activite_id, mois: Array(12).fill(0) });
    lignesB.get(k).mois[b.mois - 1] = Number(b.montant);
  }
  const sens = c => c.startsWith("7") ? -1 : 1;  // produits au crédit, charges au débit : montants positifs
  const realiseDe = (l, m) => (realise || []).filter(r => r.compte.startsWith(l.compte) && (!l.activite_id || r.activite_id === l.activite_id) && (m == null || r.mois === m))
    .reduce((s, r) => s + sens(l.compte) * Number(r.montant), 0);
  const libC = c => ((etat.refs.comptes || []).find(p => p.numero === c) || {}).libelle || "";
  const libA = id => id ? ((etat.refs.activites || []).find(a => a.id === id) || {}).libelle || "" : "Toutes";
  const moisFin = annee === new Date().getFullYear() ? new Date().getMonth() : 12; // mois échus
  const lignes = [...lignesB.values()].sort((a, b) => a.compte.localeCompare(b.compte));
  const peutSaisir = peut(BUDGET);
  const ligneHtml = l => {
    const tb = l.mois.reduce((s, x) => s + x, 0), bEchu = l.mois.slice(0, moisFin).reduce((s, x) => s + x, 0), r = realiseDe(l), ec = r - bEchu;
    const mauvais = l.compte.startsWith("7") ? ec < 0 : ec > 0;
    return `<tr><td class="code">${esc(l.compte)}</td><td>${esc(libC(l.compte))}<div class="discret petit">${esc(libA(l.activite_id))}</div></td>
      <td class="montant">${fcfa(tb)}</td><td class="montant">${fcfa(bEchu)}</td><td class="montant">${fcfa(r)}</td>
      <td class="montant ${mauvais && ec ? "negatif" : ""}">${ec ? fcfa(ec) : "0"}</td><td class="montant">${bEchu ? Math.round(r / bEchu * 100) + " %" : ""}</td>
      <td>${peutSaisir ? `<button class="btn-lien" data-budget="${esc(l.compte)}|${esc(l.activite_id || "")}">Modifier</button>` : ""}</td></tr>`; };
  const blocs = [["Produits", l => l.compte.startsWith("7")], ["Charges", l => l.compte.startsWith("6")]];
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Budget ${esc(annee)}</h1>
      <p class="discret">Un budget par compte (ou racine de compte : « 62 » couvre tous les services extérieurs), mois par mois, au besoin par activité.
      Le réalisé vient des écritures ; l'écart porte sur les mois échus (${moisFin ? `janvier à ${MOIS[moisFin - 1].toLowerCase()}` : "aucun"}).</p></div>
      <div class="actions-ligne">${peutSaisir ? `<button class="btn btn-principal" id="b-ligne">Nouvelle ligne de budget</button>` : ""}<button class="btn" id="b-export">Exporter</button></div></div>
    <div class="panneau"><div class="outils">${champsPeriode(true)}</div>
    <div class="defil"><table><thead><tr><th>Compte</th><th>Libellé · activité</th><th class="montant">Budget annuel</th><th class="montant">Budget à date</th>
      <th class="montant">Réalisé à date</th><th class="montant">Écart</th><th class="montant">Exécution</th><th></th></tr></thead>
    <tbody>${blocs.map(([t, f]) => { const ls = lignes.filter(f); return ls.length ? `<tr class="sous-total"><td colspan="8">${t}</td></tr>` + ls.map(ligneHtml).join("") : ""; }).join("")
      || `<tr><td colspan="8" class="vide">Aucun budget pour ${esc(annee)}.${peutSaisir ? " Commencez par « Nouvelle ligne de budget » : ventes, achats de marchandises, publicité, salaires…" : ""}</td></tr>`}</tbody></table></div></div>`;
  brancherPeriode(recharger);
  const formulaire = (l) => {
    const m = l ? l.mois : Array(12).fill(0);
    ouvrirModale(l ? `Budget ${l.compte} — ${libC(l.compte)}` : "Nouvelle ligne de budget", `
      <div class="grille2"><div><label for="bu-compte">Compte ou racine *</label><input type="text" id="bu-compte" list="bu-comptes" value="${esc(l ? l.compte : "")}" ${l ? "disabled" : ""}>
        <datalist id="bu-comptes">${(etat.refs.comptes || []).filter(p => /^[67]/.test(p.numero)).map(p => `<option value="${esc(p.numero)}">${esc(p.libelle)}</option>`).join("")}</datalist></div>
      <div><label for="bu-act">Activité</label><select id="bu-act" ${l ? "disabled" : ""}>${optionsRef("activites", l && l.activite_id, undefined, "Toutes")}</select></div></div>
      <div class="outils"><label for="bu-annuel" style="margin:0">Montant annuel</label><input type="number" id="bu-annuel" min="0" step="1000" style="width:10rem">
        <button type="button" class="btn" id="bu-repartir">Répartir sur 12 mois</button>
        <button type="button" class="btn" id="bu-reel">Reprendre le réalisé ${esc(annee - 1)}</button></div>
      <div class="grille-mois">${MOIS.map((x, i) => `<div><label for="bu-m${i}">${x}</label><input type="number" id="bu-m${i}" min="0" step="1000" value="${m[i] || ""}"></div>`).join("")}</div>
      <p class="discret petit" id="bu-total"></p>`, {
      libelleSave: "Enregistrer",
      large: true,
      onDelete: l ? async () => {
        const q = sb.from("budgets").delete().eq("annee", annee).eq("compte", l.compte);
        const { error: e } = await (l.activite_id ? q.eq("activite_id", l.activite_id) : q.is("activite_id", null));
        if (e) return messageErreur(e); toast("Ligne de budget supprimée."); recharger();
      } : null,
      onSave: async () => {
        const compte = $("#bu-compte").value.trim(), act = $("#bu-act").value || null;
        if (!(etat.refs.comptes || []).some(p => p.numero === compte)) return "Choisissez un compte du plan comptable (classe 6 ou 7).";
        if (!/^[67]/.test(compte)) return "Le budget porte sur des charges (classe 6) ou des produits (classe 7).";
        if (!l && lignesB.has(`${compte}|${act || ""}`)) return "Cette ligne existe déjà : modifiez-la.";
        const q = sb.from("budgets").delete().eq("annee", annee).eq("compte", compte);
        const { error: e1 } = await (act ? q.eq("activite_id", act) : q.is("activite_id", null));
        if (e1) return messageErreur(e1);
        const rows = MOIS.map((x, i) => ({ annee, compte, activite_id: act, mois: i + 1, montant: Math.round(Number($(`#bu-m${i}`).value) || 0) })).filter(r => r.montant > 0);
        if (rows.length) { const { error: e2 } = await sb.from("budgets").insert(rows); if (e2) return messageErreur(e2); }
        toast("Budget enregistré."); recharger();
      }
    });
    const maj = () => { $("#bu-total").textContent = `Total annuel : ${fcfa(MOIS.reduce((s, x, i) => s + (Number($(`#bu-m${i}`).value) || 0), 0))} FCFA`; };
    MOIS.forEach((x, i) => $(`#bu-m${i}`).oninput = maj); maj();
    $("#bu-repartir").onclick = () => { const t = Number($("#bu-annuel").value) || 0, base = Math.floor(t / 12 / 1000) * 1000;
      MOIS.forEach((x, i) => { $(`#bu-m${i}`).value = i < 11 ? base : t - base * 11; }); maj(); };
    $("#bu-reel").onclick = async () => {
      const c = $("#bu-compte").value.trim(), act = $("#bu-act").value || null;
      if (!c) return toast("Indiquez d'abord le compte.", true);
      try { const r = await appeler("realise_mensuel", { p_annee: annee - 1 });
        MOIS.forEach((x, i) => { $(`#bu-m${i}`).value = Math.max(0, Math.round((r || []).filter(z => z.compte.startsWith(c) && (!act || z.activite_id === act) && z.mois === i + 1)
          .reduce((s, z) => s + sens(c) * Number(z.montant), 0))) || ""; }); maj(); }
      catch (err) { toast(messageErreur(err), true); }
    };
  };
  if ($("#b-ligne")) $("#b-ligne").onclick = () => formulaire(null);
  $$("[data-budget]").forEach(b => b.onclick = () => formulaire(lignesB.get(b.dataset.budget)));
  $("#b-export").onclick = () => exporterTableau(`budget_${annee}.xlsx`, ["Compte", "Libellé", "Activité", ...MOIS, "Total budget", "Réalisé"],
    lignes.map(l => [l.compte, libC(l.compte), libA(l.activite_id), ...l.mois, l.mois.reduce((s, x) => s + x, 0), realiseDe(l)]), `Budget ${annee}`);
}

/* ---------------------------------------------------------------------
   Tableau de bord : les chiffres clés de l'exercice, mois par mois.
   --------------------------------------------------------------------- */
const LIB_CA = { "7015": "Ventes en ligne (E-Commerce)", "7011": "Ventes B2B et cessions (dont Guest Cameroun)", "7019": "Remboursements et réductions accordés aux clients",
  "706": "Prestations de services", "7071": "Livraisons facturées" };
async function pageTableauDeBord() {
  const P = periodeEtats();
  const [pCR, pB, bil, mens, budgets, realise, detailCR] = await Promise.all([chargerPostes("CR"), chargerPostes("BILAN"), appeler("etat_bilan", { p_date: P.fin }),
    appeler("resultat_par_axe", { p_debut: P.debut, p_fin: P.fin, p_axe: "mois" }), sb.from("budgets").select("compte, mois, montant").eq("annee", P.annee),
    appeler("realise_mensuel", { p_annee: P.annee }), appeler("etat_resultat", { p_debut: P.debut, p_fin: P.fin })]);
  const cr = totaliserEtat(pCR, sommeParCode(mens));
  const brut = totaliserEtat(pB, sommeParCode(bil, "montant", l => l.colonne === "brut")), amort = totaliserEtat(pB, sommeParCode(bil, "montant", l => l.colonne === "amort"));
  const pas = totaliserEtat(pB, sommeParCode(bil, "montant", l => l.colonne === "passif"));
  const net = c => (brut.get(c) || 0) - (amort.get(c) || 0);
  const tresorerie = net("BT") - (pas.get("DT") || 0);
  const parMois = MOIS.slice(0, P.mois).map((x, i) => totaliserEtat(pCR, sommeParCode(mens, "montant", l => Number(l.axe) === i + 1)));
  const max = Math.max(1, ...parMois.map(v => Math.max(v.get("XB") || 0, -(v.get("XI") || 0), v.get("XI") || 0)));
  const baton = (v, cls) => `<span class="baton ${cls}" style="height:${Math.round(Math.abs(v) / max * 100)}%" title="${fcfa(v)}"></span>`;
  const bud = (budgets.data || []).filter(b => b.mois <= P.mois);
  const budCA = bud.filter(b => b.compte.startsWith("70")).reduce((s, b) => s + Number(b.montant), 0);
  const budCh = bud.filter(b => b.compte.startsWith("6")).reduce((s, b) => s + Number(b.montant), 0);
  // Exécution du budget de charges : le réalisé des seuls comptes budgétés, sur les mêmes mois.
  const racines = [...new Set(bud.filter(b => b.compte.startsWith("6")).map(b => b.compte))];
  const realiseBudgete = (realise || []).filter(r => r.mois <= P.mois && racines.some(c => r.compte.startsWith(c))).reduce((s, r) => s + Number(r.montant), 0);
  const charges = -(mens.filter(l => /^R/.test(l.code)).reduce((s, l) => s + Number(l.montant), 0));
  const carte = (v, l, sous, mauvais) => `<a><b class="${mauvais ? "negatif" : ""}">${fcfa(v)}</b><span>${l}</span>${sous ? `<span class="discret petit">${sous}</span>` : ""}</a>`;
  const top = [...pCR.filter(p => p.type === "poste" && /^R/.test(p.code)).map(p => [p.libelle, -(cr.get(p.code) || 0)])].filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 6);
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Tableau de bord</h1>
      <p class="discret">Exercice ${esc(P.annee)}, du 1er janvier ${esc(P.lib)}. Les montants viennent des écritures ; le stock compte s'il a été constaté (États financiers).</p></div></div>
    <div class="outils">${champsPeriode(true, "Fin d'exercice (décembre)")}</div>
    <div class="chiffres">${carte(cr.get("XB") || 0, "Chiffre d'affaires", budCA ? `budget ${fcfa(budCA)} · ${Math.round((cr.get("XB") || 0) / budCA * 100)} %` : "")}
      ${carte(cr.get("XA") || 0, "Marge commerciale", cr.get("TA") ? `${((cr.get("XA") || 0) / cr.get("TA") * 100).toFixed(1)} % des ventes` : "")}
      ${carte(cr.get("XD") || 0, "Excédent brut d'exploitation", "", (cr.get("XD") || 0) < 0)}
      ${carte(cr.get("XI") || 0, "Résultat net", "", (cr.get("XI") || 0) < 0)}</div>
    <div class="chiffres">${carte(tresorerie, "Trésorerie nette", "", tresorerie < 0)}${carte(net("BB"), "Stock de marchandises")}
      ${carte(net("BI"), "Créances clients")}${carte(pas.get("DJ") || 0, "Dettes fournisseurs")}${carte(pas.get("CA") || 0, "Dû à l'exploitant (1041)")}
      ${budCh ? carte(realiseBudgete, "Charges budgétées", `budget ${fcfa(budCh)} · ${Math.round(realiseBudgete / budCh * 100)} %`, realiseBudgete > budCh) : ""}</div>
    <div class="grille-tdb"><div class="panneau"><h2>Chiffre d'affaires et résultat, mois par mois</h2>
      <div class="graphe">${parMois.map((v, i) => `<div class="mois-graphe"><div class="barres">${baton(v.get("XB") || 0, "ca")}${baton(v.get("XI") || 0, (v.get("XI") || 0) < 0 ? "perte" : "benefice")}</div>
        <span class="petit">${["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."][i]}</span></div>`).join("")}</div>
      <p class="petit discret"><span class="pastille" style="background:var(--registre);color:#fff">CA</span> <span class="pastille ok">Bénéfice</span> <span class="pastille alerte">Perte</span></p>
      <div class="defil"><table><thead><tr><th>Mois</th><th class="montant">CA</th><th class="montant">Marge</th><th class="montant">Charges</th><th class="montant">Résultat</th></tr></thead>
      <tbody>${parMois.map((v, i) => `<tr><td>${MOIS[i]}</td><td class="montant">${fcfa(v.get("XB") || 0)}</td><td class="montant">${fcfa(v.get("XA") || 0)}</td>
        <td class="montant">${fcfa(-pCR.filter(p => p.type === "poste" && /^R/.test(p.code)).reduce((s, p) => s + (v.get(p.code) || 0), 0))}</td>
        <td class="montant">${montantSigne(v.get("XI") || 0)}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="panneau"><h2>Composition du chiffre d'affaires</h2><div class="defil"><table><tbody>
      ${(detailCR || []).filter(l => ["TA", "TB", "TC", "TD"].includes(l.code)).sort((a, b) => b.montant - a.montant).map(l => `<tr><td>${esc(LIB_CA[l.compte] || l.compte)}<div class="discret petit">compte ${esc(l.compte)}</div></td>
        <td class="montant">${montantSigne(l.montant)}</td><td class="montant discret">${cr.get("XB") ? Math.round(l.montant / cr.get("XB") * 100) + " %" : ""}</td></tr>`).join("")}
      <tr class="sous-total"><td>Chiffre d'affaires net</td><td class="montant">${fcfa(cr.get("XB") || 0)}</td><td></td></tr></tbody></table></div>
      <p class="discret petit">Les remboursements aux clients réduisent le chiffre d'affaires (7019) ; le classeur les comptait en charges.</p></div>
    <div class="panneau"><h2>Principales charges</h2><div class="defil"><table><tbody>${top.map(([l, v]) => `<tr><td>${esc(l)}</td><td class="montant">${fcfa(v)}</td>
      <td class="montant discret">${charges ? Math.round(v / charges * 100) + " %" : ""}</td></tr>`).join("") || `<tr><td class="vide">Aucune charge.</td></tr>`}</tbody></table></div>
      <p class="actions-ligne"><button class="btn" data-aller="etats">États financiers</button><button class="btn" data-aller="analytique">Résultat par activité</button>
        <button class="btn" data-aller="budget">Budget</button></p></div></div>`;
  brancherPeriode(recharger);
  $$("[data-aller]").forEach(b => b.onclick = () => aller(b.dataset.aller));
}

/* =====================================================================
   CHARGES ÉTALÉES (charges constatées d'avance, 476)
   Une dépense qui couvre plusieurs mois (contrat de communication annuel,
   loyer payé d'avance, assurance…) est transférée au 476 puis reprise en
   charge mois par mois : le résultat de chaque mois porte sa juste part.
   ===================================================================== */
async function pageEtalements() {
  const [etals, cands] = await Promise.all([
    chargerTout(() => sb.from("v_etalements").select("*").order("date_debut")),
    peut(CORRECTION) ? chargerTout(() => sb.from("v_charges_etalables").select("*").order("montant", { ascending: false })) : Promise.resolve([])]);
  const reste = etals.reduce((s, e) => s + Number(e.reste), 0);
  const d = new Date(); d.setDate(0);
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Charges étalées</h1>
      <p class="discret">Une dépense qui couvre plusieurs mois est d'abord placée en charges constatées d'avance (476), puis reprise en charge chaque mois.
      Exemple : le contrat BALAFON de 60 M couvre février 2026 à janvier 2027 ; chaque mois en porte 5 M.</p></div>
      <div class="actions-ligne">${peut(CORRECTION) ? `<button class="btn btn-principal" id="b-etaler">Étaler une charge</button>` : ""}</div></div>
    <div class="chiffres"><a><b>${etals.length}</b><span>charge(s) étalée(s)</span></a><a><b>${fcfa(reste)}</b><span>Restant en charges constatées d'avance (476)</span></a></div>
    ${peut(CORRECTION) ? `<div class="outils"><label class="discret" style="margin:0" for="et-mois">Passer les quotes-parts jusqu'à</label>
      <select id="et-mois">${MOIS.map((m, i) => `<option value="${i + 1}" ${i === d.getMonth() ? "selected" : ""}>${m}</option>`).join("")}</select>
      <input type="number" id="et-annee" value="${d.getFullYear()}" min="2026" style="width:6rem" aria-label="Année"><button class="btn" id="b-passer">Passer</button></div>` : ""}
    <div class="panneau defil"><table><thead><tr><th>Charge</th><th>Compte</th><th>Pièce</th><th>Période couverte</th><th class="montant">Montant</th>
      <th class="montant">Mensualité</th><th class="montant">Passé en charge</th><th class="montant">Reste (476)</th></tr></thead>
    <tbody>${etals.map(e => `<tr><td>${esc(e.libelle)}${e.fournisseur ? `<div class="discret petit">${esc(e.fournisseur)}</div>` : ""}${e.motif ? `<div class="discret petit">${esc(e.motif)}</div>` : ""}</td>
      <td class="code">${esc(e.compte_charge)}</td><td class="code">${esc(e.numero_piece || "")}<div class="discret petit">${esc(dateCourte(e.date_piece))}</div></td>
      <td>${esc(MOIS[new Date(e.date_debut).getMonth()].toLowerCase())} ${esc(e.date_debut.slice(0, 4))} → ${esc(MOIS[new Date(e.dernier_mois).getMonth()].toLowerCase())} ${esc(e.dernier_mois.slice(0, 4))}
        <div class="discret petit">${e.mois_passes} / ${e.nb_mois} mois passés</div></td>
      <td class="montant">${fcfa(e.montant)}</td><td class="montant">${fcfa(Math.round(e.montant / e.nb_mois))}</td><td class="montant">${fcfa(e.passe)}</td>
      <td class="montant"><b>${fcfa(e.reste)}</b></td></tr>`).join("") || `<tr><td colspan="8" class="vide">Aucune charge étalée.</td></tr>`}</tbody></table></div>`;
  if ($("#b-passer")) $("#b-passer").onclick = async () => {
    try { toast(await appeler("passer_etalements", { p_annee: Number($("#et-annee").value), p_mois: Number($("#et-mois").value) })); recharger(); }
    catch (err) { toast(messageErreur(err), true); }
  };
  if ($("#b-etaler")) $("#b-etaler").onclick = () => {
    ouvrirModale("Étaler une charge", `<p class="discret petit">Choisissez la charge (dépense, facture d'achat ou ligne reprise du classeur), le premier mois qu'elle couvre et le nombre de mois.
        Les mois déjà écoulés se passent ensuite avec « Passer ».</p>
      <input type="text" id="et-filtre" placeholder="Rechercher : libellé, fournisseur, montant…" aria-label="Rechercher">
      <div class="defil" style="max-height:16rem;margin:.5rem 0"><table class="petit"><tbody id="et-cands"></tbody></table></div>
      <div class="grille2"><div><label for="et-debut">Premier mois couvert *</label><input type="month" id="et-debut"></div>
        <div><label for="et-nb">Nombre de mois *</label><input type="number" id="et-nb" min="2" max="60" value="12"></div></div>
      <label for="et-motif">Motif</label><input type="text" id="et-motif" placeholder="Contrat signé le…, loyer de… à…">`, {
      libelleSave: "Étaler",
      onSave: async () => {
        const c = $("input[name=et-ligne]:checked"), debut = $("#et-debut").value, nb = Number($("#et-nb").value);
        if (!c || !debut || !(nb >= 2)) return "Choisissez la charge, le premier mois et le nombre de mois (2 au moins).";
        try { await appeler("etaler_charge", { p_ligne: Number(c.value), p_debut: debut + "-01", p_mois: nb, p_motif: $("#et-motif").value.trim() }); }
        catch (err) { return messageErreur(err); }
        toast("Charge étalée. Passez maintenant les quotes-parts des mois écoulés."); recharger();
      }
    });
    const dessiner = () => {
      const q = $("#et-filtre").value.toLowerCase();
      $("#et-cands").innerHTML = cands.filter(c => !q || [c.libelle, c.fournisseur, c.compte, c.numero, String(c.montant)].join(" ").toLowerCase().includes(q)).slice(0, 80)
        .map(c => `<tr><td><input type="radio" name="et-ligne" value="${c.ligne_ecriture_id}" data-date="${esc(c.date_ecriture)}" aria-label="Choisir"></td>
          <td class="code">${esc(dateCourte(c.date_ecriture))}</td><td>${esc(c.libelle)}<div class="discret">${esc(c.compte)} ${esc(c.compte_libelle)}${c.fournisseur ? " · " + esc(c.fournisseur) : ""}</div></td>
          <td class="montant">${fcfa(c.montant)}</td></tr>`).join("") || `<tr><td class="vide">Aucune charge d'au moins 50 000.</td></tr>`;
      $$("input[name=et-ligne]").forEach(r => r.onchange = () => { if (!$("#et-debut").value) $("#et-debut").value = r.dataset.date.slice(0, 7); });
    };
    $("#et-filtre").oninput = dessiner; dessiner();
  };
}

/* =====================================================================
   DOSSIER DU PERSONNEL (lot 7)
   La vie du salarié de l'entrée à la sortie : fiche, contrat et période
   d'essai, carrière (revalorisations, promotions, mutations, formations,
   évaluations), discipline, absences, pièces du dossier, courriers sur le
   papier à en-tête (modèles de l'entreprise), sortie et solde de tout compte.
   ===================================================================== */
const PERSO_LECTURE = ["rh", "daf", "admin", "auditeur", "dg"];
const PERSO_ECRITURE = ["rh", "daf", "admin"];
const CLASSE_STATUT_PERSO = { "En poste": "ok", "En période d'essai": "attente", "Stagiaire": "", "Suspendu": "alerte", "Préavis": "attente", "Sorti": "inactif" };
const PIECES_REQUISES = ["CNI", "Photo", "CV", "Diplôme", "Casier judiciaire", "Certificat médical", "Plan de localisation", "Contrat signé"];
const CATEGORIES_PIECES = [...PIECES_REQUISES, "Acte de naissance", "Acte de mariage", "Actes de naissance des enfants", "Courrier signé", "Attestation CNPS", "RIB", "Autre"];
const TYPES_DISCIPLINE = ["Demande d'explication", "Avertissement", "Blâme", "Mise à pied", "Suspension", "Reprise"];
const TYPES_EVENEMENT = ["Confirmation", "Renouvellement d'essai", "Revalorisation", "Promotion", "Avenant", "Mutation", "Formation", "Évaluation", "Récompense",
  ...TYPES_DISCIPLINE, "Absence", "Maladie", "Accident du travail", "Note"];
const MOTIFS_SORTIE = ["Démission", "Licenciement", "Licenciement pour faute lourde", "Fin de période d'essai", "Fin de CDD", "Rupture d'un commun accord",
  "Abandon de poste", "Fin de stage", "Retraite", "Décès"];
const civilite = s => s.sexe === "F" ? "Madame" : s.sexe === "M" ? "Monsieur" : "Madame, Monsieur";
const nomPersonne = s => [s.nom, s.prenom].filter(Boolean).join(" ");
const ancienneteTexte = m => m == null ? "" : m < 12 ? `${m} mois` : `${Math.floor(m / 12)} an${m >= 24 ? "s" : ""}${m % 12 ? ` et ${m % 12} mois` : ""}`;
const dateLongue = d => d ? new Date(String(d).slice(0, 10) + "T00:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }).replace(/^1 /, "1er ") : "…";

async function pagePersonnel() {
  if (etat.param.id) return ficheSalarie(etat.param.id);
  const { data, error } = await sb.from("v_personnel").select("*").order("matricule");
  if (error) throw error;
  const tous = data || [];
  const f = etat.filtrePerso = etat.filtrePerso || { statut: "actifs", q: "" };
  const compte = s => tous.filter(x => x.statut === s).length;
  const ecrire = peut(PERSO_ECRITURE);
  // Alertes : ce qui demande une action de la RH.
  const alertes = [];
  tous.filter(x => x.jours_fin_essai != null && x.jours_fin_essai <= 15).forEach(x => alertes.push({ s: x, t: `fin de la période d'essai dans ${x.jours_fin_essai} jour(s) (${dateCourte(x.date_fin_essai)}) : confirmer, renouveler ou mettre fin`, c: "attente" }));
  tous.filter(x => x.statut !== "Sorti" && x.jours_fin_contrat != null && x.jours_fin_contrat <= 30).forEach(x => alertes.push({ s: x, t: `fin du contrat dans ${x.jours_fin_contrat} jour(s) (${dateCourte(x.date_fin_contrat)})`, c: "attente" }));
  tous.filter(x => Number(x.explications_ouvertes) > 0).forEach(x => alertes.push({ s: x, t: `${x.explications_ouvertes} demande(s) d'explication sans réponse enregistrée`, c: "alerte" }));
  tous.filter(x => x.statut === "Suspendu").forEach(x => alertes.push({ s: x, t: "suspendu : enregistrer la reprise ou la sortie", c: "alerte" }));
  tous.filter(x => x.cni_expiree && x.statut !== "Sorti").forEach(x => alertes.push({ s: x, t: "CNI expirée : demander la nouvelle", c: "attente" }));
  tous.filter(x => x.type_contrat === "Stage" && x.statut !== "Sorti" && !Number(x.indemnite_stage)).forEach(x => alertes.push({ s: x, t: "stagiaire : indemnité de stage non renseignée", c: "" }));
  const incomplets = tous.filter(x => x.statut !== "Sorti" && Number(x.pieces_manquantes) > 0).length;
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Dossier du personnel</h1>
      <p class="discret">Chaque salarié, de l'embauche à la sortie : contrat et période d'essai, carrière, discipline, absences, pièces du dossier et courriers.</p></div>
      <div class="actions-ligne">${ecrire ? `<button class="btn btn-principal" id="b-embauche">Nouvelle embauche</button>` : ""}
        <button class="btn" id="b-registre">Registre du personnel</button><button class="btn" id="b-export">Exporter</button></div></div>
    <div class="chiffres">${[["actifs", "Effectif présent", tous.filter(x => x.statut !== "Sorti" && x.type_contrat !== "Stage").length],
      ["En période d'essai", "En période d'essai", compte("En période d'essai")], ["Stagiaire", "Stagiaires", compte("Stagiaire")],
      ["Suspendu", "Suspendus", compte("Suspendu")], ["Sorti", "Sortis", compte("Sorti")]].map(([k, l, n]) =>
      `<a href="#" data-statut="${esc(k)}" ${f.statut === k ? 'style="outline:2px solid var(--registre)"' : ""}><b>${n}</b><span>${esc(l)}</span></a>`).join("")}</div>
    ${alertes.length || incomplets ? `<div class="panneau"><h2>À traiter</h2><ul class="points">${alertes.map(a => `<li><p><span class="pastille ${a.c}">${esc(a.s.matricule)}</span>
      <b>${esc(nomPersonne(a.s))}</b> — ${esc(a.t)}</p><button class="btn" data-ouvrir="${a.s.id}">Ouvrir</button></li>`).join("")}
      ${incomplets ? `<li><p>${incomplets} dossier(s) incomplet(s) : pièces manquantes (CNI, photo, CV, diplôme, casier, certificat médical, plan de localisation, contrat signé).</p>
        <button class="btn" data-statut="incomplets">Voir</button></li>` : ""}</ul></div>` : ""}
    <div class="panneau"><div class="outils">
      <select id="pe-statut" aria-label="Statut"><option value="actifs">Présents (hors sortis)</option><option value="tous">Tous</option>
        ${Object.keys(CLASSE_STATUT_PERSO).map(s => `<option ${f.statut === s ? "selected" : ""}>${esc(s)}</option>`).join("")}<option value="incomplets">Dossiers incomplets</option></select>
      <input type="text" id="filtre" placeholder="Nom, matricule, emploi…" aria-label="Rechercher" value="${esc(f.q)}"><span class="discret num pousse" id="nb"></span></div>
    <div class="defil"><table><thead><tr><th>Matricule</th><th>Nom et prénoms</th><th>Département</th><th>Contrat</th><th>Entrée</th><th>Ancienneté</th><th>Statut</th><th>Dossier</th><th></th></tr></thead>
    <tbody id="corps"></tbody></table></div></div>`;
  $("#pe-statut").value = f.statut;
  const visibles = () => tous.filter(x => (f.statut === "tous" || (f.statut === "actifs" ? x.statut !== "Sorti" : f.statut === "incomplets" ? x.statut !== "Sorti" && Number(x.pieces_manquantes) > 0 : x.statut === f.statut))
    && (!f.q || [x.matricule, x.nom, x.prenom, x.emploi, x.departement].join(" ").toLowerCase().includes(f.q.toLowerCase())));
  const dessiner = () => {
    const l = visibles();
    $("#nb").textContent = `${l.length} personne(s)`;
    $("#corps").innerHTML = l.map(x => `<tr><td class="code">${esc(x.matricule)}</td><td><b>${esc(nomPersonne(x))}</b><div class="discret petit">${esc(x.emploi || "")}</div></td>
      <td>${esc(x.departement || "")}</td><td>${esc(x.type_contrat || "")}${x.date_fin_contrat ? `<div class="discret petit">jusqu'au ${esc(dateCourte(x.date_fin_contrat))}</div>` : ""}</td>
      <td class="code">${esc(dateCourte(x.date_embauche))}${x.date_sortie ? `<div class="discret petit">sortie ${esc(dateCourte(x.date_sortie))}</div>` : ""}</td>
      <td>${esc(ancienneteTexte(x.anciennete_mois))}</td>
      <td><span class="pastille ${CLASSE_STATUT_PERSO[x.statut] || ""}">${esc(x.statut)}</span>${x.jours_fin_essai != null ? `<div class="discret petit">fin d'essai ${esc(dateCourte(x.date_fin_essai))}</div>` : ""}</td>
      <td class="petit">${Number(x.pieces_manquantes) ? `<span class="pastille attente">${x.pieces_manquantes} pièce(s) manquante(s)</span>` : `<span class="pastille ok">Complet</span>`}
        ${Number(x.explications_ouvertes) ? ` <span class="pastille alerte">explication</span>` : ""}${Number(x.sanctions) ? ` <span class="pastille">${x.sanctions} sanction(s)</span>` : ""}</td>
      <td><button class="btn" data-ouvrir="${x.id}">Ouvrir</button></td></tr>`).join("") || `<tr><td colspan="9" class="vide">Personne pour ces critères.</td></tr>`;
    $$("[data-ouvrir]").forEach(b => b.onclick = () => aller("personnel", { id: b.dataset.ouvrir }));
  };
  $("#pe-statut").onchange = () => { f.statut = $("#pe-statut").value; dessiner(); };
  $("#filtre").oninput = () => { f.q = $("#filtre").value; dessiner(); };
  $$("[data-statut]").forEach(a => a.onclick = e => { e.preventDefault(); f.statut = a.dataset.statut; $("#pe-statut").value = f.statut; dessiner(); });
  if ($("#b-embauche")) $("#b-embauche").onclick = () => formulaireEmbauche();
  $("#b-export").onclick = () => exporterTableau("personnel.xlsx", ["Matricule", "Nom", "Prénoms", "Sexe", "Né(e) le", "CNI", "N° CNPS", "Téléphone", "Emploi", "Département",
    "Contrat", "Entrée", "Fin d'essai", "Fin de contrat", "Sortie", "Motif de sortie", "Statut", "Salaire de base"],
    visibles().map(x => [x.matricule, x.nom, x.prenom, x.sexe, dateCourte(x.date_naissance), x.cni, x.numero_cnps, x.telephone, x.emploi, x.departement, x.type_contrat,
      dateCourte(x.date_embauche), dateCourte(x.date_fin_essai), dateCourte(x.date_fin_contrat), dateCourte(x.date_sortie), x.motif_sortie, x.statut, x.salaire_base]), "Personnel");
  // Registre de l'employeur : entrées et sorties, dans l'ordre d'arrivée.
  $("#b-registre").onclick = () => imprimerHtml("Registre du personnel", `<style>@page{size:A4 landscape;margin:1cm}body{max-width:none!important}td,th{font-size:10px}</style>
    <h1>Registre du personnel</h1><p class="discret">Arrêté au ${esc(dateCourte(aujourdhui()))} · ${tous.length} inscription(s)</p>
    <table><thead><tr><th>N°</th><th>Matricule</th><th>Nom et prénoms</th><th>Né(e) le</th><th>CNI</th><th>N° CNPS</th><th>Emploi</th><th>Contrat</th><th>Entrée</th><th>Sortie</th><th>Motif</th></tr></thead>
    <tbody>${tous.slice().sort((a, b) => a.date_embauche < b.date_embauche ? -1 : 1).map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.matricule)}</td><td>${esc(nomPersonne(x))}</td>
      <td>${esc(dateCourte(x.date_naissance))}</td><td>${esc(x.cni || "")}</td><td>${esc(x.numero_cnps || "")}</td><td>${esc(x.emploi || "")}</td><td>${esc(x.type_contrat || "")}</td>
      <td>${esc(dateCourte(x.date_embauche))}</td><td>${esc(dateCourte(x.date_sortie))}</td><td>${esc(x.motif_sortie || "")}</td></tr>`).join("")}</tbody></table>`);
  dessiner();
}

/* ---------- Fiche du salarié ---------- */
async function ficheSalarie(id) {
  const [rs, re, rd, rf, rb, rc] = await Promise.all([
    sb.from("v_personnel").select("*").eq("id", id).single(),
    sb.from("evenements_rh").select("*").eq("salarie_id", id).order("date_evenement", { ascending: false }).order("created_at", { ascending: false }),
    sb.from("documents_personnel").select("*").eq("salarie_id", id).order("created_at", { ascending: false }),
    sb.from("elements_fixes").select("rubrique_code, montant").eq("salarie_id", id),
    sb.from("v_bulletins").select("*").eq("salarie_id", id).order("annee", { ascending: false }).order("mois", { ascending: false }),
    sb.from("conges").select("*").eq("salarie_id", id).order("date_debut", { ascending: false })]);
  if (rs.error) throw rs.error;
  const s = rs.data, evs = re.data || [], docs = rd.data || [], fixes = rf.data || [], buls = rb.data || [], conges = rc.data || [];
  const ecrire = peut(PERSO_ECRITURE), sorti = !!s.date_sortie;
  await Promise.all(["activites", "sites", "salaries_liste"].map(x => chargerListe(x).catch(() => {})));
  const { data: rubs } = await sb.from("rubriques_paie").select("code, libelle, fixe, type").eq("type", "Gain").eq("fixe", true).order("ordre");
  etat.refs.rubriques_fixes = rubs || [];
  if (etat.ficheOuverte !== id) { etat.ficheOuverte = id; etat.ongletFiche = "resume"; }
  let onglet = etat.ongletFiche || "resume";
  let simul = null;
  if (ecrire && s.type_contrat !== "Stage") { try { simul = await appeler("simuler_net", { p_salarie: id, p_base: Number(s.salaire_base) }); } catch (e) { /* lecture seule */ } }
  const dl = rows => { const r = rows.filter(([, v]) => v !== "" && v != null); return r.length ? `<dl class="fiche">${r.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`
    : `<p class="discret petit">À compléter${ecrire ? " (Modifier la fiche)" : ""}.</p>`; };
  const libFixe = c => ((rubs || []).find(r => r.code === c) || {}).libelle || c;
  $("#contenu").innerHTML = `<p><button class="btn-lien" id="b-retour">← Dossier du personnel</button></p>
    <div class="entete-page"><div><h1>${esc(nomPersonne(s))} <span class="pastille ${CLASSE_STATUT_PERSO[s.statut] || ""}" style="vertical-align:middle">${esc(s.statut)}</span></h1>
      <p class="discret">${esc(s.matricule)} · ${esc(s.emploi || "Emploi non renseigné")}${s.departement ? " · " + esc(s.departement) : ""} · entré(e) le ${esc(dateCourte(s.date_embauche))}
        · ancienneté ${esc(ancienneteTexte(s.anciennete_mois))}${s.telephone ? " · " + esc(s.telephone) : ""}</p></div>
      <div class="actions-ligne">${ecrire ? `<button class="btn" id="b-modifier">Modifier la fiche</button><button class="btn btn-principal" id="b-evenement">Nouvel événement</button>
        <button class="btn" id="b-courrier">Rédiger un courrier</button>${!sorti ? `<button class="btn btn-danger" id="b-sortie">Sortie</button>` : ""}` : ""}
        <button class="btn" id="b-imprimer-fiche">Imprimer la fiche</button></div></div>
    <div class="panneau"><div class="onglets" role="tablist">${[["resume", "Résumé"], ["carriere", `Carrière (${evs.filter(e => !TYPES_DISCIPLINE.includes(e.type)).length})`],
      ["discipline", `Discipline (${evs.filter(e => TYPES_DISCIPLINE.includes(e.type)).length})`], ["pieces", `Pièces (${docs.length})`], ["paie", "Paie et congés"]].map(([k, l]) =>
      `<button role="tab" data-onglet="${k}" aria-selected="${k === onglet}">${l}</button>`).join("")}</div><div id="zone"></div></div>`;
  const zone = $("#zone");
  const recharge = () => aller("personnel", { id });
  const resume = () => {
    const alertes = [];
    if (s.jours_fin_essai != null) alertes.push(`Période d'essai jusqu'au ${dateCourte(s.date_fin_essai)}${s.essai_renouvele ? " (renouvelée)" : ""} : confirmer, renouveler${s.essai_renouvele ? "" : " une fois"} ou y mettre fin.`);
    if (Number(s.explications_ouvertes)) alertes.push(`${s.explications_ouvertes} demande(s) d'explication sans réponse enregistrée (onglet Discipline).`);
    if (Number(s.pieces_manquantes)) alertes.push(`Dossier incomplet : ${PIECES_REQUISES.filter(c => !docs.some(d => d.categorie === c)).join(", ")}.`);
    if (s.type_contrat === "Stage" && !Number(s.indemnite_stage)) alertes.push("Indemnité de stage à renseigner (Modifier la fiche).");
    const essai = s.date_fin_essai ? `jusqu'au ${dateCourte(s.date_fin_essai)}${s.essai_renouvele ? " (renouvelée)" : ""}${s.confirme_le ? ` · confirmé(e) le ${dateCourte(s.confirme_le)}` : ""}` : "";
    zone.innerHTML = `${alertes.map(a => `<div class="info">${esc(a)}</div>`).join("")}
      <div class="grille2"><div><h2>Identité</h2>${dl([["Né(e) le", s.date_naissance ? esc(dateCourte(s.date_naissance)) + (s.lieu_naissance ? " à " + esc(s.lieu_naissance) : "") : ""],
        ["Sexe", s.sexe === "F" ? "Femme" : s.sexe === "M" ? "Homme" : ""], ["Nationalité", esc(s.nationalite || "")], ["CNI", esc(s.cni || "")], ["NIU", esc(s.niu || "")],
        ["N° CNPS", esc(s.numero_cnps || "")], ["Situation", esc(s.situation_familiale || "")], ["Enfants à charge", s.enfants ? esc(s.enfants) : ""], ["Diplôme", esc(s.diplome || "")]])}
        <h2>Contact</h2>${dl([["Téléphone", esc(s.telephone || "")], ["E-mail", esc(s.email || "")], ["Adresse", esc([s.adresse, s.ville].filter(Boolean).join(", "))],
        ["Personne à prévenir", esc([s.personne_a_prevenir, s.telephone_urgence].filter(Boolean).join(" · "))]])}</div>
      <div><h2>Contrat et poste</h2>${dl([["Contrat", esc(s.type_contrat || "") + (s.date_fin_contrat ? ` jusqu'au ${esc(dateCourte(s.date_fin_contrat))}` : "")],
        ["Entrée", esc(dateCourte(s.date_embauche))], ["Période d'essai", esc(essai)], ["Emploi", esc(s.emploi || "")],
        ["Catégorie · échelon", esc([s.categorie, s.echelon].filter(Boolean).join(" · "))], ["Département", esc(s.departement || "")], ["Activité", esc(s.activite || "Structure")],
        ["Site", esc(s.site || "")], ["Responsable", esc(s.manager || "")],
        ["Sortie", sorti ? `${esc(dateCourte(s.date_sortie))} — ${esc(s.motif_sortie || "")}` : ""]])}
        <h2>Rémunération</h2>${s.type_contrat === "Stage" ? dl([["Indemnité de stage", s.indemnite_stage ? fcfa(s.indemnite_stage) + " FCFA par mois" : "à renseigner"],
          ["Versement", esc(s.mode_paiement || "")]]) : dl([["Salaire de base", fcfa(s.salaire_base) + " FCFA"],
          ...fixes.map(x => [libFixe(x.rubrique_code), fcfa(x.montant) + " FCFA"]),
          ["Brut mensuel", simul ? fcfa(simul.brut) + " FCFA" : ""], ["Net mensuel (mois complet)", simul ? `<b>${fcfa(simul.net)} FCFA</b>` : ""],
          ["Paiement", esc([s.mode_paiement, s.banque, s.rib, s.numero_mobile_money].filter(Boolean).join(" · "))]])}</div></div>
      ${s.observation ? `<h2>Observation</h2><p>${esc(s.observation)}</p>` : ""}
      <div id="bloc-acces" style="margin-top:1rem"></div>`;
    if (peut(PERSO_ECRITURE) || peut(["auditeur", "dg"])) blocAccesSalarie(s, $("#bloc-acces"), recharge).catch(() => {});
  };
  const ligneEv = e => `<li class="ev-rh"><p><span class="pastille ${TYPES_DISCIPLINE.includes(e.type) && e.type !== "Reprise" ? "alerte" : e.type === "Sortie" ? "inactif" : e.type === "Revalorisation" || e.type === "Promotion" ? "ok" : ""}">${esc(e.type)}</span>
      <b>${esc(dateCourte(e.date_evenement))}</b> — ${esc(e.objet || "")}${e.statut === "Ouvert" ? ` <span class="pastille attente">en cours</span>` : ""}
      ${e.date_effet && e.date_effet !== e.date_evenement ? `<span class="discret petit"> · effet ${esc(dateCourte(e.date_effet))}</span>` : ""}${e.date_fin ? `<span class="discret petit"> · fin ${esc(dateCourte(e.date_fin))}</span>` : ""}
      ${e.valeur_avant || e.valeur_apres ? `<br><span class="petit">${esc(e.valeur_avant || "")} → <b>${esc(e.valeur_apres || "")}</b></span>` : ""}
      ${e.montant_avant != null || e.montant_apres != null ? `<br><span class="petit discret">salaire de base ${fcfa(e.montant_avant)} → ${fcfa(e.montant_apres)}</span>` : ""}
      ${e.details ? `<br><span class="petit">${esc(e.details)}</span>` : ""}
      ${e.reponse ? `<br><span class="petit"><b>Réponse${e.reponse_le ? " du " + esc(dateCourte(e.reponse_le)) : ""} :</b> ${esc(e.reponse)}</span>` : ""}</p>
    <div class="actions-ligne">${e.document_html ? `<button class="btn" data-voir="${e.id}">Courrier</button>` : ecrire && modeleEv(e, s) ? `<button class="btn" data-rediger="${e.id}">Rédiger le courrier</button>` : ""}
      ${ecrire && e.type === "Demande d'explication" && e.statut === "Ouvert" ? `<button class="btn" data-repondre="${e.id}">Enregistrer la réponse</button>` : ""}
      ${ecrire && e.type === "Suspension" && e.statut === "Ouvert" ? `<button class="btn" data-reprise="1">Reprise</button>` : ""}
      ${peut(["daf", "admin"]) && !["Embauche", "Sortie"].includes(e.type) ? `<button class="btn-lien" data-suppr-ev="${e.id}">Supprimer</button>` : ""}</div></li>`;
  const brancherEv = () => {
    $$("[data-voir]").forEach(b => b.onclick = () => { const e = evs.find(x => x.id === b.dataset.voir); editeurCourrier(s, { html: e.document_html, titre: e.objet || e.type, evenement: e, lecture: true }, recharge); });
    $$("[data-rediger]").forEach(b => b.onclick = () => { const e = evs.find(x => x.id === b.dataset.rediger); editeurCourrier(s, { modele: modeleEv(e, s), evenement: e }, recharge); });
    $$("[data-repondre]").forEach(b => b.onclick = () => formulaireReponse(evs.find(x => x.id === b.dataset.repondre), recharge));
    $$("[data-reprise]").forEach(b => b.onclick = () => formulaireEvenement(s, "Reprise", recharge));
    $$("[data-suppr-ev]").forEach(b => b.onclick = async () => {

      <ul class="points">${evs.filter(e => TYPES_DISCIPLINE.includes(e.type)).map(ligneEv).join("") || `<li><p class="discret">Aucune procédure disciplinaire.</p></li>`}</ul>`;

        <td class="${d.date_expiration && d.date_expiration < aujourdhui() ? "negatif" : ""}">${esc(dateCourte(d.date_expiration))}</td><td class="code">${esc(dateHeure(d.created_at))}</td>

      if (error) return toast(messageErreur(error), true);
      window.open(data.signedUrl, "_blank", "noopener");

    $$("[data-suppr-piece]").forEach(b => b.onclick = async () => {
      const d = docs.find(x => x.id === b.dataset.supprPiece);
      if (!confirm(`Supprimer définitivement la pièce « ${d.categorie} » (${d.nom_fichier || ""}) ?`)) return;
      const { error } = await sb.from("documents_personnel").delete().eq("id", d.id);
      if (error) return toast(messageErreur(error), true);
      await sb.storage.from("personnel").remove([d.chemin]);
      toast("Pièce supprimée."); recharge();
    });
  };
  const paie = async () => {
    let solde = null;
    try { const { data } = await sb.from("v_soldes_conges").select("*").eq("salarie_id", id).maybeSingle(); solde = data; } catch (e) { /* facultatif */ }
    zone.innerHTML = `${solde ? `<div class="chiffres"><a><b>${qte(solde.acquis)}</b><span>jours de congé acquis</span></a><a><b>${qte(solde.pris)}</b><span>pris</span></a>
        <a><b>${qte(solde.reste)}</b><span>restant à prendre</span></a></div>` : ""}
      <h2>Bulletins de paie</h2><div class="defil"><table><thead><tr><th>Mois</th><th class="montant">Jours</th><th class="montant">Brut</th><th class="montant">Retenues</th>
        <th class="montant">Net</th><th>Paie</th><th></th></tr></thead><tbody>${buls.map(b => `<tr><td>${esc(MOIS[b.mois - 1])} ${b.annee}</td><td class="montant">${qte(b.jours_payes)}</td>
        <td class="montant">${fcfa(b.brut)}</td><td class="montant">${fcfa(b.total_retenues)}</td><td class="montant"><b>${fcfa(b.net_a_payer)}</b></td>
        <td><span class="pastille ${b.statut_paie === "Validée" ? "ok" : "attente"}">${esc(b.statut_paie || "")}</span></td><td><button class="btn" data-bul="${b.id}">Bulletin</button></td></tr>`).join("")
        || `<tr><td colspan="7" class="vide">${s.type_contrat === "Stage" ? "Stagiaire : indemnité versée hors paie (Trésorerie, catégorie « Indemnités de stage »)." : "Aucun bulletin calculé dans l'application (les paies de janvier à septembre viennent du classeur)."}</td></tr>`}</tbody></table></div>
      <h2 class="titre-section">Congés et absences</h2><div class="defil"><table><thead><tr><th>Type</th><th>Du</th><th>Au</th><th class="montant">Jours</th><th>Statut</th></tr></thead>
      <tbody>${conges.map(c => `<tr><td>${esc(c.type)}</td><td class="code">${esc(dateCourte(c.date_debut))}</td><td class="code">${esc(dateCourte(c.date_fin))}</td>
        <td class="montant">${qte(c.jours)}</td><td>${esc(c.statut)}</td></tr>`).join("") || `<tr><td colspan="5" class="vide">Aucun congé enregistré.</td></tr>`}</tbody></table></div>`;
    $$("[data-bul]").forEach(b => b.onclick = () => ouvrirBulletin(buls.find(x => x.id === b.dataset.bul)));

    onglet = etat.ongletFiche = k;

  $("#b-retour").onclick = () => aller("personnel");
  if ($("#b-modifier")) $("#b-modifier").onclick = async () => {
    // La vue v_personnel n'a pas toutes les colonnes (paye_par…) : on modifie la ligne complète, puis on revient à la fiche.
    const { data: complet, error } = await sb.from("salaries").select("*").eq("id", s.id).single();
    if (error) return toast(messageErreur(error), true);

    <table><tbody>${[["Né(e) le", [dateCourte(s.date_naissance), s.lieu_naissance].filter(Boolean).join(" à ")], ["CNI", s.cni], ["N° CNPS", s.numero_cnps], ["NIU", s.niu],
      ["Situation de famille", [s.situation_familiale, s.enfants ? s.enfants + " enfant(s)" : ""].filter(Boolean).join(", ")], ["Téléphone", s.telephone], ["Adresse", [s.adresse, s.ville].filter(Boolean).join(", ")],
      ["Personne à prévenir", [s.personne_a_prevenir, s.telephone_urgence].filter(Boolean).join(" · ")], ["Emploi", s.emploi], ["Département", s.departement],
      ["Contrat", [s.type_contrat, s.date_fin_contrat ? "jusqu'au " + dateCourte(s.date_fin_contrat) : ""].filter(Boolean).join(" ")], ["Entrée", dateCourte(s.date_embauche)],
      ["Fin de période d'essai", dateCourte(s.date_fin_essai)], ["Sortie", s.date_sortie ? dateCourte(s.date_sortie) + " — " + (s.motif_sortie || "") : ""]]
      .map(([k, v]) => `<tr><th style="width:30%">${esc(k)}</th><td>${esc(v || "")}</td></tr>`).join("")}</tbody></table>
    <h2>Carrière et discipline</h2><table><thead><tr><th>Date</th><th>Événement</th><th>Objet</th></tr></thead><tbody>
    ${evs.slice().reverse().map(e => `<tr><td>${esc(dateCourte(e.date_evenement))}</td><td>${esc(e.type)}</td><td>${esc(e.objet || "")}${e.valeur_apres ? " — " + esc(e.valeur_avant || "") + " → " + esc(e.valeur_apres) : ""}</td></tr>`).join("")}</tbody></table>
    <h2>Pièces du dossier</h2><p>${PIECES_REQUISES.map(c => (docs.some(d => d.categorie === c) ? "☑ " : "☐ ") + esc(c)).join(" &nbsp; ")}</p>`);
  await basculer(onglet);
}

/* ---------- Embauche ---------- */

  const rubs = etat.refs.rubriques_fixes || [];
  ouvrirModale("Nouvelle embauche", `<p class="discret petit">La fiche, le contrat et la rémunération en une fois. Le contrat se rédige ensuite depuis la fiche, sur le modèle de l'entreprise.</p>

    <h3>Contrat</h3><div class="grille2">

      <div id="em-fin-bloc" hidden><label for="em-fin">Fin du contrat ou du stage</label><input type="date" id="em-fin"></div>
      <div><label for="em-emploi">Emploi *</label><input type="text" id="em-emploi"></div><div><label for="em-dep">Département</label><input type="text" id="em-dep" placeholder="REX, SUPPLY CHAIN, ADMINISTRATION…"></div>
      <div><label for="em-cat">Catégorie (convention)</label><input type="text" id="em-cat"></div>
      <div><label for="em-act">Activité</label><select id="em-act">${optionsRef("activites", null, undefined, "Structure")}</select></div></div>
    <h3>Rémunération</h3><div id="em-remu"><div class="grille2">
      <div><label for="em-net">Net mensuel convenu (FCFA)</label><input type="number" id="em-net" min="0" step="1000"></div>
      <div><label for="em-base">Salaire de base (FCFA) *</label><input type="number" id="em-base" min="0" step="1"></div></div>
      <div class="grille2">${rubs.map(r => `<div><label for="em-f-${esc(r.code)}">${esc(r.libelle)}</label><input type="number" id="em-f-${esc(r.code)}" min="0" step="1000" data-fixe="${esc(r.code)}"></div>`).join("")}</div>
      <div class="outils"><button type="button" class="btn" id="em-calc">Calculer le salaire de base à partir du net</button><span class="discret" id="em-simul"></span></div></div>
    <div id="em-stage" hidden><label for="em-indem">Indemnité de stage mensuelle (FCFA)</label><input type="number" id="em-indem" min="0" step="1000"></div>
    <div class="grille2"><div><label for="em-mode">Paiement</label><select id="em-mode"><option>Virement</option><option>Mobile Money</option><option>Espèces</option></select></div>
      <div><label for="em-compte">RIB ou n° Mobile Money</label><input type="text" id="em-compte"></div></div>`, {
    libelleSave: "Enregistrer l'embauche", large: true,
    onSave: async () => {
      const type = $("#em-type").value, stage = type === "Stage", date = $("#em-date").value, essai = Number($("#em-essai").value || 0);
      if (!$("#em-nom").value.trim() || !date || !$("#em-emploi").value.trim()) return "Nom, date d'entrée et emploi sont obligatoires.";
      if (!stage && !(Number($("#em-base").value) > 0)) return "Indiquez le salaire de base, ou calculez-le à partir du net convenu.";
      const finEssai = !stage && essai > 0 ? (() => { const d = new Date(date + "T00:00:00"); d.setMonth(d.getMonth() + essai); d.setDate(d.getDate() - 1); return ISO(d); })() : null;
      const mode = $("#em-mode").value, compte = $("#em-compte").value.trim() || null;
      const fiche = { nom: $("#em-nom").value.trim().toUpperCase(), prenom: $("#em-prenom").value.trim().toUpperCase() || null, sexe: $("#em-sexe").value || null,
        date_naissance: $("#em-naiss").value || null, lieu_naissance: $("#em-lieu").value.trim() || null, cni: $("#em-cni").value.trim() || null,
        telephone: $("#em-tel").value.trim() || null, situation_familiale: $("#em-sit").value || null, personne_a_prevenir: $("#em-prev").value.trim() || null,
        telephone_urgence: $("#em-telprev").value.trim() || null, type_contrat: type, date_embauche: date, date_fin_essai: finEssai,
        date_fin_contrat: type !== "CDI" ? $("#em-fin").value || null : null, emploi: $("#em-emploi").value.trim(), departement: $("#em-dep").value.trim() || null,
        categorie: $("#em-cat").value.trim() || null, activite_id: $("#em-act").value || null, salaire_base: stage ? 0 : Number($("#em-base").value), net_cible: stage ? null : Number($("#em-net").value || 0) || null,
        indemnite_stage: stage ? Number($("#em-indem").value || 0) || null : null, mode_paiement: mode,
        rib: mode === "Virement" ? compte : null, numero_mobile_money: mode === "Mobile Money" ? compte : null, actif: true };
      const { data: s, error } = await sb.from("salaries").insert(fiche).select().single();
      if (error) return messageErreur(error);
      if (!stage) {
        const fx = $$("[data-fixe]").map(i => ({ salarie_id: s.id, rubrique_code: i.dataset.fixe, montant: Number(i.value || 0) })).filter(x => x.montant > 0);
        if (fx.length) { const { error: e2 } = await sb.from("elements_fixes").insert(fx); if (e2) return messageErreur(e2); }
      }
      try {
        await appeler("enregistrer_evenement_rh", { p_salarie: s.id, p: { type: "Embauche", date_evenement: date, date_effet: date, date_fin: finEssai || fiche.date_fin_contrat,
          objet: stage ? `Début de stage — ${fiche.emploi}` : `${type}${finEssai ? ` avec période d'essai de ${essai} mois (jusqu'au ${dateCourte(finEssai)})` : ""} — ${fiche.emploi}`,

      } catch (err) { return messageErreur(err); }
      toast(`${s.matricule} enregistré(e). Rédigez maintenant le contrat (« Rédiger un courrier »).`);
      aller("personnel", { id: s.id });
    }
  });
  const majType = () => { const t = $("#em-type").value; $("#em-essai-bloc").hidden = t === "Stage"; $("#em-fin-bloc").hidden = t === "CDI";
    $("#em-remu").hidden = t === "Stage"; $("#em-stage").hidden = t !== "Stage"; if (t === "CDD") $("#em-essai").value = 1; };
  $("#em-type").onchange = majType; majType();
  const fixes = () => Object.fromEntries($$("[data-fixe]").map(i => [i.dataset.fixe, Number(i.value || 0)]));
  const montrer = async () => { const b = Number($("#em-base").value || 0); if (!b) return;

  $("#em-calc").onclick = async () => {
    const net = Number($("#em-net").value || 0); if (!net) return toast("Indiquez le net mensuel convenu.", true);
    try { $("#em-base").value = await appeler("base_pour_net", { p_salarie: null, p_net: net, p_fixes: fixes() }); await montrer(); } catch (err) { toast(messageErreur(err), true); }
  };
  $("#em-base").onchange = montrer;
}

/* ---------- Événements ---------- */
function formulaireEvenement(s, typeInitial, retour) {
  const rubs = etat.refs.rubriques_fixes || [];
  ouvrirModale(`Nouvel événement — ${nomPersonne(s)}`, `<div class="grille2"><div><label for="ev-type">Événement *</label><select id="ev-type">${TYPES_EVENEMENT.map(t =>
      `<option ${t === typeInitial ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></div>
      <div><label for="ev-date">Date *</label><input type="date" id="ev-date" value="${aujourdhui()}"></div></div>
    <div id="ev-champs"></div>
    <label for="ev-objet">Objet</label><input type="text" id="ev-objet">
    <label for="ev-details" id="ev-details-lib">Détails</label><textarea id="ev-details" rows="4"></textarea>
    <p class="discret petit" id="ev-aide"></p>`, {
    libelleSave: "Enregistrer", large: true,
    onSave: async () => {
      const type = $("#ev-type").value, v = k => ($("#ev-" + k) || {}).value || "";
      const p = { type, date_evenement: v("date"), date_effet: v("effet") || null, date_fin: v("fin") || null, objet: v("objet").trim() || type, details: v("details").trim() || null };
      if (["Demande d'explication", "Avertissement", "Blâme", "Mise à pied"].includes(type) && !p.details) return "Décrivez les faits reprochés.";
      if (type === "Revalorisation") {
        if (!(Number(v("base")) > 0)) return "Indiquez le nouveau salaire de base (ou calculez-le à partir du net).";
        Object.assign(p, { salaire_base: Number(v("base")), net_cible: Number(v("net")) || null, fixes: Object.fromEntries($$("[data-evfixe]").map(i => [i.dataset.evfixe, Number(i.value || 0)])),
          valeur_avant: $("#ev-netavant").dataset.net ? `${fcfa($("#ev-netavant").dataset.net)} FCFA net` : null,
          valeur_apres: $("#ev-simul").dataset.net ? `${fcfa($("#ev-simul").dataset.net)} FCFA net` : null });
      }
      if (["Promotion", "Avenant"].includes(type)) Object.assign(p, { emploi: v("emploi"), categorie: v("categorie"), echelon: v("echelon"), departement: v("departement"),
        type_contrat: v("contrat"), ...(v("fincontrat") ? { date_fin_contrat: v("fincontrat") } : {}), valeur_avant: s.emploi, valeur_apres: v("emploi") || s.emploi });
      if (type === "Mutation") Object.assign(p, { site_id: v("site") || null, activite_id: v("activite") || null, departement: v("departement"), manager_id: v("manager") || null,
        valeur_avant: [s.departement, s.site].filter(Boolean).join(" · "), valeur_apres: [v("departement") || s.departement].filter(Boolean).join(" · ") });
      if (type === "Évaluation") p.valeur_apres = v("note");
      try { const idEv = await appeler("enregistrer_evenement_rh", { p_salarie: s.id, p });
        toast("Événement enregistré.");
        if (MODELE_PAR_TYPE[type] && confirm("Rédiger maintenant le courrier correspondant ?")) {
          const { data: e } = await sb.from("evenements_rh").select("*").eq("id", idEv).single();
          setTimeout(() => editeurCourrier({ ...s }, { modele: MODELE_PAR_TYPE[type], evenement: e }, retour), 0); return;
        }
        retour();
      } catch (err) { return messageErreur(err); }
    }
  });
  const fixes = () => Object.fromEntries($$("[data-evfixe]").map(i => [i.dataset.evfixe, Number(i.value || 0)]));
  const champs = async () => {
    const t = $("#ev-type").value, c = $("#ev-champs");
    const aides = { "Demande d'explication": "Le salarié dispose de 48 heures pour répondre par écrit. Enregistrez sa réponse dans l'onglet Discipline.",
      "Mise à pied": "Mise à pied disciplinaire : 8 jours au plus, sans salaire (Code du travail). Saisissez l'absence non payée dans les éléments du mois.",
      Suspension: "Le dossier reste « Suspendu » jusqu'à l'enregistrement de la reprise ou de la sortie.",
      Revalorisation: "Le nouveau salaire de base s'applique aux paies calculées ensuite. La lettre de notification se rédige après l'enregistrement.",
      "Renouvellement d'essai": "Une seule fois, par écrit, avant la fin de la première période." };
    $("#ev-aide").textContent = aides[t] || "";
    $("#ev-details-lib").textContent = ["Demande d'explication", "Avertissement", "Blâme", "Mise à pied", "Suspension"].includes(t) ? "Faits reprochés *" : "Détails";
    const date = (id, l, v = "") => `<div><label for="ev-${id}">${l}</label><input type="date" id="ev-${id}" value="${esc(v)}"></div>`;
    const texte = (id, l, v = "") => `<div><label for="ev-${id}">${l}</label><input type="text" id="ev-${id}" value="${esc(v || "")}"></div>`;
    if (t === "Revalorisation") {
      const { data: fx } = await sb.from("elements_fixes").select("rubrique_code, montant").eq("salarie_id", s.id);
      c.innerHTML = `<div class="grille2">${date("effet", "Date d'effet *", ISO(new Date(new Date().getFullYear(), new Date().getMonth(), 1)))}

/* ---------- Pièces du dossier ---------- */
function formulairePiece(s, retour) {
  ouvrirModale(`Ajouter une pièce — ${nomPersonne(s)}`, `<div class="grille2"><div><label for="pc-cat">Pièce *</label><select id="pc-cat">${CATEGORIES_PIECES.map(c => `<option>${esc(c)}</option>`).join("")}</select></div>
      <div><label for="pc-exp">Date d'expiration (CNI…)</label><input type="date" id="pc-exp"></div></div>
    <label for="pc-lib">Libellé</label><input type="text" id="pc-lib" placeholder="Licence en gestion, certificat du 12/01/2026…">
    <label for="pc-fichier">Fichier * <span class="discret petit">(PDF, photo ou Word, 10 Mo au plus)</span></label><input type="file" id="pc-fichier" accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx">`, {
    libelleSave: "Ajouter",
    onSave: async () => {
      const f = $("#pc-fichier").files[0];
      if (!f) return "Choisissez le fichier.";
      if (f.size > 10 * 1024 * 1024) return "Le fichier dépasse 10 Mo.";
      const nom = f.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w.-]+/g, "_");
      const chemin = `${s.id}/${Date.now()}-${nom}`;
      const { error } = await sb.storage.from("personnel").upload(chemin, f, { contentType: f.type || undefined, upsert: false });
      if (error) return messageErreur(error);
      const { error: e2 } = await sb.from("documents_personnel").insert({ salarie_id: s.id, categorie: $("#pc-cat").value, libelle: $("#pc-lib").value.trim() || null,
        chemin, nom_fichier: f.name, taille: f.size, type_mime: f.type || null, date_expiration: $("#pc-exp").value || null });
      if (e2) { await sb.storage.from("personnel").remove([chemin]); return messageErreur(e2); }
      toast("Pièce ajoutée au dossier."); retour();
    }
  });
}

      avec les retenues légales. Le salarié ne sera plus payé après la date de sortie.</p>
    <div class="grille2"><div><label for="so-motif">Motif *</label><select id="so-motif">${MOTIFS_SORTIE.map(m => `<option ${s.type_contrat === "Stage" && m === "Fin de stage" ? "selected" : ""}>${esc(m)}</option>`).join("")}</select></div>
      <div><label for="so-notif">Notifiée le</label><input type="date" id="so-notif" value="${aujourdhui()}"></div>

      <div><label for="so-preavis">Préavis (mois)</label><input type="number" id="so-preavis" min="0" step="0.5"><label class="case"><input type="checkbox" id="so-effectue" ${s.type_contrat === "Stage" ? "" : "checked"}> Préavis effectué (pas d'indemnité)</label></div></div>

      <div><label for="so-ipreavis">Indemnité compensatrice de préavis</label><input type="number" id="so-ipreavis" min="0" value="0"></div>
      <div><label for="so-lic">Indemnité de licenciement</label><input type="number" id="so-lic" min="0" value="0"></div>
      <div><label for="so-exc">Indemnité exceptionnelle (décision de la Direction)</label><input type="number" id="so-exc" min="0" value="0"></div></div>
    <label for="so-details">Observations</label><textarea id="so-details" rows="3"></textarea>
    <p class="discret petit">Repères : préavis selon la catégorie et la convention collective du commerce ; indemnité de licenciement (art. 37) à partir de 2 ans d'ancienneté, hors faute lourde ;
      aucune indemnité de préavis pendant la période d'essai. Vérifiez les montants proposés avant d'enregistrer.</p>`, {
    libelleSave: "Enregistrer la sortie", large: true,
    onSave: async () => {
      if (!confirm(`Enregistrer la sortie de ${nomPersonne(s)} au ${dateCourte($("#so-date").value)} ? Elle ne pourra plus être modifiée que par l'administrateur.`)) return "Sortie non enregistrée.";
      const n = id => Math.round(Number($("#" + id).value || 0));
      try {
        await appeler("enregistrer_sortie", { p_salarie: s.id, p: { motif: $("#so-motif").value, date_sortie: $("#so-date").value, date_notification: $("#so-notif").value || null,
          details: $("#so-details").value.trim() || null, preavis_mois: Number($("#so-preavis").value || 0), preavis_effectue: $("#so-effectue").checked,
          indemnites: { conges: n("so-conges"), preavis: $("#so-effectue").checked ? 0 : n("so-ipreavis"), licenciement: n("so-lic"), exceptionnelle: n("so-exc") } } });
      } catch (err) { return messageErreur(err); }
      const m = new Date($("#so-date").value + "T00:00:00");
      toast(`Sortie enregistrée. Calculez la paie de ${MOIS[m.getMonth()].toLowerCase()} ${m.getFullYear()} : son bulletin fera le solde de tout compte. Rédigez le certificat de travail.`);
      retour();
    }
  });
  const calc = async () => {
    const motif = $("#so-motif").value;
    try {
      const r = await appeler("calcul_droits_sortie", { p_salarie: s.id, p_date: $("#so-date").value, p_motif: motif === "Licenciement pour faute lourde" ? "Faute lourde" : motif,
        p_preavis_mois: $("#so-preavis").value === "" ? null : Number($("#so-preavis").value) });
      if ($("#so-preavis").value === "") $("#so-preavis").value = r.preavis_mois;
      $("#so-conges").value = r.indemnite_conges; $("#so-ipreavis").value = $("#so-effectue").checked ? 0 : r.indemnite_preavis; $("#so-lic").value = r.indemnite_licenciement;

    } catch (err) { toast(messageErreur(err), true); }
  };
  $("#so-calc").onclick = calc;
  $("#so-motif").onchange = () => { $("#so-preavis").value = ""; $("#so-effectue").checked = $("#so-motif").value === "Démission"; calc(); };
  $("#so-effectue").onchange = calc;
}

          (téléphone ${esc(s.telephone_urgence || "…")}), ci-après dénommé(e) <b>l'Employé(e)</b>, d'autre part,</p>
        <p>Il est établi le présent contrat qui, outre les dispositions ci-dessous, sera régi par la loi n° 92/007 du 14 août 1992 portant Code du travail, les textes pris pour son application

        <p><b>Article 2 : Fonction.</b> L'Employé(e) exercera les fonctions de <b>${esc(s.emploi || "…")}</b>${s.categorie ? `, catégorie ${esc(s.categorie)}${s.echelon ? ", échelon " + esc(s.echelon) : ""}` : ""}, et pourra être affecté(e) à tout autre service en fonction des besoins de l'entreprise.</p>

        <p>Fait à Douala, le ${esc(dateLongue(s.date_embauche))}, en deux exemplaires.</p>
        <table style="border:none;margin-top:2rem"><tr><td style="border:none"><b>Le Stagiaire</b></td><td style="border:none;text-align:right"><b>L'Entreprise</b></td></tr></table>`;

/* Éditeur : le courrier est proposé prérempli, modifiable directement, puis imprimé et rangé au dossier. */
async function editeurCourrier(s, o, retour) {
  const ev = o.evenement || null;
  const choix = o.modele || (s.date_sortie ? "certificat" : s.type_contrat === "Stage" ? "contrat_stage" : s.type_contrat === "CDD" ? "contrat_cdd" : "contrat_cdi");
  const extra = async modele => {
    const x = {};
    if (["contrat_cdi", "contrat_cdd"].includes(modele)) { try { x.net = (await appeler("simuler_net", { p_salarie: s.id, p_base: Number(s.salaire_base) })).net; } catch (e) { /* */ } }
    if (["solde", "fin_essai", "licenciement"].includes(modele)) {
      const { data: so } = await sb.from("evenements_rh").select("donnees").eq("salarie_id", s.id).eq("type", "Sortie").maybeSingle();
      const ind = (so && so.donnees && so.donnees.indemnites) || {};
      x.exceptionnelle = Number(ind.exceptionnelle || 0); x.preavis = so && so.donnees && so.donnees.preavis_mois;
      if (modele === "solde" && s.date_sortie) {
        const m = new Date(s.date_sortie + "T00:00:00");
        const { data: b } = await sb.from("v_bulletins").select("*").eq("salarie_id", s.id).eq("annee", m.getFullYear()).eq("mois", m.getMonth() + 1).maybeSingle();
        if (b) {
          const { data: ls } = await sb.from("lignes_bulletin").select("libelle, gain, retenue").eq("bulletin_id", b.id).order("ordre");
          x.lignes = [...(ls || []).filter(l => Number(l.gain)).map(l => [l.libelle, Number(l.gain)]), ["Retenues sociales et fiscales", -Number(b.total_retenues)]];
          x.total = Number(b.net_a_payer);
        } else {
          x.lignes = [["Indemnité compensatrice de congés", Number(ind.conges || 0)], ["Indemnité compensatrice de préavis", Number(ind.preavis || 0)],
            ["Indemnité de licenciement", Number(ind.licenciement || 0)], ["Indemnité exceptionnelle", Number(ind.exceptionnelle || 0)]].filter(l => l[1]);
          x.total = x.lignes.reduce((t, l) => t + l[1], 0);
          x.provisoire = true;
        }
      }
    }
    return x;
  };
  ouvrirModale(o.lecture ? (o.titre || "Courrier") : `Courrier — ${nomPersonne(s)}`, `${o.lecture ? "" : `<div class="outils"><label for="co-modele" style="margin:0">Modèle</label>
      <select id="co-modele">${Object.entries(MODELES_COURRIER).map(([k, l]) => `<option value="${k}" ${k === choix ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
      <span class="discret petit pousse">Le texte se modifie directement ci-dessous avant impression.</span></div>`}
    <div id="co-avert"></div>
    <div id="co-texte" class="courrier-edit" ${o.lecture ? "" : 'contenteditable="true"'} spellcheck="true"></div>
    <div class="barre-actions"><button type="button" class="btn" id="co-imprimer">Imprimer sur le papier à en-tête</button>
      ${o.lecture || !peut(PERSO_ECRITURE) ? "" : `<button type="button" class="btn btn-principal" id="co-ranger">Ranger au dossier</button>`}</div>`, { large: true });
  const remplir = async () => {
    if (o.lecture) { $("#co-texte").innerHTML = o.html; return; }
    const m = $("#co-modele").value, x = await extra(m);
    $("#co-avert").innerHTML = x.provisoire ? `<div class="info">Le bulletin du mois de sortie n'est pas encore calculé : montants provisoires (indemnités seules, sans salaire du mois ni retenues).
      Calculez la paie, puis rouvrez ce modèle.</div>` : "";
    $("#co-texte").innerHTML = corpsCourrier(m, s, ev, x);
  };
  if ($("#co-modele")) $("#co-modele").onchange = remplir;
  await remplir();
  $("#co-imprimer").onclick = () => imprimerHtml(o.lecture ? (o.titre || "Courrier") : MODELES_COURRIER[$("#co-modele").value], $("#co-texte").innerHTML);
  if ($("#co-ranger")) $("#co-ranger").onclick = async () => {
    const html = $("#co-texte").innerHTML, m = $("#co-modele").value;
    try {
      if (ev && modeleEv(ev, s) && !ev.document_html) {
        const { error } = await sb.from("evenements_rh").update({ document_html: html }).eq("id", ev.id); if (error) throw error;
      } else {
        await appeler("enregistrer_evenement_rh", { p_salarie: s.id, p: { type: "Courrier", objet: MODELES_COURRIER[m], document_html: html } });
      }
    } catch (err) { return toast(messageErreur(err), true); }
    $("#modale").close(); toast("Courrier rangé au dossier. Faites-le signer, puis ajoutez l'exemplaire signé aux pièces."); retour();
  };
}

/* Photos prises au téléphone : réduites (1600 px, JPEG) avant l'envoi, pour les connexions lentes. */
async function compresserImage(f, max = 1600, q = 0.8) {
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return f;
  try {
    const img = await createImageBitmap(f);
    const k = Math.min(1, max / Math.max(img.width, img.height));
    if (k === 1 && f.size < 900000) return f;
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", q));
    return b ? new File([b], (f.name || "photo").replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : f;
  } catch (e) { return f; }
}
async function deposerSupply(dossier, f) {
  if (!f) return null;
  const g = await compresserImage(f);
  if (g.size > 10 * 1024 * 1024) throw new Error("Fichier trop lourd (10 Mo au plus).");
  const ext = ((g.name || "").match(/\.(\w+)$/) || [, g.type === "application/pdf" ? "pdf" : "jpg"])[1].toLowerCase();
  const chemin = `${dossier}/${(crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2))}.${ext}`;
  const { error } = await sb.storage.from("supply").upload(chemin, g, { contentType: g.type || undefined, upsert: false });
  if (error) throw error;
  return chemin;
}

}

const moisPrecedent = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return { annee: d.getFullYear(), mois: d.getMonth() + 1 }; };

/* ---------------------------------------------------------------------

   --------------------------------------------------------------------- */
const ONGLETS_PARC = [["vehicules", "Véhicules"], ["echeances", "Documents et échéances"], ["entretiens", "Entretiens"], ["releves", "Relevés kilométriques"],
  ["carburant", "Carburant"], ["incidents", "Incidents"]];
async function pageParc() {
  await chargerRefsParc();
  const onglet = etat.param.onglet || etat.ongletParc || "vehicules";
  $("#contenu").innerHTML = `<div class="entete-page"><div><h1>Parc automobile</h1>
      <p class="discret">État des véhicules, papiers et échéances, entretiens, relevé mensuel du kilométrage comparé au carburant payé par la caisse.
      ${peut(PARC_VALIDE) ? "Vous validez les saisies de l'adjoint." : peut(PARC_SAISIE) ? "Vos saisies sont validées par le responsable supply chain." : ""}</p></div>

    <div class="panneau"><div class="onglets" role="tablist">${ONGLETS_PARC.map(([k, l]) => `<button role="tab" data-onglet="${k}" aria-selected="${k === onglet}">${esc(l)}</button>`).join("")}</div>
      <div id="parc-corps"><p class="vide">Chargement…</p></div></div>`;

  const f = { vehicules: ongletVehicules, echeances: ongletEcheances, entretiens: ongletEntretiens, releves: ongletReleves, carburant: ongletCarburant, incidents: ongletIncidents }[onglet];
  try { await f(); } catch (err) { $("#parc-corps").innerHTML = `<div class="erreur">${esc(messageErreur(err))}</div>`; }
}

async function ongletVehicules() {
  const [{ data: ech }, { data: rel }] = await Promise.all([sb.from("v_echeances_parc").select("*"),
    sb.from("releves_km").select("vehicule_id, annee, mois, kilometrage, statut").order("annee", { ascending: false }).order("mois", { ascending: false })]);
  const pire = id => { const e = (ech || []).filter(x => x.vehicule_id === id); const o = ["Expiré", "Manquant", "Sous 7 jours", "Sous 30 jours"];
    for (const k of o) { const n = e.filter(x => x.etat === k).length; if (n) return `<span class="pastille ${CLASSE_ECHEANCE[k]}">${n} ${esc(k.toLowerCase())}</span>`; }
    return e.length ? `<span class="pastille ok">Papiers à jour</span>` : ""; };
  const dernierKm = id => (rel || []).find(r => r.vehicule_id === id && r.statut !== "Refusé");
  if (peut(GESTION)) $("#parc-actions").innerHTML = `<button class="btn btn-principal" id="b-veh">Nouveau véhicule</button>`;
  $("#parc-corps").innerHTML = `<div class="cartes-parc">${etat.parc.vehicules.filter(v => v.actif).map(v => { const k = dernierKm(v.id);
    return `<article class="carte-veh"><div class="carte-veh-tete"><b>${esc(v.libelle)}</b><span class="pastille ${CLASSE_STATUT_VEH[v.statut] || ""}">${esc(v.statut || "")}</span></div>

      <dl class="mini"><dt>Usage</dt><dd>${esc(v.usage || "—")}</dd><dt>Chauffeur</dt><dd>${esc(nomPers(v.chauffeur_id) || "—")}</dd>
        <dt>Compteur</dt><dd>${k ? `${Number(k.kilometrage).toLocaleString("fr-FR")} km <span class="discret">(${String(k.mois).padStart(2, "0")}/${k.annee})</span>` : v.km_initial ? `${Number(v.km_initial).toLocaleString("fr-FR")} km (initial)` : "—"}</dd></dl>
      <div>${pire(v.id)}</div>
      ${peut(PARC_VALIDE) ? `<button class="btn" data-fiche="${v.id}">Modifier la fiche</button>` : ""}</article>`; }).join("")

async function ongletEcheances() {
  const { data, error } = await sb.from("v_echeances_parc").select("*");
  if (error) throw error;
  const ordre = { "Expiré": 0, "Manquant": 1, "Sous 7 jours": 2, "Sous 30 jours": 3, "Sans échéance": 4, "À jour": 5 };
  const lignes = (data || []).slice().sort((a, b) => (ordre[a.etat] - ordre[b.etat]) || String(a.date_fin || "").localeCompare(String(b.date_fin || "")));
  if (peut(PARC_SAISIE)) $("#parc-actions").innerHTML = `<button class="btn btn-principal" id="b-doc">Ajouter ou renouveler un document</button>`;
  $("#parc-corps").innerHTML = `<p class="discret">Le document le plus récent de chaque type fait foi. Alerte sur l'accueil 30 jours puis 7 jours avant l'expiration.
      Carte grise, assurance, visite technique et vignette sont attendues pour chaque véhicule en service.</p>
    <div class="outils"><select id="f-etat" aria-label="État"><option value="">Tous les états</option>${Object.keys(ordre).map(k => `<option>${k}</option>`).join("")}</select></div>
    <div class="defil"><table><thead><tr><th>Véhicule ou chauffeur</th><th>Document</th><th>N°</th><th>Valable du</th><th>au</th><th>État</th><th></th></tr></thead><tbody id="corps-ech"></tbody></table></div>`;
  const dessiner = () => {
    const f = $("#f-etat").value;
    $("#corps-ech").innerHTML = lignes.filter(l => !f || l.etat === f).map(l => `<tr>
      <td>${esc(l.vehicule_id ? nomVeh(l.vehicule_id) : nomPers(l.chauffeur_id))}</td><td>${esc(l.type)}</td><td>${esc(l.numero || "")}</td>
      <td class="code">${esc(dateCourte(l.date_debut))}</td><td class="code">${esc(dateCourte(l.date_fin))}</td>
      <td><span class="pastille ${CLASSE_ECHEANCE[l.etat] || ""}">${esc(l.etat)}${l.jours_restants != null && l.jours_restants >= 0 && l.etat !== "À jour" ? ` · ${l.jours_restants} j` : ""}</span></td>
      <td class="actions-ligne">${l.fichier ? `<button class="btn-lien" data-voir="${esc(l.fichier)}">Voir</button>` : ""}
        ${peut(PARC_SAISIE) ? `<button class="btn" data-renouv='${esc(JSON.stringify({ vehicule_id: l.vehicule_id, chauffeur_id: l.chauffeur_id, type: l.type }))}'>${l.document_id ? "Renouveler" : "Ajouter"}</button>` : ""}</td></tr>`).join("")
      || `<tr><td colspan="7" class="vide">Aucun document.</td></tr>`;
    $$("[data-voir]").forEach(b => b.onclick = () => voirFichierSupply(b.dataset.voir));
